    delete p.mirrorsOnly;
    p.elements=elements;
    let solutionsChanged=false;
    for(const solution of State.solutions){if(solution.puzzleId===p.id && enforcePuzzleSolutionRules(p,solution))solutionsChanged=true;}
    persistPuzzles();if(solutionsChanged)persistSolutions();

function chooseBoardTool(value){
  const p=getCurrentPuzzle();
  cancelPiecePreview(true);
  const actions=['setup','deletePuzzle','clonePuzzle','importPuzzle','exportPuzzle','setupSolution','deleteSolution','cloneSolution','importSolution','exportSolution','goDesign'];
  if(value!=='cloneElement'||State.selectedTool!=='cloneElement'){
    State.cloneSource=null;State.cloneSourceCell=null;
  }
  if(actions.includes(value)){State.selectedTool=null;syncBoardToolControls();}
  if(value==='setup'){ State.selectedTool=null; showPuzzleSetupDialog(p); return; }
  if(value==='deletePuzzle'){State.selectedTool=null;deleteCurrentPuzzle();return;}
  if(value==='clonePuzzle'){State.selectedTool=null;cloneCurrentPuzzle();return;}
  if(value==='importPuzzle'){State.selectedTool=null;triggerImport({kind:'replacePuzzle',puzzleId:p.id});return;}
  if(value==='exportPuzzle'){State.selectedTool=null;exportPuzzle(p);return;}
  if(value==='setupSolution'){State.selectedTool=null;showSolutionSetupSheet();return;}
  if(value==='deleteSolution'){State.selectedTool=null;deleteCurrentSolution();return;}
  if(value==='cloneSolution'){State.selectedTool=null;cloneCurrentSolution();return;}
  if(value==='importSolution'){ State.selectedTool=null; triggerImport({kind:'puzzleSolutions',puzzleId:p.id,returnToBoard:true}); return; }
  if(value==='exportSolution'){ State.selectedTool=null; exportCurrentSolution(); return; }
  if(value==='goDesign'){
    State.running=false; setActiveMode('create'); State.currentSolutionId=null; State.selectedCell=null; State.selectedTool=null; State.screen='puzzleEdit'; renderScreen(); return;
  }
  State.selectedTool=value||null; State.selectedCell=null; closeInspectorSheet();syncBoardToolControls();
}

// Shown on the right in place of the inspector once a run has started (or
// finished) — the inspector's edit controls wouldn't do anything useful
// then anyway, so this is more relevant: live progress toward each
// receiver's expected sequence.
function renderReceiversPanel(){
  rightPanel.innerHTML = `<h2 class="side-title">Receivers</h2>`;
  const rlist = document.createElement('div');
  for(let r=0;r<State.gridRows;r++) for(let c=0;c<State.gridCols;c++){
    const el = State.grid[r][c];
    if(el && el.type==='receiver'){
      const card=document.createElement('div'); card.className='card';
      const dots = el.colors.map((col,i)=>{
        const done = el.marks && el.marks[i]==='ok';
        const fail = el.marks && el.marks[i]==='fail';
        return `<span style="display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:3px;background:${COLHEX[col]};opacity:${done?0.3:1};box-shadow:${fail?'0 0 0 2px #ff3b3b':'none'};"></span>`;
      }).join('');
      card.innerHTML = `<p style="margin-bottom:6px;">Receiver @ (${r},${c})</p>${dots}`;
      rlist.appendChild(card);
    }
  }
  if(!rlist.children.length) rlist.innerHTML=`<div class="empty-hint">No receivers on this board.</div>`;
  rightPanel.appendChild(rlist);
}

function addToolButton(parent,type,label,color,disabled){
  const b=document.createElement('button');
  b.className='btn tool';
  b.dataset.toolType = type;
  b.innerHTML = `<span class="toolicon" style="background:${color};border-radius:5px;display:inline-block;"></span>${label}`;
  if(disabled) b.disabled = true;
  b.addEventListener('click', ()=>{
    State.selectedTool = State.selectedTool===type ? null : type;
    State.selectedCell = null;
    document.querySelectorAll('.btn.tool').forEach(x=>x.classList.remove('active'));
    if(State.selectedTool) b.classList.add('active');
    renderInspector();
    if(State.selectedTool && isNarrowLayout()) setMobilePane('board');
  });
  parent.appendChild(b);
}
// Toggles the tool palette's disabled state in place (no full re-render),
// so it can be updated every frame during playback cheaply. Also drops
// whatever tool was armed the instant it becomes disabled, so a stale
// "active" tool can't linger into a state where it can't actually be used.
function updateToolButtonsEnabled(){
  if(State.screen!=='solutionEdit') return;
  const enabled = canEditNow();
  document.querySelectorAll('.btn.tool').forEach(b=>{ b.disabled = !enabled; });
  document.querySelectorAll('.mobile-tool-button').forEach(b=>{
    b.disabled=!enabled;
    if(!enabled){b.classList.remove('active');b.setAttribute('aria-pressed','false');}
  });
  document.querySelectorAll('.board-select option').forEach(o=>{
    if(['mirrorDiag','mirrorHalf','prism','eraser'].includes(o.value)) o.disabled=!enabled;
  });
  if(!enabled && State.selectedTool){
    State.selectedTool = null;
    document.querySelectorAll('.btn.tool').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.board-select').forEach(s=>{s.value='';});
  }
}

function buildOrientationProgram(selected,choices,iconFor,readOnly,onChange){
  const program=document.createElement('div');program.className='orientation-program';
  selected.forEach((current,rowIndex)=>{
    const row=document.createElement('div');row.className='orientation-choice-row';
    const step=document.createElement('span');step.className='orientation-step';step.textContent=String(rowIndex+1);row.appendChild(step);
    for(const choice of choices){
      const button=document.createElement('button');button.type='button';button.className='orientation-choice'+(choice==null?' blank':'')+(choice===current?' selected':'');
      button.innerHTML=iconFor(choice);button.setAttribute('aria-pressed',choice===current?'true':'false');
      button.setAttribute('aria-label',choice==null?`Step ${rowIndex+1}: blank`:`Step ${rowIndex+1}: ${choice}`);
      button.title=choice==null?'No change':`Orientation ${choice}`;
      button.disabled=readOnly||(rowIndex===0&&choice==null);
      if(!button.disabled)button.addEventListener('click',()=>onChange(rowIndex,choice));
      row.appendChild(button);
    }
    program.appendChild(row);
  });
  return program;
}

function labelFor(t){ return {emitter:'Emitter',receiver:'Receiver',mirrorDiag:'Mirror',mirrorHalf:'Half-Mirror',crystal:'Crystal',prism:'Prism',transformer:'Transformer',eraser:'Eraser'}[t]||t; }

function buildDirEditor(el, readOnly){
  const wrap=document.createElement('div');
  const label = el.type==='emitter' ? 'Emits toward' : 'Receives from';
  wrap.innerHTML = `<label class="field">${label}</label>`;
  const grid=document.createElement('div'); grid.className='dirgrid';
  const positions = {N:[1,0],W:[0,1],E:[2,1],S:[1,2]};
  for(let y=0;y<3;y++) for(let x=0;x<3;x++){
    const cell=document.createElement('div');
    const found = Object.entries(positions).find(([k,v])=>v[0]===x&&v[1]===y);
    if(found){
      const d=found[0];
      const btn=document.createElement('button'); btn.className='dirbtn'+(el.dirs.includes(d)?' on':''); btn.textContent=d;
      btn.disabled=readOnly;
      btn.addEventListener('click',()=>{
        mutateSelectedConfig(cfg=>{
          const set = new Set(cfg.dirs);
          if(set.has(d)) set.delete(d); else set.add(d);
          cfg.dirs = DIRS.filter(x=>set.has(x));
        });
      });
      cell.appendChild(btn);
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  return wrap;
}

function buildColorQueueEditor(el, readOnly){
  const wrap=document.createElement('div');
  wrap.innerHTML = `<label class="field">${el.type==='emitter'?'Emits, in order (max 8)':'Expects, in order (max 8)'}</label>`;
  const chipline=document.createElement('div'); chipline.className='chipline';
  if(!el.colors.length){ chipline.innerHTML=`<span class="chip-empty">none yet</span>`; }
  el.colors.forEach((col,i)=>{
    const chip=document.createElement('div'); chip.className='chip'; chip.style.background=COLHEX[col];
    chip.title=COLNAME[col];
    if(!readOnly) chip.addEventListener('click',()=>mutateSelectedConfig(cfg=>cfg.colors.splice(i,1)));
    chipline.appendChild(chip);
  });
  wrap.appendChild(chipline);
  if(!readOnly){
    const sw=document.createElement('div'); sw.className='swatches';
    COLORS_ORDER.forEach(col=>{
      const s=document.createElement('div'); s.className='swatch'; s.style.background=COLHEX[col]; s.title=COLNAME[col];
      s.addEventListener('click',()=>mutateSelectedConfig(cfg=>{ if(cfg.colors.length<8) cfg.colors.push(col); }));
      sw.appendChild(s);
    });
    wrap.appendChild(sw);
  }
  return wrap;
}

function buildRadio(values,labels,current,onChange,readOnly){
  const wrap=document.createElement('div'); wrap.className='radiorow';
  values.forEach((v,i)=>{
    const b=document.createElement('button'); b.textContent=labels[i]; if(v===current) b.classList.add('on');
    b.disabled=readOnly;
    b.addEventListener('click',()=>onChange(v));
    wrap.appendChild(b);
  });
  return wrap;
}
function buildCheckbox(text,checked,onChange,readOnly){
  const wrap=document.createElement('label'); wrap.className='checkline';
  const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!checked; cb.disabled=readOnly;
  cb.addEventListener('change',()=>onChange(cb.checked));
  wrap.appendChild(cb); wrap.appendChild(document.createTextNode(text));
  return wrap;
}

/* ============================== RUN CONTROLS ============================== */
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const playBtn = document.getElementById('playBtn');
const stepBtn = document.getElementById('stepBtn');
const resetRunBtn = document.getElementById('resetRunBtn');
const elementCountEl = document.getElementById('elementCount');
const tickCountEl = document.getElementById('tickCount');

speedSlider.addEventListener('input', ()=>{
  // State.frac is already a normalized 0..1 "how far through the current
  // tick" value, independent of how long a tick currently takes — so
  // changing speed needs no rescaling at all; it just changes how fast
  // frac advances from here on.
  State.speed=parseInt(speedSlider.value); speedVal.textContent=State.speed;
});
playBtn.addEventListener('click', ()=>{
  if(State.finished)renderScreen();
  cancelPiecePreview(true);
  State.runStarted = true;
  closeInspectorSheet();
  State.running = !State.running;
  playBtn.textContent = State.running ? '⏸' : '▶';
  updateToolButtonsEnabled();
  // Resuming must not disturb where a packet is mid-tick — only reset the
  // frame-timing reference (so the paused duration itself isn't counted as
  // elapsed time), never State.frac, which is what remembers how far
  // through the current tick everything already was.
  if(State.running){ State.lastFrameTime=null; requestAnimationFrame(loop); }
});
stepBtn.addEventListener('click', ()=>{
  if(State.finished) return;
  cancelPiecePreview(true);
  State.runStarted = true;
  closeInspectorSheet();
  doTick();
  if(State.failureScene) finishFailureScene();
  else State.frac=1; // a manual step displays—and has consumed—the full interval
  updateRunUI(); render();
});
resetRunBtn.addEventListener('click', ()=>{
  cancelPiecePreview(true);
  // Restart playback from the very beginning — a full screen refresh is
  // the simplest way to get everything back in sync: tick/running/finished
  // reset, the tool palette re-enabled, and the right panel switched back
  // from the receivers view to the inspector.
  renderScreen();
});

// Speed slider (0-100) maps to ticks/sec through a single smooth curve —
// very fine control at the slow end, opening up to a fast top end, with no
// discrete jump anywhere along it: rate(u) = a*(e^(b*u^k) - 1), u = v/100.
// Tuned so u=1/3 (v≈33) ≈ 1 tick/s, u=2/3 (v≈67) ≈ 5 ticks/s, u=1 (v=100) ≈ 46 ticks/s.
function speedToTicksPerSecond(v){
  const u = v/100;
  return 0.94 * (Math.exp(3.92 * Math.pow(u, 1.62)) - 1);
}

function loop(t){
  if(!State.running) return;
  if(State.lastFrameTime==null) State.lastFrameTime=t;
  const dt = t-State.lastFrameTime; State.lastFrameTime=t;
  const rate = speedToTicksPerSecond(State.speed);

  if(State.failureScene){
    if(rate>0){
      const interval=(1000/rate)*State.failureScene.duration;
      State.frac += dt/interval;
      if(State.frac>=1) finishFailureScene();
    }
    State.frac=clamp(State.frac,0,1);
    updateRunUI();
    render(State.frac);
    if(State.running && !State.finished) requestAnimationFrame(loop);
    else { State.running=false; playBtn.textContent='▶'; render(1); }
    return;
  }

  if(rate>0){
    const interval = 1000/rate;
    State.frac += dt/interval;
    let safety=0;
    while(State.frac>=1 && State.running && safety<50){
      doTick(); State.frac-=1; safety++;
      if(State.finished || State.failureScene) break;
    }
    State.frac = clamp(State.frac, 0, 1);
  }
  // rate===0: State.frac is left exactly as it was — frozen, not snapped.
  updateRunUI();
  render(State.frac);
  if(State.running && !State.finished) requestAnimationFrame(loop);
  else { State.running=false; playBtn.textContent='▶'; render(1); }
}

function updateRunUI(){
  if(elementCountEl){
    const solution=State.screen==='solutionEdit'?getCurrentSolution():null;
    elementCountEl.textContent=solution?(solution.elements||[]).length:0;
  }
  if(tickCountEl) tickCountEl.textContent = State.tick;
  updateToolButtonsEnabled();
}

function onRunFinished(overflow, leftoverPackets, strictFail, hardFail){
  playBtn.textContent='▶';
  if(overflow){
    showStatus('Stopped — this looks like an infinite loop. Reset and try again.', 'failed');
    return;
  }
  if(State.solved){
    const s=getCurrentSolution().id==='BLANK'?promoteBlankIfNeeded():getCurrentSolution();
    s.status='solved';
    s.ticksToSolve=State.tick;
    persistSolutions();
    showStatus('Solved! Solution locked.', 'solved');
  } else if(hardFail){
    showStatus((State.violation && State.violation.message) || 'A packet hit an emitter, left the arena, or a receiver mishandled one — not solved.', 'failed');
  } else if(strictFail){
    showStatus((State.violation && State.violation.message) || 'Strict mode: the packet count changed through absorption or a split/combine without balancing back out — not solved.', 'failed');
  } else if(leftoverPackets){
    showStatus('Receivers matched, but packets were still on the board — not solved.', 'failed');
  } else {
    showStatus('Not solved yet — reset and adjust your solution.', 'failed');
  }
}
function showStatus(msg,cls){
  statusBar.textContent=msg;
  statusBar.className='statusbar show '+(cls||'');
}

/* ============================== UTIL ============================== */
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* ============================== HELP ============================== */
function sw(col){ return `<span class="hs" style="background:${COLHEX[col]}${col===COL.K?';box-shadow:0 0 0 1px #656a78':''}"></span>`; }
function buildHelpContent(){
  const R=sw(COL.R), G=sw(COL.G), B=sw(COL.B), Y=sw(COL.Y), M=sw(COL.M), C=sw(COL.C), W=sw(COL.W), K=sw(COL.K);
  return `
<h3>How to Play Lightyard</h3>
<p>Each puzzle is a grid with one or more <strong>emitters</strong> and <strong>receivers</strong> built in. Emitters have a predetermined sequence of colored <strong>packets of light</strong> they will emit at the start of the puzzle run. Receivers have a predetermined sequence of colored packets of light they need to receive for the puzzle to complete successfully.</p>
<p>Your job is to place objects on the board so every receiver gets exactly the light packets it expects, in order.</p>

<h3>Color mixing</h3>
<p>Packets come in seven colors:</p>
<ul>
  <li>Three primary colors (${R}<strong>Red</strong>, ${G}<strong>Green</strong>, ${B}<strong>Blue</strong>)</li>
  <li>Three secondary colors made from pairs of primaries:
    <ul>
      <li>${Y}<strong>Yellow</strong> = Red+Green</li>
      <li>${M}<strong>Magenta</strong> = Red+Blue</li>
      <li>${C}<strong>Cyan</strong> = Green+Blue</li>
    </ul>
  </li>
  <li>${W}<strong>White</strong>, which combines all three primaries</li>
</ul>
<p>Whenever two packets' paths meet or cross at the same time, both packets take on the union of their colors.</p>
<div class="help-ex">
<strong>Examples:</strong><br>
${R} Red meets ${B} Blue → both become ${M} Magenta<br>
${R} Red meets ${G} Green → both become ${Y} Yellow<br>
${G} Green meets ${B} Blue → both become ${C} Cyan<br>
${M} Magenta meets ${G} Green → both become ${W} White (together that's all three primaries)<br>
${M} Magenta meets ${R} Red → both become ${M} Magenta (Red is one of Magenta's components)<br>
${W} White meets anything → both become ${W} White
</div>

<h3>Solve Mode</h3>
<p>You start with a list of puzzle sets. Expand a set and then a puzzle to see its saved solutions or start fresh. Each solution is an independent arrangement of solver pieces. A filled star means that puzzle has at least one successful solution.</p>
<p>While editing a solution, choose a piece type from the Tools menu and tap or click any empty square to place it. Select a newly placed piece again within two seconds to configure it immediately. Otherwise, select a placed piece once to preview its routine twice; select it again during the preview or shortly afterward to open its configuration sheet. Choose Eraser and select a piece to remove it. Choose Clone, select a placed solver piece, and then select empty squares to make copies; selecting a different piece changes what Clone copies.</p>

<div class="help-piece"><div class="pn">Mirror</div><div class="pd">Reflects a packet 90° from any direction. Packets that meet at the mirror merge colors. A mirror has two possible orientations, selected in its configuration sheet. A mirror can optionally be set to flip its orientation when a packet hits it.</div></div>

<div class="help-piece"><div class="pn">Half-Mirror</div><div class="pd">Like a mirror, but one side reflects and the other is transparent. The bright line is the reflective surface. Like the mirror, the reflective side reflects packets 90°; the transparent side passes packets straight through.
<ul>
  <li>Packets that meet while reflecting off the reflective side merge colors.</li>
  <li>Packets that cross while passing through the transparent side merge colors.</li>
  <li>If one packet is reflecting and another is passing through, and they exit in the same direction, they merge into one packet; otherwise they cross, remaining two packets but merging colors.</li>
</ul>
A half-mirror can face any of four directions. It can optionally be set to follow a pattern of up to four orientations, changing orientation when a packet hits it.</div></div>

<div class="help-piece"><div class="pn">Prism</div><div class="pd">A triangle with a flat base.
<ul>
  <li>A packet hitting the base side splits into two: a primary or white packet splits into two copies of itself; a secondary splits into its two component colors—e.g. ${M} Magenta splits into ${B} Blue and ${R} Red.</li>
  <li>A packet hitting from any other side exits the base.</li>
  <li>If packets arrive from more than one of those sides at once, they merge to exit the base as a single packet with their merged color.</li>
</ul>
A prism can face any of four directions. It can optionally follow a pattern of up to four orientations, changing orientation when a packet hits it.</div></div>
<p>Puzzles can be configured with <strong>No Prisms</strong>, <strong>No Half-Mirrors</strong>, or both. When both are on, only regular Mirrors are available.</p>
<p>Press play to run your solution. The speed slider controls playback rate (0 is paused); step advances one square; reset returns the run to the beginning. After a run succeeds or fails, pressing play resets it and starts it again. If a run fails, everything stops so you can see what happened. The playback speed does not affect the outcome.</p>

<h3>What's already on the board</h3>
<p>A puzzle configuration includes objects you can't move or change:</p>

<div class="help-piece"><div class="pn">Emitters</div><div class="pd">Emit packets of light in a preset color sequence.</div></div>

<div class="help-piece"><div class="pn">Receivers</div><div class="pd">Expect a preset color sequence. A correct packet checks off the next expected color.</div></div>

<div class="help-piece"><div class="pn">Crystals</div><div class="pd">Slows any packet passing through it to half-speed.
<ul>
  <li>Clear crystals do nothing to color.</li>
  <li>${K}<strong>Black</strong> crystals absorb all packets.</li>
  <li>Other colored crystals only let through packets whose color contains all of the filter's color components; other packets are absorbed. Packets always exit as the filter color, so any extra color components are lost. For example:
    <ul>
      <li>In a ${B}<strong>Blue</strong> crystal, ${C} Cyan loses its Green as it passes through.</li>
      <li>In a ${G}<strong>Green</strong> crystal, ${W} White loses its Red and Blue.</li>
      <li>A ${R}<strong>Red</strong> crystal absorbs a ${C} Cyan packet.</li>
      <li>A ${Y}<strong>Yellow</strong> crystal absorbs a ${B} Blue packet.</li>
    </ul>
  </li>
</ul>
Crystals can have a durability factor: every arriving packet decreases the durability until the crystal reaches 0 and disintegrates. A crystal with no number is indestructible.</div></div>

<div class="help-piece"><div class="pn">Transformer</div><div class="pd">Steps a passing packet one position along the spectrum. Its colored strip shows the configured order: either ${R} Red → ${Y} Yellow → ${G} Green → ${C} Cyan → ${B} Blue → ${M} Magenta, or the reverse. There's no wraparound, and ${W} White is not part of the spectrum.</div></div>

<h3>Failing</h3>
<p>The solution fails if:</p>
<ul>
  <li>A packet hits an emitter.</li>
  <li>A packet leaves the board.</li>
  <li>A packet hits a receiver from the wrong direction.</li>
  <li>A packet that is the wrong color enters a receiver.</li>
  <li>A ${W} White packet, or a packet at the end of the transformer's spectrum, hits a transformer.</li>
  <li>There are packets left over after all the receivers have been filled.</li>
  <li><strong>Strict</strong> is set for the puzzle and the number of light packets changes because packets merged, split, or were absorbed. A simultaneous split and merge or absorption that leave the packet count unchanged cancel out and are still fine.</li>
</ul>

<h3>Solving</h3>
<p>If none of the above happens and every receiver gets its full correct sequence of colored packets, congratulations, you solved the puzzle! The solution locks, and its element and tick counts appear with it in the solution list.</p>

<h3>Solving controls</h3>
<p>The solution workspace keeps navigation, playback, and piece placement above the board. On a narrow screen, swipe the piece row sideways to reach any button that does not fit.</p>
<div class="help-ui-shot" role="img" aria-label="Annotated Solve workspace showing navigation, playback, piece tools, More, and the puzzle board">
  <div class="help-ui-top"><span class="help-ui-pill">← List</span><span class="help-ui-title">Color Crossing — Solution 1</span></div>
  <div class="help-ui-play"><span class="help-ui-pill">Elements: 3</span><span class="help-ui-pill">tick 7</span><span class="help-ui-meter"></span><span class="help-ui-pill">⏭</span><span class="help-ui-pill primary">▶</span><span class="help-ui-pill">↺</span></div>
  <div class="help-ui-tools"><span class="help-ui-tool">╱<br>Mirror</span><span class="help-ui-tool">◩<br>Half</span><span class="help-ui-tool">△<br>Prism</span><span class="help-ui-tool">⧉<br>Clone</span><span class="help-ui-tool">⌫<br>Eraser</span><span class="help-ui-tool">•••<br>More</span></div>
  <div class="help-ui-board"><span class="help-ui-piece-dot fixed" style="left:7%;top:50%"></span><span class="help-ui-piece-dot mirror" style="left:50%;top:50%"></span><span class="help-ui-piece-dot" style="left:79%;top:36%"></span><span class="help-ui-piece-dot fixed" style="left:93%;top:64%"></span></div>
  <span class="help-ui-label" style="left:5px;top:5px">1</span><span class="help-ui-label" style="left:5px;top:38px">2</span><span class="help-ui-label" style="left:5px;top:78px">3</span><span class="help-ui-label" style="right:6px;top:78px">4</span><span class="help-ui-label" style="right:8px;top:132px">5</span>
</div>
<ol class="help-ui-legend">
  <li><strong>List and solution name:</strong> List returns to the expanded puzzle list. Select the title to rename the solution.</li>
  <li><strong>Playback:</strong> Elements shows how many solver pieces are in use; tick shows elapsed steps. The slider changes playback speed. Step advances one square, Play pauses or resumes, and Reset returns to the beginning. After success or failure, Play restarts automatically.</li>
  <li><strong>Piece tools:</strong> Select Mirror, Half-Mirror, or Prism, then select an empty square to place it. Clone copies an existing solver piece; Eraser removes solver pieces. Fixed puzzle pieces cannot be changed.</li>
  <li><strong>More:</strong> Opens Setup, solution-level Clone/Delete/Import/Export, and Go to Design. The More button is part of the same horizontally scrolling tool row.</li>
  <li><strong>Board:</strong> Click an empty square to place a piece, or a piece to select it for cloning, or to delete it, or to see a preview of its sequence. Click a second time to see the piece's configuration.</li>
</ol>

<h3>Creating Puzzles</h3>
<p>In <strong>Create Puzzles</strong> mode, puzzles are organized into sets. Expand any combination of sets, create or import puzzles, and use the drag handles to reorder sets and puzzles or move a puzzle into another set.</p>

<h4>The design workspace</h4>
<div class="help-ui-shot" role="img" aria-label="Annotated Create Puzzles workspace showing navigation, puzzle name, test control, fixed-piece tools, More, and the design board">
  <div class="help-ui-top"><span class="help-ui-pill">← List</span><span class="help-ui-title">Color Crossing</span><span class="help-ui-pill primary">Try It Now</span></div>
  <div class="help-ui-tools"><span class="help-ui-tool">●→<br>Emitter</span><span class="help-ui-tool">→□<br>Receiver</span><span class="help-ui-tool">◆<br>Crystal</span><span class="help-ui-tool">≋<br>Transform</span><span class="help-ui-tool">⧉<br>Clone</span><span class="help-ui-tool">⌫<br>Eraser</span><span class="help-ui-tool">•••<br>More</span></div>
  <div class="help-ui-board"><span class="help-ui-piece-dot fixed" style="left:7%;top:50%"></span><span class="help-ui-piece-dot fixed" style="left:36%;top:36%;border-color:#9fd8ff"></span><span class="help-ui-piece-dot fixed" style="left:64%;top:64%;border-color:#ff9d4d"></span><span class="help-ui-piece-dot fixed" style="left:93%;top:50%;border-color:#e0a6ff"></span></div>
  <span class="help-ui-label" style="left:5px;top:5px">1</span><span class="help-ui-label" style="right:6px;top:5px">2</span><span class="help-ui-label" style="left:5px;top:48px">3</span><span class="help-ui-label" style="right:6px;top:48px">4</span><span class="help-ui-label" style="right:8px;top:92px">5</span>
</div>
<ol class="help-ui-legend">
  <li><strong>List and puzzle name:</strong> List returns to the set list. Select the puzzle name to open Setup.</li>
  <li><strong>Try It Now:</strong> Opens a fresh solution on this puzzle so you can test it immediately.</li>
  <li><strong>Fixed-piece tools:</strong> Select a component and then an empty square to place it. Clone copies a selected component; Eraser removes one.</li>
  <li><strong>More:</strong> Opens Setup and puzzle-level Clone/Delete/Import/Export.</li>
  <li><strong>Design board:</strong> Fixed components can be dragged to new squares. Select one to configure it.</li>
</ol>

<h4>Puzzle components</h4>
<ul>
  <li><strong>Emitter:</strong> Configure the direction or directions it emits toward and its ordered sequence of up to eight packet colors.</li>
  <li><strong>Receiver:</strong> Configure the direction or directions from which it accepts packets and the ordered color sequence it requires.</li>
  <li><strong>Crystal:</strong> Choose clear, black, or a filter color, and optionally set how many impacts it survives. Clear crystals slow packets without changing color; black absorbs everything; colored crystals filter as described above.</li>
  <li><strong>Transformer:</strong> Choose which direction it moves packets along the six-color spectrum shown on its strip.</li>
</ul>

<h4>Puzzle Setup</h4>
<ul>
  <li><strong>Name and dimensions:</strong> Name the puzzle and choose a grid from 5–13 rows by 5–9 columns. Making the grid smaller removes anything outside the new dimensions.</li>
  <li><strong>Strict:</strong> The packet count may not change. A merge, split, or absorption fails unless simultaneous changes balance to zero. Strict puzzles require equal total emitter and receiver packets; the designer and solver are warned when those totals differ.</li>
  <li><strong>No Prisms:</strong> Solvers may place regular Mirrors and Half-Mirrors, but not Prisms.</li>
  <li><strong>No Half-Mirrors:</strong> Solvers may place regular Mirrors and Prisms, but not Half-Mirrors. Turn on both restrictions to allow only regular Mirrors. Fixed puzzle components are unaffected; enabling either restriction removes newly disallowed pieces from existing solutions and marks those solutions in progress.</li>
</ul>

<h4>Testing and organizing</h4>
<p>Use <strong>Try It Now</strong> whenever you want to test the current design. From the puzzle list, sets and individual puzzles can be imported, exported, renamed, cloned, or deleted. <strong>Save as Web App</strong> downloads a standalone copy containing the current puzzle sets but no saved solutions.</p>

<h3>Sharing puzzles &amp; solutions</h3>
<p>Everything is stored locally in your browser. You can export or import:</p>
<ul>
  <li>A single solution</li>
  <li>All the solutions for a puzzle</li>
  <li>All the solutions for a set</li>
  <li>All the solutions for all of the puzzles</li>
  <li>A single puzzle configuration</li>
  <li>All the puzzles in a set</li>
  <li>All of the puzzles in all of the sets</li>
</ul>
<p>To share the whole game with someone, send them this app file plus the relevant export—they can open the app and import it straight in. Puzzle designers can also use <strong>Save as Web App</strong> to download a standalone copy with the current sets and puzzles built in; saved solutions are not included.</p>
`;
}
function showHelp(){
  const body = document.getElementById('helpBody');
  if(!body.dataset.built){ body.innerHTML = buildHelpContent(); body.dataset.built='1'; }
  document.getElementById('helpBackdrop').classList.add('show');
}
function hideHelp(){
  document.getElementById('helpBackdrop').classList.remove('show');
}
document.getElementById('helpBtn').addEventListener('click', showHelp);
document.getElementById('helpCloseBtn').addEventListener('click', hideHelp);
document.getElementById('helpPlayBtn').addEventListener('click', hideHelp);
document.getElementById('helpBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='helpBackdrop') hideHelp(); });
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('helpBackdrop').classList.contains('show')) hideHelp();
  else if(State.sheetOpen) closeInspectorSheet();
});

/* ============================== BOOT ============================== */
loadAll();
renderScreen();
showHelp();

})();
