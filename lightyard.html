<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lightyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b10;
  --panel:#12141b;
  --panel2:#181b24;
  --line:#262a36;
  --text:#e8e9ee;
  --dim:#8b8fa3;
  --dimmer:#5a5e70;
  --accent:#6ee7ff;
  --R:#ff4d4d; --G:#32e428; --B:#4d4dfe; --C:#28f0ff; --M:#e45cff; --Y:#ffd94d; --W:#f5f6fa;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;}
button, input, select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#2a2e3a;border-radius:4px;}

#app{display:flex;flex-direction:column;height:100vh;}

/* ---- Header ---- */
header{
  display:flex;align-items:center;gap:20px;
  padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  flex-shrink:0;
}
.brand{display:flex;flex-direction:column;gap:2px;cursor:pointer;border-radius:7px;outline:none;}
.brand:hover h1,.brand:focus-visible h1{color:var(--accent);}
.brand:focus-visible{box-shadow:0 0 0 2px var(--accent);}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:0.3px;}
.beam{height:3px;width:120px;border-radius:2px;
  background:linear-gradient(90deg,var(--R),var(--Y),var(--G),var(--C),var(--B),var(--M),var(--R));
  background-size:200% 100%;
  animation:flow 6s linear infinite;}
@keyframes flow{to{background-position:200% 0;}}

nav.modes{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:9px;}
nav.modes button{
  border:none;background:transparent;color:var(--dim);padding:7px 14px;border-radius:7px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
}
nav.modes button.active{background:var(--bg);color:var(--text);}
nav.modes button:hover:not(.active){color:var(--text);}
nav.detail-nav{display:none;gap:4px;background:var(--panel2);padding:3px;border-radius:9px;}
nav.detail-nav button{
  border:none;background:transparent;color:var(--text);padding:7px 12px;border-radius:7px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;
}
nav.detail-nav button:hover:not(:disabled){background:var(--bg);color:var(--accent);}
nav.detail-nav button:disabled{color:var(--dimmer);cursor:default;}
nav.detail-nav .short-label{display:none;}
header.detail-open nav.modes{display:none;}
header.detail-open nav.detail-nav{display:flex;}

.spacer{flex:1;}

.runbar{display:flex;align-items:center;gap:14px;}
.runbar .ticks{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);
  background:var(--panel2);padding:6px 10px;border-radius:7px;min-width:96px;text-align:center;}
.runbar .ticks b{color:var(--text);}
.speedwrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
.speedwrap input[type=range]{width:130px;accent-color:var(--accent);}
.iconbtn{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);}
.iconbtn:disabled{opacity:.35;cursor:default;}
.iconbtn:disabled:hover{border-color:var(--line);color:var(--text);}
.iconbtn.primary{background:var(--accent);color:#04222b;border-color:var(--accent);}

/* ---- Layout ---- */
#body{flex:1;display:flex;min-height:0;}
aside{width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px;}
aside.right{border-right:none;border-left:1px solid var(--line);}
main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0;
  background:
    radial-gradient(circle at 50% 0%, #0e1018 0%, #08090d 70%);}
#gridCanvas{border-radius:12px;background:#0d0f16;box-shadow:0 0 0 1px #626979, 0 20px 60px -20px #000;}
.mobile-tabs{display:none;}

h2.side-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dimmer);
  margin:0 0 10px 0;font-weight:600;}
h3.sub{font-size:12px;color:var(--dim);margin:16px 0 8px;font-weight:600;}

.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:10px;}
.card p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.5;}

.btn{
  display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  margin-bottom:6px;transition:.12s;
}
.btn:hover{border-color:var(--accent);}
.btn.solid{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;text-align:center;}
.btn.solid:hover{filter:brightness(1.08);}
.btn.danger{color:#ff8080;}
.btn.danger:hover{border-color:#ff8080;}
.btn.small{padding:6px 9px;font-size:12px;display:inline-block;width:auto;margin-right:6px;}
.btn.tool{display:flex;align-items:center;gap:9px;}
.btn.tool.active{border-color:var(--accent);background:#132229;}
.btn.tool:disabled{opacity:0.4;cursor:not-allowed;}
.btn.tool:disabled:hover{border-color:var(--line);}
.toolicon{width:20px;height:20px;flex-shrink:0;}

input[type=text], input[type=number]{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:7px 9px;border-radius:7px;font-size:13px;margin-bottom:8px;
}
label.field{display:block;font-size:11px;color:var(--dimmer);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
label.field.sequence-heading{color:var(--dim);}

.dirgrid{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(3,28px);gap:2px;margin-bottom:8px;}
.dirbtn{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:5px;
  cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;}
.dirbtn.on{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;}

.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
.color-code{display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
  font-weight:800;color:var(--color-code-ink,#fff);text-shadow:0 1px 2px #000b;}
.swatch.color-code{font-size:13px;}

.prism-seq-row{display:flex;gap:8px;margin-bottom:10px;}
.prism-slot{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;}
.prism-slot:hover:not(:disabled){border-color:var(--accent);}
.prism-slot:disabled{cursor:default;opacity:0.65;}
.prism-slot.off svg rect{transition:stroke .15s;}
.orientation-program{display:grid;gap:7px;margin-bottom:10px;}
.orientation-choice-row{display:grid;grid-template-columns:24px repeat(5,minmax(42px,1fr));gap:6px;align-items:center;}
.orientation-step{color:var(--dimmer);font-size:12px;font-weight:700;text-align:center;}
.orientation-choice{min-width:0;min-height:42px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.orientation-choice:hover:not(:disabled){border-color:var(--accent);}
.orientation-choice.selected{border-color:#8beeff;background:#24586a;
  box-shadow:inset 0 0 0 1px #b8f5ff99,0 0 10px #6ee7ff33;}
.orientation-choice.selected svg{filter:brightness(1.45) saturate(1.2);}
.orientation-choice:disabled{cursor:default;opacity:.62;}
.orientation-choice.blank{font-size:18px;color:var(--dimmer);}
.swatch:hover{border-color:#fff;}
.chipline{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:28px;
  background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px;}
.chip{width:22px;height:22px;border-radius:5px;cursor:pointer;position:relative;flex-shrink:0;}
.chip.color-code{font-size:11px;}
.chip::after{content:'×';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#0009;font-size:12px;opacity:0;font-weight:900;}
.chip:hover::after{opacity:1;}
.chip-empty{color:var(--dimmer);font-size:11px;padding:4px;}

.radiorow{display:flex;gap:6px;margin-bottom:8px;}
.radiorow button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  padding:7px 4px;border-radius:7px;cursor:pointer;font-size:11.5px;}
.radiorow button.on{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;}
.mirror-orientation-editor{margin-bottom:8px;}
.mirror-orientation-editor .radiorow{margin-bottom:6px;}
.mirror-orientation-row button{min-height:62px!important;}
.mirror-orientation-single svg{width:52px;height:52px;display:block;}
.mirror-orientation-sequence{display:flex;align-items:center;justify-content:center;gap:7px;}
.mirror-orientation-sequence svg{width:32px;height:32px;display:block;}
.mirror-orientation-sequence .sequence-arrow{font-size:20px;font-weight:800;line-height:1;}
.mirror-orientation-row button.on svg{filter:brightness(1.2) drop-shadow(0 0 4px #dcefff88);}

.checkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);margin-bottom:8px;cursor:pointer;}

.puzlist .item, .sollist .item{
  border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer;
}
.puzlist .item:hover, .sollist .item:hover{border-color:var(--accent);}
.sollist .item.active-sol{border-color:var(--accent);background:#132229;}
.puzlist .item .name{font-weight:600;font-size:13.5px;}
.puzlist .item .meta{font-size:11px;color:var(--dimmer);margin-top:3px;}
.sollist .item .name{font-weight:600;font-size:13px;}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.badge.solved{background:#123b26;color:#32e428;}
.badge.progress{background:#2b2410;color:#ffd94d;}
.rowbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

.empty-hint{color:var(--dimmer);font-size:12.5px;text-align:center;padding:30px 10px;}

.statusbar{position:static;flex:none;margin:8px 12px 0;padding:8px 18px;
  border-radius:8px;font-size:13px;font-weight:600;text-align:center;
  background:var(--panel2);border:1px solid var(--line);display:none;}
.statusbar.show{display:block;}
.statusbar.solved{color:#32e428;border-color:#32e428;}
.statusbar.failed{color:#ff6b6b;border-color:#ff6b6b;}

.dialog-backdrop{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:340px;}
.dialog h3{margin:0 0 12px;font-size:15px;}
.dialog .rowbtns{justify-content:flex-end;}

.puzzle-setup-dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;}
.puzzle-intro-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:7px 0 8px;}
.puzzle-intro-tools .hint{font-size:11.5px;color:var(--dimmer);margin-right:2px;}
.puzzle-intro-insert{width:32px;height:32px;border:1px solid #69707f;border-radius:8px;padding:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font:800 14px 'JetBrains Mono',monospace;box-shadow:inset 0 0 0 1px #ffffff20;}
.puzzle-intro-insert.element{width:42px;height:42px;background:#10131a;}
.puzzle-intro-insert.element svg{display:block;width:38px;height:38px;}
.puzzle-intro-surface{box-sizing:border-box;width:100%;height:280px;overflow-y:auto;overscroll-behavior:contain;
  border:1px solid #626979;border-radius:12px;background:#11131a;color:#fff;padding:18px 20px;
  font-size:20px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;}
.puzzle-intro-editor{outline:none;cursor:text;caret-color:var(--accent);}
.puzzle-intro-editor:focus{border-color:var(--accent);box-shadow:0 0 0 2px #6ee7ff25;}
.puzzle-intro-editor:empty::before{content:attr(data-placeholder);color:#858b99;pointer-events:none;}
.puzzle-intro-symbol{display:inline-flex;vertical-align:.08em;align-items:center;justify-content:center;
  min-width:1.42em;height:1.42em;margin:0 .08em;border-radius:.3em;border:1px solid #ffffff50;
  font:800 .68em 'JetBrains Mono',monospace;line-height:1;box-shadow:0 1px 5px #0008;}
.puzzle-intro-element{display:inline-flex;vertical-align:-.52em;align-items:center;justify-content:center;
  width:1.9em;height:1.9em;margin:0 .09em;border:1px solid #555c6a;border-radius:.35em;
  background:#10131a;box-shadow:0 1px 5px #0008;}
.puzzle-intro-element svg{display:block;width:100%;height:100%;}
.puzzle-intro-paragraph{min-height:1.5em;}
.puzzle-intro-paragraph + .puzzle-intro-paragraph{margin-top:.55em;}
.puzzle-intro-overlay{position:absolute;z-index:45;inset:0;display:block;
  background:rgba(5,6,11,.48);cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;}
.puzzle-intro-card{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;width:min(560px,calc(100% - 28px));height:min(340px,55%);max-height:calc(100% - 28px);
  min-height:130px;border:2px solid #858c9c;border-radius:16px;background:#1c1f28;color:#fff;
  box-shadow:0 24px 70px #000c;overflow:hidden;cursor:pointer;}
.puzzle-intro-card .puzzle-intro-surface{flex:1;min-height:0;height:auto;border:0;border-radius:0;background:#1c1f28;color:#fff;cursor:pointer;}
.puzzle-intro-dismiss{border-top:1px solid #3d424e;padding:10px 16px;text-align:center;color:var(--accent);
  font-size:12px;font-weight:700;letter-spacing:.2px;background:#11131a;}
.board-stage.intro-open{overflow:hidden;}

.sizewrap{display:flex;gap:10px;}
.sizewrap > div{flex:1;}

.help-backdrop{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
.help-backdrop.show{display:flex;}
.help-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px -20px #000;}
.help-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
.help-head h2{margin:0;font-size:18px;}
.help-head .ver{font-size:11px;color:var(--dimmer);background:var(--panel2);padding:3px 9px;border-radius:20px;font-weight:600;}
.help-body{overflow-y:auto;padding:6px 24px 20px;flex:1;}
.help-body h3{font-size:14px;color:var(--accent);margin:24px 0 8px;letter-spacing:.2px;}
.help-body h3:first-child{margin-top:16px;}
.help-body h4{font-size:12.5px;color:var(--text);margin:16px 0 5px;font-weight:700;}
.help-body p{font-size:13px;color:var(--dim);line-height:1.65;margin:6px 0;}
.help-body ul{margin:6px 0;padding-left:20px;}
.help-body li{font-size:13px;color:var(--dim);line-height:1.6;margin:3px 0;}
.help-body strong{color:var(--text);}
.help-body a{color:var(--accent);}
.hs{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 1px;}
.help-ex{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:12.5px;color:var(--dim);}
.help-piece{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);}
.help-piece:first-of-type{border-top:none;}
.help-piece .pn{font-weight:700;color:var(--text);font-size:13px;min-width:130px;flex-shrink:0;}
.help-piece .pd{font-size:12.5px;color:var(--dim);line-height:1.6;}
.help-ui-shot{position:relative;margin:12px 0 10px;border:1px solid #626979;border-radius:12px;background:#0a0b10;overflow:hidden;box-shadow:0 12px 30px #0007;}
.help-ui-top,.help-ui-play,.help-ui-tools{display:flex;align-items:center;gap:5px;padding:6px 7px;background:#12141b;border-bottom:1px solid #303646;min-width:max-content;}
.help-ui-title{flex:1;min-width:130px;color:#e8e9ee;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.help-ui-pill,.help-ui-tool{border:1px solid #343a49;border-radius:6px;background:#181b24;color:#c4c7d1;font-size:8px;font-weight:650;padding:5px 7px;white-space:nowrap;text-align:center;}
.help-ui-pill.primary{background:#123544;border-color:#6ee7ff;color:#bff6ff;}
.help-ui-play{background:#101219;}
.help-ui-meter{height:4px;width:70px;border-radius:3px;background:linear-gradient(90deg,#6ee7ff 39%,#343a49 39%);}
.help-ui-tools{overflow:hidden;}
.help-ui-tool{min-width:52px;padding:6px 4px;}
.help-ui-board{height:205px;margin:14px auto 16px;width:min(72%,300px);border:1px solid #626979;border-radius:7px;
  background-color:#0d0f16;background-image:linear-gradient(#444957 1px,transparent 1px),linear-gradient(90deg,#444957 1px,transparent 1px);background-size:14.285% 14.285%;position:relative;}
.help-ui-piece-dot{position:absolute;width:17px;height:17px;border:2px solid #8a6fff;background:#2a2436;transform:translate(-50%,-50%) rotate(45deg);}
.help-ui-piece-dot.mirror{border:0;border-radius:0;background:linear-gradient(135deg,transparent 44%,#dcefff 45% 55%,transparent 56%);transform:translate(-50%,-50%);}
.help-ui-piece-dot.fixed{border-radius:4px;border-color:#6ee7ff;background:#1a2230;transform:translate(-50%,-50%);}
.help-ui-label{position:absolute;z-index:2;width:22px;height:22px;border-radius:50%;background:#ffd94d;color:#141414;border:2px solid #fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px #000;}
.help-ui-legend{margin:8px 0 16px!important;padding-left:25px!important;}
.help-ui-legend li{padding-left:3px;}
.help-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;}
.help-foot .credit{font-size:11.5px;color:var(--dimmer);line-height:1.5;}
.help-foot .btn{width:auto;margin:0;padding:9px 16px;}
.settings-dialog-backdrop{z-index:120;}

/* ---- About / opening screen ---- */
.about-backdrop{position:fixed;inset:0;z-index:115;display:none;overflow:hidden;cursor:pointer;
  align-items:center;justify-content:center;background:
  radial-gradient(circle at 50% 42%,#182130 0%,#0b0e15 38%,#05060a 78%);}
.about-backdrop.show{display:flex;}
#aboutCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.about-content{position:relative;z-index:1;width:min(590px,calc(100vw - 40px));padding:42px 34px;text-align:center;
  border:1px solid #ffffff2e;border-radius:24px;background:linear-gradient(145deg,#161a24bd,#0b0d13ad);
  box-shadow:0 30px 90px #000c,0 0 80px #6ee7ff10;backdrop-filter:blur(8px);}
.about-logo{display:inline-flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:24px;}
.about-logo h1{margin:0;font-size:clamp(48px,11vw,82px);line-height:.95;letter-spacing:-2.5px;color:#fff;
  text-shadow:0 0 28px #6ee7ff38;}
.about-logo .beam{width:min(390px,72vw);height:7px;border-radius:5px;box-shadow:0 0 18px #6ee7ff55;}
.about-by{font-size:18px;color:#fff;margin:0 0 7px;}
.about-version{font:600 13px 'JetBrains Mono',monospace;color:#aeb5c5;margin-bottom:22px;}
.about-tagline{max-width:470px;margin:0 auto;color:#fff;font-size:clamp(18px,4.5vw,24px);line-height:1.45;text-wrap:balance;}
.about-enter{margin-top:30px;color:#c8cfdd;font-size:14px;font-weight:650;letter-spacing:.25px;}
.about-enter span{color:var(--accent);}
@media (max-width:500px){
  .about-content{padding:34px 22px;border-radius:20px;}
  .about-logo{margin-bottom:20px;}
  .about-by{font-size:16px;}
  .about-enter{margin-top:24px;}
}

/* ---- Solved celebration ---- */
.celebration-layer{position:fixed;inset:0;z-index:95;overflow:hidden;pointer-events:auto;}
.confetti-piece{position:fixed;left:var(--start-x);top:var(--start-y);width:var(--w);height:var(--h);
  border-radius:2px;background:var(--color);box-shadow:0 0 0 1px #ffffff18;
  animation:confetti-fall var(--duration) cubic-bezier(.16,.65,.33,1) var(--delay) forwards;}
@keyframes confetti-fall{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r0)) scale(.3);}
  8%{opacity:1;}
  28%{transform:translate(var(--mid-x),var(--rise)) rotate(var(--r1)) scale(1);}
  100%{opacity:.95;transform:translate(var(--end-x),calc(100vh + 90px)) rotate(var(--r2)) scale(.88);}
}
.victory-dialog{position:fixed;z-index:2;left:var(--dialog-x);top:var(--dialog-y);transform:translate(-50%,-50%);
  width:min(360px,calc(100vw - 32px));padding:27px 28px 22px;text-align:center;pointer-events:auto;
  cursor:pointer;
  border:2px solid #ffd94d;border-radius:22px;color:#fff;background:
    radial-gradient(circle at 50% -20%,#6ee7ff36,transparent 48%),linear-gradient(145deg,#242030,#11151d 68%);
  box-shadow:0 0 0 5px #ffd94d22,0 24px 80px #000d;animation:victory-arrive .42s cubic-bezier(.2,1.35,.45,1) both;}
.victory-dialog::before,.victory-dialog::after{content:'✦';position:absolute;color:#ffd94d;font-size:24px;text-shadow:0 0 14px #ffd94d99;}
.victory-dialog::before{left:18px;top:15px;transform:rotate(-16deg);}
.victory-dialog::after{right:18px;top:15px;transform:rotate(16deg);}
.victory-message{font-size:clamp(28px,7vw,42px);font-weight:800;line-height:1.08;letter-spacing:-1px;text-wrap:balance;}
.victory-name{display:block;color:#ffd94d;margin-top:4px;overflow-wrap:anywhere;}
.victory-stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px;font:700 14px 'JetBrains Mono',monospace;}
.victory-stat{padding:7px 10px;border:1px solid #ffffff22;border-radius:10px;background:#0b0e1588;color:#f5f6fa;}
.victory-stat.elements.equal{color:#7d7daf;border-color:#4d4dfe55;}
.victory-stat.elements.better{color:#4d4dfe;border-color:#4d4dfebb;text-shadow:0 0 10px #4d4dfe55;}
.victory-stat.ticks.equal{color:#a86f6f;border-color:#ff4d4d55;}
.victory-stat.ticks.better{color:#ff4d4d;border-color:#ff4d4dbb;text-shadow:0 0 10px #ff4d4d55;}
.victory-callouts{margin-top:12px;font-size:14px;font-weight:700;line-height:1.4;}
.victory-callout + .victory-callout{margin-top:4px;}
.victory-callout.elements.equal{color:#7d7daf;}.victory-callout.elements.better{color:#4d4dfe;}
.victory-callout.ticks.equal{color:#a86f6f;}.victory-callout.ticks.better{color:#ff4d4d;}
.victory-dialog .btn{width:auto;margin:20px auto 0;padding:9px 20px;text-align:center;}
@keyframes victory-arrive{from{opacity:0;transform:translate(-50%,-50%) scale(.72) rotate(-2deg);}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);}}

/* ---- Unified library / sliding board interface ---- */
.mobile-tabs{display:none!important;}
#body{position:relative;display:block;overflow:hidden;}
#leftPanel{
  width:min(820px,100%);height:100%;margin:0 auto;border:0;padding:18px;
  background:var(--bg);overflow-y:auto;
}
#rightPanel{
  display:block;position:fixed;z-index:60;left:50%;right:auto;top:var(--inspector-top,96px);bottom:auto;
  width:min(720px,100%);max-height:min(64vh,680px);padding:0;
  border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;
  background:var(--panel);overflow:hidden;
  opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-14px);
  transition:transform .18s ease,opacity .18s ease,visibility 0s linear .18s;
  box-shadow:0 24px 70px -30px #000;
}
#rightPanel.sheet-open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0);transition-delay:0s;}
.sheet-backdrop{display:none;position:fixed;inset:0;background:#0008;z-index:55;}
.sheet-backdrop.show{display:block;}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
.sheet-head h2{font-size:14px;margin:0;flex:1;}
.sheet-body{padding:14px;max-height:calc(min(64vh,680px) - 60px);overflow-y:auto;}

main#boardPanel{
  position:absolute;z-index:20;inset:0;min-width:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;
  transform:translateX(102%);transition:transform .24s ease;background:var(--bg);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
main#boardPanel.board-open{transform:translateX(0);}
main#boardPanel.run-failed #gridCanvas{border-radius:4px;
  box-shadow:0 0 0 6px rgba(255,78,78,.16),0 0 22px 10px rgba(255,55,55,.14);}
.board-chrome{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 12px;}
.board-row{display:flex;align-items:center;gap:8px;min-width:0;}
.board-row + .board-row{margin-top:8px;}
.board-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.board-title.editable{cursor:pointer;border:0;background:transparent;color:var(--text);text-align:left;padding:7px 4px;border-radius:7px;}
.board-title.editable:hover{background:var(--panel2);}
.board-select{display:none;}
.mobile-tool-strip{display:flex;position:relative;gap:6px;min-width:0;width:100%;}
.mobile-tool-strip-scroll{display:flex;gap:6px;min-width:0;flex:1;}
.mobile-tool-button,.mobile-more-button,.header-more-button{
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:8px;

}

.mobile-tool-button .mobile-tool-glyph{font-size:24px;line-height:25px;}
.mobile-tool-button[data-tool="mirrorDiag"] .mobile-tool-glyph{position:relative;height:25px;font-size:0;}
.mobile-tool-button[data-tool="mirrorDiag"] .mobile-tool-glyph::before{content:"";position:absolute;left:50%;top:50%;width:21px;height:3.5px;

.tree-set{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:9px;overflow:hidden;}

.tree-set.has-right-menu > .tree-head,.tree-puzzle.has-right-menu > .tree-puzzle-head{padding-right:92px;}
.tree-set.has-right-menu > .tree-head .tree-chevron,.tree-puzzle.has-right-menu > .tree-puzzle-head .tree-chevron{
  position:absolute;right:7px;top:7px;}
.tree-puzzle.has-right-menu > .tree-puzzle-head .tree-chevron{top:5px;}
.tree-head,.tree-puzzle-head,.tree-solution{display:flex;align-items:center;gap:9px;width:100%;border:0;color:var(--text);text-align:left;cursor:pointer;}
.tree-head{padding:12px;background:var(--panel2);}
.tree-head:hover,.tree-puzzle-head:hover,.tree-solution:hover{background:#182029;}
.tree-chevron{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;
  margin:-5px -5px -5px 0;border-radius:8px;color:#cfd5e3;background:#ffffff08;transition:background .15s;}

.tree-chevron::before{content:'';width:9px;height:9px;border:solid currentColor;border-width:0 2.5px 2.5px 0;

.tree-copy{min-width:0;flex:1;}

.tree-puzzle-body{padding:0 8px 8px 24px;}

.goal-elements-better{--goal-blue:#4d4dfe;}

.goal-ticks-better{--goal-red:#ff4d4d;}
.tree-star.goal-elements:not(.goal-ticks),.tree-stars .goal-elements:not(.goal-ticks){text-shadow:2px 0 0 var(--goal-blue);}
.tree-star.goal-ticks:not(.goal-elements),.tree-stars .goal-ticks:not(.goal-elements){text-shadow:2px 0 0 var(--goal-red);}
.tree-star.goal-elements.goal-ticks,.tree-stars .goal-elements.goal-ticks{
  text-shadow:1.5px 0 0 var(--goal-blue),3px 0 0 var(--goal-red);}
.tree-empty{font-size:12px;color:var(--dimmer);padding:10px;}
.list-drag-handle{position:absolute;z-index:2;right:7px;top:7px;width:34px;height:34px;border:0;border-radius:7px;

#sheetBody .swatch{width:44px;height:44px;font-size:17px;border-radius:9px;}
#sheetBody input[type=number]{min-height:50px;font-size:18px;color:#fff;background:#212121;border-color:#656b79;padding:10px 12px;}
#sheetBody .checkline{font-size:16px;line-height:1.4;color:#fff;min-height:46px;}
#sheetBody .checkline input{width:20px;height:20px;flex:none;}
#sheetBody .radiorow{gap:9px;margin-bottom:13px;}
#sheetBody .radiorow button{min-height:48px;font-size:15px;color:#fff;background:#212121;border-color:#656b79;}
#sheetBody .radiorow button.on{background:var(--accent);color:#03191f;border-color:var(--accent);}
#sheetBody .orientation-step{font-size:14px;color:#fff;}
#sheetBody .orientation-choice{border-color:#555b69;}
#sheetBody.sequence-sheet > div > p{font-size:14px!important;line-height:1.4!important;color:#fff!important;}

@media (max-width:800px){
  #sheetBody{padding:13px 15px;}
  #sheetBody .dirgrid{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);}
  #sheetBody .chip{width:42px;height:42px;}
  #sheetBody .swatch{width:42px;height:42px;}
  #sheetBody.sequence-sheet{padding:10px 12px;}
  #sheetBody.sequence-sheet .card{padding:10px 12px;}
  #sheetBody.sequence-sheet label.field{margin-top:7px;}
}
</style>
</head>

function computeCrossFrac(startA, endA, startB, endB){
  const EPS = 1e-9;
  const ddr = (endA.r-startA.r) - (endB.r-startB.r);

    f = dr0/ddr;

  const goal=puzzleGoalForWebApp(puzzle);
  if(goal){copy.goalElements=goal.elements;copy.goalTicks=goal.ticks;}
  else{delete copy.goalElements;delete copy.goalTicks;}
  return copy;
}
function saveAsWebApp(){
  const catalogSets=allSets();
  const usedSetIds=new Set();
  const catalog=catalogSets.map((set,index)=>{
    const base=canonicalSetId(set)||('set-'+index);let id=base,n=2;
    while(usedSetIds.has(id))id=base+'~'+n++;
    usedSetIds.add(id);return {set,id};
  });
  const embedded={
    storageNamespace:'app-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),
    playerName:State.playerName||undefined,
    colorblind:!!State.colorblind,
    soundEnabled:!!State.soundEnabled,
    sets:catalog.map(({set,id})=>({id,name:set.name,createdAt:set.createdAt||Date.now()})),
    puzzles:catalog.flatMap(({set,id})=>puzzlesForSet(set).map(p=>portableWebAppPuzzle(p,id)))
  };
  // Escaping '<' prevents script-closing text in a puzzle or set name from
  // terminating the inline script in the generated app.
  const json=JSON.stringify(embedded).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const start='/*__LIGHTYARD_EMBED_START__*/',end='/*__LIGHTYARD_EMBED_END__*/';
  const startAt=SOURCE_APP_HTML.indexOf(start),endAt=SOURCE_APP_HTML.indexOf(end,startAt+start.length);
  if(startAt<0||endAt<0){alert('This copy of Lightyard could not prepare a standalone app.');return;}
  const html=SOURCE_APP_HTML.slice(0,startAt+start.length)+' '+json+' '+SOURCE_APP_HTML.slice(endAt);
  downloadTextFile(html,'lightyard-web-app.html','text/html');
}

  return (String(s||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')) || 'untitled';
}

// Sanitizers assign fresh ids (so re-importing the same file, or a file shared by
// someone else, never collides with what's already stored) and validate just
// enough structure to render safely — every other field on each element passes
// through untouched, which is what keeps this forward-compatible with element
// types this version of the app doesn't know about yet.
function sanitizePuzzleData(raw, setId){
  if(!raw || typeof raw!=='object') throw new Error('missing puzzle data');
  const rows = clamp(parseInt(raw.rows)||7, 5, 13);
  const cols = clamp(parseInt(raw.cols)||7, 5, 9);
  const elements = Array.isArray(raw.elements) ? raw.elements.map(sanitizeElementData).filter(Boolean) : [];
  return {
    id: uid(),
    setId: setId,
    name: (raw.name && String(raw.name).slice(0,80)) || 'Imported Puzzle',
    rows, cols,
    createdAt: Date.now(),
    elements,
    strict: !!raw.strict,
    noPrisms: raw.noPrisms!=null ? !!raw.noPrisms : !!raw.mirrorsOnly,
    noHalfMirrors: !!raw.noHalfMirrors,
    introText: raw.introText==null ? '' : String(raw.introText)
  };
}
function sanitizeElementData(el){
  if(!el || typeof el!=='object' || typeof el.type!=='string') return null;
  if(typeof el.r!=='number' || typeof el.c!=='number') return null;
  if(el.type==='wood') return null;
  const copy = JSON.parse(JSON.stringify(el));
  delete copy.fixed; // runtime-only marker, reassigned by buildWorkingGrid
  normalizeCrystalType(copy); // 'crystalColored' from an older export folds into 'crystal'
  normalizeHalfMirrorData(copy);
  normalizePacketSequence(copy);
  return copy;
}
function normalizePacketSequence(el){
  if(!el || (el.type!=='emitter' && el.type!=='receiver') || !Array.isArray(el.colors))return false;
  if(el.colors.length<=8)return false;
  el.colors=el.colors.slice(0,8);
  return true;
}
// Clear and colored crystals used to be two separate element types; they're
// now one 'crystal' type with filterColor null (clear) or a color. Anything
// still carrying the old type name — from localStorage or an older export —
// gets folded in here rather than breaking.
function normalizeCrystalType(el){
  if(el && el.type==='crystalColored'){ el.type='crystal'; }
  if(el && el.type==='crystal'){
    if(el.maxHits==null) el.maxHits='inf';
    else if(el.maxHits!=='inf') el.maxHits=clamp(parseInt(el.maxHits)||1,1,99);
  }
  return el;
}
// Half-mirrors were originally stored as a diagonal plus an upper/lower
// reflective side and an optional two-state switch. Convert that model to a
// corner facing and a prism-style four-slot program as old saves are loaded.
function normalizeHalfMirrorData(el){
  if(!el || el.type!=='mirrorHalf') return el;
  const corners=['NW','NE','SE','SW'];
  const facing=corners.includes(el.facing) ? el.facing : legacyHalfMirrorFacing(el);
  let seq=Array.isArray(el.seq) ? el.seq.slice(0,3) : null;
  if(!seq && el.switching){
    const oldNext=(el.reflectiveSide||'upper')==='upper'
      ? (facing==='NW'?'NE':'NW')
      : (facing==='SE'?'SW':'SE');
    seq=[oldNext,null,null];
  }
  el.facing=facing;
  el.seq=(seq||[null,null,null]).map(v=>corners.includes(v)?v:null);
  delete el.orientation; delete el.reflectiveSide; delete el.switching;
  return el;
}
function sanitizeSolutionData(raw, puzzleRef){
  if(!raw || typeof raw!=='object') throw new Error('missing solution data');
  const elements = Array.isArray(raw.elements) ? raw.elements.map(sanitizeElementData).filter(Boolean) : [];
  const solved = raw.status==='solved';
  const puzzle=typeof puzzleRef==='object'?puzzleRef:findPuzzleByRuntimeId(puzzleRef)||State.puzzles.find(p=>p.id===puzzleRef);
  const puzzleId=puzzle?canonicalPuzzleId(puzzle):puzzleRef;
  const solution = {
    id: uid(),
    puzzleId,
    puzzleHash:puzzle?puzzleConfigurationHash(puzzle):(raw.puzzleHash||null),
    name: (raw.name && String(raw.name).slice(0,80)) || 'Imported Solution',
    elements,
    status: solved ? 'solved' : 'in-progress',
    createdAt: Date.now()
  };
  if(solved && raw.ticksToSolve!=null && Number.isFinite(Number(raw.ticksToSolve))){ solution.ticksToSolve=Math.max(0,Math.floor(Number(raw.ticksToSolve))); }
  enforcePuzzleSolutionRules(puzzle,solution);
  return solution;
}
function enforcePuzzleSolutionRules(puzzle,solution){
  if(!puzzle || !solution) return false;
  const disallowed=new Set();
  if(puzzle.noPrisms)disallowed.add('prism');
  if(puzzle.noHalfMirrors)disallowed.add('mirrorHalf');
  if(!disallowed.size)return false;
  const before=(solution.elements||[]).length;
  solution.elements=(solution.elements||[]).filter(el=>!disallowed.has(el.type));
  if(solution.elements.length===before) return false;
  solution.status='in-progress';
  delete solution.ticksToSolve;
  return true;
}
function fitSolutionToPuzzle(puzzle,solution){
  if(!puzzle||!solution)return 0;
  const occupied=new Set((puzzle.elements||[]).map(el=>`${el.r},${el.c}`));
  const kept=[];
  let removed=0;
  for(const element of solution.elements||[]){
    const fits=Number.isInteger(element.r)&&Number.isInteger(element.c)&&
      element.r>=0&&element.c>=0&&element.r<puzzle.rows&&element.c<puzzle.cols;
    const key=`${element.r},${element.c}`;
    if(!fits||occupied.has(key)){removed++;continue;}
    occupied.add(key);kept.push(element);
  }
  solution.elements=kept;
  if(removed){solution.status='in-progress';delete solution.ticksToSolve;delete solution.solvedAt;}
  return removed;
}

function targetSetForQuickImport(){
  // Used for imports that don't carry their own set context (a single
  // puzzle or solution file) — land in whichever set is currently open, or
  // fall back to a catch-all set rather than asking, since this path is
  // meant to be quick and low-friction for a single item.
  if(State.currentSetId && State.sets.some(s=>s.id===State.currentSetId)) return State.currentSetId;
  let s = State.sets.find(x=>x.name==='Imported');
  if(!s){ s = {id:uid(), name:'Imported', createdAt:Date.now()}; State.sets.push(s); persistSets(); }
  return s.id;
}

function importPuzzlePayload(data){
  const puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
  State.puzzles.push(puzzle);
  persistPuzzles();
  return puzzle;
}
function importSolutionPayload(data){
  let puzzle = null;
  if(data.puzzle){
    puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
    State.puzzles.push(puzzle);
    persistPuzzles();
  }
  if(!data.solution) throw new Error('this file has no solution data in it');
  const puzzleId = puzzle ? puzzle.id : (typeof data.solution.puzzleId==='string' ? data.solution.puzzleId : null);
  if(!puzzleId) throw new Error('this solution file has no puzzle attached to it');
  const solution = sanitizeSolutionData(data.solution, puzzle||puzzleId);
  State.solutions.push(solution);
  persistSolutions();
  return {puzzle, solution};
}
function importSolutionsPayload(data){
  let puzzle = null;
  if(data.puzzle){
    puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
    State.puzzles.push(puzzle);
    persistPuzzles();
  }
  const puzzleId = puzzle ? puzzle.id : (typeof data.puzzleId==='string' ? data.puzzleId : null);
  if(!puzzleId) throw new Error('this solutions file has no puzzle attached to it');
  const raws = Array.isArray(data.solutions) ? data.solutions : [];
  const imported = [];
  for(const raw of raws){
    const solution = sanitizeSolutionData(raw, puzzle||puzzleId);
    State.solutions.push(solution);
    imported.push(solution);
  }
  persistSolutions();
  return {puzzle, solutions: imported};
}

/* ---------- Clipboard sharing ---------- */
async function writeClipboardText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{await navigator.clipboard.writeText(text);return true;}catch(error){}
  }
  const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');
  area.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';document.body.appendChild(area);area.select();
  let copied=false;try{copied=!!document.execCommand('copy');}catch(error){}area.remove();return copied;
}
async function copyLightyardData(data,label){
  const copied=await writeClipboardText(JSON.stringify(statelessClipboardData(data),null,2));
  alert(copied?`${label} copied to the clipboard.`:`Could not copy ${label.toLowerCase()} automatically. Clipboard access may be blocked in this browser.`);
}
function statelessClipboardData(data){
  const copy=JSON.parse(JSON.stringify(data));
  const reset=solution=>{
    if(!solution||typeof solution!=='object')return;
    solution.status='in-progress';delete solution.ticksToSolve;delete solution.solvedAt;
  };
  if(copy.kind==='solution')reset(copy.solution);
  if(copy.kind==='solutions'||copy.kind==='setSolutions')for(const solution of copy.solutions||[])reset(solution);
  if(copy.kind==='allSolutions')for(const solution of copy.solutions||[])reset(solution);
  return copy;
}
function importLightyardText(text,scope){
  let data;
  try{data=JSON.parse(text);}catch(error){alert('The clipboard does not contain valid JSON.');return;}
  if(!data||data.schema!=='lightyard'||!data.kind){alert('The clipboard does not contain a Lightyard export.');return;}
  handleImportedData(data,scope);
}
function showClipboardPasteDialog(scope,label){
  const backdrop=document.createElement('div');backdrop.className='dialog-backdrop';
  const dialog=document.createElement('div');dialog.className='dialog';
  dialog.innerHTML=`<h3>Paste ${escapeHtml(label)}</h3><p style="font-size:12px;color:var(--dim);line-height:1.45;">Paste Lightyard data below, then choose Paste.</p><textarea style="width:100%;min-height:180px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:11px 'JetBrains Mono',monospace;"></textarea><div class="rowbtns"><button class="btn" data-act="cancel">Cancel</button><button class="btn solid" data-act="paste">Paste</button></div>`;
  backdrop.appendChild(dialog);document.body.appendChild(backdrop);
  const area=dialog.querySelector('textarea');
  const close=()=>backdrop.remove();dialog.querySelector('[data-act=cancel]').addEventListener('click',close);
  dialog.querySelector('[data-act=paste]').addEventListener('click',()=>{const text=area.value;close();importLightyardText(text,scope);});
  backdrop.addEventListener('click',event=>{if(event.target===backdrop)close();});setTimeout(()=>area.focus(),0);
}
async function pasteLightyardData(scope,label){
  if(navigator.clipboard&&navigator.clipboard.readText){
    try{
      const text=await navigator.clipboard.readText();
      if(text&&text.trim()){importLightyardText(text,scope);return;}
    }catch(error){}
  }
  showClipboardPasteDialog(scope,label);
}

/* ---------- Sets: import ---------- */
// Every set-bearing export kind (and the older, name-less bulk "puzzles"
// export from a previous version) normalizes to the same shape: a list of
// {name, puzzles, solutions} bundles, so one dialog and one apply routine
// handles all of them.
function normalizeIncomingSets(data){
  if(data.kind==='set'){
    return [{ name: data.setName || 'Imported Set', puzzles: data.puzzles||[], solutions: [] }];
  }
  if(data.kind==='sets'){
    return (data.sets||[]).map(s=>({ name: s.name || 'Imported Set', puzzles: s.puzzles||[], solutions: [] }));
  }
  if(data.kind==='setSolutions'){
    return [{ name: data.setName || 'Imported Set', puzzles: data.puzzles||[], solutions: data.solutions||[] }];
  }
  if(data.kind==='allSolutions'){
    return (data.sets||[]).map(s=>{
      const ids = new Set((s.puzzles||[]).map(p=>p.id));
      return { name: s.name || 'Imported Set', puzzles: s.puzzles||[], solutions: (data.solutions||[]).filter(sol=>ids.has(sol.puzzleId)) };
    });
  }
  if(data.kind==='puzzles'){
    return [{ name: 'Imported Puzzles', puzzles: data.puzzles||[], solutions: [] }];
  }
  return [];
}
function uniqueSetName(name){
  const base = name || 'Imported Set';
  if(!State.sets.some(s=>s.name===base)) return base;
  let n=2;
  while(State.sets.some(s=>s.name===base+' ('+n+')')) n++;
  return base+' ('+n+')';
}
// Builds and shows the New / Replace / Merge choice dialog for one or more
// incoming sets, then calls onConfirm with a parallel array of
// {mode:'new'|'replace'|'merge', targetSetId} once the user confirms.
function showImportSetsDialog(incomingSets, onConfirm){
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  const dialog = document.createElement('div');
  dialog.className = 'dialog';
  dialog.style.width = 'min(480px, 92vw)';
  dialog.style.maxHeight = '80vh';
  dialog.style.overflowY = 'auto';
  const h = document.createElement('h3');
  h.textContent = incomingSets.length>1 ? 'Import '+incomingSets.length+' sets' : 'Import set';
  dialog.appendChild(h);
  const rowState = incomingSets.map((s,i)=>{
    const match = State.sets.find(x=>x.name===s.name);
    const solTxt = s.solutions.length ? ', '+s.solutions.length+' solution'+(s.solutions.length!==1?'s':'') : '';
    const row = document.createElement('div');
    row.className='card'; row.style.marginBottom='10px'; row.style.padding='10px';
    const p = document.createElement('p');
    p.style.margin='0 0 8px'; p.style.fontSize='13px';
    p.innerHTML = '<strong>'+escapeHtml(s.name)+'</strong> — '+s.puzzles.length+' puzzle'+(s.puzzles.length!==1?'s':'')+solTxt;
    row.appendChild(p);
    const modeSel = document.createElement('select');
    let opts = '<option value="new">Add as a new set'+(match?' (renamed to avoid a name clash)':'')+'</option>';
    if(match) opts += '<option value="replace">Replace existing set "'+escapeAttr(s.name)+'"</option>';
    opts += '<option value="merge">Add its puzzles to an existing set…</option>';
    modeSel.innerHTML = opts;
    if(match) modeSel.value = 'replace';
    row.appendChild(modeSel);
    const mergeSel = document.createElement('select');
    mergeSel.style.marginTop='6px'; mergeSel.style.display='none';
    mergeSel.innerHTML = State.sets.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.name)+'</option>').join('');
    row.appendChild(mergeSel);
    modeSel.addEventListener('change', ()=>{ mergeSel.style.display = modeSel.value==='merge' ? 'block' : 'none'; });
    dialog.appendChild(row);
    return {modeSel, mergeSel};
  });
  const btnRow = document.createElement('div');
  btnRow.className='rowbtns';
  const cancelBtn=document.createElement('button'); cancelBtn.className='btn'; cancelBtn.textContent='Cancel';
  const confirmBtn=document.createElement('button'); confirmBtn.className='btn solid'; confirmBtn.textContent='Import';
  btnRow.appendChild(cancelBtn); btnRow.appendChild(confirmBtn);
  dialog.appendChild(btnRow);
  backdrop.appendChild(dialog);
  document.body.appendChild(backdrop);
  cancelBtn.addEventListener('click', ()=>backdrop.remove());
  confirmBtn.addEventListener('click', ()=>{
    const choices = rowState.map(({modeSel,mergeSel})=>({ mode: modeSel.value, targetSetId: mergeSel.value }));
    backdrop.remove();
    onConfirm(choices);
  });
}
function applyIncomingSets(incomingSets, choices){
  let totalPuzzles=0, totalSolutions=0;
  const replacedPuzzles=[];
  for(let i=0;i<incomingSets.length;i++){
    const s = incomingSets[i];
    const choice = choices[i];
    let targetSetId;
    if(choice.mode==='replace'){
      const existing = State.sets.find(x=>x.name===s.name);
      targetSetId = existing.id;
      replacedPuzzles.push(...State.puzzles.filter(p=>p.setId===targetSetId));
      State.puzzles = State.puzzles.filter(p=>p.setId!==targetSetId);
    } else if(choice.mode==='merge'){
      targetSetId = choice.targetSetId;
    } else {
      const newSet = {id:uid(), name: uniqueSetName(s.name), createdAt:Date.now()};
      State.sets.push(newSet);
      targetSetId = newSet.id;
    }
    const idMap = new Map();
    for(const rawP of s.puzzles){
      const puzzle = sanitizePuzzleData(rawP, targetSetId);
      if(rawP && typeof rawP.id==='string') idMap.set(rawP.id, puzzle);
      State.puzzles.push(puzzle);
      totalPuzzles++;
    }
    for(const rawSol of s.solutions){
      const newPuzzle = idMap.get(rawSol.puzzleId);
      if(!newPuzzle) continue; // solution's puzzle wasn't part of this bundle
      const solution = sanitizeSolutionData(rawSol, newPuzzle);
      State.solutions.push(solution);
      totalSolutions++;
    }
  }
  if(replacedPuzzles.length){
    State.solutions=State.solutions.filter(sol=>!replacedPuzzles.some(p=>puzzleMatchesSolution(p,sol))||allPuzzles().some(p=>puzzleMatchesSolution(p,sol)));
  }
  persistSets(); persistPuzzles(); persistSolutions();
  alert('Imported '+totalPuzzles+' puzzle'+(totalPuzzles!==1?'s':'')+
    (totalSolutions?' and '+totalSolutions+' solution'+(totalSolutions!==1?'s':''):'')+
    ' across '+incomingSets.length+' set'+(incomingSets.length!==1?'s':'')+'.');
  State.selectedCell=null; State.selectedTool=null;
  State.currentSetId=null; State.currentPuzzleId=null; State.currentSolutionId=null;
  State.screen='setList';
  renderScreen();
}

function sourcePuzzleMatches(raw, local){
  if(!raw || !local) return false;
  if(typeof raw.id==='string' && raw.id===canonicalPuzzleId(local) && puzzleConfigurationHash(raw)===puzzleConfigurationHash(local)) return true;
  return String(raw.name||'')===String(local.name||'') &&
    Number(raw.rows)===Number(local.rows) && Number(raw.cols)===Number(local.cols) &&
    puzzleConfigurationHash(raw)===puzzleConfigurationHash(local);
}
function solutionBundlesFromFile(data){
  if(data.kind==='solution') return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:data.solution?[data.solution]:[]}];
  if(data.kind==='solutions') return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:Array.isArray(data.solutions)?data.solutions:[]}];
  return normalizeIncomingSets(data).map(s=>({name:s.name||null,puzzles:s.puzzles||[],solutions:s.solutions||[]}));
}
function importScopedSolutions(data,scope){
  const allowed = scope.kind==='puzzleSolutions'
    ? allPuzzles().filter(p=>p.id===scope.puzzleId)
    : scope.kind==='setSolutions'
      ? allPuzzles().filter(p=>p.setId===scope.setId)
      : allPuzzles();
  const allowedIds=new Set(allowed.map(p=>p.id));
  const targetSet=scope.kind==='setSolutions'?findSetByRuntimeId(scope.setId):null;
  let imported=0,trimmed=0;
  if(scope.kind==='puzzleSolutions'&&scope.acceptAnyPuzzleSource){
    const target=allowed[0];
    if(target){
      for(const bundle of solutionBundlesFromFile(data))for(const rawSol of bundle.solutions||[]){
        const freshRaw={...rawSol,status:'in-progress'};delete freshRaw.ticksToSolve;delete freshRaw.solvedAt;

    persistSolutions();
    alert(imported
      ? `Pasted ${imported} solution${imported!==1?'s':''} into this puzzle${trimmed?`, skipping ${trimmed} control${trimmed!==1?'s':''} that did not fit`:''}.`
      : 'The clipboard did not contain any solutions.');
    renderScreen();return;
  }
  for(const bundle of solutionBundlesFromFile(data)){
    const rawById=new Map((bundle.puzzles||[]).filter(Boolean).map(p=>[p.id,p]));
    for(const rawSol of bundle.solutions||[]){
      const rawPuzzle=rawById.get(rawSol.puzzleId) || null;
      let target=allowed.find(p=>canonicalPuzzleId(p)===rawSol.puzzleId && (!rawSol.puzzleHash||rawSol.puzzleHash===puzzleConfigurationHash(p)));
      const canFallbackByShape=!targetSet || !bundle.name || bundle.name===targetSet.name;
      if(!target && rawPuzzle && canFallbackByShape) target=allowed.find(p=>sourcePuzzleMatches(rawPuzzle,p));
      if(!target || !allowedIds.has(target.id)) continue;
      const solution=sanitizeSolutionData(rawSol,target);
      trimmed+=fitSolutionToPuzzle(target,solution);
      State.solutions.push(solution);
      imported++;
    }

  alert(imported
    ? `Imported ${imported} solution${imported!==1?'s':''}.`
    : 'No solutions in that file matched the selected puzzle scope.');

}
function puzzleGroupsFromImport(data){
  const grouped=[];
  const ungrouped=[];
  if(data.kind==='set'||data.kind==='sets'||data.kind==='setSolutions'||data.kind==='allSolutions'){
    for(const bundle of normalizeIncomingSets(data)){
      if((bundle.puzzles||[]).length)grouped.push({name:bundle.name||'Imported Set',puzzles:bundle.puzzles});
    }
  }else if(data.kind==='puzzle'&&data.puzzle){
    ungrouped.push(data.puzzle);
  }else if(data.kind==='puzzles'){
    ungrouped.push(...(Array.isArray(data.puzzles)?data.puzzles:[]));
  }else if((data.kind==='solution'||data.kind==='solutions')&&data.puzzle){
    ungrouped.push(data.puzzle);
  }
  return {grouped,ungrouped};
}
function puzzleBundlesFromData(data){
  if(data.kind==='puzzle')return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:[]}];
  if(data.kind==='solution')return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:data.solution?[data.solution]:[]}];
  if(data.kind==='solutions')return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:Array.isArray(data.solutions)?data.solutions:[]}];
  return normalizeIncomingSets(data);
}
function puzzleImportEntries(data){
  const entries=[];
  for(const bundle of puzzleBundlesFromData(data)){
    const puzzles=(bundle.puzzles||[]).filter(Boolean);
    for(const rawPuzzle of puzzles){
      let solutions=(bundle.solutions||[]).filter(solution=>solution&&solution.puzzleId===rawPuzzle.id);
      if(puzzles.length===1&&!solutions.length)solutions=(bundle.solutions||[]).filter(Boolean);
      entries.push({groupName:bundle.name||null,rawPuzzle,solutions});
    }
  }
  return entries;
}
function showPuzzleOverlapDialog(overlapCount,onChoice){

  dialog.innerHTML=`<h3>Existing puzzles found</h3><p>${overlapCount} imported puzzle${overlapCount!==1?'s':''} overlap${overlapCount===1?'s':''} with puzzle${overlapCount===1?'':'s'} already in Lightyard.</p><p style="font-size:12px;color:var(--dim);line-height:1.45;">You can add their solutions to the existing puzzles, or create duplicate puzzle designs and attach the imported solutions to those copies.</p><div class="rowbtns"><button class="btn" data-act="cancel">Cancel</button><button class="btn" data-act="solutions">Import solutions only</button><button class="btn solid" data-act="duplicates">Create duplicate puzzles</button></div>`;

}
function applySolvePuzzleImport(entries,scope,overlapMode){
  let puzzlesAdded=0,solutionsAdded=0,trimmed=0,overlapsUsed=0;
  const groupSetIds=new Map();
  const setForEntry=entry=>{
    if(scope.kind==='solvePuzzlesIntoSet')return scope.setId;
    const key=entry.groupName||'__loose__';
    if(groupSetIds.has(key))return groupSetIds.get(key);
    if(!entry.groupName){
      const existing=State.sets.find(set=>set.name==='Added Puzzles');
      if(existing){groupSetIds.set(key,existing.id);return existing.id;}
    }
    const set={id:uid(),name:entry.groupName?uniqueSetName(entry.groupName):'Added Puzzles',createdAt:Date.now()};
    State.sets.push(set);groupSetIds.set(key,set.id);return set.id;
  };
  for(const entry of entries){
    let target=entry.overlap||null;
    if(target&&overlapMode==='solutions')overlapsUsed++;
    else{
      target=sanitizePuzzleData(entry.rawPuzzle,setForEntry(entry));
      State.puzzles.push(target);puzzlesAdded++;
    }
    for(const rawSolution of entry.solutions){
      const solution=sanitizeSolutionData(rawSolution,target);
      trimmed+=fitSolutionToPuzzle(target,solution);
      State.solutions.push(solution);solutionsAdded++;
    }
  }
  persistSets();persistPuzzles();persistSolutions();
  const parts=[];
  if(puzzlesAdded)parts.push(`${puzzlesAdded} puzzle${puzzlesAdded!==1?'s':''}`);
  if(solutionsAdded)parts.push(`${solutionsAdded} solution${solutionsAdded!==1?'s':''}`);
  if(overlapsUsed&&!solutionsAdded)parts.push(`no solutions for ${overlapsUsed} overlapping puzzle${overlapsUsed!==1?'s':''}`);
  alert(`Imported ${parts.join(' and ')||'no items'}${trimmed?`; skipped ${trimmed} control${trimmed!==1?'s':''} that did not fit`:''}.`);
  State.screen='setList';State.currentPuzzleId=null;State.currentSolutionId=null;State.selectedCell=null;State.selectedTool=null;
  renderScreen();
}
function importSolvePuzzles(data,scope){
  const entries=puzzleImportEntries(data);
  if(!entries.length){alert('That data did not contain any puzzles.');return;}
  const existing=allPuzzles().slice();
  for(const entry of entries)entry.overlap=existing.find(puzzle=>sourcePuzzleMatches(entry.rawPuzzle,puzzle))||null;
  const overlapCount=entries.filter(entry=>entry.overlap).length;
  if(overlapCount)showPuzzleOverlapDialog(overlapCount,mode=>applySolvePuzzleImport(entries,scope,mode));
  else applySolvePuzzleImport(entries,scope,'duplicates');
}
function importPuzzlesIntoSet(data,setId){
  const found=puzzleGroupsFromImport(data);
  const raws=found.grouped.flatMap(group=>group.puzzles).concat(found.ungrouped);
  for(const raw of raws) State.puzzles.push(sanitizePuzzleData(raw,setId));
  persistPuzzles();
  alert(raws.length
    ? `Imported ${raws.length} puzzle${raws.length!==1?'s':''}.`
    : 'That file did not contain any puzzles.');
  State.expandedSetIds.add(setId); State.screen='setList'; renderScreen();
}
function importCreateData(data){
  const found=puzzleGroupsFromImport(data);
  let imported=0;
  for(const group of found.grouped){
    const set={id:uid(),name:String(group.name||'Imported Set').slice(0,80),createdAt:Date.now()};
    State.sets.push(set);State.expandedSetIds.add(set.id);
    for(const raw of group.puzzles){State.puzzles.push(sanitizePuzzleData(raw,set.id));imported++;}
  }
  if(found.ungrouped.length){
    const set={id:uid(),name:'Added Puzzles',createdAt:Date.now()};
    State.sets.push(set);State.expandedSetIds.add(set.id);
    for(const raw of found.ungrouped){State.puzzles.push(sanitizePuzzleData(raw,set.id));imported++;}
  }
  if(!imported){alert('That file did not contain any puzzles.');return;}
  persistSets();persistPuzzles();
  alert(`Added ${imported} puzzle${imported!==1?'s':''}.`);
  State.selectedCell=null;State.selectedTool=null;State.currentSetId=null;State.currentPuzzleId=null;State.currentSolutionId=null;
  State.screen='setList';renderScreen();
}
function handleImportedData(data,scope){
  try{
    if(scope&&scope.kind==='addCreateData'){
      importCreateData(data);
      return;
    }
    if(scope&&scope.kind==='sets'){
      const incoming=normalizeIncomingSets(data).filter(set=>(set.puzzles||[]).length);
      if(!incoming.length){alert('That export does not contain any puzzle sets.');return;}
      showImportSetsDialog(incoming,choices=>applyIncomingSets(incoming,choices));
      return;
    }
    if(scope&&(scope.kind==='addSolvePuzzles'||scope.kind==='solvePuzzlesIntoSet')){
      importSolvePuzzles(data,scope);
      return;
    }
    if(scope && (scope.kind==='allSolutions' || scope.kind==='setSolutions' || scope.kind==='puzzleSolutions')){
      importScopedSolutions(data,scope);
      return;
    }
    if(scope && scope.kind==='puzzlesIntoSet'){
      importPuzzlesIntoSet(data,scope.setId);
      return;
    }
    if(data.kind==='puzzle'){
      const puzzle = importPuzzlePayload(data);
      alert('Imported puzzle "'+puzzle.name+'".');
      State.currentSetId = puzzle.setId;
      State.selectedCell=null; State.selectedTool=null;
      State.screen='puzzleList';
      renderScreen();
    } else if(data.kind==='solution'){
      const {puzzle, solution} = importSolutionPayload(data);
      alert('Imported puzzle "'+(puzzle?puzzle.name:'(existing)')+'" and solution "'+solution.name+'".');
      setActiveMode('solve');
      State.currentPuzzleId = solution.puzzleId;
      const owner = puzzle || State.puzzles.find(p=>p.id===solution.puzzleId);
      if(owner) State.currentSetId = owner.setId;
      warnIfStrictPacketTotalsMismatch(owner);
      State.currentSolutionId = solution.id;
      State.selectedCell=null; State.selectedTool='mirrorDiag';
      State.screen='solutionEdit';
      renderScreen();
    } else if(data.kind==='solutions'){
      const {puzzle, solutions} = importSolutionsPayload(data);
      alert('Imported puzzle "'+(puzzle?puzzle.name:'(existing)')+'" with '+solutions.length+' solution'+(solutions.length!==1?'s':'')+'.');
      setActiveMode('solve');
      State.currentPuzzleId = solutions.length ? solutions[0].puzzleId : (puzzle ? puzzle.id : null);
      const owner = puzzle || State.puzzles.find(p=>p.id===State.currentPuzzleId);
      if(owner) State.currentSetId = owner.setId;
      warnIfStrictPacketTotalsMismatch(owner);
      State.currentSolutionId = solutions.length ? solutions[0].id : 'BLANK';
      State.selectedCell=null; State.selectedTool='mirrorDiag';
      State.screen='solutionEdit';
      renderScreen();
    } else if(data.kind==='set' || data.kind==='sets' || data.kind==='setSolutions' || data.kind==='allSolutions' || data.kind==='puzzles'){
      const incoming = normalizeIncomingSets(data).filter(s=>s.puzzles.length>0 || s.solutions.length>0);
      if(incoming.length===0){
        alert('That export has no puzzles to import.');
        return;
      }
      if(data.kind==='setSolutions' || data.kind==='allSolutions') setActiveMode('solve');
      showImportSetsDialog(incoming, (choices)=>applyIncomingSets(incoming, choices));
    } else {
      alert('Unrecognized Lightyard export type: "'+data.kind+'".');
    }
  } catch(error){
    alert('Could not import that data: '+error.message);
  }
}

function handleImportedFile(file,scope){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert('That file is not valid JSON.'); return; }
    if(!data || data.schema!=='lightyard' || !data.kind){
      alert('That file does not look like a Lightyard export.');
      return;
    }
    handleImportedData(data,scope);
  };
  reader.onerror = ()=> alert('Could not read that file.');
  reader.readAsText(file);
}

/* ---------- persistence ---------- */
function storageKey(kind){
  const ns=BUILT_IN_APP_DATA&&BUILT_IN_APP_DATA.storageNamespace;
  return ns?`lightyard_${ns}_${kind}`:`lightyard_${kind}`;
}
function loadBuiltInCatalog(){
  State.builtInSets=[];State.builtInPuzzles=[];
  if(!BUILT_IN_APP_DATA)return;
  const rawSets=Array.isArray(BUILT_IN_APP_DATA.sets)?BUILT_IN_APP_DATA.sets:[];
  const setRuntimeBySource=new Map();
  rawSets.forEach((raw,index)=>{
    const sourceId=typeof raw.id==='string'?raw.id:'builtin-set-'+index;
    const set={...JSON.parse(JSON.stringify(raw)),id:'__builtin_set_'+index+'_'+sourceId,_sourceId:sourceId,_builtIn:true};
    State.builtInSets.push(set);if(!setRuntimeBySource.has(sourceId))setRuntimeBySource.set(sourceId,set.id);
  });
  const rawPuzzles=Array.isArray(BUILT_IN_APP_DATA.puzzles)?BUILT_IN_APP_DATA.puzzles:[];
  rawPuzzles.forEach((raw,index)=>{
    const sourceId=typeof raw.id==='string'?raw.id:'builtin-puzzle-'+index;
    let runtimeSetId=setRuntimeBySource.get(raw.setId);
    if(!runtimeSetId){
      const sourceSetId='builtin-orphans';
      let set=State.builtInSets.find(s=>s._sourceId===sourceSetId);
      if(!set){set={id:'__builtin_set_orphans',_sourceId:sourceSetId,_builtIn:true,name:'Built-in Puzzles',createdAt:Date.now()};State.builtInSets.push(set);}
      runtimeSetId=set.id;
    }
    const p=JSON.parse(JSON.stringify(raw));
    p.id='__builtin_puzzle_'+index+'_'+sourceId;p.setId=runtimeSetId;p._sourceId=sourceId;p._sourceSetId=raw.setId;p._builtIn=true;
    p.noPrisms=p.noPrisms!=null?!!p.noPrisms:!!p.mirrorsOnly;p.noHalfMirrors=!!p.noHalfMirrors;delete p.mirrorsOnly;
    const goal=embeddedPuzzleGoal(p);
    if(goal){p.goalElements=goal.elements;p.goalTicks=goal.ticks;}else{delete p.goalElements;delete p.goalTicks;}
    p.elements=(p.elements||[]).map(sanitizeElementData).filter(Boolean);p.configurationHash=puzzleConfigurationHash(p);
    State.builtInPuzzles.push(p);
  });
}
function loadAll(){
  loadBuiltInCatalog();
  const storedPlayerName=localStorage.getItem(storageKey('playerName'));
  State.playerName=storedPlayerName!==null
    ? String(storedPlayerName).trim().slice(0,60)
    : String(BUILT_IN_APP_DATA&&BUILT_IN_APP_DATA.playerName||'').trim().slice(0,60);
  if(storedPlayerName===null && State.playerName) localStorage.setItem(storageKey('playerName'),State.playerName);
  const storedColorblind=localStorage.getItem(storageKey('colorblind'));
  State.colorblind=storedColorblind!==null
    ? storedColorblind==='true'
    : !!(BUILT_IN_APP_DATA&&BUILT_IN_APP_DATA.colorblind);
  if(storedColorblind===null && State.colorblind) localStorage.setItem(storageKey('colorblind'),'true');
  const storedSound=localStorage.getItem(storageKey('soundEnabled'));
  State.soundEnabled=storedSound!==null
    ? storedSound==='true'
    : !!(BUILT_IN_APP_DATA&&BUILT_IN_APP_DATA.soundEnabled);
  if(storedSound===null && State.soundEnabled)localStorage.setItem(storageKey('soundEnabled'),'true');
  const storedSets=localStorage.getItem(storageKey('sets'));
  const storedPuzzles=localStorage.getItem(storageKey('puzzles'));
  try{ State.sets = JSON.parse(storedSets||'[]'); }catch(e){ State.sets=[]; }
  try{ State.puzzles = JSON.parse(storedPuzzles||'[]'); }catch(e){ State.puzzles=[]; }
  try{ State.solutions = JSON.parse(localStorage.getItem(storageKey('solutions'))||'[]'); }catch(e){ State.solutions=[]; }
  // Fold any element still carrying the old, now-merged 'crystalColored'
  // type name (from before clear and colored crystals became one 'crystal'
  // type) into 'crystal' — same migration sanitizeElementData does for
  // freshly-imported files, just applied to what's already on disk.
  let elementDataChanged = false;
  const packetSequenceChangedPuzzles=new Set();
  for(const p of State.puzzles){
    if(p.noPrisms==null){p.noPrisms=!!p.mirrorsOnly;elementDataChanged=true;}
    if(p.noHalfMirrors==null){p.noHalfMirrors=false;elementDataChanged=true;}
    if('mirrorsOnly' in p){delete p.mirrorsOnly;elementDataChanged=true;}
    const before=(p.elements||[]).length;
    p.elements=(p.elements||[]).filter(el=>el.type!=='wood');
    if(p.elements.length!==before)elementDataChanged=true;
    for(const el of p.elements){
      if(el.type==='crystalColored' || (el.type==='crystal' && el.maxHits==null)){ normalizeCrystalType(el); elementDataChanged = true; }
      if(el.type==='mirrorHalf' && !el.facing){ normalizeHalfMirrorData(el); elementDataChanged = true; }
      if(normalizePacketSequence(el)){elementDataChanged=true;packetSequenceChangedPuzzles.add(p.id);}
    }
  }
  for(const s of State.solutions){
    const before=(s.elements||[]).length;
    s.elements=(s.elements||[]).filter(el=>el.type!=='wood');
    if(s.elements.length!==before)elementDataChanged=true;
    for(const el of s.elements){
      if(el.type==='crystalColored' || (el.type==='crystal' && el.maxHits==null)){ normalizeCrystalType(el); elementDataChanged = true; }
      if(el.type==='mirrorHalf' && !el.facing){ normalizeHalfMirrorData(el); elementDataChanged = true; }
    }
  }
  let solutionDataChanged=false;
  for(const s of State.solutions){
    if('solvedAt' in s){delete s.solvedAt;solutionDataChanged=true;}
    const owner=s.puzzleHash
      ? allPuzzles().find(p=>puzzleMatchesSolution(p,s))
      : State.puzzles.find(p=>p.id===s.puzzleId) || State.builtInPuzzles.find(p=>canonicalPuzzleId(p)===s.puzzleId);
    if(owner && !s.puzzleHash){s.puzzleHash=puzzleConfigurationHash(owner);solutionDataChanged=true;}
    if(packetSequenceChangedPuzzles.has(s.puzzleId)){
      if(s.status!=='in-progress'){s.status='in-progress';solutionDataChanged=true;}
      if('ticksToSolve' in s){delete s.ticksToSolve;solutionDataChanged=true;}
    }
    if(enforcePuzzleSolutionRules(owner,s))solutionDataChanged=true;
  }
  if(elementDataChanged){ persistPuzzles(); }
  if(elementDataChanged || solutionDataChanged){ persistSolutions(); }
  // Puzzles from before sets existed (or with a setId that no longer points
  // at a real set) get folded into one default set rather than left
  // inaccessible — nothing should ever end up orphaned by this migration.
  const validSetIds = new Set(State.sets.map(s=>s.id));
  const orphans = State.puzzles.filter(p=>!p.setId || !validSetIds.has(p.setId));
  if(orphans.length){
    const def = {id:uid(), name:'My Puzzles', createdAt:Date.now()};
    State.sets.push(def);
    for(const p of orphans) p.setId = def.id;
    persistSets(); persistPuzzles();
  } else if(State.sets.length===0 && State.builtInSets.length===0){
    const def = {id:uid(), name:'My Puzzles', createdAt:Date.now()};
    State.sets.push(def);
    const sp = samplePuzzle(); sp.setId = def.id;
    State.puzzles.push(sp);
    persistSets(); persistPuzzles();
  }
  restoreNavigationState();
}
function persistSets(){ localStorage.setItem(storageKey('sets'), JSON.stringify(State.sets)); }
function persistPuzzles(){ localStorage.setItem(storageKey('puzzles'), JSON.stringify(State.puzzles)); }
function persistSolutions(){ localStorage.setItem(storageKey('solutions'), JSON.stringify(State.solutions)); }
function persistPlayerName(){
  if(State.playerName)localStorage.setItem(storageKey('playerName'),State.playerName);
  else localStorage.removeItem(storageKey('playerName'));
}
function persistColorblind(){ localStorage.setItem(storageKey('colorblind'),String(!!State.colorblind)); }
function persistSound(){ localStorage.setItem(storageKey('soundEnabled'),String(!!State.soundEnabled)); }
function firstAvailablePuzzle(){
  for(const set of allSets()){

  }

function defaultNavigationState(){

function persistNavigationState(){
  const payload={
    version:1,mode:State.mode,screen:State.screen,
    currentSetId:State.currentSetId,currentPuzzleId:State.currentPuzzleId,currentSolutionId:State.currentSolutionId,
    expandedSetIds:[...State.expandedSetIds],expandedPuzzleIds:[...State.expandedPuzzleIds]

function restoreNavigationState(){
  const raw=localStorage.getItem(storageKey('navigation'));
  if(raw==null){defaultNavigationState();return;}
  let saved;
  try{saved=JSON.parse(raw);}catch(error){defaultNavigationState();return;}
  const setIds=new Set(allSets().map(set=>set.id));
  const puzzleIds=new Set(allPuzzles().map(puzzle=>puzzle.id));
  State.expandedSetIds=new Set((saved.expandedSetIds||[]).filter(id=>setIds.has(id)));
  State.expandedPuzzleIds=new Set((saved.expandedPuzzleIds||[]).filter(id=>puzzleIds.has(id)));
  State.mode=saved.mode==='create'?'create':'solve';
  const screen=saved.screen==='puzzleList'?'setList':saved.screen;
  if(screen==='setList'){
    State.screen='setList';State.currentSetId=null;State.currentPuzzleId=null;State.currentSolutionId=null;return;
  }
  const puzzle=findPuzzleByRuntimeId(saved.currentPuzzleId);
  if(!puzzle){defaultNavigationState();return;}
  if(screen==='puzzleEdit'){
    if(puzzle._builtIn){State.mode='create';State.screen='setList';State.currentSetId=null;State.currentPuzzleId=null;State.currentSolutionId=null;return;}
    State.mode='create';State.screen='puzzleEdit';State.currentSetId=puzzle.setId;State.currentPuzzleId=puzzle.id;State.currentSolutionId=null;return;
  }
  if(screen==='solutionEdit'){
    const savedSolution=saved.currentSolutionId&&saved.currentSolutionId!=='BLANK'
      ? State.solutions.find(solution=>solution.id===saved.currentSolutionId&&puzzleMatchesSolution(puzzle,solution))
      : null;
    State.mode='solve';State.screen='solutionEdit';State.currentSetId=puzzle.setId;State.currentPuzzleId=puzzle.id;
    State.currentSolutionId=savedSolution?savedSolution.id:'BLANK';State.selectedCell=null;State.selectedTool='mirrorDiag';return;
  }
  defaultNavigationState();
}

/* ============================== SOUND ============================== */
// All sounds are synthesized at playback time so Lightyard remains one
// self-contained file. Sound starts only after the player enables it and
// interacts with a control, as required by mobile browser audio policies.
let gameAudioContext=null;
function ensureGameAudio(){
  if(!State.soundEnabled)return null;
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)return null;
  if(!gameAudioContext)gameAudioContext=new AudioCtor();
  if(gameAudioContext.state==='suspended')gameAudioContext.resume().catch(()=>{});
  return gameAudioContext;
}
function soundEnvelope(ctx,when,duration,peak){
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(.0001,when);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),when+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
  gain.connect(ctx.destination);return gain;
}
function soundOsc(ctx,type,startFreq,endFreq,when,duration,peak){
  const osc=ctx.createOscillator(),gain=soundEnvelope(ctx,when,duration,peak);
  osc.type=type;osc.frequency.setValueAtTime(startFreq,when);
  if(endFreq!=null)osc.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),when+duration);
  osc.connect(gain);osc.start(when);osc.stop(when+duration+.02);return {osc,gain};
}
function soundNoise(ctx,when,duration,peak,filterType,frequency){
  const frames=Math.max(1,Math.ceil(ctx.sampleRate*duration));
  const buffer=ctx.createBuffer(1,frames,ctx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<frames;i++)data[i]=Math.random()*2-1;
  const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=soundEnvelope(ctx,when,duration,peak);
  source.buffer=buffer;filter.type=filterType||'bandpass';filter.frequency.value=frequency||900;filter.Q.value=.8;
  source.connect(filter);filter.connect(gain);source.start(when);source.stop(when+duration+.02);return {source,filter,gain};
}
function playGameSound(type){
  const ctx=ensureGameAudio();if(!ctx)return;
  const now=ctx.currentTime+.006;
  if(type==='fail'){
    soundNoise(ctx,now,.25,.075,'bandpass',1250);
    const zap=soundOsc(ctx,'sawtooth',155,62,now,.27,.055);
    zap.osc.detune.setValueAtTime(180,now);zap.osc.detune.linearRampToValueAtTime(-240,now+.27);
  }else if(type==='crystalDown'){
    soundOsc(ctx,'sine',820,250,now,.24,.055);soundOsc(ctx,'triangle',1230,375,now,.2,.018);
  }else if(type==='receiverUp'){
    soundOsc(ctx,'sine',310,930,now,.28,.06);soundOsc(ctx,'triangle',465,1240,now+.025,.24,.022);
  }else if(type==='emitterGong'){
    soundOsc(ctx,'sine',205,194,now,.55,.065);soundOsc(ctx,'sine',308,291,now,.42,.033);soundOsc(ctx,'sine',487,460,now,.3,.012);
  }else if(type==='warble'){
    const carrier=soundOsc(ctx,'triangle',390,430,now,.3,.05),lfo=ctx.createOscillator(),depth=ctx.createGain();
    lfo.frequency.value=18;depth.gain.value=75;lfo.connect(depth);depth.connect(carrier.osc.frequency);lfo.start(now);lfo.stop(now+.3);
  }else if(type==='flip'||type==='reflect'){
    soundOsc(ctx,'sine',410,455,now,.105,.038);soundOsc(ctx,'sine',590,645,now+.085,.12,.038);
    if(type==='flip')soundNoise(ctx,now+.185,.045,.035,'highpass',2100);
  }
}
function soundHornNote(ctx,freq,when,duration,peak){
  const osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
  osc.type='sawtooth';osc.frequency.setValueAtTime(freq,when);
  filter.type='lowpass';filter.frequency.setValueAtTime(850,when);
  filter.frequency.linearRampToValueAtTime(1450,when+.07);
  filter.frequency.exponentialRampToValueAtTime(700,when+duration);
  filter.Q.value=.65;
  gain.gain.setValueAtTime(.0001,when);
  gain.gain.linearRampToValueAtTime(peak,when+.045);
  gain.gain.setValueAtTime(peak*.82,when+Math.max(.06,duration-.12));
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
  osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
  osc.start(when);osc.stop(when+duration+.02);
}
function playVictoryFanfare(){
  const ctx=ensureGameAudio();if(!ctx)return;
  const now=ctx.currentTime+.02;
  const chords=[
    {at:0,d:.3,notes:[261.63,329.63,392]},
    {at:.34,d:.3,notes:[349.23,440,523.25]},
    {at:.68,d:.34,notes:[392,493.88,587.33]},
    {at:1.06,d:.64,notes:[523.25,659.25,783.99]}
  ];
  for(const chord of chords){
    chord.notes.forEach((freq,i)=>soundHornNote(ctx,freq,now+chord.at,chord.d,i===0?.016:.012));
  }
}
function scheduleTickSound(type,frac,priority){
  if(!State.soundEvents)State.soundEvents=[];
  const at=clamp(Number(frac)||0,0,1);
  const existing=State.soundEvents.find(event=>Math.abs(event.frac-at)<.001);
  if(existing){if(priority>existing.priority){existing.type=type;existing.priority=priority;}return;}
  State.soundEvents.push({type,frac:at,priority,played:false});
}
function playScheduledSoundsUpTo(frac,collapse){
  if(!State.soundEnabled||!State.soundEvents)return;
  const due=State.soundEvents.filter(event=>!event.played&&event.frac<=frac+.0001);
  if(!due.length)return;
  if(collapse){
    const chosen=due.reduce((best,event)=>event.priority>best.priority?event:best,due[0]);
    due.forEach(event=>event.played=true);playGameSound(chosen.type);return;
  }
  due.sort((a,b)=>a.frac-b.frac);
  for(const event of due){event.played=true;playGameSound(event.type);}
}
