/* ---------- persistence ---------- */
function storageKey(kind){
  const ns=BUILT_IN_APP_DATA&&BUILT_IN_APP_DATA.storageNamespace;
  return ns?`lightyard_${ns}_${kind}`:`lightyard_${kind}`;
}
function loadAll(){
  const storedSets=localStorage.getItem(storageKey('sets'));
  const storedPuzzles=localStorage.getItem(storageKey('puzzles'));
  if(storedSets==null&&storedPuzzles==null&&BUILT_IN_APP_DATA){
    State.sets=JSON.parse(JSON.stringify(BUILT_IN_APP_DATA.sets||[]));
    State.puzzles=JSON.parse(JSON.stringify(BUILT_IN_APP_DATA.puzzles||[]));
    State.solutions=[];
    persistSets();persistPuzzles();persistSolutions();
  } else {
    try{ State.sets = JSON.parse(storedSets||'[]'); }catch(e){ State.sets=[]; }
    try{ State.puzzles = JSON.parse(storedPuzzles||'[]'); }catch(e){ State.puzzles=[]; }
    try{ State.solutions = JSON.parse(localStorage.getItem(storageKey('solutions'))||'[]'); }catch(e){ State.solutions=[]; }
  }
  // Fold any element still carrying the old, now-merged 'crystalColored'
  // type name (from before clear and colored crystals became one 'crystal'
  // type) into 'crystal' — same migration sanitizeElementData does for
  // freshly-imported files, just applied to what's already on disk.
  let elementDataChanged = false;
  const packetSequenceChangedPuzzles=new Set();
  for(const p of State.puzzles){
    if(p.noPrisms==null){p.noPrisms=!!p.mirrorsOnly;elementDataChanged=true;}
    if(p.noHalfMirrors==null){p.noHalfMirrors=false;elementDataChanged=true;}
    if('mirrorsOnly' in p){delete p.mirrorsOnly;elementDataChanged=true;}
    const before=(p.elements||[]).length;
    p.elements=(p.elements||[]).filter(el=>el.type!=='wood');
    if(p.elements.length!==before)elementDataChanged=true;
    for(const el of p.elements){
      if(el.type==='crystalColored' || (el.type==='crystal' && el.maxHits==null)){ normalizeCrystalType(el); elementDataChanged = true; }
      if(el.type==='mirrorHalf' && !el.facing){ normalizeHalfMirrorData(el); elementDataChanged = true; }
      if(normalizePacketSequence(el)){elementDataChanged=true;packetSequenceChangedPuzzles.add(p.id);}
    }
  }
  for(const s of State.solutions){
    const before=(s.elements||[]).length;
    s.elements=(s.elements||[]).filter(el=>el.type!=='wood');
    if(s.elements.length!==before)elementDataChanged=true;
    for(const el of s.elements){
      if(el.type==='crystalColored' || (el.type==='crystal' && el.maxHits==null)){ normalizeCrystalType(el); elementDataChanged = true; }
      if(el.type==='mirrorHalf' && !el.facing){ normalizeHalfMirrorData(el); elementDataChanged = true; }
    }
  }
  let solutionDataChanged=false;
  for(const s of State.solutions){
    if('solvedAt' in s){delete s.solvedAt;solutionDataChanged=true;}
    const owner=State.puzzles.find(p=>p.id===s.puzzleId);
    if(packetSequenceChangedPuzzles.has(s.puzzleId)){
      if(s.status!=='in-progress'){s.status='in-progress';solutionDataChanged=true;}
      if('ticksToSolve' in s){delete s.ticksToSolve;solutionDataChanged=true;}
    }
    if(enforcePuzzleSolutionRules(owner,s))solutionDataChanged=true;
  }
  if(elementDataChanged){ persistPuzzles(); }
  if(elementDataChanged || solutionDataChanged){ persistSolutions(); }
  // Puzzles from before sets existed (or with a setId that no longer points
  // at a real set) get folded into one default set rather than left
  // inaccessible — nothing should ever end up orphaned by this migration.
  const validSetIds = new Set(State.sets.map(s=>s.id));
  const orphans = State.puzzles.filter(p=>!p.setId || !validSetIds.has(p.setId));
  if(orphans.length){
    const def = {id:uid(), name:'My Puzzles', createdAt:Date.now()};
    State.sets.push(def);
    for(const p of orphans) p.setId = def.id;
    persistSets(); persistPuzzles();
  } else if(State.sets.length===0){
    const def = {id:uid(), name:'My Puzzles', createdAt:Date.now()};
    State.sets.push(def);
    const sp = samplePuzzle(); sp.setId = def.id;
    State.puzzles.push(sp);
    persistSets(); persistPuzzles();
  }
}
function persistSets(){ localStorage.setItem(storageKey('sets'), JSON.stringify(State.sets)); }
function persistPuzzles(){ localStorage.setItem(storageKey('puzzles'), JSON.stringify(State.puzzles)); }
function persistSolutions(){ localStorage.setItem(storageKey('solutions'), JSON.stringify(State.solutions)); }

function samplePuzzle(){
  return {
    id:uid(), name:'First Light', rows:7, cols:7, createdAt:Date.now(), noPrisms:false, noHalfMirrors:false,
    elements:[
      {r:3,c:0,type:'emitter',dirs:['E'],colors:[1,2,4]},
      {r:3,c:6,type:'receiver',dirs:['W'],colors:[1,2,4]}
    ]
  };
}

/* ============================== GEOMETRY HELPERS ============================== */
function makeGrid(rows,cols){
  const g=new Array(rows);
  for(let r=0;r<rows;r++){ g[r]=new Array(cols).fill(null); }
  return g;
}
function inBounds(r,c,rows,cols){ return r>=0&&r<rows&&c>=0&&c<cols; }

function buildWorkingGrid(){
  const rows=State.gridRows, cols=State.gridCols;
  const g = makeGrid(rows,cols);
  const puzzle = getCurrentPuzzle();
  if(puzzle){
    for(const el of puzzle.elements){
      if(inBounds(el.r,el.c,rows,cols)) g[el.r][el.c] = cloneElement(el, true);
    }
  }
  if(State.screen==='solutionEdit'){
    const sol = getCurrentSolution();
    if(sol){
      for(const el of sol.elements){
        if(puzzle && ((puzzle.noPrisms&&el.type==='prism')||(puzzle.noHalfMirrors&&el.type==='mirrorHalf'))) continue;
        if(inBounds(el.r,el.c,rows,cols)) g[el.r][el.c] = cloneElement(el, false);
      }
    }
  } else if(State.screen==='puzzleEdit'){
    // only puzzle fixed elements, already added above
  }
  State.grid = g;
  resetRuntime();
}

function cloneElement(el, fixed){
  const copy = JSON.parse(JSON.stringify(el));
  copy.fixed = fixed;
  return copy;
}

function resetRuntime(){
  State.tick=0; State.packets=[]; State.finished=false; State.solved=false; State.running=false;
  State.runStarted=false;
  State.strictCountDelta=0;
  State.hardViolation=false;
  State.failureScene=null;
  State.violation=null;
  State.frac=0;
  for(let r=0;r<State.gridRows;r++){
    for(let c=0;c<State.gridCols;c++){
      const el = State.grid[r][c];
      if(!el) continue;
      initRuntime(el);
    }
  }
  updateRunUI();
}
function initRuntime(el){
  if(el.type==='emitter'){ el.emitIndex=0; el.dirCursor=firstEnabledDir(el.dirs); }
  else if(el.type==='receiver'){ el.pointer=0; el.failed=false; el.marks=new Array((el.colors||[]).length).fill(null); }
  else if(el.type==='crystal'){ el.hitsRemaining=el.maxHits==='inf'||el.maxHits==null?Infinity:el.maxHits; }
  else if(el.type==='mirrorDiag'){ el.curOrient = el.orientation; }
  else if(el.type==='mirrorHalf'){ el.curFacing=el.facing||legacyHalfMirrorFacing(el); el.seqPos=0; }
  else if(el.type==='prism'){ el.curBase = el.base; el.seqPos = 0; }
}
function firstEnabledDir(dirs){
  for(const d of DIRS){ if(dirs && dirs.includes(d)) return d; }
  return null;
}
function nextEnabledDir(dirs, cur){
  if(!cur) return firstEnabledDir(dirs);
  let idx = DIRS.indexOf(cur);
  for(let i=1;i<=4;i++){
    const d = DIRS[(idx+i)%4];
    if(dirs.includes(d)) return d;
  }
  return cur;
}

/* ============================== SIMULATION ============================== */
// Interactions that change a packet's color or count (prism split/combine,
// crystal absorption, receiver registration, multiple packets blending together
// at a plain cell, or several packets meeting at a mirror) must not become
// visible until the packet has actually
// reached the center of that cell. Mirrors/crystal/bounces don't need this —
// they only change direction, which is invisible until the packet starts
// moving away anyway. So those interactions resolve immediately; these ones
// go through a one-tick "pending" hold: the packet finishes its approach
// still showing its own original color(s), and only at the start of the
// *next* tick — exactly when it's sitting at the cell's center — does the
// transform actually happen, immediately followed by that tick's normal
// movement in the new direction. Total travel time is unchanged; only what's
// displayed during the approach is corrected.
function resolveTransformingElement(el, r, c, list, grid, strict){
  if(!el){
    const blended = blendAll(list.map(a=>a.color));
    return list.map(a => ({dir:a.dir, color:blended}));
  }
  // Every packet resolving here is still just "approaching" (r,c) — it
  // hasn't actually arrived in a visual sense until this resolution's own
  // moment, which the final frozen frame (if this tick fails) treats as
  // the center of this cell. Recording each one's own real origin lets
  // that frame show it partway along its own approach rather than
  // teleported to wherever the resolution's OUTCOME would place it.
  for(const a of list){
    const fr = a.displayFromR!=null ? a.displayFromR : (a.fromR==null? r : a.fromR);
    const fc = a.displayFromC!=null ? a.displayFromC : (a.fromC==null? c : a.fromC);
    State._violCollector.pendingApproaches.push({fromR:fr, fromC:fc, r, c, color:a.color, failCategory:null});
  }
  const approachEntry = (i) => State._violCollector.pendingApproaches[State._violCollector.pendingApproaches.length-list.length+i];

  if(el.type==='emitter'){
    State.hardViolation = true; // a packet reaching an emitter is always a failure, strict or not
    State._violCollector.hasWERC = true;
    if(!State._violCollector.message){
      const colors = [...new Set(list.map(a=>COLNAME[a.color]))].join('/');
      State._violCollector.message = `A ${colors} packet hit the emitter at (${r},${c}).`;
    }
    list.forEach((a,i)=>{ approachEntry(i).failCategory='werc'; });
    State._violCollector.cells.push({r,c});
    return [];
  }
  if(el.type==='receiver'){
    list.forEach((a,i)=>{
      let ok = false, failReason = null;
      if(!el.dirs || !el.dirs.includes(OPP[a.dir])){
        failReason = `arrived from a direction the receiver doesn't accept`;
      } else if(el.failed){
        failReason = `arrived after the receiver had already failed`;
      } else if(el.pointer >= el.colors.length){
        failReason = `arrived after the receiver's sequence was already complete`;
      } else {
        const expected = el.colors[el.pointer];
        if(a.color===expected){ el.marks[el.pointer]='ok'; el.pointer++; ok=true; }
        else { el.marks[el.pointer]='fail'; el.failed=true; failReason = `expected ${COLNAME[expected]} but got ${COLNAME[a.color]}`; }
      }
      // wrong direction, wrong color/order, or arriving after the receiver was
      // already done (superfluous) — always a failure, strict or not.
      if(!ok){
        State.hardViolation = true;
        State._violCollector.hasWERC = true;
        if(!State._violCollector.message){
          State._violCollector.message = `The receiver at (${r},${c}) failed: a ${COLNAME[a.color]} packet ${failReason}.`;
        }
        approachEntry(i).failCategory = 'werc';
        State._violCollector.cells.push({r,c});
      }
    });
    return [];
  }
  if(el.type==='mirrorDiag'){
    const blended = blendAll(list.map(a=>a.color));
    const map = el.curOrient==='NE_SW' ? NE_SW_MAP : NW_SE_MAP;
    const out = list.map(a=>({dir:map[a.dir],color:blended}));
    if(el.switching && list.length){
      el.flipFrom=el.curOrient;
      el.curOrient = el.curOrient==='NE_SW'?'NW_SE':'NE_SW';
    }
    return out;
  }
  if(el.type==='mirrorHalf'){
    const blended=blendAll(list.map(a=>a.color));
    const map=halfMirrorOrientation(halfMirrorFacing(el))==='NE_SW'?NE_SW_MAP:NW_SE_MAP;
    const byDir=new Map();
    list.forEach(a=>{
      const inputSide=OPP[a.dir];
      const dir=halfMirrorReflects(el,inputSide)?map[a.dir]:a.dir;
      if(!byDir.has(dir)) byDir.set(dir,{dir,color:blended});
    });
    const out=[...byDir.values()];
    const delta=out.length-list.length;
    if(delta<0){
      State.strictCountDelta+=delta;
      State._violCollector.hasMerge=true;
      State._violCollector.cells.push({r,c});
      list.forEach((a,i)=>{approachEntry(i).failCategory='merge';});
    }
    if(list.length){
      const effSeq=halfMirrorEffectiveSequence(el);
      if(effSeq.length>1){
        el.flipFrom=halfMirrorFacing(el);
        el.seqPos=((el.seqPos||0)+1)%effSeq.length;
        el.curFacing=effSeq[el.seqPos];
      }
    }
    return out;
  }
  if(el.type==='prism'){
    const D = el.curBase, P1=CCW[D], P2=CW[D];
    const dArr=[], dIdx=[], otherArr=[], otherIdx=[];
    const otherInputSides = new Set();
    list.forEach((a,i)=>{
      const inputSide = OPP[a.dir];
      if(inputSide===D){ dArr.push(a); dIdx.push(i); } else { otherArr.push(a); otherIdx.push(i); }
      if(inputSide!==D) otherInputSides.add(inputSide);
    });
    const out = [];
    const hit = list.length>0;
    let split1=null, split2=null, combined=null;
    if(dArr.length){
      const color = blendAll(dArr.map(a=>a.color));
      [split1,split2] = splitTable(color);
    }
    if(otherArr.length){
      combined = blendAll(otherArr.map(a=>a.color));
    }
    if(dArr.length && otherArr.length){
      // The split branches only cross non-base traffic entering from the
      // corresponding side. Traffic entering at the point opposite the
      // base travels to the base without crossing either split branch.
      const crossesP1 = otherInputSides.has(P1);
      const crossesP2 = otherInputSides.has(P2);
      if(crossesP1 || crossesP2){
        const connected = blendAll([
          combined,
          ...(crossesP1 ? [split1] : []),
          ...(crossesP2 ? [split2] : [])
        ]);
        combined = connected;
        if(crossesP1) split1 = connected;
        if(crossesP2) split2 = connected;
      }
    }
    if(dArr.length){ out.push({dir:P1,color:split1}); out.push({dir:P2,color:split2}); }
    if(otherArr.length){ out.push({dir:D,color:combined}); }
    // Splitting (more packets out than in) or combining (fewer) both count
    // as the board's packet total changing — strict mode only tolerates
    // this if something else balances it out the same tick.
    if(out.length !== list.length){
      State._violCollector.cells.push({r,c});
      if(out.length > list.length){
        // Splitting: this cell's outgoing packets, once the tick has
        // actually reached (and passed) this cell's own center, continue
        // in their own two (or three) directions — recorded here so the
        // final frame can show that continuation, capped appropriately.
        State._violCollector.hasSplit = true;
        State._violCollector.splitResolutions = State._violCollector.splitResolutions || [];
        const input = dIdx.length ? approachEntry(dIdx[0]) : null;
        State._violCollector.splitResolutions.push({r, c, outputs: out.map(o=>({dir:o.dir,color:o.color})), failing:true});
        // The dArr inputs are also "approaching" entries (used if this
        // tick stops before even reaching this cell) — mark them so a
        // *different*, higher-priority failure elsewhere still shows this
        // cell correctly as "not yet split."
        dIdx.forEach(i => { approachEntry(i).failCategory = null; });
      } else {
        State._violCollector.hasMerge = true;
        otherIdx.forEach(i => { approachEntry(i).failCategory = 'merge'; });
      }
    } else if(dArr.length){
      // A balanced (non-failing) split still needs the same "hasn't
      // resolved yet" bookkeeping in case some other failure stops the
      // tick before this cell's own moment.
      State._violCollector.splitResolutions = State._violCollector.splitResolutions || [];
      State._violCollector.splitResolutions.push({r, c, outputs: out.map(o=>({dir:o.dir,color:o.color})), failing:false});
    }
    State.strictCountDelta += (out.length - list.length);
    if(hit){
      const effSeq = prismEffectiveSequence(el);
      if(effSeq.length>1){
        el.flipFrom = el.curBase;
        el.seqPos = ((el.seqPos||0)+1) % effSeq.length;
        el.curBase = effSeq[el.seqPos];
      }
    }
    return out;
  }
  if(el.type==='crystal'){
    // Every entry goes through here now (not just simultaneous groups),
    // since even a lone packet needs to move from "just entered" (tick1's
    // endpoint) into its uniform half-speed crossing of the middle.
    const blended = blendAll(list.map(a=>a.color));
    const out = [];
    if(el.filterColor==null){
      // Clear — no filtering, just blends and slows. Opposing arrivals do
      // not change color at the crystal edge; they change at the midpoint
      // of this slow middle crossing, when their packets actually overlap.
      list.forEach(a=>out.push({dir:a.dir,color:blended,preCrossColor:a.color,
        crossFrac:list.length>1?0.5:null,crystalMid:true,fromR:a.displayToR,fromC:a.displayToC}));
    } else {
      list.forEach((a,i)=>{
        // Passes if the packet's color contains every component of the
        // crystal's own filter color. A rejected packet is simply absorbed;
        // that is allowed normally and becomes a failure only when Strict
        // mode sees the resulting unbalanced packet-count change.
        if(el.filterColor!==COL.K && (blended & el.filterColor) === el.filterColor){
          out.push({dir:a.dir, color:el.filterColor, preCrossColor:a.color,
            crossFrac:(list.length>1 || a.color!==el.filterColor)?0.5:null,
            crystalMid:true, fromR:a.displayToR, fromC:a.displayToC});
        } else {
          State.strictCountDelta--;
          State._violCollector.hasWERC = true;
          approachEntry(i).failCategory = 'werc';
          State._violCollector.cells.push({r,c});
        }
      });
    }
    // Every arriving packet is an impact, including packets the crystal
    // accepts. Resolve the whole simultaneous cohort before disintegrating.
    if(el.maxHits!=='inf' && Number.isFinite(el.hitsRemaining)){
      el.hitsRemaining-=list.length;
      if(el.hitsRemaining<=0)grid[r][c]=null;
    }
    return out;
  }
  if(el.type==='transformer'){
    const out = [];
    const blended = blendAll(list.map(a=>a.color));
    list.forEach((a,i)=>{
      const next = stepSpectrum(blended, el.direction);
      if(next==null){
        State.hardViolation = true; // off the spectrum, or past either end — always a failure
        State._violCollector.hasWERC = true;
        if(!State._violCollector.message){
          State._violCollector.message = `A ${COLNAME[blended]} packet hit the ${el.direction} transformer at (${r},${c}) with nowhere left to go.`;
        }
        approachEntry(i).failCategory = 'werc';
        State._violCollector.cells.push({r,c});
      } else {
        out.push({dir:a.dir, color:next});
      }
    });
    return out;
  }
  return [];
}

// Resolve the arrivals against a cloned grid before their approach animation
// is shown. This is only a look-ahead: it lets the renderer know that the
// movement now being constructed will fail, without committing receiver,
// crystal, prism, or mirror state before the packets visibly get there.
function previewArrivalResolutions(byCell, grid, strict){
  const savedCollector=State._violCollector;
  const savedDelta=State.strictCountDelta;
  const savedHard=State.hardViolation;
  const previewGrid=JSON.parse(JSON.stringify(grid));
  const collector={message:null,cells:[],hasExit:false,hasWERC:false,hasMerge:false,hasSplit:false,
    pendingApproaches:[],splitResolutions:[],exitPackets:[]};
  State._violCollector=collector;
  State.strictCountDelta=0;
  State.hardViolation=false;
  const resolutions=[];
  byCell.forEach((list,key)=>{
    const [r,c]=key.split('_').map(Number);
    const el=previewGrid[r][c];
    let outputs;
    if(!el) outputs=resolveTransformingElement(null,r,c,list,previewGrid,strict);
    else outputs=resolveTransformingElement(el,r,c,list,previewGrid,strict);
    resolutions.push({r,c,type:el?el.type:null,inputs:list,outputs});
  });
  const result={collector,delta:State.strictCountDelta,hard:State.hardViolation,resolutions};
  State._violCollector=savedCollector;
  State.strictCountDelta=savedDelta;
  State.hardViolation=savedHard;
  return result;
}

function failureCategory(exitCollector, preview, strict){
  if(exitCollector.hasExit) return 'exit';
  if(preview.hard && preview.collector.hasWERC) return 'werc';
  if(strict && preview.delta!==0){
    if(preview.collector.hasWERC) return 'werc';
    if(preview.collector.hasMerge) return 'merge';
    if(preview.collector.hasSplit) return 'split';
  }
  return null;
}

function sceneTrack(fromR,fromC,toR,toC,color,opts){
  return Object.assign({r:toR,c:toC,fromR,fromC,color,holding:false},opts||{});
}

// Turn the just-computed movement into a self-contained animation ending at
// the precise failure instant. Because failure was detected before playback,
// nothing has to reach the center and then rewind to this frame.
function beginFailureScene(category, preview, gridSnapshot, arrivals, staying, exitCollector, strict){
  const edgeTime={exit:0,werc:0.05,merge:0.45,split:0.55}[category];
  const centerFrac=0.5+edgeTime;
  const stopCells = category==='exit' ? [] : preview.collector.cells;
  const stopKeys = new Set(stopCells.map(x=>x.r+'_'+x.c));
  const tracks=[];

  if(centerFrac<=1){
    for(const a of arrivals){
      const fr=a.displayFromR!=null?a.displayFromR:a.origin.r;
      const fc=a.displayFromC!=null?a.displayFromC:a.origin.c;
      const temp={r:a.r,c:a.c,fromR:fr,fromC:fc,animOutR:a.animOutR,animOutC:a.animOutC};
      const end=packetDisplayPos(temp,centerFrac);
      const originalCross=a.crossFrac;
      tracks.push(sceneTrack(fr,fc,end.r,end.c,a.color,{
        preCrossColor:a.preCrossColor,
        crossFrac:originalCross==null?null:originalCross/centerFrac,
        violating:stopKeys.has(a.r+'_'+a.c), violatingFromFrac:1
      }));
    }
    for(const p of staying){
      const start=packetDisplayPos(p,0), end=packetDisplayPos(p,Math.min(centerFrac,1));
      tracks.push(sceneTrack(start.r,start.c,end.r,end.c,p.color,{
        preCrossColor:p.preCrossColor,
        crossFrac:p.crossFrac==null?null:p.crossFrac/Math.min(centerFrac,1)
      }));
    }
  } else {
    const splitAdvance=centerFrac-1;
    for(const res of preview.resolutions){
      const breakAt=1/centerFrac;
      for(const a of res.inputs){
        const fr=a.displayFromR!=null?a.displayFromR:a.origin.r;
        const fc=a.displayFromC!=null?a.displayFromC:a.origin.c;
        tracks.push(sceneTrack(fr,fc,res.r,res.c,a.color,{hideAtFrac:breakAt}));
      }
      for(const o of res.outputs){
        const v=VEC[o.dir];
        tracks.push(sceneTrack(res.r,res.c,res.r+v.dr*splitAdvance,res.c+v.dc*splitAdvance,o.color,{
          showFromFrac:breakAt,
          motionStartFrac:breakAt,
          violating:stopKeys.has(res.r+'_'+res.c), violatingFromFrac:1
        }));
      }
    }
    for(const p of staying){
      const start=packetDisplayPos(p,0), end=packetDisplayPos(p,1);
      tracks.push(sceneTrack(start.r,start.c,end.r,end.c,p.color,{preCrossColor:p.preCrossColor,crossFrac:p.crossFrac}));
    }
  }

  for(const ep of exitCollector.exitPackets){
    const v=VEC[ep.dir];
    tracks.push(sceneTrack(ep.r,ep.c,ep.r+v.dr*0.5,ep.c+v.dc*0.5,ep.color,{violating:true,violatingFromFrac:1}));
  }

  State.grid=gridSnapshot;
  State.packets=tracks;
  const hard = category==='exit' || preview.hard;
  const message = category==='exit'
    ? (exitCollector.message || 'A packet left the grid.')
    : (hard
      ? (preview.collector.message || 'A packet was lost.')
      : `Strict mode: the packet count changed by ${preview.delta>0?'+':''}${preview.delta} this tick without balancing back to zero.`);
  State.violation={message,cells:stopCells};
  State.failureScene={duration:centerFrac,hard,strictFail:!hard};
}

function finishFailureScene(){
  if(!State.failureScene) return;
  const scene=State.failureScene;
  State.failureScene=null;
  State.frac=1;
  finishRun(false,false,scene.strictFail,scene.hard);
}

function doTick(){
  if(State.finished) return;
  const rows=State.gridRows, cols=State.gridCols, grid=State.grid;
  // flipFrom is animation-only state from the interval that just finished.
  // Clear it before taking any rollback snapshot: otherwise a failure in
  // this new interval can restore the previous flip marker and visually
  // replay that old orientation change even though the prism/mirror did
  // not change state again.
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el=grid[r][c];
    if(el) el.flipFrom = null;
  }
  // Every element's own mutable state (receiver pointers, crystal hit counts,
  // prism sequence position, emitter cursor...) gets snapshotted before
  // this tick touches any of it. If this tick turns out to fail, that
  // state gets restored — visually, none of it should appear to have
  // happened yet, since the failing packet(s) never actually arrived.
  const gridSnapshotForRevert = JSON.parse(JSON.stringify(grid));
  State.strictCountDelta = 0; // net change in on-board packet count this tick, tracked by crystal/prism/mirror interactions — emitting and receiving don't count
  // Collects, as this tick's events actually happen, everything needed to
  // reconstruct exactly where things stood if this turns out to be the
  // tick that ends the run — not just which cells and packets are at
  // fault, but every pending packet's own real approach (so it can be
  // shown partway there rather than snapped to an outcome that, from the
  // failure's own vantage point in time, hasn't actually happened yet).
  State._violCollector = {
    message:null, cells:[],
    hasExit:false, hasWERC:false, hasMerge:false, hasSplit:false,
    pendingApproaches:[], // every packet resolving at some element this tick, whether it succeeds or fails
    splitResolutions:[],  // one entry per prism resolution that produced more outputs than inputs
    exitPackets:[]        // packets that left the grid this tick
  };
  const arrivals = []; // {r,c,dir,color,origin:{r,c}} OR a bounce entry (handled inline below)
  const staying = [];  // packets that remain in place (or mid-slow-entry) without resolution this tick
  const entering = []; // fresh moves that were intercepted because their target is a crystal
  const puzzleForStrict = getCurrentPuzzle();
  const strict = !!(puzzleForStrict && puzzleForStrict.strict);

  function isCrystalEl(el){ return !!el && el.type==='crystal'; }

  function pushMove(r,c,dir,color,originR,originC,displayFrom,fromOverride){
    const v=VEC[dir]; const tr=r+v.dr, tc=c+v.dc;
    if(inBounds(tr,tc,rows,cols)){
      if(isCrystalEl(grid[tr][tc])){
        // A crystal doesn't slow anything until it's actually inside the
        // crystal's own square — the approach into it is ordinary full
        // speed. This move gets intercepted so it can be split: normal
        // speed up to the crystal's near edge, then half speed for the
        // rest of this tick (continuing over the next two ticks — see
        // below — to cross the crystal's own full width at half speed,
        // then instantly back to full speed once past its far edge).
        entering.push({r,c,dir,color,targetR:tr,targetC:tc,fromOverride});
        return;
      }
      const entry = {r:tr,c:tc,dir,color,origin:{r:originR,c:originC}};
      if(displayFrom){ entry.displayFromR=displayFrom.r; entry.displayFromC=displayFrom.c; }
      arrivals.push(entry);
    } else {
      // A packet that reaches the edge of the arena leaves play entirely —
      // that's always a failure, the same as hitting an emitter, and it's
      // the highest-priority one: if any packet is exiting this tick, the
      // whole tick stops at the very instant it reaches that boundary,
      // before anything else even gets the chance to happen.
      State.hardViolation = true;
      State._violCollector.hasExit = true;
      if(!State._violCollector.message){
        State._violCollector.message = `A ${COLNAME[color]} packet left the grid heading ${DIRWORD[dir]} from (${r},${c}).`;
      }
      State._violCollector.exitPackets.push({r, c, dir, color});
    }
  }

  // 0. Resolve any packets that finished their approach into a transforming
  // cell last tick (still sitting there, showing their own original
  // identity) — the transform happens now, at the exact moment they're at
  // the center, and they immediately continue moving this same tick.
  // A crystal's own entry (an "enter1" packet, below) is marked pending
  // too — grouping by cell here is exactly what lets several packets
  // entering the same crystal from different directions on the same tick
  // blend together, the same as any other simultaneous meeting.
  const pendingByCell = new Map();
  const midCarry = []; // packets partway through crossing a crystal's own width
  const normalMoving = [];
  for(const p of State.packets){
    if(p.pending){
      const k=p.r+'_'+p.c;
      if(!pendingByCell.has(k)) pendingByCell.set(k, []);
      pendingByCell.get(k).push(p);
    } else if(p.crystalPhase==='mid'){
      midCarry.push(p);
    } else {
      normalMoving.push(p);
    }
  }
  const justTransformed = [];
  pendingByCell.forEach((list, key)=>{
    const [r,c] = key.split('_').map(Number);
    const el = grid[r][c];
    const outputs = resolveTransformingElement(el, r, c, list, grid, strict);
    for(const o of outputs){
      if(o.crystalMid){
        // Just resolved (blend, or a colored crystal's own-color check)
        // exactly as the packet finished entering — now it spends one full
        // tick crossing the crystal's middle at uniform half speed. This
        // becomes the state for the *next* interval, so it goes to
        // `staying`, not `midCarry` (which only holds packets already
        // mid-crossing that need to advance further this same tick).
        const v = VEC[o.dir];
        const endR = o.fromR + v.dr*0.5, endC = o.fromC + v.dc*0.5;
        staying.push({
          r, c, dir:o.dir, color:o.color, holding:false,
          fromR:o.fromR, fromC:o.fromC, displayToR:endR, displayToC:endC,
          preCrossColor:o.preCrossColor, crossFrac:o.crossFrac,
          crystalPhase:'mid'
        });
      } else {
        justTransformed.push({r,c,dir:o.dir,color:o.color});
      }
    }
  });

  // 1. emit
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el = grid[r][c];
    if(el && el.type==='emitter' && el.emitIndex < el.colors.length && el.dirCursor){
      const dir = el.dirCursor;
      const color = el.colors[el.emitIndex];
      pushMove(r,c,dir,color,r,c);
      el.emitIndex++;
      el.dirCursor = nextEnabledDir(el.dirs, el.dirCursor);
    }
  }

  // 2. advance existing (already-moving) packets
  for(const p of normalMoving){ pushMove(p.r,p.c,p.dir,p.color,p.r,p.c); }
  // 2a. advance packets that just transformed out of a pending hold this tick —
  // they start their move from the interaction cell they were sitting in.
  for(const jt of justTransformed){ pushMove(jt.r,jt.c,jt.dir,jt.color,jt.r,jt.c); }
  // 2b. finish crossing a crystal's middle, then immediately keep going —
  // full speed again the instant it's past the crystal's far edge. If the
  // very next cell is itself a crystal, this naturally becomes that
  // crystal's own entry interception (no gap in between); if it's the arena
  // edge, leaving play there is a failure like any other.
  for(const p of midCarry){
    const v = VEC[p.dir];
    const farEdgeR = p.r + v.dr*0.5, farEdgeC = p.c + v.dc*0.5;
    // A packet leaving a crystal and one entering through that same face
    // pass one another at the boundary halfway through the interval. Mix
    // the whole simultaneous crossing cohort before either continues.
    const crossingEntries = entering.filter(e=>
      e.targetR===p.r && e.targetC===p.c && e.dir===OPP[p.dir]
    );
    let outgoingPreCrossColor = null;
    let crossingFrac = null;
    if(crossingEntries.length){
      const pStart = {r:p.displayToR, c:p.displayToC};
      const pEnd = {r:p.r+v.dr, c:p.c+v.dc};
      const e0 = crossingEntries[0], ev=VEC[e0.dir];
      const eStart = e0.fromOverride || {r:e0.r,c:e0.c};
      const eNear = {r:e0.r+ev.dr*0.5,c:e0.c+ev.dc*0.5};
      const eEnd = {r:eNear.r+ev.dr*0.25,c:eNear.c+ev.dc*0.25};
      crossingFrac = computeCrossFrac(pStart,pEnd,eStart,eEnd);
      if(crossingFrac==null) crossingFrac=0.5;
      const mixed = blendAll([p.color, ...crossingEntries.map(e=>e.color)]);
      outgoingPreCrossColor = p.color;
      p.color = mixed;
      for(const e of crossingEntries){
        e.preCrossColor=e.color; e.color=mixed; e.crossFrac=crossingFrac;
      }
    }
    const beforeArrivals = arrivals.length;
    const beforeEntering = entering.length;
    pushMove(p.r, p.c, p.dir, p.color, p.r, p.c, null, {r:p.displayToR, c:p.displayToC});
    // pushMove only appends a normal arrival for a genuine, in-bounds,
    // non-crystal exit — upgrade that specific case to the two-phase
    // (still-slow, then full-speed) visual. A crystal-to-crystal handoff
    // routes through `entering` instead (no arrival to upgrade here), and
    // running off the edge doesn't produce one either.
    if(arrivals.length > beforeArrivals){
      const last = arrivals[arrivals.length-1];
      last.displayFromR = p.displayToR; last.displayFromC = p.displayToC;
      last.animOutR = farEdgeR; last.animOutC = farEdgeC;
      if(outgoingPreCrossColor!=null){ last.preCrossColor=outgoingPreCrossColor; last.crossFrac=crossingFrac; }
    } else if(entering.length > beforeEntering && outgoingPreCrossColor!=null){
      const last = entering[entering.length-1];
      last.preCrossColor=outgoingPreCrossColor; last.crossFrac=crossingFrac;
    }
  }
  // 2c. start a crystal's slow entry for anything freshly intercepted this
  // tick (from normal movement, a transform's continuation, emission, or a
  // crystal-to-crystal handoff): this whole tick shows normal speed up to
  // the crystal's near edge, then half speed for the remainder.
  for(const e of entering){
    const v = VEC[e.dir];
    const nearEdgeR = e.r + v.dr*0.5, nearEdgeC = e.c + v.dc*0.5;
    const endR = nearEdgeR + v.dr*0.25, endC = nearEdgeC + v.dc*0.25;
    const fr = e.fromOverride ? e.fromOverride.r : e.r, fc = e.fromOverride ? e.fromOverride.c : e.c;
    staying.push({
      r:e.targetR, c:e.targetC, dir:e.dir, color:e.color, holding:false, pending:true,
      fromR:fr, fromC:fc,
      animOutR:nearEdgeR, animOutC:nearEdgeC,
      displayToR:endR, displayToC:endC,
      preCrossColor:e.preCrossColor, crossFrac:e.crossFrac
    });
  }

  // 2d. mid-transit crossings: two packets moving directly toward each other
  // between the same pair of adjacent cells meet halfway and blend, each
  // continuing on in its own original direction. (Bounces are excluded —
  // their origin and target are the same cell, so they're not a real
  // cell-to-cell swap.)
  const arrivalByPath = new Map();
  for(const a of arrivals){ arrivalByPath.set(a.origin.r+'_'+a.origin.c+'>'+a.r+'_'+a.c, a); }
  const crossed = new Set();
  for(const a of arrivals){
    if(crossed.has(a)) continue;
    const revKey = a.r+'_'+a.c+'>'+a.origin.r+'_'+a.origin.c;
    const b = arrivalByPath.get(revKey);
    if(b && b!==a && !crossed.has(b)){
      const blended = blendAll([a.color,b.color]);
      a.preCrossColor=a.color; b.preCrossColor=b.color;
      a.color=blended; b.color=blended;
      a.crossFrac=0.5; b.crossFrac=0.5;
      crossed.add(a); crossed.add(b);
    }
  }

  // Note: cross-detection between a packet still entering a crystal and one
  // simultaneously exiting it (an asymmetric-speed case, like the previous
  // model's) isn't re-derived for this new three-phase geometry yet —
  // entries no longer produce a normal arrival at all (they're intercepted
  // before that point), so the previous version of this check is now
  // permanently a no-op and has been removed rather than left silently dead.

  // 3. group arrivals by cell & resolve
  const byCell = new Map();
  for(const a of arrivals){
    const k=a.r+'_'+a.c;
    if(!byCell.has(k)) byCell.set(k,[]);
    byCell.get(k).push(a);
  }

  // Detect failures against these arrivals before displaying their movement.
  // This puts every category on the same edge-based tick clock and lets the
  // animation stop at 0.00 / 0.05 / 0.45 / 0.55 without first overshooting.
  const arrivalPreview=previewArrivalResolutions(byCell,grid,strict);
  const imminentFailure=failureCategory(State._violCollector,arrivalPreview,strict);
  if(imminentFailure){
    beginFailureScene(imminentFailure,arrivalPreview,gridSnapshotForRevert,arrivals,staying,State._violCollector,strict);
    return;
  }

  const resolved = [];
  function pushPending(r,c,a){
    resolved.push({r,c,dir:a.dir,color:a.color,holding:false,pending:true,
      fromR:a.origin.r,fromC:a.origin.c,preCrossColor:a.preCrossColor,crossFrac:a.crossFrac,
      bounced:a.bounced,animOutR:a.animOutR,animOutC:a.animOutC,displayFromR:a.displayFromR,displayFromC:a.displayFromC});
  }
  byCell.forEach((list, key)=>{
    const [r,c] = key.split('_').map(Number);
    const el = grid[r][c];
    if(!el){
      if(list.length>1){
        for(const a of list) pushPending(r,c,a); // blend is a transform: delay to center
      } else {
        const a=list[0];
        resolved.push({r,c,dir:a.dir,color:a.color,holding:false,fromR:a.origin.r,fromC:a.origin.c,preCrossColor:a.preCrossColor,crossFrac:a.crossFrac,bounced:a.bounced,animOutR:a.animOutR,animOutC:a.animOutC,displayFromR:a.displayFromR,displayFromC:a.displayFromC});
      }
      return;
    }
    if(el.type==='emitter'){ for(const a of list) pushPending(r,c,a); return; }
    if(el.type==='receiver'){ for(const a of list) pushPending(r,c,a); return; }
    if(el.type==='mirrorDiag' || el.type==='mirrorHalf'){ for(const a of list) pushPending(r,c,a); return; }
    if(el.type==='prism'){ for(const a of list) pushPending(r,c,a); return; }
    if(el.type==='transformer'){ for(const a of list) pushPending(r,c,a); return; }
    // Unrecognized element type (e.g. stale data from a removed element
    // like the old straight mirror) — pass packets through rather than
    // silently destroying them.
    for(const a of list) resolved.push({r,c,dir:a.dir,color:a.color,holding:false,fromR:a.origin.r,fromC:a.origin.c,preCrossColor:a.preCrossColor,crossFrac:a.crossFrac,displayFromR:a.displayFromR,displayFromC:a.displayFromC});
  });

  State.packets = staying.concat(resolved);
  State.tick++;

  // A packet reaching an emitter, a receiver mishandling one, leaving the
  // grid, or (in strict mode) the board's packet count changing without
  // balancing back to zero — any of these means this tick never really
  // finished. Roll it back and show it frozen at the exact moment things
  // went wrong instead.
  //
  // Model: think of a tick's own "0" as the edge between the cell a
  // packet is leaving and the one it's entering, and "1" as the edge on
  // the far side of that new cell — so a cell's own center falls at 0.5,
  // which is where arriving, resolving, merging, or splitting actually
  // happens. Whichever kind of failure occurs earliest along that line
  // wins and freezes the *entire* tick right there, not just the packets
  // responsible: leaving the grid happens right at the boundary (0.0);
  // hitting an emitter or a mismatched receiver just barely
  // inside the cell it hit (0.05); a bad merge just before the packets
  // involved would actually meet (0.45); a bad split just after the one
  // packet involved has already become two (0.55).
  if(State.hardViolation || (strict && State.strictCountDelta!==0)){
    State.grid = gridSnapshotForRevert;
    State.tick--;

    const vc = State._violCollector;
    let newFrac;
    if(vc.hasExit) newFrac = 0.0;
    else if(vc.hasWERC) newFrac = 0.05;
    else if(vc.hasMerge) newFrac = 0.45;
    else newFrac = 0.55;
    const oldFrac = 0.5 + newFrac; // see the model note above

    const finalPackets = [];

    if(oldFrac < 1.0){
      // Nothing that was still resolving this tick has actually reached
      // its own moment yet — every such packet is shown partway along
      // its own real approach instead.
      for(const pa of vc.pendingApproaches){
        const r = pa.fromR + (pa.r - pa.fromR) * oldFrac;
        const c = pa.fromC + (pa.c - pa.fromC) * oldFrac;
        const isCulprit = (pa.failCategory==='werc' && vc.hasWERC && newFrac===0.05) ||
                           (pa.failCategory==='merge' && vc.hasMerge && newFrac===0.45);
        finalPackets.push({r, c, color:pa.color, violating:isCulprit});
      }
      for(const ep of vc.exitPackets){
        const v = VEC[ep.dir];
        finalPackets.push({r:ep.r+v.dr*oldFrac, c:ep.c+v.dc*oldFrac, color:ep.color, violating:true});
      }
      for(const p of normalMoving.concat(midCarry)){
        const pos = packetDisplayPos(p, oldFrac);
        finalPackets.push({r:pos.r, c:pos.c, color:p.color, violating:false});
      }
      for(const e of entering){
        const temp = {r:e.targetR, c:e.targetC, fromR:(e.fromOverride?e.fromOverride.r:e.r), fromC:(e.fromOverride?e.fromOverride.c:e.c)};
        const pos = packetDisplayPos(temp, oldFrac);
        finalPackets.push({r:pos.r, c:pos.c, color:e.color, violating:false});
      }
    } else {
      // Only reachable when a split is the reason the tick is stopping —
      // the only failure category whose own moment falls after every
      // cell's center. Everything else has already cleanly resolved by
      // this point, so it can just use its own natural continuation;
      // only the splitting cell(s) need their outputs' short continued
      // travel drawn in explicitly.
      const handledKeys = new Set((vc.splitResolutions||[]).map(s=>s.r+'_'+s.c));
      for(const s of (vc.splitResolutions||[])){
        for(const o of s.outputs){
          const ov = VEC[o.dir];
          finalPackets.push({r:s.r+ov.dr*(oldFrac-1), c:s.c+ov.dc*(oldFrac-1), color:o.color, violating:s.failing});
        }
      }
      for(const p of State.packets){
        const fr = p.displayFromR!=null ? p.displayFromR : (p.fromR==null? p.r : p.fromR);
        const fc = p.displayFromC!=null ? p.displayFromC : (p.fromC==null? p.c : p.fromC);
        if(handledKeys.has(fr+'_'+fc)) continue; // this one's own cell is handled above instead
        const pos = packetDisplayPos(p, 1.0);
        finalPackets.push({r:pos.r, c:pos.c, color:p.color, violating:false});
      }
    }

    State.packets = finalPackets;
    State.frac = oldFrac;

    if(State.hardViolation){
      State.violation = { message: vc.message || 'A packet was lost.', cells: vc.cells };
      finishRun(false, false, false, true);
    } else {
      const d = State.strictCountDelta;
      State.violation = {
        message: `Strict mode: the packet count changed by ${d>0?'+':''}${d} this tick without balancing back to zero.`,
        cells: vc.cells
      };
      finishRun(false, false, true);
    }
    return;
  }

  // Check for the win condition on every tick, independent of whether
  // emitters/packets have naturally run dry: the moment every receiver has
  // its full correct sequence, the puzzle either ends cleanly (nothing left
  // on the board) or fails (something's still bouncing around unaccounted for).
  let anyReceiver=false, allSatisfied=true;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el=grid[r][c];
    if(el && el.type==='receiver'){
      anyReceiver=true;
      if(el.failed || el.pointer < el.colors.length) allSatisfied=false;
    }
  }
  if(anyReceiver && allSatisfied){
    finishRun(false, State.packets.length>0);
    return;
  }

  // check finish
  let anyEmitterPending=false;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el=grid[r][c];
    if(el && el.type==='emitter' && el.emitIndex < el.colors.length) anyEmitterPending=true;
  }
  if(!anyEmitterPending && State.packets.length===0){
    finishRun();
  } else if(State.tick>=10000){
    finishRun(true);
  }
}


function finishRun(overflow, leftoverPackets, strictFail, hardFail){
  State.finished=true; State.running=false;
  let solved=true;
  const rows=State.gridRows, cols=State.gridCols, grid=State.grid;
  let anyReceiver=false;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el=grid[r][c];
    if(el && el.type==='receiver'){
      anyReceiver=true;
      if(el.failed || el.pointer < el.colors.length) solved=false;
    }
  }
  if(!anyReceiver) solved=false;
  if(overflow) solved=false;
  if(leftoverPackets) solved=false;
  if(strictFail) solved=false;
  if(hardFail) solved=false;
  State.solved=solved;
  onRunFinished(overflow, leftoverPackets, strictFail, hardFail);
}

/* ============================== RENDERING ============================== */
const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');

function computeCellSize(){
  const mobile = window.matchMedia && window.matchMedia('(max-width:800px)').matches;
  const host = document.getElementById('boardStage');
  const maxW = host.clientWidth - (mobile ? 20 : 60);
  const maxH = host.clientHeight - (mobile ? 20 : 60);
  let size = Math.min(maxW/State.gridCols, maxH/State.gridRows);
  size = Math.max(mobile ? 24 : 30, Math.min(78, Math.floor(size)));
  return size;
}
function resizeCanvas(){
  const size = computeCellSize();
  canvas.width = size*State.gridCols;
  canvas.height = size*State.gridRows;
  canvas._cell = size;
  render();
  if(State.sheetOpen)positionInspectorSheet();
}
window.addEventListener('resize', resizeCanvas);

function render(frac){
  // During a run, an incidental render (step, resize, panel refresh) must
  // preserve the animation clock. Defaulting to 1 could momentarily show a
  // completed prism/mirror flip, after which playback at the still-stale
  // State.frac would replay the old-to-new transition a second time.
  if(frac==null) frac=State.runStarted ? State.frac : 1;
  if(!State.grid){ ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  const cell = canvas._cell || computeCellSize();
  const rows=State.gridRows, cols=State.gridCols;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // grid lines
  ctx.strokeStyle='#444957';
  ctx.lineWidth=1;
  for(let r=0;r<=rows;r++){ ctx.beginPath(); ctx.moveTo(0,r*cell+.5); ctx.lineTo(cols*cell,r*cell+.5); ctx.stroke(); }
  for(let c=0;c<=cols;c++){ ctx.beginPath(); ctx.moveTo(c*cell+.5,0); ctx.lineTo(c*cell+.5,rows*cell); ctx.stroke(); }

  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const el = State.grid[r][c];
    if(el) drawElement(el,r,c,cell,frac);
    if(State.selectedCell && State.selectedCell.r===r && State.selectedCell.c===c){
      ctx.strokeStyle='#6ee7ff'; ctx.lineWidth=2;
      ctx.strokeRect(c*cell+2,r*cell+2,cell-4,cell-4);
    }
    if(State.selectedTool==='cloneElement' && State.cloneSourceCell && State.cloneSourceCell.r===r && State.cloneSourceCell.c===c){
      ctx.strokeStyle='#ffd94d';ctx.lineWidth=3;ctx.setLineDash([5,3]);
      ctx.strokeRect(c*cell+3,r*cell+3,cell-6,cell-6);ctx.setLineDash([]);
    }
    if(State.dragOver && State.dragOver.r===r && State.dragOver.c===c){
      ctx.strokeStyle = State.dragOver.ok!==false ? '#3ddc72' : '#ff6b6b';
      ctx.lineWidth=2; ctx.setLineDash([4,3]);
      ctx.strokeRect(c*cell+2,r*cell+2,cell-4,cell-4);
      ctx.setLineDash([]);
    }
  }
  // packets on top
  for(const p of State.packets){
    drawPacket(p, cell, frac);
  }
  // On the frame where a run just failed, ring the specific cell(s)
  // involved — the emitter/receiver/crystal/transformer/prism the
  // offending packet(s) actually interacted with — alongside the packet
  // highlights above.
  if(State.finished && State.violation && State.violation.cells){
    ctx.save();
    ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    for(const vc of State.violation.cells){
      ctx.strokeRect(vc.c*cell+3, vc.r*cell+3, cell-6, cell-6);
    }
    ctx.restore();
  }
}

function cellCenter(r,c,cell){ return {x:c*cell+cell/2, y:r*cell+cell/2}; }

function lerpPos(r0,c0,r1,c1,t){ return {r:r0+(r1-r0)*t, c:c0+(c1-c0)*t}; }

function packetDisplayPos(p, frac){
  if(p.motionStartFrac!=null){
    frac = clamp((frac-p.motionStartFrac)/(1-p.motionStartFrac),0,1);
  }
  const fr = p.displayFromR!=null ? p.displayFromR : (p.fromR==null? p.r : p.fromR);
  const fc = p.displayFromC!=null ? p.displayFromC : (p.fromC==null? p.c : p.fromC);
  const tr = p.displayToR!=null ? p.displayToR : p.r;
  const tc = p.displayToC!=null ? p.displayToC : p.c;
  // Any packet with a mid-waypoint (animOutR/C) renders in two straight-line
  // halves through that point instead of one straight line — used for a
  // crystal's two-phase entry/exit (crosses at normal speed, then at half
  // speed, or vice versa, meeting exactly at the crystal's own edge).
  if(p.animOutR!=null){
    if(frac<0.5){
      const tt=frac/0.5;
      return lerpPos(fr,fc,p.animOutR,p.animOutC,tt);
    } else {
      const tt=(frac-0.5)/0.5;
      return lerpPos(p.animOutR,p.animOutC,tr,tc,tt);
    }
  }
  return lerpPos(fr,fc,tr,tc,frac);
}

function drawPacket(p, cell, frac){
  const f = frac==null?1:frac;
  if(p.showFromFrac!=null && f<p.showFromFrac) return;
  if(p.hideAtFrac!=null && f>=p.hideAtFrac) return;
  const pos = packetDisplayPos(p, f);
  const x = pos.c*cell+cell/2, y = pos.r*cell+cell/2;
  const rad = cell*0.19;
  const showColor = (p.crossFrac!=null && p.preCrossColor!=null && f < p.crossFrac) ? p.preCrossColor : p.color;
  ctx.save();
  ctx.shadowColor = COLHEX[showColor];
  ctx.shadowBlur = p.holding? 4 : 12;
  ctx.fillStyle = COLHEX[showColor];
  ctx.beginPath();
  ctx.arc(x,y,rad,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  if(p.holding){
    ctx.strokeStyle='#ffffff88'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,rad+3,0,Math.PI*2); ctx.stroke();
  }
  if(p.violating && (p.violatingFromFrac==null || f>=p.violatingFromFrac)){
    // Marks exactly the packet(s) that caused a failed run to fail — drawn
    // on top of everything else so it's unmistakable which one(s) to blame.
    ctx.save();
    ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=2.5; ctx.setLineDash([3,2]);
    ctx.beginPath(); ctx.arc(x,y,rad+5,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function drawElement(el,r,c,cell,frac){
  if(frac==null) frac=1;
  const x=c*cell, y=r*cell;
  const cx=x+cell/2, cy=y+cell/2;
  const preview=State.piecePreview&&State.piecePreview.r===r&&State.piecePreview.c===c?State.piecePreview:null;
  const beforeFlipBoundary = el.flipFrom!=null && frac < 0.5;
  ctx.save();
  ctx.translate(0,0);
  if(el.type==='emitter'){
    ctx.fillStyle='#1a2230'; ctx.strokeStyle='#3a4560'; ctx.lineWidth=1.5;
    roundRect(x+4,y+4,cell-8,cell-8,6); ctx.fill(); ctx.stroke();
    const nextColor = preview&&preview.kind==='color'?preview.value:el.colors[el.emitIndex!=null?el.emitIndex:0];
    if(nextColor!=null){
      ctx.fillStyle=COLHEX[nextColor];
      ctx.beginPath(); ctx.arc(cx,cy,cell*0.14,0,Math.PI*2); ctx.fill();
    }
    (el.dirs||[]).forEach(d=>drawArrow(cx,cy,d,cell,'#6ee7ff', true));
    drawQueueDots(x,y,cell,el.colors,preview&&preview.kind==='color'?preview.index:(el.emitIndex||0));
  } else if(el.type==='receiver'){
    ctx.fillStyle='#241a2e'; ctx.strokeStyle='#523a68'; ctx.lineWidth=1.5;
    roundRect(x+4,y+4,cell-8,cell-8,6); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#e0a6ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.rect(cx-cell*0.14,cy-cell*0.14,cell*0.28,cell*0.28); ctx.stroke();
    if(preview&&preview.kind==='color'){
      ctx.fillStyle=COLHEX[preview.value];ctx.beginPath();ctx.arc(cx,cy,cell*.085,0,Math.PI*2);ctx.fill();
    }
    (el.dirs||[]).forEach(d=>drawArrow(cx,cy,d,cell,'#e0a6ff', false));
    drawQueueDots(x,y,cell,el.colors,preview&&preview.kind==='color'?preview.index:(el.pointer||0), el.marks);
  } else if(el.type==='mirrorDiag'){
    const orient = preview&&preview.kind==='orientation'?preview.value:(beforeFlipBoundary ? el.flipFrom : el.curOrient);
    ctx.strokeStyle='#dcefff'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath();
    if(orient==='NE_SW'){ ctx.moveTo(x+cell*0.15,y+cell*0.85); ctx.lineTo(x+cell*0.85,y+cell*0.15); }
    else { ctx.moveTo(x+cell*0.15,y+cell*0.15); ctx.lineTo(x+cell*0.85,y+cell*0.85); }
    ctx.stroke();
    if(el.switching) drawSwitchMark(cx,cy,cell);
  } else if(el.type==='mirrorHalf'){
    const facing=preview&&preview.kind==='facing'?preview.value:(beforeFlipBoundary?el.flipFrom:halfMirrorFacing(el));
    drawHalfMirrorLines(ctx,cx,cy,cell,facing);

  } else if(el.type==='crystal'){
    if(el.filterColor==null){
      ctx.strokeStyle='#9fd8ff'; ctx.fillStyle='#132433aa'; ctx.lineWidth=2;
      roundRect(x+cell*0.14,y+cell*0.14,cell*0.72,cell*0.72,3);
      ctx.fill(); ctx.stroke();
    } else {
      const hex = COLHEX[el.filterColor];
      ctx.strokeStyle=el.filterColor===COL.K?'#656a78':hex;
      ctx.fillStyle=el.filterColor===COL.K?hex:hex+'33'; ctx.lineWidth=2.5;
      roundRect(x+cell*0.14,y+cell*0.14,cell*0.72,cell*0.72,3);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle=hex;
      ctx.beginPath(); ctx.arc(cx,cy,cell*0.1,0,Math.PI*2); ctx.fill();
    }
    if(el.maxHits!=='inf'){
      const remaining=el.hitsRemaining!=null?el.hitsRemaining:el.maxHits;
      ctx.fillStyle='#f5f6fa';ctx.font=`700 ${Math.max(9,cell*.18)}px "JetBrains Mono",monospace`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=3;
      ctx.fillText(String(Math.max(0,remaining)),x+cell*.72,y+cell*.27);ctx.shadowBlur=0;
    }
  } else if(el.type==='transformer'){
    ctx.strokeStyle='#ff9d4d'; ctx.fillStyle='#2a2018'; ctx.lineWidth=2;
    roundRect(x+cell*0.14,y+cell*0.14,cell*0.72,cell*0.72,3);
    ctx.fill(); ctx.stroke();
    // The strip itself carries the configured order; the transformer no
    // longer uses an up/down arrow because packet travel direction is irrelevant.
    const stripY = cy - cell*0.05, stripH = cell*0.1, stripX = x+cell*0.22, stripW = cell*0.56;
    const shownSpectrum=el.direction==='up'?SPECTRUM:SPECTRUM.slice().reverse(), n=shownSpectrum.length;
    for(let i=0;i<n;i++){ctx.fillStyle=COLHEX[shownSpectrum[i]];ctx.fillRect(stripX+stripW*i/n,stripY,stripW/n+0.5,stripH);}
    if(preview&&preview.kind==='spectrum'){
      const i=preview.index%n;ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.strokeRect(stripX+stripW*i/n-1,stripY-3,stripW/n+2,stripH+6);
    }
  } else if(el.type==='prism'){
    ctx.fillStyle='#2a2436'; ctx.strokeStyle='#8a6fff'; ctx.lineWidth=2;
    const D = preview&&preview.kind==='base'?preview.value:(beforeFlipBoundary ? el.flipFrom : el.curBase);
    const pts = trianglePts(cx,cy,cell*0.36,D);
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y); ctx.lineTo(pts[2].x,pts[2].y); ctx.closePath();

}
// A prism's rotation program: slot 1 is its own base direction (always
// "on"); slots 2-4 (el.seq, 3 entries) are each either null ("off" — holds
// whatever the previous slot showed) or a direction. The program runs up
// to the LAST slot that's on, then loops back to slot 1 — trailing off
// slots after that point simply aren't part of the cycle at all.
function prismEffectiveSequence(el){
  const raw = [el.base, ...(Array.isArray(el.seq) ? el.seq : [null,null,null])];
  let lastIdx = 0;
  for(let i=1;i<4;i++){ if(raw[i]!=null) lastIdx = i; }
  const seq = []; let carry = raw[0];
  for(let i=0;i<=lastIdx;i++){ if(raw[i]!=null) carry = raw[i]; seq.push(carry); }
  return seq;
}
function halfMirrorEffectiveSequence(el){
  const raw=[el.facing||legacyHalfMirrorFacing(el),...(Array.isArray(el.seq)?el.seq:[null,null,null])];
  let lastIdx=0;
  for(let i=1;i<4;i++){if(raw[i]!=null)lastIdx=i;}
  const seq=[];let carry=raw[0];
  for(let i=0;i<=lastIdx;i++){if(raw[i]!=null)carry=raw[i];seq.push(carry);}
  return seq;
}
function nextHalfMirrorSeqStep(cur){
  if(cur==null)return 'NW';
  return cur==='SW'?null:CORNER_CW[cur];
}
function halfMirrorVectors(facing){
  const corner={NW:{x:-1,y:-1},NE:{x:1,y:-1},SE:{x:1,y:1},SW:{x:-1,y:1}}[facing]||{x:-1,y:-1};
  const inv=Math.SQRT1_2;
  const face={x:corner.x*inv,y:corner.y*inv};
  return {face,tangent:{x:-face.y,y:face.x}};
}
function drawHalfMirrorLines(target,cx,cy,size,facing){
  const {face,tangent}=halfMirrorVectors(facing);
  target.lineCap='round';
  const lines=[
    {offset:0,half:.47,color:'#dcefff',width:3},
    {offset:.11,half:.38,color:'#8d99aa',width:2.4},
    {offset:.20,half:.30,color:'#626b79',width:2.1},
    {offset:.27,half:.22,color:'#414854',width:1.8}
  ];
  for(const line of lines){
    // The short backing lines recede away from the reflective-facing corner,
    // making the opposite (transparent) side visible without a filled shape.
    const mx=cx-face.x*size*line.offset, my=cy-face.y*size*line.offset;
    const dx=tangent.x*size*line.half, dy=tangent.y*size*line.half;
    target.strokeStyle=line.color;target.lineWidth=line.width;target.beginPath();
    target.moveTo(mx-dx,my-dy);target.lineTo(mx+dx,my+dy);target.stroke();
  }
}
// Slots 2-4's click cycle: off -> N -> E -> S -> W -> off -> ...
function nextSeqStep(cur){
  if(cur==null) return 'N';
  if(cur==='N') return 'E';
  if(cur==='E') return 'S';
  if(cur==='S') return 'W';
  return null;
}
function miniPrismIconSVG(dir){
  const size=40, cx=20, cy=20, r=13;
  if(dir==null){
    return `<svg viewBox="0 0 ${size} ${size}" width="34" height="34"><rect x="5" y="5" width="30" height="30" rx="7" fill="none" stroke="#4a4658" stroke-width="2" stroke-dasharray="4 3"/></svg>`;
  }
  const pts = trianglePts(cx,cy,r,dir);
  const ptsStr = pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${size} ${size}" width="34" height="34"><polygon points="${ptsStr}" fill="#2a2436" stroke="#8a6fff" stroke-width="2"/></svg>`;
}
function miniHalfMirrorIconSVG(facing){
  if(facing==null){
    return '<svg viewBox="0 0 40 40" width="34" height="34"><rect x="5" y="5" width="30" height="30" rx="7" fill="none" stroke="#4a4658" stroke-width="2" stroke-dasharray="4 3"/></svg>';
  }
  const {face,tangent}=halfMirrorVectors(facing);
  const lines=[{o:0,h:13.5,c:'#dcefff',w:2.6},{o:3.5,h:10.5,c:'#8d99aa',w:2.1},{o:6.5,h:7.5,c:'#626b79',w:1.8},{o:9,h:5,c:'#414854',w:1.5}];
  const paths=lines.map(l=>{
    const mx=20-face.x*l.o,my=20-face.y*l.o,dx=tangent.x*l.h,dy=tangent.y*l.h;
    return `<line x1="${(mx-dx).toFixed(1)}" y1="${(my-dy).toFixed(1)}" x2="${(mx+dx).toFixed(1)}" y2="${(my+dy).toFixed(1)}" stroke="${l.c}" stroke-width="${l.w}" stroke-linecap="round"/>`;
  }).join('');
  return `<svg viewBox="0 0 40 40" width="34" height="34">${paths}</svg>`;
}
function trianglePts(cx,cy,r,base){
  // base direction = flat side; apex points opposite
  const apexVec = VEC[OPP[base]];
  const apex = {x:cx+apexVec.dc*r, y:cy+apexVec.dr*r};
  const baseVec = VEC[base];
  const baseCenter = {x:cx+baseVec.dc*r, y:cy+baseVec.dr*r};
  const perp = (base==='N'||base==='S') ? {x:1,y:0} : {x:0,y:1};
  const b1 = {x:baseCenter.x+perp.x*r, y:baseCenter.y+perp.y*r};
  const b2 = {x:baseCenter.x-perp.x*r, y:baseCenter.y-perp.y*r};
  return [apex,b1,b2];
}
function drawArrow(cx,cy,dir,cell,color,outward){
  const v=VEC[dir]; const len=cell*0.4;
  let sx,sy,ex,ey;
  if(outward){ sx=cx; sy=cy; ex=cx+v.dc*len; ey=cy+v.dr*len; }
  else { sx=cx+v.dc*len; sy=cy+v.dr*len; ex=cx+v.dc*len*0.42; ey=cy+v.dr*len*0.42; }
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
  const ang = Math.atan2(ey-sy,ex-sx);
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-6*Math.cos(ang-0.4), ey-6*Math.sin(ang-0.4));
  ctx.lineTo(ex-6*Math.cos(ang+0.4), ey-6*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
}
function drawSwitchMark(cx,cy,cell){
  ctx.strokeStyle='#ffd94d'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx+cell*0.3,cy-cell*0.3,4,0,Math.PI*1.5); ctx.stroke();
}
function drawQueueDots(x,y,cell,colors,idx,marks){
  if(!colors||!colors.length) return;
  const n=Math.min(colors.length,8); const dotR=Math.max(3,cell*0.065);
  for(let i=0;i<n;i++){
    const slot=i%4, row=i<4?0:1;
    const dx=x+cell*(0.16+slot*(0.68/3));
    const yy=y+cell*(row===0?0.16:0.84);
    ctx.beginPath();
    ctx.fillStyle = COLHEX[colors[i]];
    ctx.globalAlpha = i<idx ? 0.25 : 1;
    ctx.arc(dx,yy,dotR,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    if(marks && marks[i]==='fail'){
      ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.arc(dx,yy,dotR+2,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(dx-dotR-2,yy+dotR+2); ctx.lineTo(dx+dotR+2,yy-dotR-2); ctx.stroke();
    }
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================== CANVAS INTERACTION ============================== */
function isEditScreen(){ return State.screen==='puzzleEdit' || State.screen==='solutionEdit'; }
// Once play or step has actually been pressed, the board is frozen —
// covers actively playing, paused partway through (or even paused before
// the very first tick has landed), and stopped after a crash or a solve
// alike. Only an explicit restart (or switching to a different solution/
// the blank slot) brings it back, via resetRuntime() clearing this flag.
function canEditNow(){
  if(State.screen==='puzzleEdit') return true;
  if(State.screen==='solutionEdit') return !State.runStarted;
  return false;
}
function cellFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  const cell = canvas._cell;
  const c = Math.floor((e.clientX-rect.left)/cell);
  const r = Math.floor((e.clientY-rect.top)/cell);
  return {r,c};
}
const ROTATABLE = {mirrorDiag:1, prism:1};
function currentElementsArray(){ return State.screen==='puzzleEdit' ? getCurrentPuzzle().elements : promoteBlankIfNeeded().elements; }
function isReadOnlyEl(el){ return !!(el && el.fixed && State.screen==='solutionEdit'); }

let pointerDown = null; // {r,c,pointerId}
let dragState = null;   // {r0,c0,moved,cfg}
let lastHandledBoardGesture = null; // suppresses the click following a handled pointer gesture
let piecePreviewTimers=[];
let piecePreviewToken=0;

function cancelPiecePreview(clearArmed){
  piecePreviewToken++;
  for(const timer of piecePreviewTimers)clearTimeout(timer);
  piecePreviewTimers=[];State.piecePreview=null;
  if(clearArmed){State.previewArmedCell=null;State.previewConfigUntil=0;}
}
function previewFramesFor(el){
  if(el.type==='emitter'||el.type==='receiver')return {kind:'color',values:(el.colors||[]).slice(0,8)};
  if(el.type==='mirrorDiag')return {kind:'orientation',values:el.switching?[el.orientation,el.orientation==='NE_SW'?'NW_SE':'NE_SW']:[el.orientation]};
  if(el.type==='mirrorHalf')return {kind:'facing',values:halfMirrorEffectiveSequence(el)};
  if(el.type==='prism')return {kind:'base',values:prismEffectiveSequence(el)};
  if(el.type==='transformer')return {kind:'spectrum',values:(el.direction==='up'?SPECTRUM:SPECTRUM.slice().reverse())};
  return {kind:'pulse',values:[null]};
}
function startPieceRoutinePreview(r,c,el){
  cancelPiecePreview(false);State.previewArmedCell={r,c};
  const sequence=previewFramesFor(el);if(!sequence.values.length)sequence.values=[null];
  const dwell=sequence.values.length===1?1200:720;
  const token=piecePreviewToken;let at=0;
  const show=(value,index,delay,dim)=>piecePreviewTimers.push(setTimeout(()=>{
    if(token!==piecePreviewToken)return;
    State.piecePreview={r,c,kind:sequence.kind,value,index,dim:!!dim};render();
  },delay));
  for(let cycle=0;cycle<2;cycle++){
    sequence.values.forEach((value,index)=>{
      show(value,index,at,false);show(value,index,at+dwell-160,true);at+=dwell;
    });
    piecePreviewTimers.push(setTimeout(()=>{if(token===piecePreviewToken){State.piecePreview=null;render();}},at));
    if(cycle===0)at+=1000;
  }
  State.previewConfigUntil=Date.now()+at+500;
  piecePreviewTimers.push(setTimeout(()=>{
    if(token!==piecePreviewToken)return;
    State.piecePreview=null;piecePreviewTimers=[];render();
  },at+20));
  piecePreviewTimers.push(setTimeout(()=>{
    if(token!==piecePreviewToken)return;
    State.previewArmedCell=null;State.previewConfigUntil=0;
  },at+500));
}
function handlePieceTap(r,c,el){
  const armed=State.previewArmedCell;
  if(armed&&armed.r===r&&armed.c===c&&Date.now()<=State.previewConfigUntil){cancelPiecePreview(true);selectCell(r,c);return;}
  startPieceRoutinePreview(r,c,el);
}

function syncPlacementToolFromMenu(){
  const select=boardChrome.querySelector('.board-select');
  if(!select)return;
  if(!select.value){State.selectedTool=null;return;}
  let allowed;
  if(State.screen==='puzzleEdit') allowed=['emitter','receiver','crystal','transformer','cloneElement','eraser'];
  else {
    const puzzle=getCurrentPuzzle();
    allowed=['mirrorDiag','mirrorHalf','cloneElement','eraser'];
    if(puzzle&&puzzle.noHalfMirrors)allowed=allowed.filter(type=>type!=='mirrorHalf');
    if(!puzzle || !puzzle.noPrisms)allowed.splice(allowed.includes('mirrorHalf')?2:1,0,'prism');
  }
  if(allowed.includes(select.value))State.selectedTool=select.value;
}

canvas.addEventListener('pointerdown', (e)=>{
  if(!isEditScreen()) return;
  // Read the select itself at the start of the gesture. Some mobile browsers
  // defer its input/change event until the following interaction; this keeps
  // that very first board tap from becoming a no-op.
  syncPlacementToolFromMenu();
  e.preventDefault();
  const {r,c} = cellFromEvent(e);
  if(!inBounds(r,c,State.gridRows,State.gridCols)) return;
  const el = State.grid[r][c];
  // Placement and erasing are single-tap actions, so commit them on the
  // initial press. Waiting for a window-level pointerup allowed the first
  // board interaction after a native Tools selection to be swallowed on
  // some browsers. Existing pieces still wait for pointerup so they can be
  // distinguished from a drag or a deliberate configuration tap.
  if(canEditNow() && State.selectedTool && (!el || State.selectedTool==='eraser')){
    onCellClick(r,c);
    lastHandledBoardGesture={r,c,at:Date.now()};
    pointerDown=null; dragState=null;
    return;
  }
  if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  pointerDown = {r,c,pointerId:e.pointerId};
  if(canEditNow() && el && !isReadOnlyEl(el) && !['eraser','cloneElement'].includes(State.selectedTool)){
    const arr = currentElementsArray();
    const cfg = arr.find(x=>x.r===r&&x.c===c);
    if(cfg) dragState = {r0:r,c0:c,moved:false,cfg};
  }
});
window.addEventListener('pointermove', (e)=>{
  if(!dragState || !pointerDown || e.pointerId!==pointerDown.pointerId) return;
  e.preventDefault();
  const {r,c} = cellFromEvent(e);
  if(r!==dragState.r0 || c!==dragState.c0) dragState.moved = true;
  if(dragState.moved)cancelPiecePreview(true);
  if(dragState.moved && inBounds(r,c,State.gridRows,State.gridCols)){
    const occupied = State.grid[r][c] && !(r===dragState.r0 && c===dragState.c0);
    State.dragOver = {r,c, ok: !occupied};
    render();
  }
});
window.addEventListener('pointerup', (e)=>{
  if(!pointerDown || e.pointerId!==pointerDown.pointerId){ return; }
  e.preventDefault();
  const startedAt = pointerDown; pointerDown = null;
  const ds = dragState; dragState = null;
  State.dragOver = null;
  const target = cellFromEvent(e);
  if(!ds || !ds.moved){
    if(inBounds(target.r,target.c,State.gridRows,State.gridCols)){
      onCellClick(target.r,target.c);
      lastHandledBoardGesture={r:target.r,c:target.c,at:Date.now()};
    }
    else render();
    return;
  }
  if(inBounds(target.r,target.c,State.gridRows,State.gridCols)){
    const occupied = State.grid[target.r][target.c] && !(target.r===ds.r0 && target.c===ds.c0);
    if(!occupied && (target.r!==ds.r0 || target.c!==ds.c0)){
      if(e.altKey){
        const dup = JSON.parse(JSON.stringify(ds.cfg));
        dup.r=target.r; dup.c=target.c;
        currentElementsArray().push(dup);
      } else {
        ds.cfg.r = target.r; ds.cfg.c = target.c;
      }
      saveCurrentDoc();
      buildWorkingGrid();
      State.selectedCell=null;
      closeInspectorSheet();
      render();
      lastHandledBoardGesture={r:target.r,c:target.c,at:Date.now()};
      return;
    }
  }
  // invalid drop: nothing changed, element snaps back automatically
  lastHandledBoardGesture={r:target.r,c:target.c,at:Date.now()};
  render();
});
window.addEventListener('pointercancel', (e)=>{
  if(!pointerDown || e.pointerId!==pointerDown.pointerId) return;
  pointerDown=null; dragState=null; State.dragOver=null; render();
});

// Some browsers occasionally omit the canvas pointer sequence immediately
// after closing a native select. A separate click path makes that first board
// action reliable. Normal pointer-driven clicks are ignored here because they
// were already handled above.
canvas.addEventListener('click',(e)=>{
  const {r,c}=cellFromEvent(e);
  const recent=lastHandledBoardGesture;
  if(recent && recent.r===r && recent.c===c && Date.now()-recent.at<1000){
    lastHandledBoardGesture=null;
    return;
  }
  lastHandledBoardGesture=null;
  syncPlacementToolFromMenu();
  if(inBounds(r,c,State.gridRows,State.gridCols))onCellClick(r,c);
});

function onCellClick(r,c){
  const el = State.grid[r][c];
  if(State.selectedTool==='eraser'){
    if(canEditNow() && el && !isReadOnlyEl(el)) removeElementAt(r,c);
    return;
  }
  if(State.selectedTool==='cloneElement'){
    if(!canEditNow())return;
    if(el){
      if(isReadOnlyEl(el))return;
      const cfg=currentElementsArray().find(item=>item.r===r&&item.c===c);
      if(!cfg)return;
      State.cloneSource=JSON.parse(JSON.stringify(cfg));delete State.cloneSource.fixed;
      State.cloneSourceCell={r,c};State.selectedCell=null;closeInspectorSheet();render();
    } else if(State.cloneSource){
      cloneElementTo(r,c);
    }
    return;
  }
  if(!canEditNow()){
    if(el) selectCell(r,c);
    return;
  }
  if(State.screen==='puzzleEdit'){
    if(el){ selectCell(r,c); }
    else if(State.selectedTool){ placeElement(r,c,State.selectedTool, true); }
  } else if(State.screen==='solutionEdit'){
    if(el){ handlePieceTap(r,c,el); }
    else if(State.selectedTool){ placeElement(r,c,State.selectedTool, false); }
  }
}

function cloneElementTo(r,c){
  if(!State.cloneSource||State.grid[r][c])return;
  const copy=JSON.parse(JSON.stringify(State.cloneSource));copy.r=r;copy.c=c;delete copy.fixed;
  currentElementsArray().push(copy);saveCurrentDoc();State.selectedCell=null;
  if(State.screen==='solutionEdit')renderScreen();
  else {buildWorkingGrid();closeInspectorSheet();render();}
}

function removeElementAt(r,c){
  const el=State.grid[r][c];
  if(!el || isReadOnlyEl(el)) return;
  const arr=currentElementsArray();
  const idx=arr.findIndex(e=>e.r===r&&e.c===c);
  if(idx>=0){arr.splice(idx,1);saveCurrentDoc();}
  State.selectedCell=null; closeInspectorSheet(); buildWorkingGrid(); render();
}

function rotateElementAt(r,c){
  mutateSelectedConfig(cfg=>{
    if(cfg.type==='mirrorDiag'){ cfg.orientation = cfg.orientation==='NE_SW' ? 'NW_SE' : 'NE_SW'; }
    else if(cfg.type==='prism'){ cfg.base = CW[cfg.base]; }
  });
}

document.addEventListener('keydown', (e)=>{
  if(e.key!=='Delete' && e.key!=='Backspace') return;
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
  if(!canEditNow() || !State.selectedCell) return;
  e.preventDefault();
  removeSelected();
});

function defaultConfigFor(type){
  if(type==='emitter') return {type,dirs:['E'],colors:[1]};
  if(type==='receiver') return {type,dirs:['W'],colors:[1]};
  if(type==='mirrorDiag') return {type,orientation:'NE_SW',switching:false};
  if(type==='mirrorHalf') return {type,facing:'NW',seq:[null,null,null]};
  if(type==='crystal') return {type,filterColor:null,maxHits:'inf',lastFiniteHits:99};
  if(type==='transformer') return {type, direction:'up'};
  if(type==='prism') return {type,base:'E',seq:[null,null,null]};
}

function placeElement(r,c,type,fixed){
  const puzzle=getCurrentPuzzle();
  if(!fixed && puzzle && ((type==='prism'&&puzzle.noPrisms)||(type==='mirrorHalf'&&puzzle.noHalfMirrors))) return;
  const cfg = defaultConfigFor(type);
  cfg.r=r; cfg.c=c;
  const arr = fixed ? getCurrentPuzzle().elements : promoteBlankIfNeeded().elements;
  arr.push(cfg);
  saveCurrentDoc();
  State.selectedCell = null;
  if(State.screen==='solutionEdit'){
    cancelPiecePreview(true);
    State.previewArmedCell={r,c};
    State.previewConfigUntil=Date.now()+2000;
    renderScreen();
  }
  else { buildWorkingGrid(); closeInspectorSheet(); render(); }
}

function selectCell(r,c){
  cancelPiecePreview(true);
  State.selectedCell = {r,c};
  renderInspector();
  openInspectorSheet();
  render();
}

function removeSelected(){
  if(!State.selectedCell) return;
  const {r,c} = State.selectedCell;
  const el = State.grid[r][c];
  if(!el || (el.fixed && State.screen==='solutionEdit')) return; // can't remove fixed from solution editor
  const arr = currentElementsArray();
  const idx = arr.findIndex(e=>e.r===r&&e.c===c);
  if(idx>=0){ arr.splice(idx,1); saveCurrentDoc(); }
  State.selectedCell=null;
  if(State.screen==='solutionEdit'){ renderScreen(); }
  else { buildWorkingGrid(); renderInspector(); render(); }
}

function saveCurrentDoc(){
  if(State.screen==='puzzleEdit') persistPuzzles();
  else if(State.screen==='solutionEdit'){ persistSolutions(); updateRunUI(); }
}

function mutateSelectedConfig(mutator){
  if(!State.selectedCell) return;
  const {r,c}=State.selectedCell;
  const arr = currentElementsArray();
  const cfg = arr.find(e=>e.r===r&&e.c===c);
  if(!cfg) return;
  mutator(cfg);
  saveCurrentDoc();
  State.selectedCell={r,c};
  if(State.screen==='solutionEdit'){ renderScreen(); }
  else { buildWorkingGrid(); renderInspector(); render(); }
}

function getCurrentPuzzle(){ return State.puzzles.find(p=>p.id===State.currentPuzzleId); }
// A puzzle always has a virtual "blank" solution pinned above its real
// ones — nothing is actually created or persisted for it until the first
// edit happens (see promoteBlankIfNeeded). currentSolutionId is 'BLANK'
// (or unset) while that virtual slot is the one being shown.
function getCurrentSolution(){
  if(State.currentSolutionId && State.currentSolutionId!=='BLANK'){
    const s = State.solutions.find(x=>x.id===State.currentSolutionId);
    if(s) return s;
  }
  const p = getCurrentPuzzle();
  return {id:'BLANK', puzzleId: p?p.id:null, name:'New solution', elements:[], status:'in-progress', createdAt:null};
}
// Called right before an actual edit (placing/moving/deleting/configuring
// a solver-placed element) is about to happen. If the blank virtual slot
// is currently active, this is the moment it becomes a real, persisted
// solution — after which State.currentSolutionId points at it like any
// other. Already-real solutions pass through untouched.
function promoteBlankIfNeeded(){
  const cur = getCurrentSolution();
  if(cur.id!=='BLANK') return cur;
  const p = getCurrentPuzzle();
  const s = {id:uid(), puzzleId:p.id, name:'Attempt '+(solutionsForPuzzle(p.id).length+1), elements:[], status:'in-progress', createdAt:Date.now()};
  State.solutions.push(s);
  persistSolutions();
  State.currentSolutionId = s.id;
  return s;
}
function solutionsForPuzzle(pid){ return State.solutions.filter(s=>s.puzzleId===pid); }

function actionButton(text,cls,onClick){
  const b=document.createElement('button'); b.type='button'; b.className='btn small'+(cls?' '+cls:''); b.textContent=text;
  b.addEventListener('click',onClick); return b;

function appendScopeActions(parent,label,onImport,onExport){

  if(label){ const span=document.createElement('span'); span.className='scope-label'; span.textContent=label; row.appendChild(span); }
  row.appendChild(actionButton('Import','',onImport));
  row.appendChild(actionButton('Export','',onExport));
  parent.appendChild(row);
  return row;
}
function puzzleMeta(p,withSolutions){
  const emitters=(p.elements||[]).filter(e=>e.type==='emitter').length;
  const receivers=(p.elements||[]).filter(e=>e.type==='receiver').length;
  let text=`${(p.elements||[]).length} element${(p.elements||[]).length!==1?'s':''} · ${emitters} emitter${emitters!==1?'s':''} · ${receivers} receiver${receivers!==1?'s':''}`;
  if(p.noPrisms) text+=' · No Prisms';
  if(p.noHalfMirrors) text+=' · No Half-Mirrors';
  if(withSolutions){
    const n=solutionsForPuzzle(p.id).length;
    text+=` · ${n} solution${n!==1?'s':''}`;
  }
  return text;
}
function puzzlePacketTotals(p){
  let emitted=0,expected=0;
  for(const el of (p&&p.elements)||[]){
    if(el.type==='emitter') emitted+=Array.isArray(el.colors)?el.colors.length:0;
    else if(el.type==='receiver') expected+=Array.isArray(el.colors)?el.colors.length:0;
  }
  return {emitted,expected};
}
function warnIfStrictPacketTotalsMismatch(p){
  if(!p || !p.strict)return false;
  const {emitted,expected}=puzzlePacketTotals(p);
  if(emitted===expected)return false;

function updateListDragTarget(e){

function reorderSet(sourceId,targetId,after){
  if(!targetId||sourceId===targetId)return;

  if(targetIndex<0){State.sets.splice(sourceIndex,0,source);return;}
  State.sets.splice(targetIndex+(after?1:0),0,source);persistSets();

function movePuzzle(sourceId,target){
  const source=State.puzzles.find(p=>p.id===sourceId);if(!source||!target||!target.setId)return;
  if(target.puzzleId===sourceId)return;
  const bySet=new Map(State.sets.map(set=>[set.id,State.puzzles.filter(p=>p.setId===set.id&&p.id!==sourceId)]));
  const destination=bySet.get(target.setId);if(!destination)return;
  let index=destination.length;
  if(target.puzzleId){const found=destination.findIndex(p=>p.id===target.puzzleId);if(found>=0)index=found+(target.after?1:0);}
  source.setId=target.setId;destination.splice(index,0,source);State.expandedSetIds.add(target.setId);

function showPuzzleSetupDialog(p){
  const backdrop=document.createElement('div'); backdrop.className='dialog-backdrop';

  dialog.innerHTML=`<h3>Puzzle setup</h3><label class="field">Puzzle name</label><input id="setupName" type="text" value="${escapeAttr(p.name)}">

    const rows=clamp(parseInt(dialog.querySelector('#setupRows').value)||7,5,13);
    const cols=clamp(parseInt(dialog.querySelector('#setupCols').value)||7,5,9);
    const elements=(p.elements||[]).filter(e=>e.r<rows&&e.c<cols);
    const newlyDisallowed=[];
    if(noPrisms&&!p.noPrisms)newlyDisallowed.push('prism');
    if(noHalfMirrors&&!p.noHalfMirrors)newlyDisallowed.push('mirrorHalf');
    const affected=newlyDisallowed.length
      ? State.solutions.filter(s=>s.puzzleId===p.id && (s.elements||[]).some(el=>newlyDisallowed.includes(el.type))).length : 0;
    const restrictionNames=newlyDisallowed.map(type=>type==='prism'?'No Prisms':'No Half-Mirrors').join(' and ');
    if(affected && !confirm(`Turning on ${restrictionNames} will remove disallowed pieces from ${affected} saved solution${affected!==1?'s':''} and mark those solutions in progress. Continue?`))return;
    if(strict && !p.strict){
      const {emitted,expected}=puzzlePacketTotals({elements});
      if(emitted!==expected)alert(`This puzzle will be unsolvable in Strict mode: its emitters produce ${emitted} packet${emitted!==1?'s':''}, but its receivers expect ${expected}. The totals must be equal.`);
    }
    p.name=dialog.querySelector('#setupName').value.trim()||'Untitled Puzzle';

    p.cols=cols;
    p.strict=strict;
