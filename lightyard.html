<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lightyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b10;
  --panel:#12141b;
  --panel2:#181b24;
  --line:#262a36;
  --text:#e8e9ee;
  --dim:#8b8fa3;
  --dimmer:#5a5e70;
  --accent:#6ee7ff;
  --R:#ff4d4d; --G:#3ddc72; --B:#4d8dff; --C:#3de3e3; --M:#ff4dd2; --Y:#ffd94d; --W:#f5f6fa;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;}
button, input, select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#2a2e3a;border-radius:4px;}

#app{display:flex;flex-direction:column;height:100vh;}

/* ---- Header ---- */
header{
  display:flex;align-items:center;gap:20px;
  padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  flex-shrink:0;
}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:0.3px;}
.beam{height:3px;width:120px;border-radius:2px;
  background:linear-gradient(90deg,var(--R),var(--Y),var(--G),var(--C),var(--B),var(--M),var(--R));
  background-size:200% 100%;
  animation:flow 6s linear infinite;}
@keyframes flow{to{background-position:200% 0;}}

nav.modes{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:9px;}
nav.modes button{
  border:none;background:transparent;color:var(--dim);padding:7px 14px;border-radius:7px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
}
nav.modes button.active{background:var(--bg);color:var(--text);}
nav.modes button:hover:not(.active){color:var(--text);}

.spacer{flex:1;}

.runbar{display:flex;align-items:center;gap:14px;}
.runbar .ticks{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);
  background:var(--panel2);padding:6px 10px;border-radius:7px;min-width:96px;text-align:center;}
.runbar .ticks b{color:var(--text);}
.speedwrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
.speedwrap input[type=range]{width:130px;accent-color:var(--accent);}
.iconbtn{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);}
.iconbtn:disabled{opacity:.35;cursor:default;}
.iconbtn:disabled:hover{border-color:var(--line);color:var(--text);}
.iconbtn.primary{background:var(--accent);color:#04222b;border-color:var(--accent);}

/* ---- Layout ---- */
#body{flex:1;display:flex;min-height:0;}
aside{width:250px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px;}
aside.right{border-right:none;border-left:1px solid var(--line);}
main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0;
  background:
    radial-gradient(circle at 50% 0%, #0e1018 0%, #08090d 70%);}
#gridCanvas{border-radius:12px;background:#0d0f16;box-shadow:0 0 0 1px #626979, 0 20px 60px -20px #000;}
.mobile-tabs{display:none;}

h2.side-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dimmer);
  margin:0 0 10px 0;font-weight:600;}
h3.sub{font-size:12px;color:var(--dim);margin:16px 0 8px;font-weight:600;}

.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:10px;}
.card p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.5;}

.btn{
  display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  margin-bottom:6px;transition:.12s;
}
.btn:hover{border-color:var(--accent);}
.btn.solid{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;text-align:center;}
.btn.solid:hover{filter:brightness(1.08);}
.btn.danger{color:#ff8080;}
.btn.danger:hover{border-color:#ff8080;}
.btn.small{padding:6px 9px;font-size:12px;display:inline-block;width:auto;margin-right:6px;}
.btn.tool{display:flex;align-items:center;gap:9px;}
.btn.tool.active{border-color:var(--accent);background:#132229;}
.btn.tool:disabled{opacity:0.4;cursor:not-allowed;}
.btn.tool:disabled:hover{border-color:var(--line);}
.toolicon{width:20px;height:20px;flex-shrink:0;}

input[type=text], input[type=number]{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:7px 9px;border-radius:7px;font-size:13px;margin-bottom:8px;
}
label.field{display:block;font-size:11px;color:var(--dimmer);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
label.field.sequence-heading{color:var(--dim);}

.dirgrid{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(3,28px);gap:2px;margin-bottom:8px;}
.dirbtn{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:5px;
  cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;}
.dirbtn.on{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;}

.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;}

.prism-seq-row{display:flex;gap:8px;margin-bottom:10px;}
.prism-slot{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;}
.prism-slot:hover:not(:disabled){border-color:var(--accent);}
.prism-slot:disabled{cursor:default;opacity:0.65;}
.prism-slot.off svg rect{transition:stroke .15s;}
.orientation-program{display:grid;gap:7px;margin-bottom:10px;}
.orientation-choice-row{display:grid;grid-template-columns:24px repeat(5,minmax(42px,1fr));gap:6px;align-items:center;}
.orientation-step{color:var(--dimmer);font-size:12px;font-weight:700;text-align:center;}
.orientation-choice{min-width:0;min-height:42px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.orientation-choice:hover:not(:disabled){border-color:var(--accent);}
.orientation-choice.selected{border-color:var(--accent);background:#132229;box-shadow:inset 0 0 0 1px #6ee7ff44;}
.orientation-choice:disabled{cursor:default;opacity:.62;}
.orientation-choice.blank{font-size:18px;color:var(--dimmer);}
.swatch:hover{border-color:#fff;}
.chipline{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;min-height:28px;
  background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px;}
.chip{width:22px;height:22px;border-radius:5px;cursor:pointer;position:relative;flex-shrink:0;}
.chip::after{content:'×';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#0009;font-size:12px;opacity:0;font-weight:900;}
.chip:hover::after{opacity:1;}
.chip-empty{color:var(--dimmer);font-size:11px;padding:4px;}

.radiorow{display:flex;gap:6px;margin-bottom:8px;}
.radiorow button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  padding:7px 4px;border-radius:7px;cursor:pointer;font-size:11.5px;}
.radiorow button.on{background:var(--accent);color:#04222b;border-color:var(--accent);font-weight:700;}

.checkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);margin-bottom:8px;cursor:pointer;}

.puzlist .item, .sollist .item{
  border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer;
}
.puzlist .item:hover, .sollist .item:hover{border-color:var(--accent);}
.sollist .item.active-sol{border-color:var(--accent);background:#132229;}
.puzlist .item .name{font-weight:600;font-size:13.5px;}
.puzlist .item .meta{font-size:11px;color:var(--dimmer);margin-top:3px;}
.sollist .item .name{font-weight:600;font-size:13px;}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.badge.solved{background:#123b26;color:#3ddc72;}
.badge.progress{background:#2b2410;color:#ffd94d;}
.rowbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

.empty-hint{color:var(--dimmer);font-size:12.5px;text-align:center;padding:30px 10px;}

.statusbar{position:static;flex:none;margin:8px 12px 0;padding:8px 18px;
  border-radius:8px;font-size:13px;font-weight:600;text-align:center;
  background:var(--panel2);border:1px solid var(--line);display:none;}
.statusbar.show{display:block;}
.statusbar.solved{color:#3ddc72;border-color:#3ddc72;}
.statusbar.failed{color:#ff6b6b;border-color:#ff6b6b;}

.dialog-backdrop{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:340px;}
.dialog h3{margin:0 0 12px;font-size:15px;}
.dialog .rowbtns{justify-content:flex-end;}

.sizewrap{display:flex;gap:10px;}
.sizewrap > div{flex:1;}

.help-backdrop{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
.help-backdrop.show{display:flex;}
.help-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(760px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 80px -20px #000;}
.help-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
.help-head h2{margin:0;font-size:18px;}
.help-head .ver{font-size:11px;color:var(--dimmer);background:var(--panel2);padding:3px 9px;border-radius:20px;font-weight:600;}
.help-body{overflow-y:auto;padding:6px 24px 20px;flex:1;}
.help-body h3{font-size:14px;color:var(--accent);margin:24px 0 8px;letter-spacing:.2px;}
.help-body h3:first-child{margin-top:16px;}
.help-body h4{font-size:12.5px;color:var(--text);margin:16px 0 5px;font-weight:700;}
.help-body p{font-size:13px;color:var(--dim);line-height:1.65;margin:6px 0;}
.help-body ul{margin:6px 0;padding-left:20px;}
.help-body li{font-size:13px;color:var(--dim);line-height:1.6;margin:3px 0;}
.help-body strong{color:var(--text);}
.help-body a{color:var(--accent);}
.hs{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 1px;}
.help-ex{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:12.5px;color:var(--dim);}
.help-piece{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);}
.help-piece:first-of-type{border-top:none;}
.help-piece .pn{font-weight:700;color:var(--text);font-size:13px;min-width:130px;flex-shrink:0;}
.help-piece .pd{font-size:12.5px;color:var(--dim);line-height:1.6;}
.help-ui-shot{position:relative;margin:12px 0 10px;border:1px solid #626979;border-radius:12px;background:#0a0b10;overflow:hidden;box-shadow:0 12px 30px #0007;}
.help-ui-top,.help-ui-play,.help-ui-tools{display:flex;align-items:center;gap:5px;padding:6px 7px;background:#12141b;border-bottom:1px solid #303646;min-width:max-content;}
.help-ui-title{flex:1;min-width:130px;color:#e8e9ee;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.help-ui-pill,.help-ui-tool{border:1px solid #343a49;border-radius:6px;background:#181b24;color:#c4c7d1;font-size:8px;font-weight:650;padding:5px 7px;white-space:nowrap;text-align:center;}
.help-ui-pill.primary{background:#123544;border-color:#6ee7ff;color:#bff6ff;}
.help-ui-play{background:#101219;}
.help-ui-meter{height:4px;width:70px;border-radius:3px;background:linear-gradient(90deg,#6ee7ff 39%,#343a49 39%);}
.help-ui-tools{overflow:hidden;}
.help-ui-tool{min-width:52px;padding:6px 4px;}
.help-ui-board{height:205px;margin:14px auto 16px;width:min(72%,300px);border:1px solid #626979;border-radius:7px;
  background-color:#0d0f16;background-image:linear-gradient(#444957 1px,transparent 1px),linear-gradient(90deg,#444957 1px,transparent 1px);background-size:14.285% 14.285%;position:relative;}
.help-ui-piece-dot{position:absolute;width:17px;height:17px;border:2px solid #8a6fff;background:#2a2436;transform:translate(-50%,-50%) rotate(45deg);}
.help-ui-piece-dot.mirror{border:0;border-radius:0;background:linear-gradient(135deg,transparent 44%,#dcefff 45% 55%,transparent 56%);transform:translate(-50%,-50%);}
.help-ui-piece-dot.fixed{border-radius:4px;border-color:#6ee7ff;background:#1a2230;transform:translate(-50%,-50%);}
.help-ui-label{position:absolute;z-index:2;width:22px;height:22px;border-radius:50%;background:#ffd94d;color:#141414;border:2px solid #fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px #000;}
.help-ui-legend{margin:8px 0 16px!important;padding-left:25px!important;}
.help-ui-legend li{padding-left:3px;}
.help-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;}
.help-foot .credit{font-size:11.5px;color:var(--dimmer);line-height:1.5;}
.help-foot .btn{width:auto;margin:0;padding:9px 16px;}

/* ---- Phone / narrow-tablet layout ---- */
@media (max-width:800px){
  html,body{height:100%;height:100dvh;overscroll-behavior:none;}
  #app{height:100%;height:100dvh;}
  header{padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));gap:8px;flex-wrap:wrap;}
  header .brand, header > .spacer{display:none;}
  nav.modes{flex:1;min-width:0;}
  nav.modes button{flex:1;min-height:40px;padding:7px 6px;font-size:12px;white-space:nowrap;}
  #helpBtn{width:40px;height:40px;}
  .runbar{order:5;width:100%;gap:6px;}
  .runbar .ticks{min-width:72px;padding:7px 6px;font-size:12px;}
  .speedwrap{flex:1;min-width:82px;gap:5px;}
  .speedwrap > span:first-child{display:none;}
  .speedwrap input[type=range]{width:auto;min-width:54px;flex:1;}
  .iconbtn{width:40px;height:40px;flex-shrink:0;}

  #body{position:relative;}
  #body:not(.editing) > aside.left{display:block;width:100%;border:0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));}
  #body:not(.editing) > main, #body:not(.editing) > aside.right{display:none;}

  #body.editing{padding-bottom:calc(56px + env(safe-area-inset-bottom));}
  #body.editing > aside, #body.editing > main{
    display:none;position:absolute;inset:0 0 calc(56px + env(safe-area-inset-bottom)) 0;width:100%;border:0;
  }
  #body.editing > main.mobile-active{display:flex;padding:10px;overflow:auto;align-items:center;justify-content:center;}
  #body.editing > aside.mobile-active{display:block;padding:14px 12px;overflow-y:auto;overscroll-behavior:contain;}
  #gridCanvas{touch-action:none;flex:none;}

  .mobile-tabs{
    position:absolute;display:flex;z-index:20;left:0;right:0;bottom:0;
    height:calc(56px + env(safe-area-inset-bottom));padding:5px 8px calc(5px + env(safe-area-inset-bottom));
    gap:5px;background:var(--panel);border-top:1px solid var(--line);
  }
  .mobile-tabs button{
    flex:1;border:1px solid transparent;background:transparent;color:var(--dim);border-radius:8px;
    font:600 12px 'Space Grotesk',system-ui,sans-serif;min-width:0;
  }
  .mobile-tabs button.active{background:var(--panel2);border-color:var(--line);color:var(--accent);}

  .btn{min-height:44px;padding:11px 12px;}
  .btn.small{min-height:40px;padding:9px 11px;}
  input[type=text], input[type=number]{min-height:42px;font-size:16px;}
  .dirgrid{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:3px;}
  .swatch{width:36px;height:36px;}
  .chip{width:32px;height:32px;}
  .prism-slot{min-height:48px;}
  .orientation-choice-row{grid-template-columns:20px repeat(5,minmax(0,1fr));gap:4px;}
  .orientation-choice{min-height:46px;}
  .radiorow button{min-height:44px;}
  .checkline{min-height:40px;}
  .statusbar{margin:6px 8px 0;padding:7px 13px;}
  .dialog{width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;}
  .help-backdrop{padding:10px;}
  .help-modal{max-height:calc(100dvh - 20px);}
  .help-head{padding:12px 14px;}
  .help-body{padding:4px 16px 16px;}
  .help-foot{padding:10px 14px;}
  .help-piece{display:block;}
  .help-piece .pn{margin-bottom:3px;}
}

@media (max-width:390px){
  .runbar{gap:4px;}
  .runbar .ticks{min-width:62px;}
  .runbar .iconbtn{width:38px;height:38px;}
  .speedwrap #speedVal{display:none;}
  .help-foot .credit{display:none;}
  .help-foot{justify-content:flex-end;}
}

/* ---- Unified library / sliding board interface ---- */
.mobile-tabs{display:none!important;}
#body{position:relative;display:block;overflow:hidden;}
#leftPanel{
  width:min(820px,100%);height:100%;margin:0 auto;border:0;padding:18px;
  background:var(--bg);overflow-y:auto;
}
#rightPanel{
  display:block;position:fixed;z-index:60;left:50%;right:auto;top:var(--inspector-top,96px);bottom:auto;
  width:min(720px,100%);max-height:min(64vh,680px);padding:0;
  border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;
  background:var(--panel);overflow:hidden;
  opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-14px);
  transition:transform .18s ease,opacity .18s ease,visibility 0s linear .18s;
  box-shadow:0 24px 70px -30px #000;
}
#rightPanel.sheet-open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0);transition-delay:0s;}
.sheet-backdrop{display:none;position:fixed;inset:0;background:#0008;z-index:55;}
.sheet-backdrop.show{display:block;}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
.sheet-head h2{font-size:14px;margin:0;flex:1;}
.sheet-body{padding:14px;max-height:calc(min(64vh,680px) - 60px);overflow-y:auto;}

main#boardPanel{
  position:absolute;z-index:20;inset:0;min-width:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;
  transform:translateX(102%);transition:transform .24s ease;background:var(--bg);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
main#boardPanel.board-open{transform:translateX(0);}
.board-chrome{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 12px;}
.board-row{display:flex;align-items:center;gap:8px;min-width:0;}
.board-row + .board-row{margin-top:8px;}
.board-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.board-title.editable{cursor:pointer;border:0;background:transparent;color:var(--text);text-align:left;padding:7px 4px;border-radius:7px;}
.board-title.editable:hover{background:var(--panel2);}
.board-select{display:none;}
.mobile-tool-strip{display:flex;position:relative;gap:6px;min-width:0;width:100%;}
.mobile-tool-strip-scroll{display:flex;gap:6px;min-width:0;flex:1;}
.mobile-tool-button,.mobile-more-button{
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:8px;
  min-height:46px;padding:5px 4px;font-size:10.5px;font-weight:650;line-height:1.1;cursor:pointer;
}
.mobile-tool-button{flex:0 1 104px;min-width:70px;}
.mobile-tool-button.active{border-color:var(--accent);background:#132229;color:var(--accent);box-shadow:inset 0 0 0 1px #6ee7ff33;}
.mobile-tool-button:disabled{opacity:.35;cursor:default;}
.mobile-tool-glyph{display:block;font-size:16px;line-height:17px;margin-bottom:2px;color:var(--text);}
.mobile-more-wrap{position:relative;display:flex;flex:0 0 76px;min-width:60px;}
.mobile-more-button{width:100%;color:var(--text);}
.mobile-more-menu{display:none;position:fixed;z-index:90;min-width:170px;padding:5px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 35px #000b;}

<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Lightyard</h1>
      <div class="beam"></div>
    </div>
    <nav class="modes">
      <button data-mode="solve" class="active">Solve Puzzles</button>
      <button data-mode="create">Create Puzzles</button>
    </nav>
    <div class="spacer"></div>
    <div class="runbar" id="runbar" style="display:none;">
      <div class="ticks">Elements: <b id="elementCount">0</b></div>
      <div class="ticks">tick <b id="tickCount">0</b></div>
      <div class="speedwrap">
        <span>speed</span>
        <input type="range" id="speedSlider" min="0" max="100" value="39">
        <span id="speedVal" style="width:22px;">39</span>
      </div>
      <button class="iconbtn" id="stepBtn" title="Step one tick">⏭</button>
      <button class="iconbtn primary" id="playBtn" title="Play / Pause">▶</button>
      <button class="iconbtn" id="resetRunBtn" title="Restart playback from tick 0">↺</button>
    </div>
    <button class="iconbtn" id="helpBtn" title="How to play">?</button>
  </header>
  <div id="body">

    <aside class="left" id="leftPanel"></aside>
    <main id="boardPanel">
      <div class="board-chrome" id="boardChrome"></div>
      <div class="statusbar" id="statusBar"></div>
      <div class="board-stage" id="boardStage">
        <canvas id="gridCanvas" width="800" height="600" tabindex="0" aria-label="Puzzle board"></canvas>
      </div>
    </main>
    <aside class="right" id="rightPanel"></aside>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
  </div>
</div>
<div class="help-backdrop" id="helpBackdrop">
  <div class="help-modal">
    <div class="help-head">
      <h2>Lightyard</h2>
      <span class="ver">v1.0</span>
      <div class="spacer"></div>
      <button class="iconbtn" id="helpCloseBtn" title="Close">×</button>
    </div>
    <div class="help-body" id="helpBody"></div>
    <div class="help-foot">
      <span class="credit">Created by <strong style="color:var(--dim);">Geoff Canyon</strong> · inspired by <a href="https://trainyard.ca" target="_blank" rel="noopener">Trainyard</a></span>
      <button class="btn solid" id="helpPlayBtn">Let's play →</button>
    </div>
  </div>
</div>
<input type="file" id="importFileInput" accept="application/json,.json,.lightyard-puzzle.json,.lightyard-solution.json" style="display:none;">

<script>
(function(){
"use strict";

// Captured before the app renders anything dynamic. Save as Web App uses this
// clean source—not the mutated live DOM—as the shell for a standalone copy.
const SOURCE_APP_HTML='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const BUILT_IN_APP_DATA = /*__LIGHTYARD_EMBED_START__*/ null /*__LIGHTYARD_EMBED_END__*/;

/* ============================== CONSTANTS ============================== */
const DIRS = ['N','E','S','W'];
const DIRWORD = {N:'north',E:'east',S:'south',W:'west'};
const VEC = {N:{dr:-1,dc:0}, E:{dr:0,dc:1}, S:{dr:1,dc:0}, W:{dr:0,dc:-1}};
const OPP = {N:'S',E:'W',S:'N',W:'E'};
const CW  = {N:'E',E:'S',S:'W',W:'N'};
const CCW = {N:'W',W:'S',S:'E',E:'N'};
const NE_SW_MAP = {N:'E',E:'N',S:'W',W:'S'};
const NW_SE_MAP = {N:'W',W:'N',S:'E',E:'S'};
const CORNER_CW = {NW:'NE',NE:'SE',SE:'SW',SW:'NW'};
const CORNER_SIDES = {NW:['N','W'],NE:['N','E'],SE:['S','E'],SW:['S','W']};
function legacyHalfMirrorFacing(el){
  const orient=el.orientation||'NE_SW';
  const upper=(el.reflectiveSide||'upper')==='upper';
  return orient==='NE_SW' ? (upper?'NW':'SE') : (upper?'NE':'SW');
}
function halfMirrorFacing(el){ return el.curFacing||el.facing||legacyHalfMirrorFacing(el); }
function halfMirrorOrientation(facing){ return facing==='NW'||facing==='SE' ? 'NE_SW' : 'NW_SE'; }
function halfMirrorReflects(el,inputSide){
  return CORNER_SIDES[halfMirrorFacing(el)].includes(inputSide);
}

// colors as bitmask: R=1 G=2 B=4
const COL = {R:1,G:2,B:4,Y:3,M:5,C:6,W:7,K:'black'};
const COLNAME = {1:'R',2:'G',4:'B',3:'Y',5:'M',6:'C',7:'W',black:'Black'};
const COLHEX  = {1:'#ff4d4d',2:'#3ddc72',4:'#4d8dff',3:'#ffd94d',5:'#ff4dd2',6:'#3de3e3',7:'#f5f6fa',black:'#050507'};
const COLORS_ORDER = [1,2,4,3,5,6,7]; // R G B Y M C W
// The transformer's spectrum: red -> yellow -> green -> cyan -> blue -> magenta.
// No wraparound — stepping past either end (or white, which isn't on the
// spectrum at all) is a failure, handled by stepSpectrum returning null.
const SPECTRUM = [COL.R, COL.Y, COL.G, COL.C, COL.B, COL.M];
function stepSpectrum(color, direction){
  const idx = SPECTRUM.indexOf(color);
  if(idx===-1) return null; // white, or anything else off the spectrum
  const next = direction==='up' ? idx+1 : idx-1;
  if(next<0 || next>=SPECTRUM.length) return null;
  return SPECTRUM[next];
}

function splitTable(x){
  // returns [p1color,p2color] for a D-side prism hit
  if(x===6) return [2,4];   // Cyan -> Green(P1) + Blue(P2)
  if(x===5) return [4,1];   // Magenta -> Blue(P1) + Red(P2)
  if(x===3) return [1,2];   // Yellow -> Red(P1) + Green(P2)
  return [x,x];             // R,G,B,W -> same color both sides
}
function blendAll(colors){ let c=0; for(const x of colors) c|=x; return c; }

// Two packets each moving in a straight line (start -> end) during the same
// interval: find the frac in (0,1) where their positions coincide, if any.
// Handles unequal speeds (e.g. one at half speed leaving a crystal, the
// other at full speed approaching it) as well as the simple equal-speed
// case — a straight line segment intersection in position-vs-frac space.
function computeCrossFrac(startA, endA, startB, endB){
  const EPS = 1e-9;
  const ddr = (endA.r-startA.r) - (endB.r-startB.r);
  const ddc = (endA.c-startA.c) - (endB.c-startB.c);
  const dr0 = startB.r - startA.r;
  const dc0 = startB.c - startA.c;
  let f;
  if(Math.abs(ddr) > EPS){
    f = dr0/ddr;
    const colA = startA.c + f*(endA.c-startA.c);
    const colB = startB.c + f*(endB.c-startB.c);
    if(Math.abs(colA-colB) > 1e-6) return null;
  } else if(Math.abs(ddc) > EPS){
    if(Math.abs(dr0) > 1e-6) return null;
    f = dc0/ddc;
  } else {
    return null; // same relative velocity: never newly meet
  }
  if(!(f > EPS && f < 1-EPS)) return null;
  return f;
}

let idCounter = 1;
function uid(){ return 'id'+(idCounter++)+'_'+Date.now().toString(36); }

/* ============================== EXPORT / IMPORT ============================== */
// Self-describing JSON files: a "schema"+"schemaVersion" envelope around a plain
// snapshot of the stored objects, so any element type this app knows about today
// or adds later round-trips automatically — nothing here hardcodes a field list.
const EXPORT_SCHEMA_VERSION = 1;

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function downloadTextFile(text,filename,mimeType){
  const blob=new Blob([text],{type:mimeType||'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function saveAsWebApp(){
  const embedded={
    storageNamespace:'app-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),
    sets:JSON.parse(JSON.stringify(State.sets)),
    puzzles:JSON.parse(JSON.stringify(State.puzzles))
  };
  // Escaping '<' prevents script-closing text in a puzzle or set name from
  // terminating the inline script in the generated app.
  const json=JSON.stringify(embedded).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const start='/*__LIGHTYARD_EMBED_START__*/',end='/*__LIGHTYARD_EMBED_END__*/';
  const startAt=SOURCE_APP_HTML.indexOf(start),endAt=SOURCE_APP_HTML.indexOf(end,startAt+start.length);
  if(startAt<0||endAt<0){alert('This copy of Lightyard could not prepare a standalone app.');return;}
  const html=SOURCE_APP_HTML.slice(0,startAt+start.length)+' '+json+' '+SOURCE_APP_HTML.slice(endAt);
  downloadTextFile(html,'lightyard-web-app.html','text/html');
}
function slugify(s){
  return (String(s||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')) || 'untitled';
}

function exportPuzzle(puzzle){
  downloadJSON({
    schema:'lightyard', schemaVersion:EXPORT_SCHEMA_VERSION, kind:'puzzle',
    exportedAt: Date.now(),
    puzzle: JSON.parse(JSON.stringify(puzzle))
  }, slugify(puzzle.name)+'.lightyard-puzzle.json');
}
function exportSolution(solution){
  const puzzle = State.puzzles.find(p=>p.id===solution.puzzleId) || null;
  downloadJSON({
    schema:'lightyard', schemaVersion:EXPORT_SCHEMA_VERSION, kind:'solution',
    exportedAt: Date.now(),
    puzzle: puzzle ? JSON.parse(JSON.stringify(puzzle)) : null,
    solution: JSON.parse(JSON.stringify(solution))
  }, slugify((puzzle?puzzle.name+'-':'')+solution.name)+'.lightyard-solution.json');
}
function exportAllSolutions(puzzle){
  const solutions = State.solutions.filter(s=>s.puzzleId===puzzle.id);
  downloadJSON({
    schema:'lightyard', schemaVersion:EXPORT_SCHEMA_VERSION, kind:'solutions',
    exportedAt: Date.now(),
    puzzle: JSON.parse(JSON.stringify(puzzle)),
    solutions: JSON.parse(JSON.stringify(solutions))
  }, slugify(puzzle.name)+'-solutions.json');
}

// Sanitizers assign fresh ids (so re-importing the same file, or a file shared by
// someone else, never collides with what's already stored) and validate just
// enough structure to render safely — every other field on each element passes
// through untouched, which is what keeps this forward-compatible with element
// types this version of the app doesn't know about yet.
function sanitizePuzzleData(raw, setId){
  if(!raw || typeof raw!=='object') throw new Error('missing puzzle data');
  const rows = clamp(parseInt(raw.rows)||7, 5, 13);
  const cols = clamp(parseInt(raw.cols)||7, 5, 9);
  const elements = Array.isArray(raw.elements) ? raw.elements.map(sanitizeElementData).filter(Boolean) : [];
  return {
    id: uid(),
    setId: setId,
    name: (raw.name && String(raw.name).slice(0,80)) || 'Imported Puzzle',
    rows, cols,
    createdAt: Date.now(),
    elements,
    strict: !!raw.strict,
    noPrisms: raw.noPrisms!=null ? !!raw.noPrisms : !!raw.mirrorsOnly,
    noHalfMirrors: !!raw.noHalfMirrors
  };
}
function sanitizeElementData(el){
  if(!el || typeof el!=='object' || typeof el.type!=='string') return null;
  if(typeof el.r!=='number' || typeof el.c!=='number') return null;
  if(el.type==='wood') return null;
  const copy = JSON.parse(JSON.stringify(el));
  delete copy.fixed; // runtime-only marker, reassigned by buildWorkingGrid
  normalizeCrystalType(copy); // 'crystalColored' from an older export folds into 'crystal'
  normalizeHalfMirrorData(copy);
  normalizePacketSequence(copy);
  return copy;
}
function normalizePacketSequence(el){
  if(!el || (el.type!=='emitter' && el.type!=='receiver') || !Array.isArray(el.colors))return false;
  if(el.colors.length<=8)return false;
  el.colors=el.colors.slice(0,8);
  return true;
}
// Clear and colored crystals used to be two separate element types; they're
// now one 'crystal' type with filterColor null (clear) or a color. Anything
// still carrying the old type name — from localStorage or an older export —
// gets folded in here rather than breaking.
function normalizeCrystalType(el){
  if(el && el.type==='crystalColored'){ el.type='crystal'; }
  if(el && el.type==='crystal'){
    if(el.maxHits==null) el.maxHits='inf';
    else if(el.maxHits!=='inf') el.maxHits=clamp(parseInt(el.maxHits)||1,1,99);
  }
  return el;
}
// Half-mirrors were originally stored as a diagonal plus an upper/lower
// reflective side and an optional two-state switch. Convert that model to a
// corner facing and a prism-style four-slot program as old saves are loaded.
function normalizeHalfMirrorData(el){
  if(!el || el.type!=='mirrorHalf') return el;
  const corners=['NW','NE','SE','SW'];
  const facing=corners.includes(el.facing) ? el.facing : legacyHalfMirrorFacing(el);
  let seq=Array.isArray(el.seq) ? el.seq.slice(0,3) : null;
  if(!seq && el.switching){
    const oldNext=(el.reflectiveSide||'upper')==='upper'
      ? (facing==='NW'?'NE':'NW')
      : (facing==='SE'?'SW':'SE');
    seq=[oldNext,null,null];
  }
  el.facing=facing;
  el.seq=(seq||[null,null,null]).map(v=>corners.includes(v)?v:null);
  delete el.orientation; delete el.reflectiveSide; delete el.switching;
  return el;
}
function sanitizeSolutionData(raw, puzzleId){
  if(!raw || typeof raw!=='object') throw new Error('missing solution data');
  const elements = Array.isArray(raw.elements) ? raw.elements.map(sanitizeElementData).filter(Boolean) : [];
  const solved = raw.status==='solved';
  const solution = {
    id: uid(),
    puzzleId,
    name: (raw.name && String(raw.name).slice(0,80)) || 'Imported Solution',
    elements,
    status: solved ? 'solved' : 'in-progress',
    createdAt: Date.now()
  };
  if(solved && raw.ticksToSolve!=null && Number.isFinite(Number(raw.ticksToSolve))){ solution.ticksToSolve=Math.max(0,Math.floor(Number(raw.ticksToSolve))); }
  enforcePuzzleSolutionRules(State.puzzles.find(p=>p.id===puzzleId),solution);
  return solution;
}
function enforcePuzzleSolutionRules(puzzle,solution){
  if(!puzzle || !solution) return false;
  const disallowed=new Set();
  if(puzzle.noPrisms)disallowed.add('prism');
  if(puzzle.noHalfMirrors)disallowed.add('mirrorHalf');
  if(!disallowed.size)return false;
  const before=(solution.elements||[]).length;
  solution.elements=(solution.elements||[]).filter(el=>!disallowed.has(el.type));
  if(solution.elements.length===before) return false;
  solution.status='in-progress';
  delete solution.ticksToSolve;
  return true;
}

function targetSetForQuickImport(){
  // Used for imports that don't carry their own set context (a single
  // puzzle or solution file) — land in whichever set is currently open, or
  // fall back to a catch-all set rather than asking, since this path is
  // meant to be quick and low-friction for a single item.
  if(State.currentSetId && State.sets.some(s=>s.id===State.currentSetId)) return State.currentSetId;
  let s = State.sets.find(x=>x.name==='Imported');
  if(!s){ s = {id:uid(), name:'Imported', createdAt:Date.now()}; State.sets.push(s); persistSets(); }
  return s.id;
}

function importPuzzlePayload(data){
  const puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
  State.puzzles.push(puzzle);
  persistPuzzles();
  return puzzle;
}
function importSolutionPayload(data){
  let puzzle = null;
  if(data.puzzle){
    puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
    State.puzzles.push(puzzle);
    persistPuzzles();
  }
  if(!data.solution) throw new Error('this file has no solution data in it');
  const puzzleId = puzzle ? puzzle.id : (typeof data.solution.puzzleId==='string' ? data.solution.puzzleId : null);
  if(!puzzleId) throw new Error('this solution file has no puzzle attached to it');
  const solution = sanitizeSolutionData(data.solution, puzzleId);
  State.solutions.push(solution);
  persistSolutions();
  return {puzzle, solution};
}
function importSolutionsPayload(data){
  let puzzle = null;
  if(data.puzzle){
    puzzle = sanitizePuzzleData(data.puzzle, targetSetForQuickImport());
    State.puzzles.push(puzzle);
    persistPuzzles();
  }
  const puzzleId = puzzle ? puzzle.id : (typeof data.puzzleId==='string' ? data.puzzleId : null);
  if(!puzzleId) throw new Error('this solutions file has no puzzle attached to it');
  const raws = Array.isArray(data.solutions) ? data.solutions : [];
  const imported = [];
  for(const raw of raws){
    const solution = sanitizeSolutionData(raw, puzzleId);
    State.solutions.push(solution);
    imported.push(solution);
  }
  persistSolutions();
  return {puzzle, solutions: imported};
}

/* ---------- Sets: export ---------- */
function exportSet(set){
  const puzzles = State.puzzles.filter(p=>p.setId===set.id);
  downloadJSON({
    schema:'lightyard', schemaVersion:EXPORT_SCHEMA_VERSION, kind:'set',

/* ---------- Sets: import ---------- */
// Every set-bearing export kind (and the older, name-less bulk "puzzles"
// export from a previous version) normalizes to the same shape: a list of
// {name, puzzles, solutions} bundles, so one dialog and one apply routine
// handles all of them.
function normalizeIncomingSets(data){
  if(data.kind==='set'){
    return [{ name: data.setName || 'Imported Set', puzzles: data.puzzles||[], solutions: [] }];
  }
  if(data.kind==='sets'){
    return (data.sets||[]).map(s=>({ name: s.name || 'Imported Set', puzzles: s.puzzles||[], solutions: [] }));
  }
  if(data.kind==='setSolutions'){
    return [{ name: data.setName || 'Imported Set', puzzles: data.puzzles||[], solutions: data.solutions||[] }];
  }
  if(data.kind==='allSolutions'){
    return (data.sets||[]).map(s=>{
      const ids = new Set((s.puzzles||[]).map(p=>p.id));
      return { name: s.name || 'Imported Set', puzzles: s.puzzles||[], solutions: (data.solutions||[]).filter(sol=>ids.has(sol.puzzleId)) };
    });
  }
  if(data.kind==='puzzles'){
    return [{ name: 'Imported Puzzles', puzzles: data.puzzles||[], solutions: [] }];
  }
  return [];
}
function uniqueSetName(name){
  const base = name || 'Imported Set';
  if(!State.sets.some(s=>s.name===base)) return base;
  let n=2;
  while(State.sets.some(s=>s.name===base+' ('+n+')')) n++;
  return base+' ('+n+')';
}
// Builds and shows the New / Replace / Merge choice dialog for one or more
// incoming sets, then calls onConfirm with a parallel array of
// {mode:'new'|'replace'|'merge', targetSetId} once the user confirms.
function showImportSetsDialog(incomingSets, onConfirm){
  const backdrop = document.createElement('div');
  backdrop.className = 'dialog-backdrop';
  const dialog = document.createElement('div');
  dialog.className = 'dialog';
  dialog.style.width = 'min(480px, 92vw)';
  dialog.style.maxHeight = '80vh';
  dialog.style.overflowY = 'auto';
  const h = document.createElement('h3');
  h.textContent = incomingSets.length>1 ? 'Import '+incomingSets.length+' sets' : 'Import set';
  dialog.appendChild(h);
  const rowState = incomingSets.map((s,i)=>{
    const match = State.sets.find(x=>x.name===s.name);
    const solTxt = s.solutions.length ? ', '+s.solutions.length+' solution'+(s.solutions.length!==1?'s':'') : '';
    const row = document.createElement('div');
    row.className='card'; row.style.marginBottom='10px'; row.style.padding='10px';
    const p = document.createElement('p');
    p.style.margin='0 0 8px'; p.style.fontSize='13px';
    p.innerHTML = '<strong>'+escapeHtml(s.name)+'</strong> — '+s.puzzles.length+' puzzle'+(s.puzzles.length!==1?'s':'')+solTxt;
    row.appendChild(p);
    const modeSel = document.createElement('select');
    let opts = '<option value="new">Add as a new set'+(match?' (renamed to avoid a name clash)':'')+'</option>';
    if(match) opts += '<option value="replace">Replace existing set "'+escapeAttr(s.name)+'"</option>';
    opts += '<option value="merge">Add its puzzles to an existing set…</option>';
    modeSel.innerHTML = opts;
    if(match) modeSel.value = 'replace';
    row.appendChild(modeSel);
    const mergeSel = document.createElement('select');
    mergeSel.style.marginTop='6px'; mergeSel.style.display='none';
    mergeSel.innerHTML = State.sets.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.name)+'</option>').join('');
    row.appendChild(mergeSel);
    modeSel.addEventListener('change', ()=>{ mergeSel.style.display = modeSel.value==='merge' ? 'block' : 'none'; });
    dialog.appendChild(row);
    return {modeSel, mergeSel};
  });
  const btnRow = document.createElement('div');
  btnRow.className='rowbtns';
  const cancelBtn=document.createElement('button'); cancelBtn.className='btn'; cancelBtn.textContent='Cancel';
  const confirmBtn=document.createElement('button'); confirmBtn.className='btn solid'; confirmBtn.textContent='Import';
  btnRow.appendChild(cancelBtn); btnRow.appendChild(confirmBtn);
  dialog.appendChild(btnRow);
  backdrop.appendChild(dialog);
  document.body.appendChild(backdrop);
  cancelBtn.addEventListener('click', ()=>backdrop.remove());
  confirmBtn.addEventListener('click', ()=>{
    const choices = rowState.map(({modeSel,mergeSel})=>({ mode: modeSel.value, targetSetId: mergeSel.value }));
    backdrop.remove();
    onConfirm(choices);
  });
}
function applyIncomingSets(incomingSets, choices){
  let totalPuzzles=0, totalSolutions=0;
  for(let i=0;i<incomingSets.length;i++){
    const s = incomingSets[i];
    const choice = choices[i];
    let targetSetId;
    if(choice.mode==='replace'){
      const existing = State.sets.find(x=>x.name===s.name);
      targetSetId = existing.id;
      const idsToRemove = new Set(State.puzzles.filter(p=>p.setId===targetSetId).map(p=>p.id));
      State.puzzles = State.puzzles.filter(p=>p.setId!==targetSetId);
      State.solutions = State.solutions.filter(sol=>!idsToRemove.has(sol.puzzleId));
    } else if(choice.mode==='merge'){
      targetSetId = choice.targetSetId;
    } else {
      const newSet = {id:uid(), name: uniqueSetName(s.name), createdAt:Date.now()};
      State.sets.push(newSet);
      targetSetId = newSet.id;
    }
    const idMap = new Map();
    for(const rawP of s.puzzles){
      const puzzle = sanitizePuzzleData(rawP, targetSetId);
      if(rawP && typeof rawP.id==='string') idMap.set(rawP.id, puzzle.id);
      State.puzzles.push(puzzle);
      totalPuzzles++;
    }
    for(const rawSol of s.solutions){
      const newPid = idMap.get(rawSol.puzzleId);
      if(!newPid) continue; // solution's puzzle wasn't part of this bundle
      const solution = sanitizeSolutionData(rawSol, newPid);
      State.solutions.push(solution);
      totalSolutions++;
    }
  }
  persistSets(); persistPuzzles(); persistSolutions();
  alert('Imported '+totalPuzzles+' puzzle'+(totalPuzzles!==1?'s':'')+
    (totalSolutions?' and '+totalSolutions+' solution'+(totalSolutions!==1?'s':''):'')+
    ' across '+incomingSets.length+' set'+(incomingSets.length!==1?'s':'')+'.');
  State.selectedCell=null; State.selectedTool=null;
  State.currentSetId=null; State.currentPuzzleId=null; State.currentSolutionId=null;
  State.screen='setList';
  renderScreen();
}

function sourcePuzzleMatches(raw, local){
  if(!raw || !local) return false;
  if(typeof raw.id==='string' && raw.id===local.id) return true;
  return String(raw.name||'')===String(local.name||'') &&
    Number(raw.rows)===Number(local.rows) && Number(raw.cols)===Number(local.cols);
}
function solutionBundlesFromFile(data){
  if(data.kind==='solution') return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:data.solution?[data.solution]:[]}];
  if(data.kind==='solutions') return [{name:null,puzzles:data.puzzle?[data.puzzle]:[],solutions:Array.isArray(data.solutions)?data.solutions:[]}];
  return normalizeIncomingSets(data).map(s=>({name:s.name||null,puzzles:s.puzzles||[],solutions:s.solutions||[]}));
}
function importScopedSolutions(data,scope){
  const allowed = scope.kind==='puzzleSolutions'
    ? State.puzzles.filter(p=>p.id===scope.puzzleId)
    : scope.kind==='setSolutions'
      ? State.puzzles.filter(p=>p.setId===scope.setId)
      : State.puzzles.slice();
  const allowedIds=new Set(allowed.map(p=>p.id));
  const targetSet=scope.kind==='setSolutions'?State.sets.find(s=>s.id===scope.setId):null;
  let imported=0;
  for(const bundle of solutionBundlesFromFile(data)){
    const rawById=new Map((bundle.puzzles||[]).filter(Boolean).map(p=>[p.id,p]));
    for(const rawSol of bundle.solutions||[]){
      const rawPuzzle=rawById.get(rawSol.puzzleId) || null;
      let target=allowed.find(p=>p.id===rawSol.puzzleId);
      const canFallbackByShape=!targetSet || !bundle.name || bundle.name===targetSet.name;
      if(!target && rawPuzzle && canFallbackByShape) target=allowed.find(p=>sourcePuzzleMatches(rawPuzzle,p));
      if(!target || !allowedIds.has(target.id)) continue;
      State.solutions.push(sanitizeSolutionData(rawSol,target.id));
      imported++;
    }
  }
  persistSolutions();
  alert(imported
    ? `Imported ${imported} solution${imported!==1?'s':''}.`
    : 'No solutions in that file matched the selected puzzle scope.');
  if(!scope.returnToBoard){ State.screen='setList'; State.currentPuzzleId=null; State.currentSolutionId=null; }
  renderScreen();
}
function importPuzzlesIntoSet(data,setId){
  const raws=[];
  if(data.kind==='puzzle' && data.puzzle) raws.push(data.puzzle);
  else for(const bundle of normalizeIncomingSets(data)) raws.push(...(bundle.puzzles||[]));
  for(const raw of raws) State.puzzles.push(sanitizePuzzleData(raw,setId));
  persistPuzzles();
  alert(raws.length
    ? `Imported ${raws.length} puzzle${raws.length!==1?'s':''}.`
    : 'That file did not contain any puzzles.');
  State.expandedSetIds.add(setId); State.screen='setList'; renderScreen();
}
function importPuzzleReplacement(data,puzzleId){
  const target=State.puzzles.find(p=>p.id===puzzleId);
  if(!target) throw new Error('the selected puzzle no longer exists');
  let raw=null;
  if(data.kind==='puzzle') raw=data.puzzle||null;
  else {
    const bundles=normalizeIncomingSets(data);
    raw=bundles.flatMap(b=>b.puzzles||[])[0]||null;
  }
  if(!raw) throw new Error('that file does not contain a puzzle');
  if(!confirm(`Replace the design of "${target.name}" with the imported puzzle?`)) return;
  const fresh=sanitizePuzzleData(raw,target.setId);
  target.name=fresh.name; target.rows=fresh.rows; target.cols=fresh.cols; target.elements=fresh.elements; target.strict=fresh.strict; target.noPrisms=fresh.noPrisms; target.noHalfMirrors=fresh.noHalfMirrors; delete target.mirrorsOnly;
  let solutionsChanged=false;
  for(const solution of State.solutions){if(solution.puzzleId===target.id && enforcePuzzleSolutionRules(target,solution))solutionsChanged=true;}
  persistPuzzles();if(solutionsChanged)persistSolutions();State.selectedCell=null; State.selectedTool=null; closeInspectorSheet(); renderScreen();
}

function handleImportedFile(file,scope){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert('That file is not valid JSON.'); return; }
    if(!data || data.schema!=='lightyard' || !data.kind){
      alert('That file does not look like a Lightyard export.');
      return;
    }
    try{
      if(scope && (scope.kind==='allSolutions' || scope.kind==='setSolutions' || scope.kind==='puzzleSolutions')){
        importScopedSolutions(data,scope);
        return;
      }
      if(scope && scope.kind==='puzzlesIntoSet'){
        importPuzzlesIntoSet(data,scope.setId);
        return;
      }
      if(scope && scope.kind==='replacePuzzle'){
        importPuzzleReplacement(data,scope.puzzleId);
        return;
      }
      if(data.kind==='puzzle'){
        const puzzle = importPuzzlePayload(data);
        alert('Imported puzzle "'+puzzle.name+'".');
        State.currentSetId = puzzle.setId;
        State.selectedCell=null; State.selectedTool=null;
        State.screen='puzzleList';
        renderScreen();
      } else if(data.kind==='solution'){
        const {puzzle, solution} = importSolutionPayload(data);
        alert('Imported puzzle "'+(puzzle?puzzle.name:'(existing)')+'" and solution "'+solution.name+'".');
        setActiveMode('solve');
        State.currentPuzzleId = solution.puzzleId;
        const owner = puzzle || State.puzzles.find(p=>p.id===solution.puzzleId);
        if(owner) State.currentSetId = owner.setId;
        warnIfStrictPacketTotalsMismatch(owner);
        State.currentSolutionId = solution.id;
        State.selectedCell=null; State.selectedTool=null;
        State.screen='solutionEdit';
        renderScreen();
      } else if(data.kind==='solutions'){
        const {puzzle, solutions} = importSolutionsPayload(data);
        alert('Imported puzzle "'+(puzzle?puzzle.name:'(existing)')+'" with '+solutions.length+' solution'+(solutions.length!==1?'s':'')+'.');
        setActiveMode('solve');
        State.currentPuzzleId = solutions.length ? solutions[0].puzzleId : (puzzle ? puzzle.id : null);
        const owner = puzzle || State.puzzles.find(p=>p.id===State.currentPuzzleId);
        if(owner) State.currentSetId = owner.setId;
        warnIfStrictPacketTotalsMismatch(owner);
        State.currentSolutionId = solutions.length ? solutions[0].id : 'BLANK';
        State.selectedCell=null; State.selectedTool=null;
        State.screen='solutionEdit';
        renderScreen();
      } else if(data.kind==='set' || data.kind==='sets' || data.kind==='setSolutions' || data.kind==='allSolutions' || data.kind==='puzzles'){
        const incoming = normalizeIncomingSets(data).filter(s=>s.puzzles.length>0 || s.solutions.length>0);
        if(incoming.length===0){
          alert('That file has no puzzles to import.');
          return;
        }
        if(data.kind==='setSolutions' || data.kind==='allSolutions') setActiveMode('solve');
        showImportSetsDialog(incoming, (choices)=>applyIncomingSets(incoming, choices));
      } else {
        alert('Unrecognized Lightyard export type: "'+data.kind+'".');
      }
    } catch(e){
      alert('Could not import that file: '+e.message);
    }
  };
  reader.onerror = ()=> alert('Could not read that file.');
  reader.readAsText(file);
}

function setActiveMode(mode){
  State.mode = mode;
  document.querySelectorAll('nav.modes button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
}

const importFileInput = document.getElementById('importFileInput');
importFileInput.addEventListener('change', ()=>{
  const file = importFileInput.files && importFileInput.files[0];
  const scope=State.importScope;
  State.importScope=null;
  if(file) handleImportedFile(file,scope);
  importFileInput.value = '';
});
function triggerImport(scope){ State.importScope=scope||null; importFileInput.click(); }

/* ============================== STATE ============================== */
const State = {
  mode:'solve', // 'solve' | 'create'
  sets: [],
  puzzles: [],
  solutions: [],
  currentSetId: null,
  currentPuzzleId: null,
  currentSolutionId: null,
  screen:'setList', // setList | puzzleList | puzzleEdit | solutionEdit
  selectedTool:null,   // element type currently armed for placement
  selectedCell:null,   // {r,c} currently inspected
  cloneSource:null,    // copied element configuration while the Clone tool is active
  cloneSourceCell:null,// {r,c} source highlighted on the board
  previewArmedCell:null,// first-tapped piece; tapping it again opens configuration
  previewConfigUntil:0,// second tap opens configuration only through 500 ms after preview
  piecePreview:null,   // transient visual state while previewing a piece's routine
  running:false,
  runStarted:false,    // true from the moment play/step is first pressed until an explicit restart — separate from tick/running so a pause before the first tick still counts as "started"
  speed:39,
  tick:0,
  packets:[],
  grid:null,           // working grid (2D array of element-or-null) for current screen
  gridRows:7, gridCols:7,
  lastFrameTime:null,
  frac:0,              // 0..1, how far through the current tick's animation we are
  finished:false,
  solved:false,
  failureScene:null,    // animated, precomputed portion of a tick that ends in failure
  violation:null,      // {message, cells:[{r,c}]} for the run's actual final frame, set only when it fails — see doTick
  editingElements:null, // reference to the array (puzzle.elements or solution.elements) currently being edited
  expandedSetIds:new Set(),
  expandedPuzzleIds:new Set(),
  importScope:null,
  sheetOpen:false
