function currentPuzzleSequence(){
  const puzzle=getCurrentPuzzle();
  if(!puzzle)return {puzzles:[],index:-1};
  // Flatten sets in display order, preserving each set's puzzle order.
  // Empty sets contribute nothing, so navigation naturally skips them.
  const puzzles=allSets().flatMap(set=>puzzlesForSet(set));
  return {puzzles,index:puzzles.findIndex(item=>item.id===puzzle.id)};
}
function renderHeaderNavigation(){
  const detail=State.screen==='puzzleEdit'||State.screen==='solutionEdit';
  appHeader.classList.toggle('detail-open',detail);
  document.querySelectorAll('nav.modes button').forEach(button=>button.classList.toggle('active',button.dataset.mode===State.mode));
  if(!detail)return;
  const {puzzles,index}=currentPuzzleSequence();
  previousPuzzleBtn.disabled=index<=0;
  nextPuzzleBtn.disabled=index<0||index>=puzzles.length-1;
}
function navigateAdjacentPuzzle(offset){
  const {puzzles,index}=currentPuzzleSequence();
  const target=puzzles[index+offset];
  if(!target)return;
  openPuzzleBoard(target,State.screen==='solutionEdit'?'BLANK':null);
}

function isNarrowLayout(){
  return !!(window.matchMedia && window.matchMedia('(max-width:800px)').matches);

function closeActionMenus(){document.querySelectorAll('.action-menu-popup').forEach(menu=>menu.remove());}
function actionMenu(label,items,kebab){
  const button=document.createElement('button');button.type='button';button.className='btn small action-menu-button'+(kebab?' kebab-menu-button':'');
  button.textContent=kebab?'⋮':label+' ▾';button.title=label;button.setAttribute('aria-label',label);
  button.setAttribute('aria-haspopup','true');button.setAttribute('aria-expanded','false');
  const menu=document.createElement('div');menu.className='action-menu-popup';
  for(const item of items){
    const option=document.createElement('button');option.type='button';option.textContent=item.label;
    if(item.danger)option.classList.add('danger');
    option.addEventListener('click',()=>{closeActionMenus();button.setAttribute('aria-expanded','false');item.action();});
    menu.appendChild(option);
  }
  button.addEventListener('click',event=>{
    event.stopPropagation();const opening=!menu.isConnected;closeActionMenus();
    if(!opening){button.setAttribute('aria-expanded','false');return;}
    document.body.appendChild(menu);menu.classList.add('open');button.setAttribute('aria-expanded','true');
    const rect=button.getBoundingClientRect();
    menu.style.left=Math.max(8,Math.min(window.innerWidth-menu.offsetWidth-8,rect.left))+'px';
    const below=rect.bottom+5,above=rect.top-menu.offsetHeight-5;
    menu.style.top=(below+menu.offsetHeight<=window.innerHeight-8?below:Math.max(8,above))+'px';
  });
  return button;
}
document.addEventListener('pointerdown',event=>{
  if(event.target.closest&&(event.target.closest('.action-menu-button')||event.target.closest('.action-menu-popup')))return;
  closeActionMenus();
});
function solutionMenuItems(copyData,pasteScope,onExport,onImport,newSolution){

    {label:'Import Solutions',action:onImport}

}
function puzzleMeta(p,withSolutions){
  const emitters=(p.elements||[]).filter(e=>e.type==='emitter').length;
  const receivers=(p.elements||[]).filter(e=>e.type==='receiver').length;
  let text=`${(p.elements||[]).length} element${(p.elements||[]).length!==1?'s':''} · ${emitters} emitter${emitters!==1?'s':''} · ${receivers} receiver${receivers!==1?'s':''}`;
  if(p.noPrisms) text+=' · No Prisms';
  if(p.noHalfMirrors) text+=' · No Half-Mirrors';
  if(withSolutions){
    const n=solutionsForPuzzle(p.id).length;
    text+=` · ${n} solution${n!==1?'s':''}`;
  }
  return text;
}
function puzzlePacketTotals(p){
  let emitted=0,expected=0;
  for(const el of (p&&p.elements)||[]){
    if(el.type==='emitter') emitted+=Array.isArray(el.colors)?el.colors.length:0;
    else if(el.type==='receiver') expected+=Array.isArray(el.colors)?el.colors.length:0;
  }
  return {emitted,expected};
}
function warnIfStrictPacketTotalsMismatch(p){
  if(!p || !p.strict)return false;
  const {emitted,expected}=puzzlePacketTotals(p);
  if(emitted===expected)return false;
  alert(`This puzzle is unsolvable in Strict mode: its emitters produce ${emitted} packet${emitted!==1?'s':''}, but its receivers expect ${expected}. The totals must be equal.`);
  return true;
}
function solvedPuzzle(p){ return solutionsForPuzzle(p.id).some(s=>s.status==='solved'); }
function puzzleGoalAchievement(p){
  const goal=embeddedPuzzleGoal(p);
  if(!goal)return null;
  const solved=solutionsForPuzzle(p).filter(s=>s.status==='solved');
  if(!solved.length)return {goal,elements:null,ticks:null};
  const bestElements=Math.min(...solved.map(s=>(s.elements||[]).length));
  const tickValues=solved.filter(s=>s.ticksToSolve!=null&&Number.isFinite(Number(s.ticksToSolve))).map(s=>Number(s.ticksToSolve));
  const bestTicks=tickValues.length?Math.min(...tickValues):Infinity;
  return {
    goal,
    elements:bestElements<goal.elements?'better':bestElements===goal.elements?'equal':null,
    ticks:bestTicks<goal.ticks?'better':bestTicks===goal.ticks?'equal':null
  };
}
function goalStarClasses(p){
  const classes=[];
  if(solvedPuzzle(p))classes.push('solved');
  const achievement=puzzleGoalAchievement(p);
  if(achievement&&achievement.elements)classes.push('goal-elements','goal-elements-'+achievement.elements);
  if(achievement&&achievement.ticks)classes.push('goal-ticks','goal-ticks-'+achievement.ticks);
  return classes.join(' ');
}
function puzzleGoalLabel(p){
  const goal=embeddedPuzzleGoal(p);
  return goal?`Goal: ${goal.elements} elements, ${goal.ticks} ticks`:'';
}
function starRow(puzzles){
  return puzzles.map(p=>`<span class="${goalStarClasses(p)}">${solvedPuzzle(p)?'★':'☆'}</span>`).join('');
}
function openPuzzleBoard(p,solutionId){
  if(solutionId!=null)warnIfStrictPacketTotalsMismatch(p);
  cancelPiecePreview(true);
  State.currentSetId=p.setId; State.currentPuzzleId=p.id; State.currentSolutionId=solutionId||null;
  State.selectedCell=null; State.selectedTool=solutionId!=null?'mirrorDiag':null; State.sheetOpen=false;
  State.screen=solutionId!=null?'solutionEdit':'puzzleEdit';
  renderScreen();
  if(solutionId==='BLANK')schedulePuzzleIntro(p);
}
function newPuzzleInSet(set){
  const p={id:uid(),setId:set.id,name:'Untitled Puzzle',rows:7,cols:7,createdAt:Date.now(),elements:[],strict:false,noPrisms:false,noHalfMirrors:false};
  State.puzzles.push(p); persistPuzzles(); State.expandedSetIds.add(set.id); openPuzzleBoard(p,null);
}
function localSetForBuiltIn(set){
  let local=State.sets.find(s=>s.name===set.name);
  if(!local){local={id:uid(),name:set.name,createdAt:Date.now()};State.sets.push(local);persistSets();}
  return local;
}
function cloneBuiltInPuzzleToLocal(p,set,openAfter=true){
  const localSet=localSetForBuiltIn(set||findSetByRuntimeId(p.setId));
  const copy=sanitizePuzzleData(portablePuzzle(p,localSet.id),localSet.id);
  copy.name=(p.name+' (copy)').slice(0,80);State.puzzles.push(copy);persistPuzzles();State.expandedSetIds.add(localSet.id);
  if(openAfter)openPuzzleBoard(copy,null);else renderScreen();

}
function cloneBuiltInSetToLocal(set){
  const local={id:uid(),name:uniqueSetName(set.name),createdAt:Date.now()};State.sets.push(local);
  for(const p of puzzlesForSet(set))State.puzzles.push(sanitizePuzzleData(portablePuzzle(p,local.id),local.id));
  persistSets();persistPuzzles();State.expandedSetIds.add(local.id);renderScreen();
}
let listDrag=null;
function clearListDropMarks(){
  document.querySelectorAll('.list-drop-before,.list-drop-after,.list-drop-inside').forEach(el=>el.classList.remove('list-drop-before','list-drop-after','list-drop-inside'));
}
function makeListDragHandle(kind,id,label){
  const handle=document.createElement('button');handle.type='button';handle.className='list-drag-handle';handle.textContent='⠿';
  handle.title=kind==='set'?'Drag to reorder set':'Drag to reorder or move puzzle';handle.setAttribute('aria-label',handle.title);
  handle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();});
  handle.addEventListener('pointerdown',e=>{
    if(e.button!=null&&e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    const source=handle.closest(kind==='set'?'.tree-set':'.tree-puzzle');
    listDrag={kind,id,label,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,source,started:false,target:null,ghost:null};
    if(handle.setPointerCapture)handle.setPointerCapture(e.pointerId);
  });
  return handle;
}
function updateListDragTarget(e){
  if(!listDrag||e.pointerId!==listDrag.pointerId)return;
  listDrag.x=e.clientX;listDrag.y=e.clientY;
  if(!listDrag.started&&Math.hypot(e.clientX-listDrag.startX,e.clientY-listDrag.startY)<6)return;
  e.preventDefault();
  if(!listDrag.started){
    listDrag.started=true;listDrag.source.classList.add('list-dragging');
    const ghost=document.createElement('div');ghost.className='list-drag-ghost';ghost.textContent=listDrag.label;document.body.appendChild(ghost);listDrag.ghost=ghost;
  }
  listDrag.ghost.style.left=Math.min(window.innerWidth-listDrag.ghost.offsetWidth-8,e.clientX+12)+'px';
  listDrag.ghost.style.top=Math.min(window.innerHeight-listDrag.ghost.offsetHeight-8,e.clientY+12)+'px';
  clearListDropMarks();listDrag.target=null;
  const under=document.elementFromPoint(e.clientX,e.clientY);if(!under)return;
  if(listDrag.kind==='set'){
    const setBox=under.closest&&under.closest('.tree-set');if(!setBox)return;
    if(setBox.dataset.builtIn==='true')return;
    const after=e.clientY>setBox.getBoundingClientRect().top+setBox.getBoundingClientRect().height/2;
    setBox.classList.add(after?'list-drop-after':'list-drop-before');
    listDrag.target={setId:setBox.dataset.setId,after};
    return;
  }
  const puzzleBox=under.closest&&under.closest('.tree-puzzle');
  if(puzzleBox){
    if(puzzleBox.dataset.builtIn==='true')return;
    const rect=puzzleBox.getBoundingClientRect(),after=e.clientY>rect.top+rect.height/2;
    puzzleBox.classList.add(after?'list-drop-after':'list-drop-before');
    listDrag.target={setId:puzzleBox.dataset.setId,puzzleId:puzzleBox.dataset.puzzleId,after};
    return;
  }
  const setBox=under.closest&&under.closest('.tree-set');
  if(setBox&&setBox.dataset.builtIn!=='true'){setBox.classList.add('list-drop-inside');listDrag.target={setId:setBox.dataset.setId,puzzleId:null,after:true};}
}
function reorderSet(sourceId,targetId,after){
  if(!targetId||sourceId===targetId)return;
  const sourceIndex=State.sets.findIndex(s=>s.id===sourceId);if(sourceIndex<0)return;
  const [source]=State.sets.splice(sourceIndex,1);const targetIndex=State.sets.findIndex(s=>s.id===targetId);
  if(targetIndex<0){State.sets.splice(sourceIndex,0,source);return;}
  State.sets.splice(targetIndex+(after?1:0),0,source);persistSets();
}
function movePuzzle(sourceId,target){
  const source=State.puzzles.find(p=>p.id===sourceId);if(!source||!target||!target.setId)return;
  if(target.puzzleId===sourceId)return;
  const bySet=new Map(State.sets.map(set=>[set.id,State.puzzles.filter(p=>p.setId===set.id&&p.id!==sourceId)]));
  const destination=bySet.get(target.setId);if(!destination)return;
  let index=destination.length;
  if(target.puzzleId){const found=destination.findIndex(p=>p.id===target.puzzleId);if(found>=0)index=found+(target.after?1:0);}
  source.setId=target.setId;destination.splice(index,0,source);State.expandedSetIds.add(target.setId);
  const known=new Set(State.sets.map(s=>s.id));
  State.puzzles=State.sets.flatMap(set=>bySet.get(set.id)||[]).concat(State.puzzles.filter(p=>!known.has(p.setId)&&p.id!==sourceId));
  persistPuzzles();
}
function finishListDrag(e){
  if(!listDrag||e.pointerId!==listDrag.pointerId)return;
  const drag=listDrag;listDrag=null;clearListDropMarks();
  if(drag.source)drag.source.classList.remove('list-dragging');if(drag.ghost)drag.ghost.remove();
  if(!drag.started||!drag.target)return;
  if(drag.kind==='set')reorderSet(drag.id,drag.target.setId,drag.target.after);
  else movePuzzle(drag.id,drag.target);
  renderScreen();
}

function makeMobileToolStrip(primaryOptions,moreOptions,extraClass){

function bindBoardToolSelect(select,actionValues){
  let committing=false;
  const commit=()=>{
    if(committing)return;
    const value=select.value;
    committing=true;
    chooseBoardTool(value);
    if(actionValues.includes(value))select.value='';
    setTimeout(()=>{committing=false;},0);
  };
  // Safari versions differ on whether a native select commits through input
  // or change. Handling both makes the tool active before the next board tap.
  select.addEventListener('input',commit);
  select.addEventListener('change',commit);
}

function makePuzzleIntroElement(token){
  if(!PUZZLE_INTRO_ELEMENTS[token])return null;

}
function makePuzzleIntroToken(token){
  return PUZZLE_INTRO_COLORS[token]!=null?makePuzzleIntroSymbol(token):makePuzzleIntroElement(token);
}
function appendPuzzleIntroLine(container,source){
  const token=/\[\[(R|G|B|Y|M|C|W|K|EMITTER|RECEIVER|CRYSTAL|TRANSFORMER|MIRROR|HALF_MIRROR|PRISM)\]\]/g;
  let at=0,match;
  while((match=token.exec(source))){
    if(match.index>at)container.appendChild(document.createTextNode(source.slice(at,match.index)));
    container.appendChild(makePuzzleIntroToken(match[1]));at=token.lastIndex;
  }
  if(at<source.length)container.appendChild(document.createTextNode(source.slice(at)));

function renderPuzzleIntroText(container,text){
  container.replaceChildren();
  const source=String(text||'');
  if(!source)return;
  for(const line of source.split('\n')){
    const paragraph=document.createElement('div');paragraph.className='puzzle-intro-paragraph';
    if(line)appendPuzzleIntroLine(paragraph,line);else paragraph.appendChild(document.createElement('br'));
    container.appendChild(paragraph);
  }
}
function serializePuzzleIntroEditor(editor){
  function read(node){
    if(node.nodeType===Node.TEXT_NODE)return node.nodeValue||'';
    if(node.nodeType!==Node.ELEMENT_NODE)return '';
    if(node.classList.contains('puzzle-intro-token')&&node.dataset.token)return `[[${node.dataset.token}]]`;
    if(node.tagName==='BR')return '\n';
    let value='';for(const child of node.childNodes)value+=read(child);return value;
  }
  let value='',hasContent=false;
  for(const child of editor.childNodes){
    const block=child.nodeType===Node.ELEMENT_NODE&&(child.tagName==='DIV'||child.tagName==='P');
    if(block&&hasContent)value+='\n';
    let part=read(child);
    if(block&&part==='\n')part='';
    value+=part;hasContent=true;
  }
  return value.replace(/\u00a0/g,' ').replace(/\r/g,'');
}
function insertPuzzleIntroNode(editor,node){
  editor.focus();
  const selection=window.getSelection();let range=null;
  if(selection&&selection.rangeCount){
    const candidate=selection.getRangeAt(0);
    if(editor.contains(candidate.commonAncestorContainer))range=candidate;
  }
  if(!range){range=document.createRange();range.selectNodeContents(editor);range.collapse(false);}
  range.deleteContents();range.insertNode(node);range.setStartAfter(node);range.collapse(true);
  if(selection){selection.removeAllRanges();selection.addRange(range);}
}

function updateToolButtonsEnabled(){
  if(State.screen!=='solutionEdit') return;

  document.querySelectorAll('.btn.tool').forEach(b=>{ b.disabled = !enabled; });
  document.querySelectorAll('.mobile-tool-button').forEach(b=>{
    b.disabled=!enabled;

    if(['mirrorDiag','mirrorHalf','prism','eraser'].includes(o.value)) o.disabled=!enabled;

const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const playBtn = document.getElementById('playBtn');
const stepBtn = document.getElementById('stepBtn');
const resetRunBtn = document.getElementById('resetRunBtn');
const elementCountEl = document.getElementById('elementCount');
const tickCountEl = document.getElementById('tickCount');

speedSlider.addEventListener('input', ()=>{
  // State.frac is already a normalized 0..1 "how far through the current
  // tick" value, independent of how long a tick currently takes — so
  // changing speed needs no rescaling at all; it just changes how fast
  // frac advances from here on.
  State.speed=parseInt(speedSlider.value); speedVal.textContent=State.speed;
});
playBtn.addEventListener('click', ()=>{
  if(State.finished)renderScreen();
  ensureGameAudio();
  cancelPiecePreview(true);
  State.runStarted = true;
  closeInspectorSheet();
  State.running = !State.running;
  playBtn.textContent = State.running ? '⏸' : '▶';
  updateToolButtonsEnabled();
  // Resuming must not disturb where a packet is mid-tick — only reset the
  // frame-timing reference (so the paused duration itself isn't counted as
  // elapsed time), never State.frac, which is what remembers how far
  // through the current tick everything already was.
  if(State.running){ State.lastFrameTime=null; requestAnimationFrame(loop); }
});
stepBtn.addEventListener('click', ()=>{
  if(State.finished) return;
  ensureGameAudio();
  cancelPiecePreview(true);
  State.runStarted = true;
  closeInspectorSheet();
  doTick();
  if(State.failureScene) finishFailureScene();
  else {
    State.frac=1; // a manual step displays—and has consumed—the full interval
    if(State.finishAfterAnimation){State.finishAfterAnimation=false;finishRun();}
  }
  playScheduledSoundsUpTo(1,true);
  updateRunUI(); render();
});
resetRunBtn.addEventListener('click', ()=>{
  cancelPiecePreview(true);
  // Restart playback from the very beginning — a full screen refresh is
  // the simplest way to get everything back in sync: tick/running/finished
  // reset, the tool palette re-enabled, and the right panel switched back
  // from the receivers view to the inspector.
  renderScreen();
});

// Speed slider (0-100) maps to ticks/sec through a single smooth curve —
// very fine control at the slow end, opening up to a fast top end, with no
// discrete jump anywhere along it: rate(u) = a*(e^(b*u^k) - 1), u = v/100.
// Tuned so u=1/3 (v≈33) ≈ 1 tick/s, u=2/3 (v≈67) ≈ 5 ticks/s, u=1 (v=100) ≈ 46 ticks/s.
function speedToTicksPerSecond(v){
  const u = v/100;
  return 0.94 * (Math.exp(3.92 * Math.pow(u, 1.62)) - 1);
}

function loop(t){
  if(!State.running) return;
  if(State.lastFrameTime==null) State.lastFrameTime=t;
  const dt = t-State.lastFrameTime; State.lastFrameTime=t;
  const rate = speedToTicksPerSecond(State.speed);

  if(State.failureScene){
    if(rate>0){
      const interval=(1000/rate)*State.failureScene.duration;
      State.frac += dt/interval;
      if(State.frac>=1) finishFailureScene();
    }
    State.frac=clamp(State.frac,0,1);
    updateRunUI();
    render(State.frac);
    if(State.running && !State.finished) requestAnimationFrame(loop);
    else { State.running=false; playBtn.textContent='▶'; render(1); }
    return;
  }

  if(rate>0){
    const interval = 1000/rate;
    State.frac += dt/interval;
    let safety=0;
    while(State.frac>=1 && State.running && safety<50){
      playScheduledSoundsUpTo(1);
      if(State.finishAfterAnimation){
        State.finishAfterAnimation=false;State.frac=1;finishRun();
      }else{
        doTick(); State.frac-=1;
        playScheduledSoundsUpTo(Math.max(0,Math.min(1,State.frac)));
      }
      safety++;
      if(State.finished || State.failureScene) break;
    }
    State.frac = clamp(State.frac, 0, 1);
    playScheduledSoundsUpTo(State.frac);
  }
  // rate===0: State.frac is left exactly as it was — frozen, not snapped.
  updateRunUI();
  render(State.frac);
  if(State.running && !State.finished) requestAnimationFrame(loop);
  else { State.running=false; playBtn.textContent='▶'; render(1); }
}

function updateRunUI(){
  if(elementCountEl){
    const solution=State.screen==='solutionEdit'?getCurrentSolution():null;
    elementCountEl.textContent=solution?(solution.elements||[]).length:0;
  }
  if(tickCountEl) tickCountEl.textContent = State.tick;
  updateToolButtonsEnabled();
}

function onRunFinished(overflow, leftoverPackets, strictFail, hardFail){
  playBtn.textContent='▶';
  statusBar.className='statusbar';
  if(State.solved){
    const s=getCurrentSolution().id==='BLANK'?promoteBlankIfNeeded():getCurrentSolution();
    s.status='solved';
    s.puzzleId=canonicalPuzzleId(getCurrentPuzzle());
    s.puzzleHash=puzzleConfigurationHash(getCurrentPuzzle());
    s.ticksToSolve=State.tick;
    persistSolutions();
    showSolvedCelebration();
  }
}

function showSolvedCelebration(){
  dismissCelebration();
  playVictoryFanfare();
  statusBar.className='statusbar';
  const boardRect=canvas.getBoundingClientRect();
  const usableRect=boardRect.width&&boardRect.height?boardRect:boardStage.getBoundingClientRect();
  const centerX=usableRect.left+usableRect.width/2;
  const centerY=usableRect.top+Math.min(usableRect.height*.42,260);
  const layer=document.createElement('div');
  layer.className='celebration-layer';
  layer.setAttribute('aria-live','polite');
  const colors=['#ff4d4d','#ffd94d','#32e428','#28f0ff','#4d4dfe','#e45cff','#f5f6fa'];
  const count=84;
  for(let i=0;i<count;i++){
    const piece=document.createElement('i');piece.className='confetti-piece';
    const angle=Math.random()*Math.PI*2;
    const spread=90+Math.random()*Math.max(130,Math.min(usableRect.width,usableRect.height)*.55);
    const endX=Math.cos(angle)*spread;
    const midX=endX*.38;
    const rise=-(80+Math.random()*Math.min(210,usableRect.height*.42));
    const startX=centerX+(Math.random()-.5)*36;
    const startY=centerY+(Math.random()-.5)*24;
    piece.style.setProperty('--start-x',startX+'px');
    piece.style.setProperty('--start-y',startY+'px');
    piece.style.setProperty('--mid-x',midX+'px');
    piece.style.setProperty('--end-x',endX+'px');
    piece.style.setProperty('--rise',rise+'px');
    piece.style.setProperty('--r0',Math.floor(Math.random()*180)+'deg');
    piece.style.setProperty('--r1',(360+Math.floor(Math.random()*540))+'deg');
    piece.style.setProperty('--r2',(900+Math.floor(Math.random()*900))+'deg');
    piece.style.setProperty('--duration',(2.6+Math.random()*1.7)+'s');
    piece.style.setProperty('--delay',(Math.random()*.22)+'s');
    piece.style.setProperty('--w',(6+Math.random()*7)+'px');
    piece.style.setProperty('--h',(9+Math.random()*11)+'px');
    piece.style.setProperty('--color',colors[i%colors.length]);
    layer.appendChild(piece);
  }
  const dialog=document.createElement('div');dialog.className='victory-dialog';dialog.setAttribute('role','dialog');
  dialog.setAttribute('aria-label','Puzzle solved');
  dialog.style.setProperty('--dialog-x',clamp(centerX,190,window.innerWidth-190)+'px');
  dialog.style.setProperty('--dialog-y',clamp(centerY,120,window.innerHeight-120)+'px');
  const message=document.createElement('div');message.className='victory-message';
  if(State.playerName){
    message.appendChild(document.createTextNode('Way to go,'));
    const name=document.createElement('span');name.className='victory-name';name.textContent=State.playerName+'!';message.appendChild(name);
  }else message.textContent='Way to go!';
  const solution=getCurrentSolution();
  const elementCount=(solution.elements||[]).length;
  const tickCount=Number.isFinite(Number(solution.ticksToSolve))?Math.floor(Number(solution.ticksToSolve)):State.tick;
  const goal=embeddedPuzzleGoal(getCurrentPuzzle());
  const elementResult=goal?(elementCount<goal.elements?'better':elementCount===goal.elements?'equal':null):null;
  const tickResult=goal?(tickCount<goal.ticks?'better':tickCount===goal.ticks?'equal':null):null;
  const stats=document.createElement('div');stats.className='victory-stats';
  const elements=document.createElement('div');elements.className='victory-stat elements'+(elementResult?' '+elementResult:'');elements.textContent=`${elementCount} element${elementCount!==1?'s':''}`;
  const ticks=document.createElement('div');ticks.className='victory-stat ticks'+(tickResult?' '+tickResult:'');ticks.textContent=`${tickCount} tick${tickCount!==1?'s':''}`;
  stats.appendChild(elements);stats.appendChild(ticks);
  const callouts=document.createElement('div');callouts.className='victory-callouts';
  if(elementResult){
    const line=document.createElement('div');line.className='victory-callout elements '+elementResult;
    line.textContent=elementResult==='better'
      ? `Fantastic—you beat the element goal by ${goal.elements-elementCount}!`
      : `Great—you matched the ${goal.elements}-element goal!`;
    callouts.appendChild(line);
  }
  if(tickResult){
    const line=document.createElement('div');line.className='victory-callout ticks '+tickResult;
    line.textContent=tickResult==='better'
      ? `Fantastic—you beat the tick goal by ${goal.ticks-tickCount}!`
      : `Great—you matched the ${goal.ticks}-tick goal!`;
    callouts.appendChild(line);
  }
  const {puzzles,index}=currentPuzzleSequence();
  const nextPuzzle=index>=0?puzzles[index+1]:null;
  const close=document.createElement('button');close.type='button';close.className='btn solid';close.textContent=nextPuzzle?'Next Puzzle':'Continue';
  if(nextPuzzle)close.addEventListener('click',event=>{
    event.stopPropagation();
    const recent=mostRecentSolutionForPuzzle(nextPuzzle);
    dismissCelebration();
    openPuzzleBoard(nextPuzzle,recent?recent.id:'BLANK');
  });
  layer.addEventListener('click',dismissCelebration);
  dialog.appendChild(message);dialog.appendChild(stats);if(callouts.children.length)dialog.appendChild(callouts);dialog.appendChild(close);layer.appendChild(dialog);document.body.appendChild(layer);
  setTimeout(()=>close.focus(),0);
  setTimeout(()=>layer.querySelectorAll('.confetti-piece').forEach(piece=>piece.remove()),4700);
}

  aboutCanvas.height=Math.max(1,Math.round(rect.height*dpr));
  aboutCanvas.style.width=rect.width+'px';aboutCanvas.style.height=rect.height+'px';
  aboutCtx.setTransform(dpr,0,0,dpr,0,0);
  aboutCanvas._cssWidth=rect.width;aboutCanvas._cssHeight=rect.height;
  randomizeAboutMirrors();
  aboutPacket=null;aboutNextPacketAt=performance.now()+250;
}
function randomizeAboutMirrors(){
  const w=aboutCanvas._cssWidth||window.innerWidth,h=aboutCanvas._cssHeight||window.innerHeight;
  // Choose random cells on an invisible square grid, with every chosen cell
  // wholly above or below the central card. Taking three from each region
  // avoids the old four-corners-of-a-rectangle arrangement.
  const card=aboutContent.getBoundingClientRect();
  const step=aboutGridStep=clamp(Math.min(w/7.2,h/10.5),48,84);
  const cols=Math.max(5,Math.floor(w/step));
  const rows=Math.max(6,Math.floor(h/step));
  const originX=(w-(cols-1)*step)/2,originY=(h-(rows-1)*step)/2;
  const top=[],bottom=[],clearance=step*.43;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const cell={x:originX+col*step,y:originY+row*step};
    if(cell.y+clearance<card.top)top.push(cell);
    else if(cell.y-clearance>card.bottom)bottom.push(cell);
  }
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  shuffle(top);shuffle(bottom);
  const picked=[...top.slice(0,Math.min(3,top.length)),...bottom.slice(0,Math.min(3,bottom.length))];
  // Very short landscape screens may not fit three cells in both regions;
  // fill any remaining slots from every still-safe grid cell.
  if(picked.length<5){
    const used=new Set(picked.map(p=>p.x+','+p.y));
    for(const cell of shuffle([...top,...bottom]))if(!used.has(cell.x+','+cell.y)){picked.push(cell);used.add(cell.x+','+cell.y);if(picked.length>=5)break;}
  }
  aboutMirrorSet=picked.map((p,i)=>({...p,id:i,orientation:Math.random()<.5?'NE_SW':'NW_SE'}));
}
function aboutMirrors(){return aboutMirrorSet;}
function drawAboutMirror(m){
  const length=aboutGridStep*.68;
  const d=length/2;
  aboutCtx.save();aboutCtx.lineCap='round';aboutCtx.lineWidth=4;
  aboutCtx.strokeStyle='#eaf7ff';aboutCtx.shadowColor='#6ee7ff';aboutCtx.shadowBlur=13;
  aboutCtx.beginPath();
  if(m.orientation==='NE_SW'){aboutCtx.moveTo(m.x-d,m.y+d);aboutCtx.lineTo(m.x+d,m.y-d);}
  else{aboutCtx.moveTo(m.x-d,m.y-d);aboutCtx.lineTo(m.x+d,m.y+d);}
  aboutCtx.stroke();aboutCtx.restore();
}
function startAboutPacket(now){
  const mirrors=aboutMirrors();
  if(!mirrors.length){aboutNextPacketAt=now+1000;return;}
  const mirror=mirrors[Math.floor(Math.random()*mirrors.length)];
  const dir=DIRS[Math.floor(Math.random()*DIRS.length)];
  const route=buildAboutRoute(mirror,dir);
  const colors=[COL.R,COL.G,COL.B,COL.Y,COL.M,COL.C,COL.W];
  const firstDir=aboutSegmentDir(route[0],route[1]);
  aboutPacket={x:route[0].x,y:route[0].y,dir:firstDir,route,segment:0,color:colors[Math.floor(Math.random()*colors.length)],speed:190+Math.random()*80,finished:false};
  aboutLastTime=now;
}
function aboutSegmentDir(a,b){
  if(Math.abs(b.x-a.x)>Math.abs(b.y-a.y))return b.x>a.x?'E':'W';
  return b.y>a.y?'S':'N';
}
function nextAboutMirror(x,y,dir){
  let hit=null,nearest=Infinity;
  for(const m of aboutMirrors()){
    const sameLane=(dir==='E'||dir==='W')?Math.abs(m.y-y)<.75:Math.abs(m.x-x)<.75;
    if(!sameLane)continue;
    const ahead=dir==='E'?m.x-x:dir==='W'?x-m.x:dir==='S'?m.y-y:y-m.y;
    if(ahead>.5&&ahead<nearest){nearest=ahead;hit=m;}
  }
  return hit;
}
function buildAboutRoute(target,initialDir){
  const w=aboutCanvas._cssWidth,h=aboutCanvas._cssHeight;
  let x=target.x,y=target.y,dir=initialDir;
  if(dir==='E')x=-30;else if(dir==='W')x=w+30;else if(dir==='S')y=-30;else y=h+30;
  const route=[{x,y}];
  // Plain mirror reflection is reversible. A ray that begins outside cannot
  // feed into a closed loop: every state in such a loop already has its one
  // unique predecessor. So simply follow each collision until the ray exits.
  while(true){
    const hit=nextAboutMirror(x,y,dir);
    if(!hit){
      if(dir==='E')x=w+110;else if(dir==='W')x=-110;else if(dir==='S')y=h+110;else y=-110;
      route.push({x,y});return route;
    }
    x=hit.x;y=hit.y;route.push({x,y});
    const map=hit.orientation==='NE_SW'?NE_SW_MAP:NW_SE_MAP;dir=map[dir];
  }
}
function moveAboutPacket(distance){
  const p=aboutPacket;if(!p)return;
  while(distance>0&&!p.finished){
    const end=p.route[p.segment+1];
    const dx=end.x-p.x,dy=end.y-p.y,remaining=Math.hypot(dx,dy);
    if(distance<remaining){p.x+=dx/remaining*distance;p.y+=dy/remaining*distance;distance=0;}
    else{
      p.x=end.x;p.y=end.y;distance-=remaining;p.segment++;
      if(p.segment>=p.route.length-1)p.finished=true;
      else p.dir=aboutSegmentDir(p.route[p.segment],p.route[p.segment+1]);
    }
  }
}
function drawAboutPacket(){
  const p=aboutPacket;if(!p)return;
  const v=VEC[p.dir],trail=58;
  const grad=aboutCtx.createLinearGradient(p.x-v.dc*trail,p.y-v.dr*trail,p.x,p.y);
  grad.addColorStop(0,COLHEX[p.color]+'00');grad.addColorStop(1,COLHEX[p.color]+'cc');
  aboutCtx.save();aboutCtx.strokeStyle=grad;aboutCtx.lineWidth=5;aboutCtx.lineCap='round';
  aboutCtx.beginPath();aboutCtx.moveTo(p.x-v.dc*trail,p.y-v.dr*trail);aboutCtx.lineTo(p.x,p.y);aboutCtx.stroke();
  aboutCtx.shadowColor=COLHEX[p.color];aboutCtx.shadowBlur=22;aboutCtx.fillStyle=COLHEX[p.color];
  aboutCtx.beginPath();aboutCtx.arc(p.x,p.y,11,0,Math.PI*2);aboutCtx.fill();aboutCtx.shadowBlur=0;
  if(State.colorblind){
    aboutCtx.fillStyle=colorCodeInk(p.color);aboutCtx.font='900 13px Arial,system-ui,sans-serif';
    aboutCtx.textAlign='center';aboutCtx.textBaseline='middle';aboutCtx.fillText(COLLETTER[p.color],Math.round(p.x),Math.round(p.y));
  }
  aboutCtx.restore();
}
function animateAbout(now){
  if(!aboutBackdrop.classList.contains('show')){aboutFrame=null;return;}
  const w=aboutCanvas._cssWidth,h=aboutCanvas._cssHeight;
  aboutCtx.clearRect(0,0,w,h);aboutMirrors().forEach(drawAboutMirror);
  if(!aboutPacket&&now>=aboutNextPacketAt)startAboutPacket(now);
  if(aboutPacket){
    const dt=Math.min(.05,Math.max(0,(now-aboutLastTime)/1000));aboutLastTime=now;
    moveAboutPacket(aboutPacket.speed*dt);drawAboutPacket();
    if(aboutPacket.x < -90||aboutPacket.x>w+90||aboutPacket.y < -90||aboutPacket.y>h+90){
      aboutPacket=null;aboutNextPacketAt=now+1000+Math.random()*2000;
    }
  }
  aboutFrame=requestAnimationFrame(animateAbout);
}
function showAbout(){
  hideHelp();if(aboutResizeTimer!=null){clearTimeout(aboutResizeTimer);aboutResizeTimer=null;}
  aboutBackdrop.classList.add('show');resizeAboutCanvas();aboutLastTime=performance.now();
  if(aboutFrame==null)aboutFrame=requestAnimationFrame(animateAbout);
  setTimeout(()=>aboutBackdrop.focus(),0);
}
function hideAbout(){
  const enteringApp=initialAboutDismissal&&aboutBackdrop.classList.contains('show');
  if(enteringApp)initialAboutDismissal=false;
  aboutBackdrop.classList.remove('show');if(aboutFrame!=null)cancelAnimationFrame(aboutFrame);
  if(aboutResizeTimer!=null)clearTimeout(aboutResizeTimer);
  aboutFrame=null;aboutResizeTimer=null;aboutPacket=null;
  if(enteringApp&&State.screen==='solutionEdit'){
    const puzzle=getCurrentPuzzle();
    warnIfStrictPacketTotalsMismatch(puzzle);
    if(State.currentSolutionId==='BLANK')schedulePuzzleIntro(puzzle);
  }
}
aboutBackdrop.addEventListener('click',hideAbout);
aboutBackdrop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hideAbout();}});
window.addEventListener('resize',()=>{
  if(!aboutBackdrop.classList.contains('show'))return;
  // A browser can fire dozens of resize events while a window or mobile
  // viewport is changing. Blank the animated scenery once, then rebuild it
  // only after the size has remained stable for a moment.
  aboutMirrorSet=[];aboutPacket=null;aboutNextPacketAt=Infinity;
  aboutCtx.clearRect(0,0,aboutCanvas._cssWidth||0,aboutCanvas._cssHeight||0);
  if(aboutResizeTimer!=null)clearTimeout(aboutResizeTimer);
  aboutResizeTimer=setTimeout(()=>{
    aboutResizeTimer=null;
    if(!aboutBackdrop.classList.contains('show'))return;
    resizeAboutCanvas();aboutLastTime=performance.now();
  },220);
});

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function sw(col){ return `<span class="hs" style="background:${COLHEX[col]}${col===COL.K?';box-shadow:0 0 0 1px #656a78':''}"></span>`; }
function buildHelpContent(){
  const R=sw(COL.R), G=sw(COL.G), B=sw(COL.B), Y=sw(COL.Y), M=sw(COL.M), C=sw(COL.C), W=sw(COL.W), K=sw(COL.K);
  return `
<h3>How to Play Lightyard</h3>
<p>Each puzzle is a grid with one or more <strong>emitters</strong> and <strong>receivers</strong> built in. Emitters have a predetermined sequence of colored <strong>packets of light</strong> they will emit at the start of the puzzle run. Receivers have a predetermined sequence of colored packets of light they need to receive for the puzzle to complete successfully.</p>
<p>Your job is to place objects on the board so every receiver gets exactly the light packets it expects, in order.</p>

<h3>Color mixing</h3>
<p>Packets come in seven colors:</p>
<ul>
  <li>Three primary colors (${R}<strong>Red</strong>, ${G}<strong>Green</strong>, ${B}<strong>Blue</strong>)</li>
  <li>Three secondary colors made from pairs of primaries:
    <ul>
      <li>${Y}<strong>Yellow</strong> = Red+Green</li>
      <li>${M}<strong>Magenta</strong> = Red+Blue</li>
      <li>${C}<strong>Cyan</strong> = Green+Blue</li>
    </ul>
  </li>
  <li>${W}<strong>White</strong>, which combines all three primaries</li>
</ul>
<p>Whenever two packets' paths meet or cross at the same time, both packets take on the union of their colors.</p>
<div class="help-ex">
<strong>Examples:</strong><br>
${R} Red meets ${B} Blue → both become ${M} Magenta<br>
${R} Red meets ${G} Green → both become ${Y} Yellow<br>
${G} Green meets ${B} Blue → both become ${C} Cyan<br>
${M} Magenta meets ${G} Green → both become ${W} White (together that's all three primaries)<br>
${M} Magenta meets ${R} Red → both become ${M} Magenta (Red is one of Magenta's components)<br>
${W} White meets anything → both become ${W} White
</div>

<h3>Solve Mode</h3>
<p>You start with puzzle sets in two sections: <strong>Built-in</strong> puzzles embedded in this copy of Lightyard, followed by <strong>Local</strong> puzzles stored in this browser. Expand a set and then a puzzle to see its saved solutions or start fresh. Each solution is an independent arrangement of solver pieces. A filled star means that exact puzzle configuration has at least one successful solution.</p>
<p>A puzzle may open with a short introduction or hint when you start a new solution. Tap or click the introduction to dismiss it; if it is longer than the display, scroll the text without moving the puzzle behind it.</p>
<p>While editing a solution, choose a piece type from the Tools menu and tap or click any empty square to place it. Select a newly placed piece again within two seconds to configure it immediately. Otherwise, select a placed piece once to preview its routine twice; select it again during the preview or shortly afterward to open its configuration sheet. Choose Eraser and select a piece to remove it. Choose Clone, select a placed solver piece, and then select empty squares to make copies; selecting a different piece changes what Clone copies.</p>

<div class="help-piece"><div class="pn">Mirror</div><div class="pd">Reflects a packet 90° from any direction. Packets that meet on the same side of the mirror merge colors; packets reaching opposite sides at the same time reflect independently and do not affect one another. A mirror has two possible orientations, selected in its configuration sheet. A mirror can optionally be set to flip its orientation when a packet hits it.</div></div>

<div class="help-piece"><div class="pn">Half-Mirror</div><div class="pd">Like a mirror, but one side reflects and the other is transparent. The bright line is the reflective surface. Like the mirror, the reflective side reflects packets 90°; the transparent side passes packets straight through.
<ul>
  <li>Packets that meet while reflecting off the reflective side merge colors.</li>
  <li>Packets that cross while passing through the transparent side merge colors.</li>
  <li>If one packet is reflecting and another is passing through, and they exit in the same direction, they merge into one packet; otherwise they cross, remaining two packets but merging colors.</li>
</ul>
A half-mirror can face any of four directions. It can optionally be set to follow a pattern of up to four orientations, changing orientation when a packet hits it.</div></div>

<div class="help-piece"><div class="pn">Prism</div><div class="pd">A triangle with a flat base.
<ul>
  <li>A packet hitting the base side splits into two: a primary or white packet splits into two copies of itself; a secondary splits into its two component colors—e.g. ${M} Magenta splits into ${B} Blue and ${R} Red.</li>
  <li>A packet hitting from any other side exits the base.</li>
  <li>If packets arrive from more than one of those sides at once, they merge to exit the base as a single packet with their merged color.</li>
</ul>
A prism can face any of four directions. It can optionally follow a pattern of up to four orientations, changing orientation when a packet hits it.</div></div>
<p>Puzzles can be configured with <strong>No Prisms</strong>, <strong>No Half-Mirrors</strong>, or both. When both are on, only regular Mirrors are available.</p>
<p>Press play to run your solution. The speed slider controls playback rate (0 is paused); step advances one square; reset returns the run to the beginning. A failed packet is marked where it failed, but the remaining packets continue so you can see every success and failure in the run. The board turns red from the first failure onward without moving or covering the puzzle. After the completed run, pressing play resets it and starts it again. The playback speed does not affect the outcome.</p>

<h3>What's already on the board</h3>
<p>A puzzle configuration includes objects you can't move or change:</p>

<div class="help-piece"><div class="pn">Emitters</div><div class="pd">Emit packets of light in a preset color sequence.</div></div>

<div class="help-piece"><div class="pn">Receivers</div><div class="pd">Expect a preset color sequence. A correct packet checks off the next expected color.</div></div>

<div class="help-piece"><div class="pn">Crystals</div><div class="pd">Slows any packet passing through it to half-speed.
<ul>
  <li>Clear crystals do nothing to color.</li>
  <li>${K}<strong>Black</strong> crystals absorb all packets.</li>
  <li>Other colored crystals only let through packets whose color contains all of the filter's color components; other packets are absorbed. Packets always exit as the filter color, so any extra color components are lost. For example:
    <ul>
      <li>In a ${B}<strong>Blue</strong> crystal, ${C} Cyan loses its Green as it passes through.</li>
      <li>In a ${G}<strong>Green</strong> crystal, ${W} White loses its Red and Blue.</li>
      <li>A ${R}<strong>Red</strong> crystal absorbs a ${C} Cyan packet.</li>
      <li>A ${Y}<strong>Yellow</strong> crystal absorbs a ${B} Blue packet.</li>
    </ul>
  </li>
</ul>
Crystals can have a durability factor: every arriving packet decreases the durability until the crystal reaches 0 and disintegrates. A crystal with no number is indestructible.</div></div>

<div class="help-piece"><div class="pn">Transformer</div><div class="pd">Steps a passing packet one position along the spectrum. Its colored strip shows the configured order: either ${R} Red → ${Y} Yellow → ${G} Green → ${C} Cyan → ${B} Blue → ${M} Magenta, or the reverse. There's no wraparound, and ${W} White is not part of the spectrum.</div></div>

<h3>Failing</h3>
<p>The solution fails if:</p>
<ul>
  <li>A packet hits an emitter.</li>
  <li>A packet leaves the board.</li>
  <li>A packet hits a receiver from the wrong direction.</li>
  <li>A packet that is the wrong color enters a receiver.</li>
  <li>A ${W} White packet, or a packet at the end of the transformer's spectrum, hits a transformer.</li>
  <li>There are packets left over after all the receivers have been filled.</li>
  <li><strong>Strict</strong> is set for the puzzle and the number of light packets changes because packets merged, split, or were absorbed. A simultaneous split and merge or absorption that leave the packet count unchanged cancel out and are still fine.</li>
</ul>
<p>Failure is permanent for that run, but it does not stop playback. Each failed packet is marked at its failure point, receiver successes continue to be checked off, and later packets can independently succeed or fail.</p>

<h3>Solving</h3>
<p>If none of the above happens and every receiver gets its full correct sequence of colored packets, congratulations, you solved the puzzle! The solution locks, and its element and tick counts appear with it in the solution list and congratulations display. Saved web apps can include an element and tick goal beside each puzzle name. Matching a goal is highlighted with a faded color; beating it uses the full packet Blue for elements or packet Red for ticks. The puzzle's gold star receives the same right-side goal accents.</p>
<p>On the Solve Puzzles list, the kebab beside <strong>Local</strong> manages all solutions. Each set and puzzle has its own solution kebab immediately before its expand/collapse chevron. The Local and local-set menus can also paste or import puzzles together with their solutions. If a puzzle is already present, Lightyard asks whether to attach only its solutions to the existing puzzle or create a duplicate puzzle with those solutions.</p>
<p>Copied solutions are always treated as fresh attempts: solved status and recorded tick counts are not copied. Pasting solutions directly into a puzzle accepts solutions made for any source puzzle. Controls outside the target grid or on top of fixed puzzle elements are skipped, while every control that fits is retained.</p>
<p>Use the <strong>Preferences</strong> gear to add or change the player name used in the solved-puzzle celebration. Preferences also includes a colorblind option that labels moving packets and colored crystals with letters, and an optional Sound setting for packet interactions and the solved-puzzle celebration. Emitter and receiver sequences show color letters when their configuration is open.</p>

<p>The solution workspace keeps navigation, playback, and piece placement above the board. On a narrow screen, swipe the piece row sideways to reach any button that does not fit.</p>

  <li><strong>Try It Now:</strong> The first item in the kebab opens a fresh solution on this puzzle so you can test it immediately.</li>
  <li><strong>Fixed-piece tools:</strong> Select a component—including a Half-Mirror or Prism—and then an empty square to place it. Clone copies a selected component; Eraser removes one.</li>
  <li><strong>More:</strong> The kebab beside the puzzle name opens Try It Now, Setup, Clone Puzzle, Copy Puzzle, Export Puzzle, and Delete Puzzle.</li>
  <li><strong>Design board:</strong> Fixed components can be dragged to new squares. Select one to configure it.</li>
</ol>

<h4>Puzzle components</h4>
<ul>
  <li><strong>Emitter:</strong> Configure the direction or directions it emits toward and its ordered sequence of up to eight packet colors.</li>
  <li><strong>Receiver:</strong> Configure the direction or directions from which it accepts packets and the ordered color sequence it requires.</li>
  <li><strong>Crystal:</strong> Choose clear, black, or a filter color, and optionally set how many impacts it survives. Clear crystals slow packets without changing color; black absorbs everything; colored crystals filter as described above.</li>
  <li><strong>Transformer:</strong> Choose which direction it moves packets along the six-color spectrum shown on its strip.</li>
  <li><strong>Half-Mirror:</strong> Set its starting facing and optional four-step facing sequence. As a fixed puzzle component, a solver cannot move, erase, clone, or reconfigure it.</li>
  <li><strong>Prism:</strong> Set its starting facing and optional four-step facing sequence. As a fixed puzzle component, a solver cannot move, erase, clone, or reconfigure it.</li>
</ul>

<h4>Puzzle Setup</h4>
<ul>
  <li><strong>Name and dimensions:</strong> Name the puzzle and choose a grid from 5–13 rows by 5–9 columns. Making the grid smaller removes anything outside the new dimensions.</li>
  <li><strong>New-solution introduction:</strong> Add optional help or story text shown over the board whenever a player starts fresh. The editor is the same size and style as the player-facing display. Its insert buttons add packet colors and representative puzzle or solution pieces directly to the text; longer text scrolls.</li>
  <li><strong>Strict:</strong> The packet count may not change. A merge, split, or absorption fails unless simultaneous changes balance to zero. Strict puzzles require equal total emitter and receiver packets; the designer and solver are warned when those totals differ.</li>
  <li><strong>No Prisms:</strong> Solvers may place regular Mirrors and Half-Mirrors, but cannot add Prisms. Any fixed Prisms placed by the puzzle designer remain on the board in their designed positions and configurations.</li>
  <li><strong>No Half-Mirrors:</strong> Solvers may place regular Mirrors and Prisms, but cannot add Half-Mirrors. Any fixed Half-Mirrors placed by the puzzle designer remain on the board in their designed positions and configurations. Turn on both restrictions to let solvers add only regular Mirrors; enabling either restriction removes newly disallowed pieces from existing solutions and marks those solutions in progress.</li>
</ul>

<h4>Testing and organizing</h4>
<p>Use <strong>Try It Now</strong> whenever you want to test the current design. Built-in puzzles are read-only; clone a puzzle or set to Local before editing it. Local sets and individual puzzles can be copied or pasted through the clipboard, imported or exported as files, renamed, cloned, reordered, moved, or deleted. <strong>Save as Web App</strong> downloads a standalone copy containing the current built-in and local puzzle sets, player name, colorblind preference, sound preference, and the best element and tick goals from solved puzzles—but no saved solutions.</p>

<h3>Sharing puzzles &amp; solutions</h3>
<p>Local puzzles, changes, and solutions are stored in your browser; built-in puzzles remain embedded in the app file. The same sharing scopes are available through Copy/Paste using the clipboard or Export/Import using files:</p>
<ul>
  <li>A single solution</li>
  <li>All the solutions for a puzzle</li>
  <li>All the solutions for a set</li>
  <li>All the solutions for all of the puzzles</li>
  <li>A single puzzle configuration</li>
  <li>All the puzzles in a set</li>
  <li>All of the puzzles in all of the sets</li>
</ul>
<p>To share the whole game with someone, send them this app file plus the relevant export—they can open the app and import it straight in. Puzzle designers can also use <strong>Save as Web App</strong> to download a standalone copy with the current sets, puzzles, player name, colorblind preference, sound preference, and solved-puzzle goals built in; saved solutions themselves are not included. Personal settings can be changed at any time with the gear button.</p>
`;
}
function showHelp(){
  const body = document.getElementById('helpBody');
  if(!body.dataset.built){ body.innerHTML = buildHelpContent(); body.dataset.built='1'; }
  document.getElementById('helpBackdrop').classList.add('show');
}
function hideHelp(){
  document.getElementById('helpBackdrop').classList.remove('show');
}
document.getElementById('helpBtn').addEventListener('click', showHelp);
document.getElementById('brandHelpBtn').addEventListener('click', showAbout);
document.getElementById('brandHelpBtn').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();showAbout();}
});
function showSettingsDialog(){
  const old=document.getElementById('settingsDialog');if(old)old.remove();
  const backdrop=document.createElement('div');backdrop.className='dialog-backdrop settings-dialog-backdrop';backdrop.id='settingsDialog';
  const dialog=document.createElement('div');dialog.className='dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','settingsDialogTitle');
  dialog.innerHTML='<h3 id="settingsDialogTitle">Preferences</h3><label class="field" for="playerNameInput">Player name</label><input id="playerNameInput" type="text" maxlength="60" autocomplete="name"><p style="font-size:11.5px;color:var(--dimmer);line-height:1.45;margin:-2px 0 10px;">Used in the solved-puzzle celebration. Leave blank for the generic message.</p><label class="checkline"><input id="colorblindSetting" type="checkbox"> Show color letters on packets and crystals</label><label class="checkline"><input id="soundSetting" type="checkbox"> Play game sounds</label><div class="rowbtns"><button class="btn" data-act="cancel">Cancel</button><button class="btn solid" data-act="save">Save</button></div>';
  backdrop.appendChild(dialog);document.body.appendChild(backdrop);
  const input=dialog.querySelector('#playerNameInput');input.value=State.playerName;
  const colorblind=dialog.querySelector('#colorblindSetting');colorblind.checked=State.colorblind;
  const sound=dialog.querySelector('#soundSetting');sound.checked=State.soundEnabled;
  const close=()=>{backdrop.remove();document.getElementById('settingsBtn').focus();};
  const save=()=>{
    State.playerName=input.value.trim().slice(0,60);State.colorblind=colorblind.checked;State.soundEnabled=sound.checked;
    persistPlayerName();persistColorblind();persistSound();if(State.soundEnabled)ensureGameAudio();close();
    if(State.grid)render();
    if(State.sheetOpen){
      if(State.screen==='solutionEdit'&&State.runStarted)renderReceiversPanel();
      else if(State.selectedCell)renderInspector();
    }
  };
  dialog.querySelector('[data-act=cancel]').addEventListener('click',close);
  dialog.querySelector('[data-act=save]').addEventListener('click',save);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}});
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)close();});
  setTimeout(()=>{input.focus();input.select();},0);
}
document.getElementById('settingsBtn').addEventListener('click',showSettingsDialog);
document.getElementById('helpCloseBtn').addEventListener('click', hideHelp);
document.getElementById('helpPlayBtn').addEventListener('click', hideHelp);
document.getElementById('helpBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='helpBackdrop') hideHelp(); });
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Escape') return;
  const settingsDialog=document.getElementById('settingsDialog');
  if(settingsDialog){settingsDialog.remove();document.getElementById('settingsBtn').focus();}
  else if(aboutBackdrop.classList.contains('show'))hideAbout();
  else if(document.getElementById('helpBackdrop').classList.contains('show')) hideHelp();
  else if(document.getElementById('puzzleIntroOverlay')) dismissPuzzleIntro();
  else if(State.sheetOpen) closeInspectorSheet();
});

/* ============================== BOOT ============================== */
loadAll();
renderScreen();
showAbout();

})();
</script></body></html>
