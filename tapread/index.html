<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap &amp; Read</title>
<meta name="theme-color" content="#fbf5ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8613c'/%3E%3Cpath d='M14 18c7-3 13-2 18 2v28c-5-4-11-5-18-2z' fill='%23fff'/%3E%3Cpath d='M50 18c-7-3-13-2-18 2v28c5-4 11-5 18-2z' fill='%23ffe3a3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf5ea; --page:#fffdf8; --ink:#2b2833; --ink-2:#6b6577; --line:#e9dfcd;
  --tomato:#e8613c; --tomato-2:#fbe1d7; --teal:#2a9d8f; --teal-2:#d6f0ec;
  --sun:#f4b942; --sun-2:#fdf0cf; --plum:#7b5ea7; --plum-2:#ece5f6; --sky:#3d8bd9; --sky-2:#dcebfa;
  --shadow:0 1px 0 rgba(60,40,10,.06), 0 8px 24px -12px rgba(60,40,10,.25);
  --r:18px; --read:"Andika", "Comic Sans MS", system-ui, sans-serif; --ui:"Fredoka", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#1d1b22; --page:#26232c; --ink:#f3eee6; --ink-2:#b4adbd; --line:#3a3642;
    --tomato-2:#4a2a22; --teal-2:#1d3b38; --sun-2:#43391f; --plum-2:#352c44; --sky-2:#1f3247;
    --shadow:0 8px 24px -12px rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.on{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.topbar h1,.topbar h2{font-weight:600;margin:0;font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 16px 40px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--page);box-shadow:var(--shadow);font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--tomato);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{padding:6px 12px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--page);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;flex:none}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500}
.muted{color:var(--ink-2)}
.hidden{display:none!important}

/* readers */
.readers{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:24px 16px}
.reader-card{width:150px;border:0;background:var(--page);border-radius:24px;padding:20px 10px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px}
.reader-card .face{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:46px}
.reader-card .nm{font-size:20px;font-weight:600}
.reader-card.add{background:transparent;border:3px dashed var(--line);box-shadow:none}
.hello{text-align:center;padding:40px 16px 0}
.hello h1{font-size:clamp(30px,6vw,46px);margin:0 0 6px;font-weight:600}

/* library */
.shelf-title{font-size:18px;font-weight:600;margin:22px 4px 10px;color:var(--ink-2)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.book{border:0;border-radius:16px;background:var(--page);box-shadow:var(--shadow);text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:210px}
.book .cover{height:120px;display:grid;place-items:center;font-size:56px;position:relative}
.book .cover img{width:100%;height:100%;object-fit:cover}
.book .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.book .t{font-weight:600;font-size:16px;line-height:1.2}
.book .prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.book .prog i{display:block;height:100%;background:var(--teal)}
.book.add{border:3px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;font-size:17px;gap:6px;color:var(--ink-2)}
.lvl1{background:var(--sun-2)} .lvl2{background:var(--teal-2)} .lvl3{background:var(--plum-2)}
.book .cover.lv{background:color-mix(in srgb, var(--lv) 24%, var(--page))}
.lv-chip{position:absolute;top:8px;left:8px;font:600 12px var(--ui);padding:2px 8px;border-radius:999px;background:var(--lv);color:#fff}
.badge{position:absolute;bottom:8px;right:8px;font:600 12px var(--ui);padding:3px 9px;border-radius:999px;background:var(--page);color:var(--ink);box-shadow:var(--shadow)}
.badge.next{background:var(--sun);color:#2b2833}
.shelf-title .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lv);margin-right:8px;vertical-align:0}
.level-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.level-pill{font:600 15px var(--ui);padding:4px 12px;border-radius:999px;background:var(--lv);color:#fff}
.level-notes{margin:10px 0 0;padding-left:18px;line-height:1.55}
.big-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.big-action{flex:1;min-width:220px;border:0;border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);text-align:left}
.big-action .e{font-size:38px}
.big-action b{display:block;font-size:19px;font-weight:600}

/* book reader */
#scr-book{height:100%;min-height:0}
.book-stage{flex:1;display:flex;align-items:stretch;gap:8px;padding:0 8px 8px;min-height:0}
.nav{border:0;background:transparent;width:56px;font-size:34px;color:var(--ink-2);flex:none;border-radius:16px}
.nav:hover{background:rgba(0,0,0,.04)}
.nav[disabled]{opacity:.15}
.page{flex:1;background:var(--page);border-radius:22px;box-shadow:var(--shadow);overflow:auto;position:relative;display:flex;flex-direction:column;padding:clamp(18px,4vw,48px);min-height:0}
.page-inner{margin:auto 0;width:100%;max-width:720px;align-self:center}
.page.turn-l{animation:turnL .28s ease} .page.turn-r{animation:turnR .28s ease}
@keyframes turnL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes turnR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.reading{font-family:var(--read);line-height:1.55;font-size:calc(var(--fs,30px) * var(--scale,1))}
.reading p{margin:0 0 .7em}
.reading h2{font-size:1.15em;margin:0 0 .8em;text-align:center;font-weight:700;color:var(--plum)}
.reading .title{font-size:1.5em;text-align:center;margin:0 0 .2em;line-height:1.2;font-weight:700}
.reading .byline{text-align:center;font-size:.6em;color:var(--ink-2);margin-bottom:1.2em}
.reading .pic{text-align:center;font-size:2.6em;line-height:1.25;margin:.1em 0 .4em;letter-spacing:.05em}
.reading img{display:block;max-width:100%;max-height:46vh;margin:0 auto .8em;border-radius:10px}
.w{cursor:pointer;border-radius:.2em;padding:0 .04em;transition:background .15s,color .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.w:hover{background:var(--sun-2)}
.w.hit{animation:pop .45s ease;background:var(--sun);color:#2b2833}
.w.say{background:var(--sky-2);box-shadow:0 0 0 .08em var(--sky)}
.w.sent{background:var(--teal-2)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.pageno{text-align:center;margin-top:1em;font-size:.65em;color:var(--ink-2)}
.book-tools{display:flex;gap:10px;align-items:center;justify-content:center;padding:4px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));flex-wrap:wrap}
.voice-prep{text-align:center;font-size:13px;color:var(--ink-2);min-height:20px;padding:0 12px 3px}
.read-along{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px}
.read-along span{font-size:15px}
.progress-line{height:6px;background:var(--line);border-radius:3px;flex:1;max-width:340px;overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--tomato);transition:width .3s}
.listen-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--page);box-shadow:var(--shadow);border-radius:999px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:14px;z-index:30;font-size:18px}
.meter{width:90px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--teal);transition:width .08s}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.game-tile{border:0;border-radius:22px;padding:22px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:170px}
.game-tile .e{font-size:46px}
.game-tile b{font-size:21px;font-weight:600}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;padding-bottom:40px}
.stars{font-size:26px;letter-spacing:4px;min-height:34px}
.prompt-word{font-family:var(--read);font-size:clamp(48px,12vw,110px);font-weight:700;background:var(--page);border-radius:28px;padding:16px 44px;box-shadow:var(--shadow);text-align:center}
.choices{display:grid;grid-template-columns:repeat(2,minmax(130px,260px));gap:16px}
.choice{font-family:var(--read);font-size:clamp(28px,6vw,48px);border:0;border-radius:22px;padding:20px 12px;background:var(--page);box-shadow:var(--shadow);font-weight:700}
.choice.right{background:var(--teal);color:#fff}
.choice.wrong{animation:shake .4s;opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.speaker{width:96px;height:96px;border-radius:50%;border:0;background:var(--sky);color:#fff;font-size:44px;box-shadow:var(--shadow)}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--tomato);color:#fff;font-size:52px;box-shadow:var(--shadow);position:relative}
.mic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--tomato);opacity:.5;animation:ring 1.1s infinite}
@keyframes ring{from{transform:scale(.92);opacity:.7}to{transform:scale(1.15);opacity:0}}
.mem-grid{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,4),minmax(70px,150px))}
.mem{aspect-ratio:3/4;border:0;border-radius:16px;padding:0;position:relative;background:transparent}
.mem .f,.mem .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;box-shadow:var(--shadow)}
.mem .b{background:repeating-linear-gradient(45deg,var(--plum),var(--plum) 10px,#8c70b8 10px,#8c70b8 20px);color:#fff;font-size:30px}
.mem .f{background:var(--page);font-family:var(--read);font-weight:700;font-size:clamp(18px,4vw,30px);padding:4px;text-align:center;word-break:break-word;visibility:hidden}
.mem.up .f,.mem.done .f{visibility:visible}
.mem.up .b,.mem.done .b{visibility:hidden}
.mem.up,.mem.done{animation:flip .3s ease}
.mem.done .f{background:var(--teal-2)}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.feedback{font-size:24px;min-height:34px;text-align:center;font-weight:500}
.fall-sky{position:relative;isolation:isolate;width:min(100%,800px);height:clamp(300px,55dvh,570px);overflow:hidden;border-radius:24px;background:linear-gradient(var(--sky-2),var(--page));border:2px solid var(--line)}
.fall-sky::after{content:'✦     ·     ✧     ·     ✦';position:absolute;inset:8px 0 auto;text-align:center;color:var(--sky);font-size:24px;pointer-events:none}
.fall-word{position:absolute;top:0;left:0;max-width:46%;font:700 clamp(22px,4vw,34px)/1.3 var(--read);padding:8px 14px;border-radius:18px;background:var(--page);box-shadow:var(--shadow);white-space:nowrap;will-change:transform;z-index:1}
.fall-sparkle{position:absolute;font-size:42px;pointer-events:none;z-index:2;animation:sparkle .8s ease-out forwards}
@keyframes sparkle{to{transform:translateY(-50px) scale(1.8) rotate(25deg);opacity:0}}
.game-area:has(.fall-sky){gap:12px;padding-bottom:16px}
@media(prefers-reduced-motion:reduce){.fall-sparkle,.confetti{animation-duration:.1s}.w{transition:none}}
.confetti{position:fixed;pointer-events:none;font-size:30px;z-index:60;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* parent */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--ink-2)}
.tab.on{background:var(--ink);color:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--page);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card .n{font-size:30px;font-weight:600}
.card .l{color:var(--ink-2);font-size:14px}
.panel{background:var(--page);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-top:16px}
.panel h3{margin:0 0 12px;font-weight:600;font-size:18px}
.panel h4{margin:16px 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
td.wd{font-family:var(--read);font-weight:700;font-size:17px}
.table-wrap{overflow-x:auto}
.boxes{display:inline-flex;gap:3px}
.boxes i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.boxes i.on{background:var(--teal)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{min-width:150px;color:var(--ink-2)}
.field{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;min-height:42px}
textarea.field{width:100%;min-height:160px;font-family:var(--read)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-2)}
.wordcloud{display:flex;flex-wrap:wrap;gap:8px}
.wordcloud span{font-family:var(--read);font-weight:700;background:var(--sun-2);border-radius:10px;padding:4px 10px}
.note{font-size:14px;color:var(--ink-2);line-height:1.5}
.bar-prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:120px}
.bar-prog i{display:block;height:100%;background:var(--teal);width:0}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(20,15,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--page);border-radius:24px;padding:24px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:22px;font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;font-size:24px;display:grid;place-items:center}
.swatches button.on{border-color:var(--ink)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:70;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:640px){
  .nav{display:none}
  .book-stage{padding:0 6px 6px}
  .choices{grid-template-columns:repeat(2,1fr);width:100%}
  .row label{min-width:100%}
}
/* ===== Library: a bookcase on the nursery wall; books as cloth picture books ===== */
:root{--wall:#d7e8e1;--wall-dot:#c6ddd4;--oak:#c98a4b;--oak-hi:#dfa86c;--oak-lo:#9a6230;--oak-dk:#6e4220;--birch:#f3e5cc;--paper-1:#fffaf0;--paper-edge:#e4d6ba;--table-1:#c99a66;--table-2:#b5824e}
@media (prefers-color-scheme: dark){:root{--wall:#1c2726;--wall-dot:#243230;--oak:#7a5132;--oak-hi:#94673f;--oak-lo:#5a3922;--oak-dk:#3a2414;--birch:#33281f;--paper-1:#2d2924;--paper-edge:#433b31;--table-1:#4a3424;--table-2:#3c2a1c}}
#scr-library{background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 2px,transparent 2.5px);background-size:28px 28px}
.case{--bkW:132px;--bkH:174px;--row:calc(var(--bkH) + 46px);position:relative;margin:34px 0 10px;padding:22px 18px 0;border:12px solid var(--oak);border-bottom-width:18px;border-radius:12px 12px 6px 6px;background:linear-gradient(var(--birch),color-mix(in srgb,var(--birch) 88%,#7a4a22));box-shadow:inset 0 14px 18px -12px rgba(60,30,0,.45),0 14px 26px -14px rgba(60,30,0,.55)}
.case.featured{border-color:#e2a93b;background:linear-gradient(#fff3d4,#f6e2b5)}
@media (prefers-color-scheme: dark){.case.featured{border-color:#9c7426;background:linear-gradient(#3b3020,#33291b)}}
.case-sign{position:absolute;top:0;left:20px;transform:translateY(-78%);background:var(--oak-hi);color:#3b2412;font:600 18px var(--ui);padding:5px 16px 6px;border-radius:9px;box-shadow:0 3px 0 var(--oak-lo),0 7px 10px -6px rgba(0,0,0,.45);display:flex;align-items:center;gap:9px}
.case.featured .case-sign{background:#f4c24f;box-shadow:0 3px 0 #b8861f,0 7px 10px -6px rgba(0,0,0,.45)}
.case-sign .dot{width:15px;height:15px;border-radius:50%;background:var(--lv);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 2px #fffaf0}
.row-books{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:28px;row-gap:0;margin:0 -18px;padding:0 24px;
  background-image:linear-gradient(to bottom,transparent calc(var(--row) - 20px),var(--oak-hi) calc(var(--row) - 20px),var(--oak-hi) calc(var(--row) - 17px),var(--oak) calc(var(--row) - 16px),var(--oak-lo) calc(var(--row) - 3px),var(--oak-dk) var(--row));background-size:100% var(--row)}
.bk{position:relative;flex:none;width:var(--bkW);height:var(--bkH);margin:calc(var(--row) - var(--bkH) - 19px) 0 19px;margin-bottom:19px;border:0;padding:0;background:none;font:inherit;color:inherit;cursor:pointer;transform-origin:50% 100%;transition:transform .18s ease}
.bk:hover{transform:translateY(-6px) rotate(-1.5deg)}
.bk:active{transform:translateY(-2px) scale(.97)}
.bk:focus-visible{outline:3px solid var(--sky);outline-offset:5px;border-radius:8px}
.bk-cover{position:absolute;inset:0;display:flex;flex-direction:column;gap:7px;padding:12px 10px 10px 19px;border-radius:3px 9px 9px 3px;background-color:var(--lv);
  background-image:linear-gradient(90deg,rgba(0,0,0,.3) 0 8px,rgba(255,255,255,.28) 8px 10px,rgba(0,0,0,.1) 10px 14px,transparent 14px),repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px);
  box-shadow:3px 1px 0 -1px var(--paper-1),4px 1px 0 -1px var(--paper-edge),6px 2px 0 -1px var(--paper-1),7px 2px 0 -1px var(--paper-edge),0 6px 6px -4px rgba(40,20,0,.45)}
.bk-art{flex:1;min-height:0;display:grid;place-items:center;font-size:56px;line-height:1;border-radius:7px;background:rgba(255,253,245,.3);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);overflow:hidden}
.bk-art img{width:100%;height:100%;object-fit:cover}
.bk-label{background:#fffaf0;color:#2b2833;font:600 14px/1.15 var(--ui);text-align:center;padding:6px 5px;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.18);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

<section class="screen on" id="scr-startup">

</section>

const BUILTIN_STORIES = [
{ id:'b-cap', title:'Where Is My Cap?', author:'Tap & Read', level:1, names:['Sam'], cover:'🧢', text:`
@pic 👦🧢
I am Sam. I see my cap.
===

My cap is red. My cap is big.
===

I can nap. I nap and nap.
===
@pic 👦❓

Is my cap in the pan?

Is my cap in the can?
===
@pic 🧺
Is my cap on the mat?

@pic 👀
Look! Look! I see a cap. I see a tail.
===
@pic 🐱🧢
It is a cat! A cat is in my cap.

@pic 😺💤

{ id:'b-pig-digs', title:'Big Pig Digs', author:'Tap & Read', level:2, names:['Pig', 'Rat'], cover:'🐷', text:`
@pic 🐷
Here is Big Pig. Big Pig can dig.
===
@pic 🐷⛏️
Dig, dig, dig! Big Pig digs a pit.
===
@pic 🕳️
Big Pig digs a big, big pit.
===
@pic 🎩
"Is it a hat?" said Big Pig. It is not a hat.
===
@pic 🫙
"Is it a lid?" said Big Pig. It is not a lid.
===
@pic 🐷💦
Big Pig digs and digs. Big Pig is hot.
===
@pic 🐭
Look! It is Rat! Rat is in the pit.

@pic 🐭😠
"Big Pig! I had a nap in my pit!" said Rat.

@pic 🐷🙏

@pic 🐷🐭🌳
Big Pig and Rat dig. Dig, dig, dig! Look, it is a fig tree!
===
@pic 🐷🐭😋

`},
{ id:'b-bug-bus', title:'Bug Gets on the Bus', author:'Tap & Read', level:3, names:['Bug'], cover:'🐞', text:`
@pic 🐞
Bug is a little red bug. Bug has six legs.
===
@pic 🐞🪵☀️
Bug sits on a log. The sun is hot. Bug is hot.
===
@pic 🐞🚌
"I am hot," said Bug. "I will get on the bus."
===
@pic 🚌
The bus is big and red. Bug gets on the bus.

A cat is on the bus. A dog is on the bus. A hen is on the bus.

{ id:'b-up', title:'Up, Up, Up!', author:'Tap & Read', level:4, cover:'🎈', text:`

{ id:'b-fox-crow', title:'The Fox and the Crow', author:'A fable, retold', level:7, cover:'🦊', text:`
@pic 🐦🧀

{ id:'b-tortoise-hare', title:'The Tortoise and the Hare', author:'A fable, retold', level:5, cover:'🐢', text:`
@pic 🐇💨
Hare was very fast, and he liked to tell everyone about it. "No one can beat me," he said.
===

===
@pic 🐇😂

@pic 🏁🐇🐢

{ id:'b-pip-light', title:'Pip and the Lighthouse', author:'Tap & Read', level:7, cover:'⛵', text:`
## Chapter One: The Little Keeper

@pic 🏠💡🌊

Pip lived with her grandfather in a white lighthouse at the edge of the sea. Every night, Grandpa climbed the one hundred steps to the top and lit the great lamp.

The light swept across the dark water, round and round, so that the fishing boats could find their way home.

"Why does it have to turn?" Pip asked one evening.

"So that every boat can see it, wherever it is," said Grandpa. "A light that only shines one way is only half a light."
===
Pip liked to count the steps as they climbed. Some nights she counted by ones. Some nights she counted by twos. On very windy nights she did not count at all, because she was too busy holding the rail.

From the top, she could see the whole harbor. She knew every boat by its color. The blue one was Mr. Ortega's. The yellow one belonged to the twins. The little green one with the patched sail was old Mrs. Finch's, and it was always the last one home.
===
## Chapter Two: The Storm

@pic ⛈️🌊

One afternoon the sky turned the color of a bruise. The wind began to howl, and the waves grew taller than houses.

"A storm is coming," said Grandpa. He rubbed his knee, which always ached before bad weather. "I will go up early tonight."

But when he stood up, his knee would not bend. He sat back down with a groan.

"I can't climb the steps, Pip," he said quietly. "Not tonight."
===
Pip looked out of the window. She could see the blue boat and the yellow boat coming in fast. But where was the little green boat?

"Mrs. Finch is still out there," Pip whispered.

Grandpa looked at her for a long moment. Then he took the big brass key from his pocket and put it in her hand.

"You know the way," he said. "One hundred steps. Turn the key, open the valve, and strike the match. Just like we practiced."
===
## Chapter Three: One Hundred Steps

@pic 🔦🪜

Pip ran to the stairs. The tower shook with every gust of wind. Rain hammered on the walls.

She counted out loud to keep herself brave. "Twenty. Twenty-one. Twenty-two." Her legs burned. "Sixty. Sixty-one." Her hands were cold. "Ninety-nine. One hundred!"

At the top, she turned the key. She opened the valve. Her fingers shook as she struck the match. Once. Twice. On the third try, the flame caught.

The great lamp blazed, and the light began to turn.
===

// ---------- IndexedDB ------------------------------------------------------
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      // Open the existing schema as-is. A forced version upgrade waits forever
      // when an older app tab still holds a connection (including in Safari).
      const r = indexedDB.open('tapread');
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('kv')) {
        d.createObjectStore('kv');
        d.createObjectStore('readers', { keyPath: 'id' });
        d.createObjectStore('stories', { keyPath: 'id' });
        d.createObjectStore('events', { keyPath: 'id', autoIncrement: true }).createIndex('reader', 'readerId');
        d.createObjectStore('words', { keyPath: 'key' }).createIndex('reader', 'readerId');
        d.createObjectStore('audio');
        }
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => this.db.close(); res(); };
      r.onblocked = () => toast('Close other Tap & Read tabs to finish updating.', 6000);
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), s = t.objectStore(store);
      let out; const r = fn(s);
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(s, k) { return this.tx(s, 'readonly', st => st.get(k)); },
  put(s, v, k) { return this.tx(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)); },
  del(s, k) { return this.tx(s, 'readwrite', st => st.delete(k)); },
  all(s) { return this.tx(s, 'readonly', st => st.getAll()); },
  byReader(s, id) { return this.tx(s, 'readonly', st => st.index('reader').getAll(id)); },
  clear(s) { return this.tx(s, 'readwrite', st => st.clear()); },
  async delByReader(s, id) {
    return this.tx(s, 'readwrite', st => {
      const c = st.index('reader').openCursor(IDBKeyRange.only(id));
      c.onsuccess = () => { const cur = c.result; if (cur) { cur.delete(); cur.continue(); } };
    });
  },
};
const KV = { get: k => DB.get('kv', k), set: (k, v) => DB.put('kv', v, k) };

// Audio only: models and reading records have separate storage. Save PCM at 16 bit
// (48 KB/second at 24 kHz), with an LRU disk budget shared by all neural voices.
const AudioCache = {
  diskLimit: 128 * 1024 * 1024, memoryLimit: 24 * 1024 * 1024, tail: Promise.resolve(),
  prefix: 'audio-cache-meta|', indexed: null,
  writeMeta(entry) { return DB.put('kv', entry, this.prefix + entry.key); },
  index() {
    if (this.indexed) return this.indexed;
    this.indexed = (async () => {
      if (await KV.get('audio-cache-indexed-v1')) return;
      // An ordinary transaction works with either old schema; no upgrade and no
      // requirement to close other tabs. Read one legacy clip at a time.
      await new Promise((resolve, reject) => {
        const tx = DB.db.transaction(['audio', 'kv'], 'readwrite'), kv = tx.objectStore('kv');
        const request = tx.objectStore('audio').openCursor();
        request.onsuccess = () => {
          const cursor = request.result;
          if (!cursor) { kv.put(true, 'audio-cache-indexed-v1'); return; }
          if (cursor.value?.audio?.byteLength && !String(cursor.key).startsWith('lab|')) kv.put({ key: cursor.key, bytes: cursor.value.audio.byteLength, used: Date.now() }, this.prefix + cursor.key);
          cursor.continue();
        };
        tx.oncomplete = resolve; tx.onabort = tx.onerror = () => reject(tx.error);
      });
    })().catch(e => { this.indexed = null; throw e; });
    return this.indexed;
  },
  async entries() {
    await this.index();
    return DB.tx('kv', 'readonly', store => store.getAll(IDBKeyRange.bound(this.prefix, this.prefix + '\uffff')));
  },
  remember(engine, key, clip) {
    engine.mem.delete(key); engine.mem.set(key, clip);
    let bytes = [...engine.mem.values()].reduce((n, c) => n + c.audio.byteLength, 0);
    for (const [k, c] of engine.mem) { if (bytes <= this.memoryLimit) break; engine.mem.delete(k); bytes -= c.audio.byteLength; }
    return clip;
  },
  async get(key) {
    const clip = await DB.get('audio', key); if (!clip) return null;
    this.writeMeta({ key, bytes: clip.audio.byteLength, used: Date.now() }).catch(() => {});
    if (clip.pcm16) {
      const audio = new Float32Array(clip.audio.length);
      for (let i = 0; i < audio.length; i++) audio[i] = clip.audio[i] / 32768;
      return { audio, sr: clip.sr };
    }
    return clip;
  },
  put(key, clip) {
    const audio = new Int16Array(clip.audio.length);
    for (let i = 0; i < audio.length; i++) audio[i] = Math.round(Math.max(-1, Math.min(1, clip.audio[i])) * 32767);
    const packed = { audio, sr: clip.sr, pcm16: true };
    const save = async () => {
      await DB.put('audio', packed, key);
      await this.writeMeta({ key, bytes: audio.byteLength, used: Date.now() });
      await this.trim();
    };
    this.tail = this.tail.catch(() => {}).then(save);
    return this.tail;
  },
  async trim() {
    const entries = (await this.entries()).sort((a, b) => a.used - b.used);
    let bytes = entries.reduce((n, e) => n + e.bytes, 0);
    if (bytes <= this.diskLimit) return;
    const remove = [];
    for (const e of entries) { if (bytes <= this.diskLimit) break; remove.push(e.key); bytes -= e.bytes; }
    await this.remove(remove);
  },
  remove(keys) {
    return new Promise((resolve, reject) => {
      const tx = DB.db.transaction(['audio', 'kv'], 'readwrite');
      for (const key of keys) { tx.objectStore('audio').delete(key); tx.objectStore('kv').delete(this.prefix + key); }
      tx.oncomplete = resolve; tx.onabort = tx.onerror = () => reject(tx.error);
    });
  },
  async clear(prefix) {
    await this.tail.catch(() => {});
    await this.remove((await this.entries()).filter(e => e.key.startsWith(prefix)).map(e => e.key));
  },
};

const WORD_RE = /[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu;
function tokenize(text) {
  const out = []; let last = 0;
  for (const m of text.matchAll(WORD_RE)) {
    if (m.index > last) out.push({ w: false, v: text.slice(last, m.index) });
    out.push({ w: true, v: m[0] });
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push({ w: false, v: text.slice(last) });
  return out;
}
const normWord = w => String(w).toLowerCase().replace(/’/g, "'").replace(/^['\-]+|['\-]+$/g, '');
const wordsOf = text => (String(text).match(WORD_RE) || []).map(normWord);
const countWords = text => (String(text).match(WORD_RE) || []).length;

const ONES = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
const TENS = ',,twenty,thirty,forty,fifty,sixty,seventy,eighty,ninety'.split(',');
function numToWords(n) {
  n = Math.floor(Number(n));
  if (!isFinite(n) || n < 0 || n > 999999) return String(n);
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  if (n < 1000) return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + numToWords(n % 100) : '');
  return numToWords(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? ' ' + numToWords(n % 1000) : '');
}
// What actually gets sent to the speech engine.
function speakable(text) {
  return String(text).replace(WORD_RE, w => {
    const k = normWord(w);
    if (S.overrides[k]) return S.overrides[k];
    if (/^\d+$/.test(w)) return numToWords(w);
    return w;
  });
}

// ---------- story parsing ---------------------------------------------------
// A story is { id, title, author, level, cover, pages: [[block]] }
// block: {t:'h', text} | {t:'p', text} | {t:'pic', text} | {t:'img', src, alt}
function parseScript(raw) {
  const pages = [];
  for (const chunk of raw.replace(/\r\n?/g, '\n').split(/^\s*(?:={3,}|-{3,}|\f|\[page\])\s*$/m)) {
    const blocks = [];
    for (const para of chunk.split(/\n\s*\n/)) {
      const lines = para.split('\n').map(l => l.trim()).filter(Boolean);
      let buf = [];
      const flush = () => { if (buf.length) blocks.push({ t: 'p', text: buf.join(' ') }); buf = []; };
      for (const l of lines) {
        if (l.startsWith('@pic ')) { flush(); blocks.push({ t: 'pic', text: l.slice(5).trim() }); }
        else if (/^#{1,3}\s/.test(l)) { flush(); blocks.push({ t: l.startsWith('# ') ? 'title' : 'h', text: l.replace(/^#+\s*/, '') }); }
        else buf.push(l);
      }
      flush();
    }
    if (blocks.length) pages.push(blocks);
  }
  return pages;
}

// Split a flat block list into pages: chapter headings start a page, and long runs
// of paragraphs are broken at roughly `target` words (never mid-sentence).
function paginate(blocks, target = S.wordsPerPage) {
  const pages = []; let cur = [], n = 0;
  const push = () => { if (cur.length) pages.push(cur); cur = []; n = 0; };
  for (const b of blocks) {
    if (b.t === 'h' || b.t === 'break') { push(); if (b.t === 'h') cur.push(b); continue; }
    if (b.t === 'img' || b.t === 'pic') { if (n > target * 0.6) push(); cur.push(b); n += target * 0.35; continue; }
    const wc = countWords(b.text);
    if (n && n + wc > target) push();
    if (wc > target * 1.4) {               // split a very long paragraph by sentences
      const sents = b.text.match(/[^.!?]+[.!?]+["'’”)]*\s*|[^.!?]+$/g) || [b.text];
      let acc = '';
      for (const s of sents) {
        if (acc && countWords(acc + s) > target) { cur.push({ t: 'p', text: acc.trim() }); push(); acc = ''; }
        acc += s;
      }
      if (acc.trim()) { cur.push({ t: 'p', text: acc.trim() }); n += countWords(acc); }
    } else { cur.push(b); n += wc; }
  }
  push();
  return pages;
}
function guessLevel(pages) {
  const words = pages.flat().filter(b => b.t === 'p').reduce((a, b) => a + countWords(b.text), 0);
  const per = words / Math.max(1, pages.length);
  return per <= 12 ? 2 : per <= 45 ? 5 : 7;   // rough fallback when word levels can't load
}
function storyFromScript(meta) {
  // Optional header lines: @author, @level (kept as a level you set), @names (character names).
  const head = {};
  const text = meta.text.replace(/^@(author|level|names)[ \t]+(.*)$/gim, (_, k, v) => { head[k.toLowerCase()] = v.trim(); return ''; }).replace(/^@img\b.*$/gim, '');
  if (head.author && !meta.author) meta = { ...meta, author: head.author };
  if (head.names && !meta.names) meta = { ...meta, names: head.names.split(',').map(x => x.trim()).filter(Boolean) };
  if (head.level && !meta.level && !meta.builtin) meta = { ...meta, level: Math.min(8, Math.max(1, +head.level || 1)), levelSource: 'manual' };
  meta = { ...meta, text };
  let pages = parseScript(meta.text);
  let title = meta.title;
  const tb = pages[0]?.findIndex(b => b.t === 'title');
  if (tb >= 0) { title = title || pages[0][tb].text; pages[0].splice(tb, 1); if (!pages[0].length) pages.shift(); }
  const explicit = /^\s*(?:={3,}|-{3,}|\f|\[page\])\s*$/m.test(meta.text);
  if (!explicit) pages = paginate(pages.flat());
  return { id: meta.id || 'u-' + uid(), title: title || 'My story', author: meta.author || '', level: meta.level || guessLevel(pages), cover: meta.cover || '📘', builtin: !!meta.builtin, names: meta.names || [], levelScheme: meta.level ? 2 : undefined, ...(meta.levelSource ? { levelSource: meta.levelSource } : {}), pages, added: Date.now() };
}

// ===========================================================================
// Reading levels
// ===========================================================================
// Eight levels follow a standard phonics sequence. A book's level comes from its
// text: the share of words a reader at that level can sound out or knows by sight,
// how many new out-of-level ("tricky") words each page adds, and page/sentence
// length. Tricky words are fine — the reader taps them — so each level allows a
// small budget of them per page. A reader's level comes from how much they tap.
// Levels are guidance, not gates: every book stays open.
const LEVELS = [
  { level: 1, color: '#e5533d', about: 'First sounds: m, s, t, p, n, c and short a, plus a few sight words. Short pattern books.', limits: [10, 8], floor: 0.80, tricky: 1 },
  { level: 2, color: '#e8812c', about: 'Short a and i with most single consonants, and -s endings (cat, sit, pigs).', limits: [18, 7], floor: 0.80, tricky: 1.5 },
  { level: 3, color: '#d9a400', about: 'All short vowels and consonants, plus ff, ll, ss, zz (hot, bug, bed, hill).', limits: [25, 8], floor: 0.80, tricky: 2 },
  { level: 4, color: '#4a9d3a', about: 'Digraphs and blends: sh, ch, th, wh, ck, ng; st-, fl-, -nd, -mp (ship, frog, jump).', limits: [35, 9], floor: 0.80, tricky: 2.5 },
  { level: 5, color: '#2a9d8f', about: 'Long vowels: silent e (cake), ee, ea, ai, ay, oa, ow, igh; endings -ed, -ing, -er.', limits: [55, 11], floor: 0.80, tricky: 3 },
  { level: 6, color: '#3d7fd9', about: 'More vowel sounds: ar, or, er, ir, ur; oi, oy, ou, ow; oo; soft c and g; two-syllable words.', limits: [85, 13], floor: 0.80, tricky: 4 },
  { level: 7, color: '#5b5fc7', about: 'Longer words: prefixes and suffixes (un-, re-, -ful, -tion), kn, wr, ph. Short chapters.', limits: [160, 17], floor: 0.75, tricky: 6 },
  { level: 8, color: '#8a5fbf', about: 'Chapter books, no limits.', limits: [Infinity, Infinity], floor: 0, tricky: Infinity },
];
const levelOf = n => LEVELS[Math.min(8, Math.max(1, n || 1)) - 1];

// Level of every dictionary word, precomputed from the CMU Pronouncing Dictionary and the
// phonics scope (tools are in the leveling folder). Loaded only when a book needs scoring.
const WordLevels = {
  map: null, loading: null,
  load() {
    if (this.map) return Promise.resolve();
    return this.loading ||= fetch('vendor/levels/wordlevels.json').then(r => { if (!r.ok) throw new Error('Could not load word levels'); return r.json(); }).then(data => {
      const map = new Map();
      data.bands.forEach((list, band) => { for (const w of list.split(' ')) map.set(w, band + 1); });
      this.map = map;
    }).catch(e => { this.loading = null; throw e; });
  },
  // Level 1–8; words not in the dictionary count as Level 8 (tricky everywhere).
  of(word) {
    const w = word.toLowerCase().replace(/’/g, "'");
    return this.map.get(w) || this.map.get(w.replace(/'s$/, '')) || 8;
  },
};

// The text a reader sees on each page (the title is on page 1).
function storyPageTexts(story) {
  return story.pages.map((blocks, i) => (i === 0 ? story.title + '.\n' : '') + blocks.filter(b => b.t === 'p' || b.t === 'h').map(b => b.text).join('\n'));
}

// pageTexts: array of strings. names: character names (never tricky). levelOfWord: word -> 1..8.
function scoreLevel(pageTexts, { names = [] } = {}, levelOfWord) {
  const WORD = /[A-Za-z]+(?:['’][A-Za-z]+)*/g;
  const all = pageTexts.join('\n');
  // Character names: capitalized mid-sentence, never seen in lowercase.
  const lower = new Set((all.match(WORD) || []).filter(w => w === w.toLowerCase()).map(w => w.toLowerCase()));
  const exempt = new Set(names.map(n => n.toLowerCase()));
  for (const sent of all.split(/(?<=[.!?:]["'”’]?)\s+|\n+|["“”]/))
    (sent.match(WORD) || []).slice(1).forEach(w => {
      const lw = w.toLowerCase().replace(/['’]s$/, '');
      if (/^[A-Z][a-z]/.test(w) && !lower.has(lw) && levelOfWord(lw) > 1) exempt.add(lw);
    });
  const tokens = [], perPage = [], perSentence = [];
  for (const text of pageTexts) {
    const ws = text.match(WORD) || [];
    perPage.push(ws.length);
    for (const s of text.split(/(?<=[.!?])\s+/)) { const k = (s.match(WORD) || []).length; if (k) perSentence.push(k); }
    for (const w of ws) { const lw = w.toLowerCase(); if (!exempt.has(lw.replace(/['’]s$/, ''))) tokens.push(lw); }
  }
  const lv = tokens.map(levelOfWord);
  const p90 = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(0.9 * s.length))]; };
  const pageP90 = p90(perPage), sentP90 = p90(perSentence);
  const known = n => lv.filter(x => x <= n).length / Math.max(1, lv.length);
  const trickyPerPage = n => new Set(tokens.filter((w, i) => lv[i] > n)).size / Math.max(1, pageTexts.length);
  let level = 8;
  for (const L of LEVELS) {
    if (known(L.level) >= L.floor && trickyPerPage(L.level) <= L.tricky && pageP90 <= L.limits[0] && sentP90 <= L.limits[1]) { level = L.level; break; }
  }
  const tricky = [...new Set(tokens.filter((w, i) => lv[i] > level))];
  return { level, known: +known(level).toFixed(3), tricky, names: [...exempt] };
}

// Score a story (imports); falls back to a length-based guess if word levels can't load.
async function levelStory(story) {
  if (story.levelSource === 'manual') return story;
  try {
    await WordLevels.load();
    const r = scoreLevel(storyPageTexts(story), { names: story.names || [] }, w => WordLevels.of(w));
    Object.assign(story, { level: r.level, levelScheme: 2, levelSource: 'auto', levelInfo: { known: r.known, tricky: r.tricky.slice(0, 20) } });
  } catch (e) {
    console.warn('Leveling unavailable', e);
    Object.assign(story, { level: guessLevel(story.pages), levelScheme: 2, levelSource: 'estimate' });
  }
  return story;
}

// Stories saved before levels existed used 1–3; rescore them once.
async function migrateStoryLevels() {
  const old = (await DB.all('stories')).filter(s => s.levelScheme !== 2);
  if (!old.length) return;
  for (const s of old) { if (s.levelSource !== 'manual') s.level = { 1: 2, 2: 5, 3: 7 }[s.level] || s.level; await levelStory(s); await DB.put('stories', s); }
  STORY_CACHE = null;
  if (document.body.dataset.screen === 'library') renderLibrary();
}

// ---- Reader level ----------------------------------------------------------
// For each book a reader has read, the share of words on the pages they read

  }
  const last = s.pages.length - 1;
  for (const id of ['prevBtn', 'prevBtn2']) $('#' + id).disabled = B.page === 0;
  $('#nextBtn').disabled = false;
  $('#nextBtn2').textContent = B.page === last ? 'The end ✓' : 'Next ›';
  $('#bookProg').style.width = ((B.page + 1) / s.pages.length * 100) + '%';
  saveProgress();
  prepareBookAudio(ReadAlong.active && !ReadAlong.paused);
}
function pageSpeech(story, page) {
  const texts = (page === 0 ? [story.title] : []).concat((story.pages[page] || []).filter(b => ['h', 'p'].includes(b.t)).map(b => b.text));
  return texts.flatMap(text => {
    let cur = '', prev = ''; const sentences = [];
    for (const tk of tokenize(text)) {
      cur += tk.v;
      if (tk.w) prev = tk.v;
      else if (/[.!?]/.test(tk.v) && !(/^\./.test(tk.v.trim()) && ABBREV.test(prev))) { if (cur.trim()) sentences.push(cur.trim()); cur = ''; }
    }
    if (cur.trim()) sentences.push(cur.trim());
    return sentences;
  });
}
// Voice preparation stays invisible unless it takes more than 2 seconds; then a pair of
// headphones fills up as the page's words get ready.
function prepareBookAudio(reading = false) {
  const s = B.story, page = B.page, prep = $('#voicePrep');
  const next = (s.pages[page + 1] || []).filter(b => ['p', 'h'].includes(b.t)).flatMap(b => b.text.match(WORD_RE) || []);
  const nextSentences = pageSpeech(s, page + 1);
  const currentSentence = +($$('#pageInner .w[data-i]')[ReadAlong.cursor]?.dataset.s || 0);
  const here = () => B.story === s && B.page === page && document.body.dataset.screen === 'book';
  const icon = prep.querySelector('.prep-hp');
  if (!icon.firstElementChild.innerHTML) { icon.firstElementChild.innerHTML = HP_OUTLINE; icon.lastElementChild.innerHTML = HP_ICON.replace('class="hp-ico" ', ''); }
  let frac = 0, done = false;
  const set = f => { frac = f; icon.style.setProperty('--p', Math.round(f * 100) + '%'); prep.setAttribute('aria-label', `Preparing the voice: ${Math.round(f * 100)}%`); };
  clearTimeout(prep._timer); prep.classList.add('hidden'); set(0);
  if (!TTS.engine()) return;
  prep._timer = setTimeout(() => { if (!done && here()) prep.classList.remove('hidden'); }, 2000);
  TTS.prewarm([...B.pageWords, String(page + 1)], [`The end! Great reading, ${READER.name}!`, `Wonderful reading, ${READER.name}!`, 'Great reading!', 'Good reading! Keep going!'], {
    priorityPhrases: reading ? [...B.sentences.slice(currentSentence), ...nextSentences] : B.sentences.slice(0, 1),
    afterWords: next, afterPhrases: [...B.sentences, ...nextSentences],
    onProgress: (ready, total, error) => {
      if (!here()) return;
      if (error) { done = true; clearTimeout(prep._timer); prep.classList.add('hidden'); return; }
      set(total ? ready / total : 0);
      if (total && ready === total) finish();
    },
    onComplete: () => finish(),
  });
  function finish() {
    if (done || !here()) return; done = true; clearTimeout(prep._timer); set(1);
    if (!prep.classList.contains('hidden')) setTimeout(() => { if (here()) prep.classList.add('hidden'); }, 600);
  }
}

async function saveProgress() {
  const key = 'progress:' + READER.id, prog = (await KV.get(key)) || {};
  const prev = prog[B.story.id] || {};
  const done = prev.done || B.page === B.story.pages.length - 1;
  prog[B.story.id] = { page: B.page, ts: Date.now(), done, maxPage: Math.max(prev.maxPage || 0, B.page), ...(B.story.flowed ? { word: wordOffset(B.story.pages, B.page) } : {}) };
  await KV.set(key, prog);
  logEvent({ type: 'page', storyId: B.story.id, page: B.page, words: pageWordCount(B.story.pages[B.page] || []) });
}
function turn(d) {
  const n = B.page + d, last = B.story.pages.length - 1;
  ReadAlong.reset(); TTS.stop(); clearHighlights();
  if (n < 0) return;
  if (n > last) { finishBook(); return; }
  B.page = n; renderPage(d);
}
async function finishBook() {
  logEvent({ type: 'finish', storyId: B.story.id });
  const prog = (await KV.get('progress:' + READER.id)) || {}; prog[B.story.id] = { ...(prog[B.story.id] || {}), page: 0, done: true, ts: Date.now() }; await KV.set('progress:' + READER.id, prog);
  chime('win'); confetti(innerWidth / 2, innerHeight / 2, 24);
  TTS.say(`The end! Great reading, ${READER.name}!`);
  const pw = await practiceWords(12);
  modal(`<div style="text-align:center"><div style="font-size:64px">🏆</div><h3>You finished ${esc(B.story.title)}!</h3>
    <p class="muted">${pw.length ? `Want to play a game with your ${pw.length} practice words?` : 'Pick another book?'}</p>
    <div class="row" style="justify-content:center;margin-top:16px">${pw.length ? '<button class="btn teal" id="fGame">🎲 Play</button>' : ''}<button class="btn" id="fLib">📚 Books</button></div></div>`,
    (m, close) => { $('#fLib', m).onclick = () => { close(); renderLibrary(); }; if ($('#fGame', m)) $('#fGame', m).onclick = () => { close(); renderGames(); }; });
}
function clearHighlights() { $$('#pageInner .w.say, #pageInner .w.sent').forEach(e => e.classList.remove('say', 'sent')); }

// Tap = say the word, long-press = say the whole sentence.
function wireBook() {
  const inner = $('#board'); let timer = null, longFired = false, downEl = null, downXY = null;
  inner.addEventListener('pointerdown', e => {
    const w = e.target.closest('#pageInner .w'); if (!w) return;   // only words on the open page
    audioCtx(); downEl = w; longFired = false; downXY = [e.clientX, e.clientY];
    clearTimeout(timer);
    timer = setTimeout(() => { longFired = true; saySentence(w); }, 520);
  });
  const cancel = () => { clearTimeout(timer); };
  inner.addEventListener('pointermove', e => { if (downXY && Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 12) { cancel(); downEl = null; } });
  inner.addEventListener('pointercancel', () => { cancel(); downEl = null; });
  inner.addEventListener('pointerup', e => {
    cancel(); const w = e.target.closest('#pageInner .w');
    if (!w || w !== downEl || longFired) { downEl = null; return; }
    downEl = null; tapWord(w);
  });
  inner.addEventListener('contextmenu', e => e.preventDefault());
  inner.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('w')) { e.preventDefault(); tapWord(e.target); } });
  $('#prevBtn').onclick = $('#prevBtn2').onclick = () => turn(-1);
  $('#nextBtn').onclick = $('#nextBtn2').onclick = () => turn(1);
  $('#readPageBtn').onclick = () => readPage();
  $('#readAlongToggle').onclick = () => ReadAlong.paused ? ReadAlong.start() : ReadAlong.pause();
  $('#readAlongEnd').onclick = () => ReadAlong.reset();
  $('#readAloudBtn').onclick = () => readAloud();
  // Dragging a page corner or swiping is handled by the page-flip book (see buildBook).
  addEventListener('keydown', e => {
    if (document.body.dataset.screen !== 'book' || $('#modalRoot').firstChild) return;
    if (e.key === 'ArrowRight') turn(1); if (e.key === 'ArrowLeft') turn(-1);
  });
}
function tapWord(el) {
  ReadAlong.pause();
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); clearTimeout(el._hit); el._hit = setTimeout(() => el.classList.remove('hit'), 1200);
  const display = el.dataset.num || el.textContent;
  TTS.say(display, { word: true });
  recordTap(display, { storyId: B.story.id, page: B.page, properNoun: el.dataset.p === '1', how: el.closest('.title,h2') ? 'title' : el.dataset.num ? 'pageno' : 'tap' });
}
async function saySentence(el) {
  ReadAlong.pause();
  const si = +el.dataset.s; if (si < 0) return tapWord(el);
  clearHighlights();
  const spans = $$(`#pageInner .w[data-s="${si}"]`); spans.forEach(s => s.classList.add('sent'));
  el.classList.add('say');

}
function readPage() { ReadAlong.start(); }

// ===========================================================================
// Games — all built from the reader's weighted practice list
// ===========================================================================
const STARTERS = ['the', 'said', 'was', 'here', 'look', 'come', 'where', 'what', 'they', 'you'];
let GAME = null;

async function gameWords(n) {
  const recs = await practiceWords(n);
  const words = recs.map(r => ({ word: r.word, display: r.proper ? r.display : r.word }));
  const mastered = new Set((await DB.byReader('words', READER.id)).filter(r => r.box >= 5).map(r => r.word));
  const starter = words.length < 3;
  if (starter) for (const w of shuffle(STARTERS)) { if (words.length >= Math.min(n, 6)) break; if (!mastered.has(w) && !words.find(x => x.word === w)) words.push({ word: w, display: w }); }
  return { words, starter };
}

async function renderGames() {
  const { words, starter } = await gameWords(12);
  $('#gamesNote').textContent = !words.length ? 'You’ve practiced all your current words! Read a story to find more.' : starter
    ? 'Tap words you don’t know while reading, and they’ll show up here. For now, here are some starter words.'
    : `Playing with ${words.length} of your words: ${words.slice(0, 6).map(w => w.display).join(', ')}${words.length > 6 ? '…' : ''}`;
  const tiles = [
    { id: 'find', e: '👂', t: 'Listen & Find', d: 'Hear a word, tap the right one.', c: 'lvl2' },
    { id: 'match', e: '🃏', t: 'Memory Match', d: 'Match each word to its sound.', c: 'lvl3' },
    { id: 'fall', e: '✨', t: 'Falling Words', d: 'Say any floating word. Make it sparkle and earn a star!', c: 'lvl2' },
  ];
  if (S.recog) tiles.push({ id: 'say', e: '🎤', t: 'Say It!', d: Recog.ready ? 'Say a word, hear it, and earn a star.' : 'Needs speech recognition — tap to load it.', c: 'lvl1' });
  $('#gameTiles').innerHTML = tiles.map(g => `<button class="game-tile ${g.c}" data-g="${g.id}"><span class="e">${g.e}</span><b>${g.t}</b><span class="muted">${g.d}</span></button>`).join('');
  $$('#gameTiles [data-g]').forEach(b => b.onclick = () => startGame(b.dataset.g));
  show('games');
  TTS.prewarm(words.map(w => w.display), gamePhrases());
}

function gamePhrases() { return [...PRAISE, `Great listening, ${READER.name}!`, 'You matched them all!', `Great practicing, ${READER.name}!`, `You did it, ${READER.name}!`, 'You’ve practiced all your current words!']; }

async function startGame(kind) {
  if (GAME) { GAME.alive = false; GAME.cleanup?.(); }
  TTS.stop(); Recog.cancel(); Recog.closeMic();
  audioCtx();
  if (['say', 'fall'].includes(kind) && !Recog.ready) {
    const ok = await loadRecogWithModal(); if (!ok) return;
  }
  const { words } = await gameWords(kind === 'match' ? 6 : 8);
  GAME = { kind, words: shuffle(words), i: 0, stars: 0, firstTry: true, pool: await vocabPool(), alive: true, readerId: READER.id, round: 0 };
  $('#gameTitle').textContent = { find: 'Listen & Find', match: 'Memory Match', say: 'Say It!', fall: 'Falling Words' }[kind];
  $('#gameStars').textContent = '';
  logEvent({ type: 'game', game: kind });
  show('game');
  TTS.prewarm(words.map(w => w.display), gamePhrases());
  if (!words.length) return endGame('You’ve practiced all your current words!');
  if (kind === 'find') findRound(); else if (kind === 'match') matchGame(); else if (kind === 'fall') fallingGame(); else sayRound();
}
function addStar() { GAME.stars++; $('#gameStars').textContent = GAME.kind === 'fall' ? `⭐ ${GAME.stars} / 10` : '⭐'.repeat(Math.min(GAME.stars, 10)); }
function endGame(msg) {
  if (!GAME) return; GAME.alive = false; GAME.cleanup?.(); Recog.cancel(); Recog.closeMic(); chime('win'); confetti(innerWidth / 2, innerHeight / 2, 24);
  TTS.say(msg || `You did it, ${READER.name}!`);
  $('#gameArea').innerHTML = `<div style="font-size:80px">🏆</div><div class="feedback">${esc(msg || 'You did it!')}</div><div class="stars">${'⭐'.repeat(['say', 'fall'].includes(GAME.kind) ? GAME.stars : Math.max(1, GAME.stars))}</div>
    <div class="row"><button class="btn teal" id="again">Play again</button><button class="btn" id="toGames">More games</button></div>`;
  $('#again').onclick = () => startGame(GAME.kind); $('#toGames').onclick = renderGames;
}

// Shrink text until it fits on one line in its box (long words in game buttons and cards).
function fitText(el, min = 12) {
  el.style.fontSize = ''; el.style.whiteSpace = 'nowrap';
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 1 && size > min) { size -= 1; el.style.fontSize = size + 'px'; }
}
const pipsHTML = (done, total) => `<div class="pips" role="img" aria-label="Word ${done + 1} of ${total}">${Array.from({ length: total }, (_, k) => `<i class="${k < done ? 'done' : k === done ? 'now' : ''}"></i>`).join('')}</div>`;
// ---- Listen & Find ----
function findRound() {
  const g = GAME; if (!g.alive) return;
  if (g.i >= g.words.length) return endGame(`Great listening, ${READER.name}!`);
  const target = g.words[g.i]; g.firstTry = true;
  const opts = shuffle([target.display, ...distractors(target.word, g.pool, 3)]);
  $('#gameArea').innerHTML = `<button class="speaker hp-btn" id="hear" title="Hear it again" aria-label="Hear the word again">${HP_ICON}</button>
    <div class="feedback" id="fb">Which word did you hear?</div>
    <div class="choices">${opts.map(o => `<button class="choice" data-w="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    ${pipsHTML(g.i, g.words.length)}`;
  $$('.choice').forEach(b => fitText(b, 16));
  TTS.prewarm([target.display, ...opts], [...PRAISE, `Great listening, ${READER.name}!`], { append: true });
  const hear = () => { if (g === GAME && g.alive) return TTS.say(target.display, { word: true }); };
  $('#hear').onclick = hear; setTimeout(hear, 350);
  $$('.choice').forEach(b => b.onclick = async () => {
    if (!g.alive || b.classList.contains('wrong')) return;
    if (sameWord(b.dataset.w, target.word)) {
      b.classList.add('right'); chime('good'); const r = b.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top);
      if (g.firstTry) { addStar(); recordAnswer(target.word, 'right', { game: 'find' }); }
      $('#fb').textContent = praise();
      $$('.choice').forEach(c => c.disabled = true);
      await TTS.say($('#fb').textContent); await sleep(500);
      g.i++; findRound();
    } else {
      b.classList.add('wrong'); chime('oops');
      if (g.firstTry) recordAnswer(target.word, 'wrong', { game: 'find', picked: normWord(b.dataset.w) });
      g.firstTry = false;
      $('#fb').textContent = `That one says “${b.dataset.w}”. Listen again!`;
      await TTS.say(b.dataset.w, { word: true }); await sleep(250); if (g.alive) hear();
    }
  });
}

// ---- Memory Match: printed words on one side, their sounds on the other ----
// Words and sounds are two separate groups with different card backs; each turn is one
// card from each group. Tapping a second card from the same group switches to it.
function matchGame() {
  const g = GAME, words = g.words.slice(0, innerWidth < 500 ? 4 : 6);
  const wordCards = shuffle(words.map((w, k) => ({ k, w, type: 'word' })));
  const soundCards = shuffle(words.map((w, k) => ({ k, w, type: 'sound' })));
  const cards = [...wordCards, ...soundCards];
  const cols = innerWidth >= 760 ? words.length : words.length <= 4 ? words.length : 3;   // one row per group when there's room
  const card = (c, i) => c.type === 'word'
    ? `<button class="mem word" data-i="${i}" aria-label="Word card"><span class="b"></span><span class="f">${esc(c.w.display)}</span></button>`
    : `<button class="mem sound" data-i="${i}" aria-label="Sound card"><span class="b">${HP_ICON}</span><span class="f">${HP_ICON}</span></button>`;
  $('#gameArea').innerHTML = `<div class="feedback" id="fb">Find the word that matches the sound!</div>
    <div class="mem-groups"><div class="mem-group" style="--cols:${cols}" aria-label="Words">${wordCards.map((c, i) => card(c, i)).join('')}</div>
    <div class="mem-group" style="--cols:${cols}" aria-label="Sounds">${soundCards.map((c, i) => card(c, i + wordCards.length)).join('')}</div></div>`;
  $$('.mem.word .f').forEach(f => fitText(f, 12));
  let up = null, lock = false, found = 0, tries = {};
  $$('.mem').forEach(el => el.onclick = async () => {
    if (lock || el.classList.contains('done') || !g.alive) return;
    const c = cards[+el.dataset.i];
    if (c.type === 'sound') TTS.say(c.w.display, { word: true });
    if (up && up[0] === el) return;
    if (up && up[1].type === c.type) { up[0].classList.remove('up', 'picked'); up = null; }   // switch within a group
    el.classList.add('up'); chime('flip');
    if (!up) { up = [el, c]; el.classList.add('picked'); return; }
    lock = true;
    const [e1, c1] = up, e2 = el, c2 = c; up = null; e1.classList.remove('picked');
    if (c1.k === c2.k) {
      await sleep(400); e1.classList.add('done'); e2.classList.add('done'); chime('good'); addStar(); found++;
      const r = e2.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, 8);
      await TTS.say(c1.w.display, { word: true });
      recordAnswer(c1.w.word, (tries[c1.k] || 0) <= 2 ? 'right' : 'seen', { game: 'match' });
      lock = false;
      if (found === words.length) setTimeout(() => endGame(`You matched them all!`), 600);
    } else {
      tries[c1.k] = (tries[c1.k] || 0) + 1; tries[c2.k] = (tries[c2.k] || 0) + 1;
      await sleep(1100); e1.classList.remove('up'); e2.classList.remove('up'); lock = false;
    }
  });
}

// ---- Say It! — practice without visible grading ----
async function sayRound() {
  const g = GAME;
  if (!g?.alive) return;
  if (g.i >= g.words.length) { Recog.closeMic(); return endGame(`Great practicing, ${READER.name}!`); }
  const target = g.words[g.i], round = ++g.round;
  const active = () => GAME === g && g.alive && g.round === round;
  let busy = false;
  $('#gameArea').innerHTML = `<div class="prompt-word">${esc(target.display)}</div>
    <div class="feedback" id="fb" aria-live="polite">Say this word.</div>
    <button class="mic" id="mic" title="Say the word">🎤</button><div class="meter"><i id="lvl"></i></div>
    <div class="row"><button class="hp-btn hidden" id="hearPractice">${HP_ICON}Hear it again</button><button class="btn small ghost" id="skip">Next ›</button></div>
    ${pipsHTML(g.i, g.words.length)}`;
  const mic = $('#mic'), fb = $('#fb'), hear = $('#hearPractice');
  const next = () => {
    if (!active()) return;
    ++g.round; Recog.cancel(); Recog.closeMic(); TTS.stop(); g.i++; sayRound();
  };
  $('#skip').onclick = next;
  hear.onclick = () => { if (active() && !busy) TTS.say(target.display, { word: true }); };
  async function listen() {
    if (!active() || busy) return;
    busy = true; TTS.stop(); hear.classList.add('hidden');
    mic.classList.add('rec'); mic.title = 'Finish listening'; fb.textContent = 'Listening…';
    let rec;
    try { rec = await Recog.record({ maxMs: 7000, silenceMs: 1000, noSpeechMs: 7000, onLevel: v => { if (active()) $('#lvl').style.width = Math.min(100, v * 400) + '%'; } }); }
    catch (e) {
      if (active()) { mic.classList.remove('rec'); fb.textContent = 'Allow the microphone, then tap to try again.'; busy = false; }
      return;
    }
    if (!active()) return;
    Recog.closeMic(); mic.classList.remove('rec'); mic.disabled = true;
    if (!rec.speech) {
      busy = false; mic.disabled = false; fb.textContent = 'Tap the microphone when you’re ready.'; return;
    }
    // Award effort immediately; recognition has no effect on stars or the response.
    addStar(); chime('good');
    const pos = mic.getBoundingClientRect(); confetti(pos.left + pos.width / 2, pos.top, 8);
    fb.textContent = '⭐ Keep practicing!';
    const assessment = (async () => {
      let result = null;
      try { result = await Recog.transcribe(rec); } catch (e) { console.warn('Practice recognition unavailable', e); }
      // Capture the reader identity so navigation cannot credit a different reader.
      await recordPracticeAttempt(target, judgeWord(target.word, result), g.readerId);
    })().catch(e => console.warn('Could not save practice attempt', e));
    const played = await TTS.say(target.display, { word: true });
    if (!active()) return;
    if (!played) {
      busy = false; hear.classList.remove('hidden'); fb.textContent = 'Tap to hear the word, or choose Next.'; return;
    }
    await assessment;
    if (!active()) return;
    fb.textContent = '⭐ One more word!';
    await sleep(650); if (active()) next();
  }
  mic.onclick = () => { if (busy && mic.classList.contains('rec')) Recog.stopEarly(); else listen(); };
  // Start listening after the word appears. Subsequent rounds need no extra taps.
  await sleep(400); if (active()) listen();
}

// ---- Falling Words: choose any visible word; there are no lost lives or misses. ----
function fallingGame() {
  const g = GAME, active = () => GAME === g && g.alive;
  $('#gameArea').innerHTML = `<div class="feedback" id="fallFeedback" role="status">Say any word you see!</div>
    <div class="fall-sky" id="fallSky" aria-label="Slowly falling practice words"></div>
    <div class="row"><span id="fallMic" class="muted">🎤 Getting ready…</span><div class="meter"><i id="fallLevel"></i></div></div>
    <div class="row"><button class="btn small" id="fallPause">⏸ Pause</button><button class="btn small ghost" id="fallDone">Done practicing</button></div>
    <div class="muted">Words come back around. Take your time. · 10 stars to finish</div>`;
  const sky = $('#fallSky');
  Object.assign(g, { falling: new Map(), clock: 0, spawnAt: 0, sequence: 0, paused: false, processing: false, hearing: false, listenVersion: 0 });
  let raf, last = performance.now();
  const spawn = () => {
    const available = g.words.filter(w => ![...g.falling.values()].some(f => sameWord(f.word, w.word)));
    if (!available.length) return;
    const w = available[g.sequence % available.length], id = ++g.sequence;
    const el = document.createElement('div'); el.className = 'fall-word'; el.textContent = w.display;
    el.dataset.id = id; sky.appendChild(el);
    const lane = id % 2, x = sky.clientWidth * (lane ? .52 : .03);
    let font = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > sky.clientWidth * .45 && font > 16) el.style.fontSize = (--font) + 'px';
    g.falling.set(id, { ...w, id, el, born: g.clock, x, y: 16 });
    g.spawnAt = g.clock + 3200;
  };
  const frame = now => {
    if (!active()) return;
    const dt = Math.min(100, now - last); last = now;
    if (!g.paused && !g.processing && !g.hearing && !document.hidden) {
      g.clock += dt;

function resultWords(res) {
  if (!res) return [];
  const ws = (res.words?.length ? res.words : (res.text || '').split(/\s+/).map(w => ({ word: w })));
  return ws.flatMap(w => (String(w.word).match(WORD_RE) || []).map(t => ({ w: normWord(t), start: w.start, end: w.end, p: w.probability ?? 1 })));

// Rough sound-alike key: enough to tell "sad"/"said" or "brans"/"branch" are near misses,

// would make it "hear" the right word even when the child said something else.
//   right     – the target appears in any variant
//   close     – something that sounds close (child probably said it; ask to try again)
//   different – a clearly different word, heard with confidence

// "I'll read it!" — record the child reading the page, then score it quietly.
// The child only ever gets encouragement; details go to the grown-ups' view.
async function readAloud() {
  ReadAlong.reset();
  if (!Recog.ready && !(await loadRecogWithModal())) return;
  TTS.stop(); clearHighlights();
  // Score the story text only — not the title, byline or page number.
  const spans = $$('#pageInner .w:not([data-num])').filter(e => !e.closest('.title'));
  const ref = spans.map(e => normWord(e.textContent));
  if (!ref.length) return;
  const bar = document.createElement('div'); bar.className = 'listen-bar';
  bar.innerHTML = `<span>🎤 Read the page out loud…</span><div class="meter"><i></i></div><button class="btn small primary">I’m done</button>`;
  document.body.appendChild(bar);
  bar.querySelector('button').onclick = () => Recog.stopEarly();
  const page = B.page, story = B.story;
  let rec;
  try { rec = await Recog.record({ maxMs: 29000, silenceMs: 3500, noSpeechMs: 8000, onLevel: v => { const i = bar.querySelector('.meter i'); if (i) i.style.width = Math.min(100, v * 400) + '%'; } }); }
  catch { bar.remove(); toast('Microphone not available'); return; }
  bar.querySelector('span').textContent = '⭐ Checking…'; bar.querySelector('button').remove();
  let res = null;
  try { if (rec.speech) res = [].concat(await Recog.transcribe(rec)); } catch (e) { console.warn(e); }
  bar.remove(); Recog.closeMic();
  if (!res || !res.some(r => resultWords(r).length)) { toast('I didn’t hear any reading. Try again!'); return; }
  const sc = scoreReading(ref, res);
  const stars = sc.ratio >= 0.9 ? 3 : sc.ratio >= 0.7 ? 2 : 1;
  const missed = [], hes = [];
  sc.al.forEach((a, k) => {
    if (a.status === 'unreached') return;
    const w = spans[k].textContent;
    if (a.status === 'skip' || a.status === 'sub') { missed.push(normWord(w)); recordAnswer(w, 'read-miss', { storyId: story.id, page, heard: a.j >= 0 ? sc.hyp[a.j]?.w || '' : '' }); }
    else if (a.hes) { hes.push(normWord(w)); recordAnswer(w, 'read-hes', { storyId: story.id, page, gap: a.gap }); }
  });
  logEvent({ type: 'readaloud', storyId: story.id, page, reached: sc.reached, ok: sc.ok, missed, hes, heard: sc.hyp.map(h => h.w).join(' ') });
  chime(stars === 3 ? 'win' : 'good'); confetti(innerWidth / 2, innerHeight - 120, 8 + stars * 6);
  const msg = stars === 3 ? `Wonderful reading, ${READER.name}!` : stars === 2 ? 'Great reading!' : 'Good reading! Keep going!';
  toast(`${'⭐'.repeat(stars)}  ${msg}`, 3000); TTS.say(msg);
}

const BLOCK_TAGS = new Set(['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI', 'BLOCKQUOTE', 'PRE', 'DD', 'DT', 'FIGCAPTION', 'TD']);
const clean = s => s.replace(/\s+/g, ' ').trim();

// Walk a document body and produce flat blocks. resolveImg(src) -> data URL | null (may be async).
async function htmlToBlocks(root, resolveImg) {
  const blocks = [];
  const walk = async el => {
    for (const node of el.childNodes) {
      if (node.nodeType !== 1) continue;
      const tag = node.tagName.toUpperCase();
      if (['SCRIPT', 'STYLE', 'NAV', 'HEADER', 'FOOTER', 'NOSCRIPT', 'SVG', 'TEMPLATE', 'HEAD'].includes(tag)) continue;
      if (tag === 'IMG' || tag === 'IMAGE') {
        const src = node.getAttribute('src') || node.getAttribute('xlink:href') || node.getAttribute('href');
        const url = src && resolveImg ? await resolveImg(src) : null;
        if (url) blocks.push({ t: 'img', src: url, alt: node.getAttribute('alt') || '' });
        continue;
      }
      if (BLOCK_TAGS.has(tag)) {
        if (node.querySelector('img,image')) for (const im of node.querySelectorAll('img,image')) {
          const src = im.getAttribute('src') || im.getAttribute('xlink:href') || im.getAttribute('href');
          const url = src && resolveImg ? await resolveImg(src) : null;
          if (url) blocks.push({ t: 'img', src: url, alt: im.getAttribute('alt') || '' });
        }
        const text = clean(node.textContent || '');
        if (text) blocks.push({ t: /^H[1-6]$/.test(tag) ? 'h' : 'p', text, lvl: /^H[1-6]$/.test(tag) ? +tag[1] : 0 });
        continue;
      }
      // a DIV that only contains text acts like a paragraph
      if (tag === 'DIV' && ![...node.children].some(c => BLOCK_TAGS.has(c.tagName.toUpperCase()) || c.tagName.toUpperCase() === 'DIV' || c.tagName.toUpperCase() === 'IMG')) {
        const text = clean(node.textContent || ''); if (text) blocks.push({ t: 'p', text }); continue;
      }
      await walk(node);
    }
  };
  await walk(root);
  return blocks;
}

// Cut Project Gutenberg front and back matter.
function stripGutenberg(blocks) {
  const s = blocks.findIndex(b => /\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG/i.test(b.text || ''));
  const e = blocks.findIndex(b => /\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG/i.test(b.text || ''));
  let out = blocks;
  if (e > 0) out = out.slice(0, e);
  if (s >= 0) out = out.slice(s + 1);
  return out.filter(b => !/project gutenberg/i.test(b.text || '') || countWords(b.text) > 60);
}

function finishImport({ title, author, blocks, cover }) {
  blocks = stripGutenberg(blocks);
  // A run of headings at the start (title page) collapses into the title.
  const h = blocks.filter(b => b.t === 'h');
  if (!title) title = h[0]?.text || 'My story';
  // Drop headings that just repeat the title, and promote only top-level-ish headings to chapter breaks.
  const minLvl = Math.min(...h.map(b => b.lvl || 2), 9);
  blocks = blocks.filter(b => !(b.t === 'h' && clean(b.text).toLowerCase() === clean(title).toLowerCase()));
  blocks = blocks.map(b => b.t === 'h' && (b.lvl || 2) > minLvl + 1 ? { t: 'p', text: b.text } : b);
  const pages = paginate(blocks.filter(b => b.t !== 'break' || true));
  if (!pages.length) throw new Error('No readable text was found in that file.');
  return { id: 'u-' + uid(), title: clean(title).slice(0, 120), author: author ? clean(author).slice(0, 120) : '', level: guessLevel(pages), cover: '📗', coverImg: cover || null, pages, added: Date.now() };
}

async function importText(raw, name) {
  const st = storyFromScript({ text: raw.replace(/\r\n?/g, '\n'), title: '' });
  if (!st.title || st.title === 'My story') st.title = (name || 'My story').replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
  // Strip Gutenberg boilerplate from plain-text books too.
  if (/PROJECT GUTENBERG/i.test(raw)) {
    const body = raw.split(/\*\*\*\s*START OF (?:THE|THIS) PROJECT GUTENBERG[^\n]*\n/i).pop().split(/\*\*\*\s*END OF (?:THE|THIS) PROJECT GUTENBERG/i)[0];
    const t = raw.match(/^Title:\s*(.+)$/m)?.[1], a = raw.match(/^Author:\s*(.+)$/m)?.[1];
    const paras = body.replace(/\r\n?/g, '\n').split(/\n\s*\n/).map(clean).filter(Boolean);
    const blocks = paras.map(p => /^(CHAPTER|Chapter)\s+[\dIVXLC]+\b/.test(p) && countWords(p) < 14 ? { t: 'h', text: p } : { t: 'p', text: p });
    return finishImport({ title: t || st.title, author: a, blocks });
  }
  return st;
}

async function importHTML(raw, name) {
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  const imgs = src => /^(data:image|https?:)/i.test(src) ? src : null;
  const blocks = await htmlToBlocks(doc.body, imgs);
  return finishImport({ title: doc.querySelector('title')?.textContent || (name || '').replace(/\.[^.]+$/, ''), author: doc.querySelector('meta[name=author]')?.content, blocks });
}

let JSZipLoad = null;
function loadJSZip() {
  return JSZipLoad ||= new Promise((res, rej) => {
    if (window.JSZip) return res(window.JSZip);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => res(window.JSZip); s.onerror = () => { JSZipLoad = null; rej(new Error('Could not load the EPUB reader (JSZip).')); };
    document.head.appendChild(s);
  });
}
const resolvePath = (base, rel) => {
  rel = decodeURIComponent(rel.split('#')[0]);
  const parts = (base.includes('/') ? base.slice(0, base.lastIndexOf('/') + 1) : '').concat(rel).split('/');
  const out = []; for (const p of parts) { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); }
  return out.join('/');
};
function parseXML(text, type = 'application/xml') {
  let d = new DOMParser().parseFromString(text, type);
  if (d.querySelector('parsererror')) d = new DOMParser().parseFromString(text, 'text/html');
  return d;
}
async function importEPUB(file) {
  const JSZip = await loadJSZip();
  const zip = await JSZip.loadAsync(file);
  const read = p => zip.file(p)?.async('string');
  const container = parseXML(await read('META-INF/container.xml') || '');
  const opfPath = container.querySelector('rootfile')?.getAttribute('full-path');
  if (!opfPath) throw new Error('This EPUB is missing its table of contents (OPF).');
  const opf = parseXML(await read(opfPath));
  const pick = sel => [...opf.getElementsByTagName('*')].find(e => e.localName === sel)?.textContent;
  const title = pick('title'), author = pick('creator');
  const manifest = {};
  for (const it of [...opf.getElementsByTagName('*')].filter(e => e.localName === 'item')) manifest[it.getAttribute('id')] = { href: resolvePath(opfPath, it.getAttribute('href')), type: it.getAttribute('media-type'), props: it.getAttribute('properties') || '' };
  const spine = [...opf.getElementsByTagName('*')].filter(e => e.localName === 'itemref' && e.getAttribute('linear') !== 'no').map(e => manifest[e.getAttribute('idref')]).filter(Boolean);
  const coverId = [...opf.getElementsByTagName('*')].find(e => e.localName === 'meta' && e.getAttribute('name') === 'cover')?.getAttribute('content');
  const coverItem = Object.values(manifest).find(m => m.props.includes('cover-image')) || manifest[coverId];
  const imgCache = new Map();
  const toDataURL = async path => {
    if (imgCache.has(path)) return imgCache.get(path);
    const f = zip.file(path); if (!f) return null;
    const b64 = await f.async('base64');
    if (b64.length > 2.5e6) return null;      // skip huge images (~1.8 MB)
    const ext = path.split('.').pop().toLowerCase();
    const mime = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' }[ext] || 'image/*';
    const url = `data:${mime};base64,${b64}`; imgCache.set(path, url); return url;
  };
  const blocks = [];
  for (const item of spine) {
    if (!/x?html/.test(item.type || 'html')) continue;
    const doc = parseXML(await read(item.href) || '', 'application/xhtml+xml');
    const body = doc.querySelector('body') || doc.documentElement;
    const b = await htmlToBlocks(body, src => /^data:/.test(src) ? src : toDataURL(resolvePath(item.href, src)));
    if (!b.length) continue;
    if (!b.some(x => x.text && countWords(x.text) > 0) && !b.some(x => x.t === 'img')) continue;
    blocks.push({ t: 'break' }, ...b);
  }
  // A leading image-only section that is just the cover duplicates the cover tile; drop it.
  const cover = coverItem ? await toDataURL(coverItem.href) : null;
  const firstText = blocks.findIndex(b => b.text);
  const cleaned = blocks.filter((b, i) => !(b.t === 'img' && i < firstText && cover && b.src === cover));
  return finishImport({ title, author, blocks: cleaned, cover });
}

async function importFile(file) {
  const name = file.name || 'story';
  if (/\.epub$/i.test(name) || file.type === 'application/epub+zip') return importEPUB(file);
  const text = await file.text();
  if (/\.x?html?$/i.test(name) || /^\s*<(!doctype|html)/i.test(text)) return importHTML(text, name);
  return importText(text, name);
}

function storySource(st) {
  const lines = [`# ${st.title}`];
  if (st.author) lines.push(`@author ${st.author}`);
  if (st.level) lines.push(`@level ${st.level}`);
  if (st.names?.length) lines.push(`@names ${st.names.join(', ')}`);
  const pages = st.pages.map(blocks => blocks.map(b => b.t === 'pic' ? `@pic ${b.text}` : b.t === 'h' ? `## ${b.text}` : b.t === 'p' ? b.text : b.t === 'img' ? `@img ${b.alt || 'picture'}` : '').filter(Boolean).join('\n\n'));
  return lines.join('\n') + '\n' + pages.join('\n---\n') + '\n';
}
