// Recording is confined to the parent dialog and always stops when it closes.
let cancelParentRecording = null;
function openParentVoice(onSaved) {
  TTS.stop(); Recog.cancel(); Recog.closeMic();
  let recorder = null, stream = null, timer = null, closed = false, draft = null, busy = false;
  const cleanup = () => {
    closed = true; clearTimeout(timer);
    if (recorder?.state === 'recording') recorder.stop();
    stream?.getTracks().forEach(t => t.stop()); stream = null;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    if (cancelParentRecording === cleanup) cancelParentRecording = null;
  };
  cancelParentRecording?.(); cancelParentRecording = cleanup;
  modal(`<h3>Add a parent voice</h3>
    <p>Record 5–10 seconds in a quiet room, or choose a recording of your own voice.</p>
    <p class="note">Try: “Hello, let’s read together. Take your time. Every word is a chance to learn something new.”</p>
    <div class="row"><label>Name</label><input class="field" id="pvName" value="My voice" maxlength="60"></div>
    <div class="row"><button class="btn teal" id="pvRecord">🎤 Record</button><button class="btn hidden" id="pvStop">Stop</button><button class="btn" id="pvPick">Choose audio</button><input class="hidden" type="file" id="pvFile" accept="audio/*"></div>
    <p class="note" id="pvStatus" role="status">Your recording stays on this device. Only the voice profile is saved.</p>
    <div class="row"><button class="btn primary" id="pvSave" disabled>Save &amp; use voice</button><button class="btn ghost" id="pvCancel">Cancel</button></div>`, (m, close) => {
      const status = $('#pvStatus', m), record = $('#pvRecord', m), stop = $('#pvStop', m), save = $('#pvSave', m);
      const leave = () => { cleanup(); close(); };
      $('#pvCancel', m).onclick = leave;
      // Cover clicking the dialog backdrop as well as the Cancel button.
      m.parentElement.addEventListener('click', e => { if (e.target === m.parentElement) cleanup(); });
      async function prepare(blob) {
        if (closed) return;
        busy = true; record.disabled = true; $('#pvPick', m).disabled = true; save.disabled = true;
        status.textContent = 'Preparing your recording…';
        try {
          if (blob.size > 20 * 1024 * 1024) throw new Error('Choose a short recording under 20 MB.');
          const ctx = audioCtx(), decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
          if (decoded.duration < 3) throw new Error('Please record at least 3 seconds of clear speech.');
          const duration = Math.min(10, decoded.duration), offline = new OfflineAudioContext(1, Math.ceil(duration * 24000), 24000);
          const source = offline.createBufferSource(); source.buffer = decoded; source.connect(offline.destination); source.start();
          const rendered = await offline.startRendering();
          if (closed) return;
          draft = Float32Array.from(rendered.getChannelData(0));
          const rms = Math.sqrt(draft.reduce((sum, n) => sum + n * n, 0) / draft.length);
          if (rms < 0.002) throw new Error('That recording is very quiet. Please record closer to the microphone.');
          status.textContent = 'Recording ready. Save to create your voice profile.'; save.disabled = false;
        } catch (e) { if (!closed) status.textContent = e.message; draft = null; }
        finally { busy = false; if (!closed) { record.disabled = false; $('#pvPick', m).disabled = false; } }
      }
      record.onclick = async () => {
        if (busy) return;
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { status.textContent = 'Recording needs HTTPS and microphone support. You can choose an audio file instead.'; return; }
        record.disabled = true; save.disabled = true;
        try {
          try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch {}
          stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
          if (closed) { stream.getTracks().forEach(t => t.stop()); return; }
          const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t));
          recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
          const chunks = [];
          recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
          recorder.onstop = () => {
            clearTimeout(timer); stream?.getTracks().forEach(t => t.stop()); stream = null;
            try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
            stop.classList.add('hidden'); record.disabled = false; $('#pvPick', m).disabled = false;
            if (!closed) prepare(new Blob(chunks, { type: recorder.mimeType }));
          };
          recorder.onerror = () => { if (!closed) status.textContent = 'Recording failed. Choose an audio file or try again.'; stream?.getTracks().forEach(t => t.stop()); };
          recorder.start(); stop.classList.remove('hidden'); $('#pvPick', m).disabled = true;
          status.textContent = 'Recording… read the passage above. Stops after 10 seconds.';
          timer = setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 10000);
        } catch (e) { if (!closed) { status.textContent = 'Could not record: ' + e.message; record.disabled = false; } stream?.getTracks().forEach(t => t.stop()); try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {} }
      };
      stop.onclick = () => { if (recorder?.state === 'recording') recorder.stop(); };
      $('#pvPick', m).onclick = () => $('#pvFile', m).click();
      $('#pvFile', m).onchange = e => { const file = e.target.files[0]; if (file) prepare(file); };
      save.onclick = async () => {
        if (!draft || busy) return;
        const name = $('#pvName', m).value.trim(); if (!name) { status.textContent = 'Give your voice a name first.'; return; }
        busy = true; save.disabled = true; record.disabled = true; $('#pvPick', m).disabled = true;
        status.textContent = 'Creating your voice… the first use downloads PocketTTS and its voice encoder.';
        let off = () => {};
        off = Pocket.onStatus(st => { if (!closed) status.textContent = st.label; });
        try {
          const embedding = await Pocket.clone(draft);
          if (closed) return;
          const profiles = await KV.get('pocketProfiles') || [], profile = { id: uid(), name, created: Date.now(), embedding };
          profiles.push(profile); await KV.set('pocketProfiles', profiles);
          S.pocketVoice = 'parent:' + profile.id; S.engine = 'pocket'; await saveSettings();
          leave(); onSaved(); toast('Parent voice saved. Use Try it to hear a sample.');
        } catch (e) { if (!closed) status.textContent = 'Could not create voice: ' + e.message; }
        finally { off(); busy = false; if (!closed) { save.disabled = false; record.disabled = false; $('#pvPick', m).disabled = false; } }
      };
    });
  // Navigation also releases any recording, even if the dialog is replaced.
}

async function exportBackup() {

  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `tapread-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importBackup(data) {
  if (data.app !== 'tapread') throw new Error('Not a Tap & Read backup.');
  for (const s of ['readers', 'stories', 'words']) for (const x of data[s] || []) await DB.put(s, x);
  for (const e of data.events || []) { const { id, ...rest } = e; await DB.put('events', rest); }
  for (const [k, v] of Object.entries(data.kv || {})) if (v) await KV.set(k, v);
  if (data.parentVoices) {
    if (!Array.isArray(data.parentVoices) || data.parentVoices.length > 50) throw new Error('Invalid voice profiles in backup');
    const profiles = data.parentVoices.map(v => { if (typeof v.id !== 'string' || typeof v.name !== 'string') throw new Error('Invalid voice name'); return { id: v.id, name: v.name.slice(0, 60), created: v.created, embedding: validatePocketEmbedding(v.embedding) }; });
    await KV.set('pocketProfiles', profiles);
  }
  if (data.settings) { S = { ...DEFAULT_SETTINGS, ...data.settings }; await saveSettings(); }
  STORY_CACHE = null;
}

// ---------- Speech lab: measure recognition accuracy on this child ----------
// Grown-up chooses whether the next attempt will be said correctly or deliberately
// mispronounced; the reader says the word; we record what the recognizer decided.
let LAB = { trials: null, word: null };
// Store lab recordings at 16 kHz (what Whistle uses) to keep them small.
function to16k(rec) {
  const ratio = rec.sampleRate / 16000; if (ratio <= 1) return { samples: rec.samples.slice(), sampleRate: rec.sampleRate };
  const n = Math.floor(rec.samples.length / ratio), out = new Float32Array(n);
  for (let i = 0; i < n; i++) { const a = Math.floor(i * ratio), b = Math.min(rec.samples.length, Math.floor((i + 1) * ratio)); let sum = 0; for (let j = a; j < b; j++) sum += rec.samples[j]; out[i] = sum / Math.max(1, b - a); }
  return { samples: out, sampleRate: 16000, speech: true };
}
async function renderLab(body, reader) {
  if (!LAB.trials) LAB.trials = (await KV.get('labTrials')) || [];
  const t = LAB.trials.filter(x => !reader || x.readerId === reader.id);
  const good = t.filter(x => x.intent === 'correct'), bad = t.filter(x => x.intent === 'wrong');
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const frr = good.filter(x => x.verdict === 'different').length, unclear = good.filter(x => x.verdict === 'unclear').length, almost = good.filter(x => x.verdict === 'close').length;
  const far = bad.filter(x => x.verdict === 'right').length;
  if (!LAB.word) LAB.word = await labNextWord();
  body.innerHTML = `
  <div class="panel"><h3>Speech lab</h3>
    <p class="note">Checks how well speech recognition hears <b>this</b> reader before you trust the Say It game or read-aloud stats. Pick how the next word will be said, have the reader say it (or mispronounce it on purpose — “wabbit” for rabbit), and the lab records what the recognizer decided. About 30 correct and 15 mispronounced tries gives a usable picture.</p>
    ${Recog.ready ? '' : `<div class="row"><button class="btn teal" id="labLoad">Load speech recognition (17 MB)</button></div>`}
    <div class="${Recog.ready ? '' : 'hidden'}" style="text-align:center">
      <div class="prompt-word" style="display:inline-block;margin:10px 0">${esc(LAB.word)}</div>
      <div class="row" style="justify-content:center"><button class="btn small" id="labNext">↻ Different word</button><button class="hp-btn icon" id="labHear" aria-label="Hear the word">${HP_ICON}</button></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn teal" data-intent="correct">🎤 Say it correctly</button>
        <button class="btn primary" data-intent="wrong">🎤 Say it wrong on purpose</button></div>
      <div class="row" style="justify-content:center"><div class="meter"><i id="labLvl"></i></div></div>
      <div class="feedback" id="labOut"></div></div></div>
  <div class="cards">
    <div class="card"><div class="n">${t.length}</div><div class="l">tries${reader ? ' for ' + esc(reader.name) : ''}</div></div>
    <div class="card"><div class="n">${pct(frr, good.length)}</div><div class="l">correct readings marked wrong (${frr}/${good.length})</div></div>
    <div class="card"><div class="n">${pct(almost, good.length)}</div><div class="l">correct readings “almost, try again” (${almost}/${good.length})</div></div>
    <div class="card"><div class="n">${pct(unclear, good.length)}</div><div class="l">correct readings “didn’t catch that”</div></div>
    <div class="card"><div class="n">${pct(far, bad.length)}</div><div class="l">wrong readings accepted (${far}/${bad.length})</div></div>
  </div>
  <div class="panel"><h3>How to read this</h3><p class="note">The first number matters most: missed recognitions can keep familiar words in practice longer. Say It never shows a grade or withholds a star. False acceptances can retire a word too soon, so use these results as a guide.</p></div>
  <div class="panel"><h3>Compare methods</h3><p class="note">Re-runs every saved recording through a single pass and through the four pitch-shifted passes (100%, 90%, 80%, 72%), so you can see whether the extra passes help with this reader. Recordings are saved in this browser (only tries made after this update).</p>
    <div class="row"><button class="btn small teal" id="labCmp" ${Recog.ready ? '' : 'disabled'}>Compare on ${t.filter(x => x.saved).length} saved recordings</button><span class="muted" id="labCmpMsg"></span></div><div id="labCmpOut"></div></div>
  <div class="panel"><h3>Tries</h3><div class="row"><button class="btn small" id="labCsv">⬇️ Export CSV</button><button class="btn small ghost" id="labClr">Clear</button></div>
    <div class="table-wrap"><table><thead><tr><th>When</th><th>Word</th><th>Intended</th><th>Heard (pitch: text)</th><th>Decision</th><th>Confidence</th><th></th></tr></thead><tbody>
    ${t.slice().reverse().slice(0, 100).map((x, k) => `<tr><td class="muted">${new Date(x.ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</td><td class="wd">${esc(x.word)}</td><td>${x.intent === 'correct' ? 'correct' : '<b>wrong</b>'}</td><td>${esc(x.heard || '∅')}${x.variants ? `<div class="muted" style="font-size:12px">${esc(x.variants)}</div>` : ''}</td>
      <td>${x.verdict === 'right' ? '✓ right' : x.verdict === 'close' ? '~ almost' : x.verdict === 'unclear' ? '? unclear' : '✗ different'}</td><td>${x.p != null ? x.p.toFixed(2) : ''}</td><td>${x.saved ? `<button class="btn small ghost" data-play="${x.ts}">▶︎</button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#labLoad', body) && ($('#labLoad', body).onclick = async () => { if (await loadRecogWithModal()) renderLab(body, reader); });
  $('#labNext', body) && ($('#labNext', body).onclick = async () => { LAB.word = await labNextWord(); renderLab(body, reader); });
  $('#labHear', body) && ($('#labHear', body).onclick = () => TTS.say(LAB.word, { word: true }));
  $$('[data-intent]', body).forEach(b => b.onclick = async () => {
    $$('[data-intent]', body).forEach(x => x.disabled = true); TTS.stop();
    $('#labOut', body).textContent = 'Listening…';
    try {
      const rec = await Recog.record({ maxMs: 5000, silenceMs: 900, onLevel: v => { const l = $('#labLvl', body); if (l) l.style.width = Math.min(100, v * 400) + '%'; } });
      $('#labOut', body).textContent = 'Thinking…';
      const res = rec.speech ? await Recog.transcribe(rec) : null;
      const v = judgeWord(LAB.word, res);
      const trial = { ts: Date.now(), readerId: reader?.id, word: LAB.word, intent: b.dataset.intent, verdict: v.verdict, heard: v.heard, p: v.p, variants: v.variantText };
      if (rec.speech) { await DB.put('audio', to16k(rec), 'lab|' + trial.ts); trial.saved = true; }
      LAB.trials.push(trial); await KV.set('labTrials', LAB.trials);

    const methods = { 'Single pass': [1], 'Four pitch passes': Recog.SHIFTS };
    const tally = {}; for (const m in methods) tally[m] = { correct: { right: 0, close: 0, unclear: 0, different: 0 }, wrong: { right: 0, close: 0, unclear: 0, different: 0 } };
    let k = 0;

    }

    const row = (m, c, w) => { const n = c.right + c.close + c.unclear + c.different, nw = w.right + w.close + w.unclear + w.different;
      return `<tr><td><b>${m}</b></td><td>${pct(c.right, n)}</td><td>${pct(c.close, n)}</td><td>${pct(c.unclear, n)}</td><td>${pct(c.different, n)}</td><td>${pct(w.right, nw)}</td></tr>`; };
    $('#labCmpOut', body).innerHTML = `<div class="table-wrap"><table><thead><tr><th></th><th>Correct → right</th><th>→ almost</th><th>→ didn’t catch</th><th>→ marked wrong</th><th>Wrong → accepted</th></tr></thead><tbody>${Object.keys(methods).map(m => row(m, tally[m].correct, tally[m].wrong)).join('')}</tbody></table></div>
      <p class="note">Say It gives a star for every spoken attempt and models the word afterward. Recognition only adjusts future practice; three consecutive recognized correct readings retire a word.</p>`;
  };
  $('#labCsv', body).onclick = () => {
    const rows = [['time', 'reader', 'word', 'intended', 'heard', 'decision', 'confidence', 'by pitch'], ...t.map(x => [new Date(x.ts).toISOString(), x.readerId || '', x.word, x.intent, x.heard || '', x.verdict, x.p ?? '', x.variants || ''])];
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' })); a.download = 'speech-lab.csv'; a.click();
  };
  $('#labClr', body).onclick = async () => { if (!confirm('Clear all lab results?')) return; for (const x of t) if (x.saved) await DB.del('audio', 'lab|' + x.ts); LAB.trials = LAB.trials.filter(x => reader && x.readerId !== reader.id); await KV.set('labTrials', LAB.trials); renderLab(body, reader); };
}
async function labNextWord() {
  const pw = await practiceWords(20);
  const pool = pw.length >= 5 ? pw.map(w => w.word) : (await vocabPool()).filter(w => w.length >= 3 && w.length <= 8);
  return pool[Math.floor(Math.random() * pool.length)] || 'rabbit';
}
