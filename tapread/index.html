<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap &amp; Read</title>
<meta name="theme-color" content="#fbf5ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8613c'/%3E%3Cpath d='M14 18c7-3 13-2 18 2v28c-5-4-11-5-18-2z' fill='%23fff'/%3E%3Cpath d='M50 18c-7-3-13-2-18 2v28c5-4 11-5 18-2z' fill='%23ffe3a3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf5ea; --page:#fffdf8; --ink:#2b2833; --ink-2:#6b6577; --line:#e9dfcd;
  --tomato:#e8613c; --tomato-2:#fbe1d7; --teal:#2a9d8f; --teal-2:#d6f0ec;
  --sun:#f4b942; --sun-2:#fdf0cf; --plum:#7b5ea7; --plum-2:#ece5f6; --sky:#3d8bd9; --sky-2:#dcebfa;
  --shadow:0 1px 0 rgba(60,40,10,.06), 0 8px 24px -12px rgba(60,40,10,.25);
  --r:18px; --read:"Andika", "Comic Sans MS", system-ui, sans-serif; --ui:"Fredoka", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#1d1b22; --page:#26232c; --ink:#f3eee6; --ink-2:#b4adbd; --line:#3a3642;
    --tomato-2:#4a2a22; --teal-2:#1d3b38; --sun-2:#43391f; --plum-2:#352c44; --sky-2:#1f3247;
    --shadow:0 8px 24px -12px rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.on{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.topbar h1,.topbar h2{font-weight:600;margin:0;font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 16px 40px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--page);box-shadow:var(--shadow);font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--tomato);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{padding:6px 12px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--page);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;flex:none}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500}
.muted{color:var(--ink-2)}
.hidden{display:none!important}

/* readers */
.readers{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:24px 16px}
.reader-card{width:150px;border:0;background:var(--page);border-radius:24px;padding:20px 10px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px}
.reader-card .face{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:46px}
.reader-card .nm{font-size:20px;font-weight:600}
.reader-card.add{background:transparent;border:3px dashed var(--line);box-shadow:none}
.hello{text-align:center;padding:40px 16px 0}
.hello h1{font-size:clamp(30px,6vw,46px);margin:0 0 6px;font-weight:600}

/* library */
.shelf-title{font-size:18px;font-weight:600;margin:22px 4px 10px;color:var(--ink-2)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.book{border:0;border-radius:16px;background:var(--page);box-shadow:var(--shadow);text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:210px}
.book .cover{height:120px;display:grid;place-items:center;font-size:56px;position:relative}
.book .cover img{width:100%;height:100%;object-fit:cover}
.book .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.book .t{font-weight:600;font-size:16px;line-height:1.2}
.book .prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.book .prog i{display:block;height:100%;background:var(--teal)}
.book.add{border:3px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;font-size:17px;gap:6px;color:var(--ink-2)}
.lvl1{background:var(--sun-2)} .lvl2{background:var(--teal-2)} .lvl3{background:var(--plum-2)}
.big-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.big-action{flex:1;min-width:220px;border:0;border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);text-align:left}
.big-action .e{font-size:38px}
.big-action b{display:block;font-size:19px;font-weight:600}

/* book reader */
#scr-book{height:100%;min-height:0}
.book-stage{flex:1;display:flex;align-items:stretch;gap:8px;padding:0 8px 8px;min-height:0}
.nav{border:0;background:transparent;width:56px;font-size:34px;color:var(--ink-2);flex:none;border-radius:16px}
.nav:hover{background:rgba(0,0,0,.04)}
.nav[disabled]{opacity:.15}
.page{flex:1;background:var(--page);border-radius:22px;box-shadow:var(--shadow);overflow:auto;position:relative;display:flex;flex-direction:column;padding:clamp(18px,4vw,48px);min-height:0}
.page-inner{margin:auto 0;width:100%;max-width:720px;align-self:center}
.page.turn-l{animation:turnL .28s ease} .page.turn-r{animation:turnR .28s ease}
@keyframes turnL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes turnR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.reading{font-family:var(--read);line-height:1.55;font-size:calc(var(--fs,30px) * var(--scale,1))}
.reading p{margin:0 0 .7em}
.reading h2{font-size:1.15em;margin:0 0 .8em;text-align:center;font-weight:700;color:var(--plum)}
.reading .title{font-size:1.5em;text-align:center;margin:0 0 .2em;line-height:1.2;font-weight:700}
.reading .byline{text-align:center;font-size:.6em;color:var(--ink-2);margin-bottom:1.2em}
.reading .pic{text-align:center;font-size:2.6em;line-height:1.25;margin:.1em 0 .4em;letter-spacing:.05em}
.reading img{display:block;max-width:100%;max-height:46vh;margin:0 auto .8em;border-radius:10px}
.w{cursor:pointer;border-radius:.2em;padding:0 .04em;transition:background .15s,color .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.w:hover{background:var(--sun-2)}
.w.hit{animation:pop .45s ease;background:var(--sun);color:#2b2833}
.w.say{background:var(--sky-2);box-shadow:0 0 0 .08em var(--sky)}
.w.sent{background:var(--teal-2)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.pageno{text-align:center;margin-top:1em;font-size:.65em;color:var(--ink-2)}
.book-tools{display:flex;gap:10px;align-items:center;justify-content:center;padding:4px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));flex-wrap:wrap}
.progress-line{height:6px;background:var(--line);border-radius:3px;flex:1;max-width:340px;overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--tomato);transition:width .3s}
.listen-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--page);box-shadow:var(--shadow);border-radius:999px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:14px;z-index:30;font-size:18px}
.meter{width:90px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--teal);transition:width .08s}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.game-tile{border:0;border-radius:22px;padding:22px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:170px}
.game-tile .e{font-size:46px}
.game-tile b{font-size:21px;font-weight:600}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;padding-bottom:40px}
.stars{font-size:26px;letter-spacing:4px;min-height:34px}
.prompt-word{font-family:var(--read);font-size:clamp(48px,12vw,110px);font-weight:700;background:var(--page);border-radius:28px;padding:16px 44px;box-shadow:var(--shadow);text-align:center}
.choices{display:grid;grid-template-columns:repeat(2,minmax(130px,260px));gap:16px}
.choice{font-family:var(--read);font-size:clamp(28px,6vw,48px);border:0;border-radius:22px;padding:20px 12px;background:var(--page);box-shadow:var(--shadow);font-weight:700}
.choice.right{background:var(--teal);color:#fff}
.choice.wrong{animation:shake .4s;opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.speaker{width:96px;height:96px;border-radius:50%;border:0;background:var(--sky);color:#fff;font-size:44px;box-shadow:var(--shadow)}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--tomato);color:#fff;font-size:52px;box-shadow:var(--shadow);position:relative}
.mic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--tomato);opacity:.5;animation:ring 1.1s infinite}
@keyframes ring{from{transform:scale(.92);opacity:.7}to{transform:scale(1.15);opacity:0}}
.mem-grid{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,4),minmax(70px,150px))}
.mem{aspect-ratio:3/4;border:0;border-radius:16px;padding:0;position:relative;background:transparent}
.mem .f,.mem .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;box-shadow:var(--shadow)}
.mem .b{background:repeating-linear-gradient(45deg,var(--plum),var(--plum) 10px,#8c70b8 10px,#8c70b8 20px);color:#fff;font-size:30px}
.mem .f{background:var(--page);font-family:var(--read);font-weight:700;font-size:clamp(18px,4vw,30px);padding:4px;text-align:center;word-break:break-word;visibility:hidden}
.mem.up .f,.mem.done .f{visibility:visible}
.mem.up .b,.mem.done .b{visibility:hidden}
.mem.up,.mem.done{animation:flip .3s ease}
.mem.done .f{background:var(--teal-2)}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.feedback{font-size:24px;min-height:34px;text-align:center;font-weight:500}
.confetti{position:fixed;pointer-events:none;font-size:30px;z-index:60;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* parent */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--ink-2)}
.tab.on{background:var(--ink);color:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--page);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card .n{font-size:30px;font-weight:600}
.card .l{color:var(--ink-2);font-size:14px}
.panel{background:var(--page);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-top:16px}
.panel h3{margin:0 0 12px;font-weight:600;font-size:18px}
.panel h4{margin:16px 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
td.wd{font-family:var(--read);font-weight:700;font-size:17px}
.table-wrap{overflow-x:auto}
.boxes{display:inline-flex;gap:3px}
.boxes i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.boxes i.on{background:var(--teal)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{min-width:150px;color:var(--ink-2)}
.field{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;min-height:42px}
textarea.field{width:100%;min-height:160px;font-family:var(--read)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-2)}
.wordcloud{display:flex;flex-wrap:wrap;gap:8px}
.wordcloud span{font-family:var(--read);font-weight:700;background:var(--sun-2);border-radius:10px;padding:4px 10px}
.note{font-size:14px;color:var(--ink-2);line-height:1.5}
.bar-prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:120px}
.bar-prog i{display:block;height:100%;background:var(--teal);width:0}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(20,15,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--page);border-radius:24px;padding:24px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:22px;font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;font-size:24px;display:grid;place-items:center}
.swatches button.on{border-color:var(--ink)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:70;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:640px){
  .nav{display:none}
  .book-stage{padding:0 6px 6px}
  .choices{grid-template-columns:repeat(2,1fr);width:100%}
  .row label{min-width:100%}
}
</style>
</head>
<body>

<!-- Who's reading -->
<section class="screen" id="scr-readers">
  <div class="hello"><h1>Who’s reading today?</h1><p class="muted">Tap your name</p></div>
  <div class="readers" id="readerList"></div>
  <div style="text-align:center;margin-top:auto;padding:20px"><button class="btn ghost small" data-act="parent">👪 Grown-ups</button></div>
</section>

<!-- Library -->
<section class="screen" id="scr-library">
  <div class="topbar">
    <button class="icon-btn" data-act="readers" title="Switch reader" id="libFace">🙂</button>
    <h1 id="libHello">Hi!</h1>
    <button class="btn small" data-act="parent">👪 Grown-ups</button>
  </div>
  <div class="wrap">
    <div class="big-actions">
      <button class="big-action lvl2" data-act="games"><span class="e">🎲</span><span><b>Word games</b><span id="practiceCount" class="muted">Practice your words</span></span></button>
      <button class="big-action lvl1 hidden" id="continueBtn"><span class="e">📖</span><span><b>Keep reading</b><span id="continueTitle" class="muted"></span></span></button>
    </div>
    <div id="shelves"></div>
  </div>
</section>

<!-- Book -->
<section class="screen" id="scr-book">
  <div class="topbar">
    <button class="icon-btn" data-act="library" title="Back to books">🏠</button>
    <h2 id="bookTitle"></h2>
    <button class="icon-btn" id="readPageBtn" title="Read this page to me">🔊</button>
    <button class="icon-btn hidden" id="readAloudBtn" title="I'll read it!">🎤</button>
  </div>
  <div class="book-stage">
    <button class="nav" id="prevBtn" aria-label="Previous page">‹</button>
    <article class="page" id="page"><div class="page-inner reading" id="pageInner"></div></article>
    <button class="nav" id="nextBtn" aria-label="Next page">›</button>
  </div>
  <div class="book-tools">
    <button class="btn small" id="prevBtn2">‹ Back</button>
    <div class="progress-line"><i id="bookProg"></i></div>
    <button class="btn small primary" id="nextBtn2">Next ›</button>
  </div>
</section>

<!-- Games menu -->
<section class="screen" id="scr-games">
  <div class="topbar">
    <button class="icon-btn" data-act="library" title="Back">🏠</button>
    <h1>Word games</h1>
  </div>
  <div class="wrap">
    <p class="muted" id="gamesNote"></p>
    <div class="games" id="gameTiles"></div>
  </div>
</section>

<!-- Game play -->
<section class="screen" id="scr-game">
  <div class="topbar">
    <button class="icon-btn" id="gameQuit" title="Stop">✕</button>
    <h2 id="gameTitle"></h2>
    <div class="stars" id="gameStars"></div>
  </div>
  <div class="game-area" id="gameArea"></div>
</section>

<!-- Parent area -->
<section class="screen" id="scr-parent">
  <div class="topbar">
    <button class="icon-btn" id="parentBack" title="Back">←</button>
    <h1>Grown-ups</h1>
    <select class="field" id="parentReader" aria-label="Reader"></select>
  </div>
  <div class="wrap">
    <div class="tabs" id="parentTabs">
      <button class="tab on" data-tab="overview">Progress</button>
      <button class="tab" data-tab="words">Words</button>
      <button class="tab" data-tab="stories">Stories</button>
      <button class="tab" data-tab="settings">Settings</button>
      <button class="tab" data-tab="lab">Speech lab</button>
    </div>
    <div id="parentBody"></div>
  </div>
</section>

<div id="modalRoot"></div>
<div id="toast"></div>
<script type="module">
// Tap & Read — a tap-to-hear children's reader. Built from src/ by build.sh.

// ---------------------------------------------------------------------------
// Built-in stories. Script format (same as plain-text import):
//   ===          page break
//   ## Heading   chapter heading
//   @pic 🐱🎩    a picture line (emoji)
//   blank line   new paragraph
// ---------------------------------------------------------------------------
const BUILTIN_STORIES = [
{ id:'b-cat-hat', title:'Cat and Hat', author:'Tap & Read', level:1, cover:'🐱', text:`
@pic 🐱
This is Cat.
===
@pic 🎩
This is a hat.
===
@pic 🐱🎩
Cat sees the hat.
===
@pic 🐱❓
Is the hat for Cat?
===
@pic 🎩🐱
Cat gets in the hat.
===
@pic 🎩
Where is Cat?
===
@pic 👀🎩
I can see a tail!
===
@pic 🐱✨
Here is Cat!
===
@pic 😺🎩
Cat likes the hat.
===
@pic 💤🎩
Now Cat naps in the hat.
`},
{ id:'b-up', title:'Up, Up, Up!', author:'Tap & Read', level:1, cover:'🎈', text:`
@pic 👧🎈
Mia has a red balloon.
===
@pic 🌬️🎈
The wind is big.
===
@pic 🎈⬆️
Up goes the balloon.
===
@pic 🌳🎈
Up past the tree.
===
@pic 🏠🎈
Up past the house.
===
@pic 🐦🎈
A bird says, "Hello!"
===
@pic ☁️🎈
Up to the clouds.
===
@pic 👧😢
"Come back!" says Mia.
===
@pic 🎈⬇️
Down, down, down it comes.
===
@pic 👧🎈😀
Mia hugs her red balloon. The end!
`},
{ id:'b-fox-crow', title:'The Fox and the Crow', author:'A fable, retold', level:2, cover:'🦊', text:`
@pic 🐦🧀
A crow found a big piece of cheese. She flew up to a high branch to eat it.
===
@pic 🦊
A hungry fox walked by. He looked up and saw the cheese. "I want that cheese," he said to himself.
===
@pic 🦊🌳
"Good morning, Crow!" said the fox. "What shiny feathers you have! What bright eyes!"
===
@pic 🐦
The crow sat up tall. She liked to hear such nice words.
===
@pic 🦊🎶
"I am sure your song is the best in the whole wood," said the fox. "Will you sing for me, just once?"
===
@pic 🐦🎵🧀
The crow was so proud that she opened her beak to sing. "Caw! Caw!"
===
@pic 🧀⬇️🦊
Down fell the cheese, right into the mouth of the fox.
===
@pic 🦊😋
"Thank you," said the fox. "Here is a tip for you: do not trust someone just because they say nice things."
===
@pic 🐦💭
The crow never forgot it.
`},
{ id:'b-tortoise-hare', title:'The Tortoise and the Hare', author:'A fable, retold', level:2, cover:'🐢', text:`
@pic 🐇💨
Hare was very fast, and he liked to tell everyone about it. "No one can beat me," he said.
===
@pic 🐢
Tortoise was very slow. One day she said, "I will race you, Hare."
===
@pic 🐇😂
Hare laughed and laughed. "You? Race me? Okay, let's go!"
===
@pic 🏁🐇🐢
All the animals came to watch. Owl said, "Ready, set, go!"
===
@pic 🐇💨💨

## Chapter One: The Little Keeper

@pic 🏠💡🌊

Pip lived with her grandfather in a white lighthouse at the edge of the sea. Every night, Grandpa climbed the one hundred steps to the top and lit the great lamp.

The light swept across the dark water, round and round, so that the fishing boats could find their way home.

"Why does it have to turn?" Pip asked one evening.

"So that every boat can see it, wherever it is," said Grandpa. "A light that only shines one way is only half a light."
===
Pip liked to count the steps as they climbed. Some nights she counted by ones. Some nights she counted by twos. On very windy nights she did not count at all, because she was too busy holding the rail.

From the top, she could see the whole harbor. She knew every boat by its color. The blue one was Mr. Ortega's. The yellow one belonged to the twins. The little green one with the patched sail was old Mrs. Finch's, and it was always the last one home.
===
## Chapter Two: The Storm

@pic ⛈️🌊

One afternoon the sky turned the color of a bruise. The wind began to howl, and the waves grew taller than houses.

"A storm is coming," said Grandpa. He rubbed his knee, which always ached before bad weather. "I will go up early tonight."

But when he stood up, his knee would not bend. He sat back down with a groan.

"I can't climb the steps, Pip," he said quietly. "Not tonight."
===
Pip looked out of the window. She could see the blue boat and the yellow boat coming in fast. But where was the little green boat?

"Mrs. Finch is still out there," Pip whispered.

Grandpa looked at her for a long moment. Then he took the big brass key from his pocket and put it in her hand.

"You know the way," he said. "One hundred steps. Turn the key, open the valve, and strike the match. Just like we practiced."
===
## Chapter Three: One Hundred Steps

@pic 🔦🪜

Pip ran to the stairs. The tower shook with every gust of wind. Rain hammered on the walls.

She counted out loud to keep herself brave. "Twenty. Twenty-one. Twenty-two." Her legs burned. "Sixty. Sixty-one." Her hands were cold. "Ninety-nine. One hundred!"

At the top, she turned the key. She opened the valve. Her fingers shook as she struck the match. Once. Twice. On the third try, the flame caught.

"Thank you for the light," she said.

"It wasn't only me," said Pip. "Grandpa taught me how."

// Kokoro takes ~2–3 s to generate a word it hasn't seen before (single-threaded WASM),

const TTS = {
  token: 0,
  usingKokoro() { return S.engine === 'kokoro' && Kokoro.ready; },
  stop() { this.token++; SystemVoice.stop(); Player.stop(); },
  async kokoroPlay(text, my, waitMs) {

  // wait: for deliberate voice tests in Settings, wait for Kokoro instead of falling back.

// Learning model: tap log, per-word state, spaced practice
// ===========================================================================
// Every tap / game answer / read-aloud result is an event. Per reader+word we also keep a

  const n = B.page + d, last = B.story.pages.length - 1;
  TTS.stop(); clearHighlights();
  if (n < 0) return;
  if (n > last) { finishBook(); return; }
  B.page = n; renderPage(d);
}
async function finishBook() {
  logEvent({ type: 'finish', storyId: B.story.id });
  const prog = (await KV.get('progress:' + READER.id)) || {}; prog[B.story.id] = { ...(prog[B.story.id] || {}), page: 0, done: true, ts: Date.now() }; await KV.set('progress:' + READER.id, prog);
  chime('win'); confetti(innerWidth / 2, innerHeight / 2, 24);
  TTS.say(`The end! Great reading, ${READER.name}!`);
  const pw = await practiceWords(12);
  modal(`<div style="text-align:center"><div style="font-size:64px">🏆</div><h3>You finished ${esc(B.story.title)}!</h3>
    <p class="muted">${pw.length ? `Want to play a game with your ${pw.length} practice words?` : 'Pick another book?'}</p>
    <div class="row" style="justify-content:center;margin-top:16px">${pw.length ? '<button class="btn teal" id="fGame">🎲 Play</button>' : ''}<button class="btn" id="fLib">📚 Books</button></div></div>`,
    (m, close) => { $('#fLib', m).onclick = () => { close(); renderLibrary(); }; if ($('#fGame', m)) $('#fGame', m).onclick = () => { close(); renderGames(); }; });
}
function clearHighlights() { $$('#pageInner .w.say, #pageInner .w.sent').forEach(e => e.classList.remove('say', 'sent')); }

// Tap = say the word, long-press = say the whole sentence.
function wireBook() {
  const inner = $('#pageInner'); let timer = null, longFired = false, downEl = null, downXY = null;
  inner.addEventListener('pointerdown', e => {
    const w = e.target.closest('.w'); if (!w) return;
    audioCtx(); downEl = w; longFired = false; downXY = [e.clientX, e.clientY];
    clearTimeout(timer);
    timer = setTimeout(() => { longFired = true; saySentence(w); }, 520);
  });
  const cancel = () => { clearTimeout(timer); };
  inner.addEventListener('pointermove', e => { if (downXY && Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 12) { cancel(); downEl = null; } });
  inner.addEventListener('pointercancel', () => { cancel(); downEl = null; });
  inner.addEventListener('pointerup', e => {
    cancel(); const w = e.target.closest('.w');
    if (!w || w !== downEl || longFired) { downEl = null; return; }
    downEl = null; tapWord(w);
  });
  inner.addEventListener('contextmenu', e => e.preventDefault());
  inner.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('w')) { e.preventDefault(); tapWord(e.target); } });
  $('#prevBtn').onclick = $('#prevBtn2').onclick = () => turn(-1);
  $('#nextBtn').onclick = $('#nextBtn2').onclick = () => turn(1);
  $('#readPageBtn').onclick = () => readPage();
  $('#readAloudBtn').onclick = () => readAloud();
  // Swipe to turn pages.
  let sx = null, sy = 0;
  $('#page').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('#page').addEventListener('touchend', e => {
    if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(dx < 0 ? 1 : -1);
  });
  addEventListener('keydown', e => {
    if (document.body.dataset.screen !== 'book' || $('#modalRoot').firstChild) return;
    if (e.key === 'ArrowRight') turn(1); if (e.key === 'ArrowLeft') turn(-1);
  });
}
function tapWord(el) {
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); clearTimeout(el._hit); el._hit = setTimeout(() => el.classList.remove('hit'), 1200);
  const display = el.dataset.num || el.textContent;
  TTS.say(display, { word: true });
  recordTap(display, { storyId: B.story.id, page: B.page, properNoun: el.dataset.p === '1', how: el.closest('.title,h2') ? 'title' : el.dataset.num ? 'pageno' : 'tap' });
}
async function saySentence(el) {
  const si = +el.dataset.s; if (si < 0) return tapWord(el);
  clearHighlights();
  const spans = $$(`#pageInner .w[data-s="${si}"]`); spans.forEach(s => s.classList.add('sent'));
  el.classList.add('say');
  logEvent({ type: 'sentence', storyId: B.story.id, page: B.page });

}
async function readPage() {
  audioCtx();

  if (btn.dataset.on) { TTS.stop(); clearHighlights(); delete btn.dataset.on; btn.textContent = '🔊'; return; }
  btn.dataset.on = 1; btn.textContent = '⏹';

// ===========================================================================
// Games — all built from the reader's weighted practice list
// ===========================================================================
const STARTERS = ['the', 'said', 'was', 'here', 'look', 'come', 'where', 'what', 'they', 'you'];
let GAME = null;

async function gameWords(n) {
  const recs = await practiceWords(n);
  const words = recs.map(r => ({ word: r.word, display: r.proper ? r.display : r.word }));
  const starter = words.length < 3;
  if (starter) for (const w of shuffle(STARTERS)) { if (words.length >= Math.min(n, 6)) break; if (!words.find(x => x.word === w)) words.push({ word: w, display: w }); }
  return { words, starter };
}

async function renderGames() {
  const { words, starter } = await gameWords(12);
  $('#gamesNote').textContent = starter
    ? 'Tap words you don’t know while reading, and they’ll show up here. For now, here are some starter words.'
    : `Playing with ${words.length} of your words: ${words.slice(0, 6).map(w => w.display).join(', ')}${words.length > 6 ? '…' : ''}`;
  const tiles = [
    { id: 'find', e: '👂', t: 'Listen & Find', d: 'Hear a word, tap the right one.', c: 'lvl2' },
    { id: 'match', e: '🃏', t: 'Memory Match', d: 'Match each word to its sound.', c: 'lvl3' },
  ];
  if (S.recog) tiles.push({ id: 'say', e: '🎤', t: 'Say It!', d: Recog.ready ? 'See a word, say it out loud.' : 'Needs speech recognition — tap to load it.', c: 'lvl1' });
  $('#gameTiles').innerHTML = tiles.map(g => `<button class="game-tile ${g.c}" data-g="${g.id}"><span class="e">${g.e}</span><b>${g.t}</b><span class="muted">${g.d}</span></button>`).join('');
  $$('#gameTiles [data-g]').forEach(b => b.onclick = () => startGame(b.dataset.g));
  show('games');
}

async function startGame(kind) {
  audioCtx();
  if (kind === 'say' && !Recog.ready) {
    const ok = await loadRecogWithModal(); if (!ok) return;
  }
  const { words } = await gameWords(kind === 'match' ? 6 : 8);
  GAME = { kind, words: shuffle(words), i: 0, stars: 0, firstTry: true, pool: await vocabPool(), alive: true };
  $('#gameTitle').textContent = { find: 'Listen & Find', match: 'Memory Match', say: 'Say It!' }[kind];
  $('#gameStars').textContent = '';
  logEvent({ type: 'game', game: kind });
  show('game');
  if (kind === 'find') findRound(); else if (kind === 'match') matchGame(); else sayRound();
}
function addStar() { GAME.stars++; $('#gameStars').textContent = '⭐'.repeat(Math.min(GAME.stars, 10)); }
function endGame(msg) {
  if (!GAME) return; GAME.alive = false; chime('win'); confetti(innerWidth / 2, innerHeight / 2, 24);
  TTS.say(msg || `You did it, ${READER.name}!`);
  $('#gameArea').innerHTML = `<div style="font-size:80px">🏆</div><div class="feedback">${esc(msg || 'You did it!')}</div><div class="stars">${'⭐'.repeat(Math.max(1, GAME.stars))}</div>
    <div class="row"><button class="btn teal" id="again">Play again</button><button class="btn" id="toGames">More games</button></div>`;
  $('#again').onclick = () => startGame(GAME.kind); $('#toGames').onclick = renderGames;
}

// ---- Listen & Find ----
function findRound() {
  const g = GAME; if (!g.alive) return;
  if (g.i >= g.words.length) return endGame(`Great listening, ${READER.name}!`);
  const target = g.words[g.i]; g.firstTry = true;
  const opts = shuffle([target.display, ...distractors(target.word, g.pool, 3)]);
  $('#gameArea').innerHTML = `<button class="speaker" id="hear" title="Hear it again">🔊</button>
    <div class="feedback" id="fb">Which word did you hear?</div>
    <div class="choices">${opts.map(o => `<button class="choice" data-w="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="muted">${g.i + 1} of ${g.words.length}</div>`;
  const hear = () => TTS.say(target.display, { word: true });
  $('#hear').onclick = hear; setTimeout(hear, 350);
  $$('.choice').forEach(b => b.onclick = async () => {
    if (!g.alive || b.classList.contains('wrong')) return;
    if (sameWord(b.dataset.w, target.word)) {
      b.classList.add('right'); chime('good'); const r = b.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top);
      if (g.firstTry) { addStar(); recordAnswer(target.word, 'right', { game: 'find' }); }
      $('#fb').textContent = praise();
      $$('.choice').forEach(c => c.disabled = true);
      await TTS.say($('#fb').textContent); await sleep(500);
      g.i++; findRound();
    } else {
      b.classList.add('wrong'); chime('oops');
      if (g.firstTry) recordAnswer(target.word, 'wrong', { game: 'find', picked: normWord(b.dataset.w) });
      g.firstTry = false;
      $('#fb').textContent = `That one says “${b.dataset.w}”. Listen again!`;
      await TTS.say(b.dataset.w, { word: true }); await sleep(250); if (g.alive) hear();
    }
  });
}

// ---- Memory Match: a word card and a speaker card for each word ----
function matchGame() {
  const g = GAME, words = g.words.slice(0, innerWidth < 500 ? 4 : 6);
  const cards = shuffle(words.flatMap((w, k) => [{ k, w, type: 'word' }, { k, w, type: 'sound' }]));
  const cols = cards.length <= 8 ? 4 : innerWidth < 500 ? 3 : 4;
  $('#gameArea').innerHTML = `<div class="feedback" id="fb">Find the word that matches the sound!</div>
    <div class="mem-grid" style="--cols:${cols}">${cards.map((c, i) => `<button class="mem" data-i="${i}"><span class="b">?</span><span class="f">${c.type === 'word' ? esc(c.w.display) : '🔊'}</span></button>`).join('')}</div>`;
  let up = [], lock = false, found = 0, tries = {};
  $$('.mem').forEach(el => el.onclick = async () => {
    if (lock || el.classList.contains('up') || el.classList.contains('done') || !g.alive) return;
    const c = cards[+el.dataset.i]; el.classList.add('up'); chime('flip');
    if (c.type === 'sound') TTS.say(c.w.display, { word: true });
    up.push([el, c]);
    if (up.length < 2) return;
    lock = true;
    const [[e1, c1], [e2, c2]] = up; up = [];
    if (c1.k === c2.k && c1.type !== c2.type) {
      await sleep(400); e1.classList.add('done'); e2.classList.add('done'); chime('good'); addStar(); found++;
      const r = e2.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, 8);
      await TTS.say(c1.w.display, { word: true });
      recordAnswer(c1.w.word, (tries[c1.k] || 0) <= 2 ? 'right' : 'seen', { game: 'match' });
      lock = false;
      if (found === words.length) setTimeout(() => endGame(`You matched them all!`), 600);
    } else {
      tries[c1.k] = (tries[c1.k] || 0) + 1; tries[c2.k] = (tries[c2.k] || 0) + 1;
      await sleep(1100); e1.classList.remove('up'); e2.classList.remove('up'); lock = false;
    }
  });
}

// ---- Say It! (Whistle) ----
async function sayRound() {
  const g = GAME; if (!g.alive) return;
  if (g.i >= g.words.length) { Recog.closeMic(); return endGame(`Great talking, ${READER.name}!`); }
  const target = g.words[g.i]; g.tries = g.tries || 0;
  $('#gameArea').innerHTML = `<div class="prompt-word">${esc(target.display)}</div>
    <div class="feedback" id="fb">${g.i === 0 && !g.tries ? 'Tap the microphone and say this word.' : 'Can you say this word?'}</div>
    <button class="mic" id="mic" title="Tap and say the word">🎤</button><div class="meter"><i id="lvl"></i></div>
    <div class="row"><button class="btn small" id="help">🔊 Help me</button><button class="btn small ghost" id="skip">Skip ›</button></div>`;
  if (g.i === 0 && !g.tries) TTS.say('Tap the microphone and say the word.');
  $('#help').onclick = () => { TTS.say(target.display, { word: true }); };
  $('#skip').onclick = () => { g.i++; g.tries = 0; g.close = 0; sayRound(); };
  $('#mic').onclick = async () => {
    const mic = $('#mic'); if (mic.classList.contains('rec')) { Recog.stopEarly(); return; }
    TTS.stop(); mic.classList.add('rec'); $('#fb').textContent = 'Listening…';
    let rec;
    try { rec = await Recog.record({ maxMs: 5000, silenceMs: 900, onLevel: v => { const l = $('#lvl'); if (l) l.style.width = Math.min(100, v * 400) + '%'; } }); }
    catch (e) { mic.classList.remove('rec'); $('#fb').textContent = 'I can’t use the microphone. Ask a grown-up to allow it.'; return; }
    if (!g.alive) return;
    mic.classList.remove('rec'); $('#fb').textContent = 'Thinking…';
    let res = null;
    try { res = rec.speech ? await Recog.transcribe(rec) : null; } catch (e) { console.warn(e); }
    if (!g.alive) return;
    let v = judgeWord(target.word, res);
    // A second "almost" on the same word counts: the recognizer is the likelier culprit.
    if (v.verdict === 'close') { g.close = (g.close || 0) + 1; if (g.close >= 2) v = { ...v, verdict: 'right', lenient: true }; }
    if (v.verdict === 'right') {
      chime('good'); const r = mic.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top);
      if (!g.tries) addStar();
      recordAnswer(target.word, v.lenient ? 'say-close' : 'say-right', { game: 'say', heard: v.heard, p: v.p, variants: v.variantText });
      $('#fb').textContent = praise(); await TTS.say($('#fb').textContent);
      g.i++; g.tries = 0; g.close = 0; await sleep(300); sayRound();
    } else if (v.verdict === 'close') {
      recordAnswer(target.word, 'say-unclear', { game: 'say', heard: v.heard, close: true, variants: v.variantText });
      $('#fb').textContent = 'Almost! Say it one more time?';
      await TTS.say('Almost! Say it one more time?');
    } else if (v.verdict === 'unclear') {
      recordAnswer(target.word, 'say-unclear', { game: 'say', heard: v.heard, variants: v.variantText });
      $('#fb').textContent = 'I didn’t quite catch that. Try again?';
      await TTS.say('I didn’t quite catch that. Try again?');
    } else {
      g.tries++;
      if (g.tries === 1) recordAnswer(target.word, 'say-wrong', { game: 'say', heard: v.heard, p: v.p, variants: v.variantText });
      $('#fb').textContent = 'Let’s hear it together…';
      await TTS.say('Listen.'); await TTS.say(target.display, { word: true });
      if (g.tries >= 2) { $('#fb').textContent = 'Good try! Let’s do the next one.'; await TTS.say('Good try!'); g.i++; g.tries = 0; g.close = 0; await sleep(400); sayRound(); }
      else $('#fb').textContent = 'Now you try!';
    }
  };
}

$('#gameQuit').onclick = () => { if (GAME) GAME.alive = false; Recog.closeMic(); renderGames(); };

// ===========================================================================
// Speech recognition (experimental): Whistle via the cactus-needle WASM build
// ===========================================================================
// Files live next to index.html in vendor/cactus-needle (the worker must be same-origin).
// The 16.9 MB model downloads from Hugging Face on first use and is cached by the browser.
const Recog = {
  ready: false, loading: null, whistle: null, stream: null, _stop: null,
  load(onProgress) {
    if (this.ready) return Promise.resolve();
    if (this.loading) return this.loading;
    this.loading = (async () => {
      const mod = await import('./vendor/cactus-needle/dist/browser/index.js');
      this.whistle = await mod.createWhistle({ onDownloadProgress: p => onProgress?.((p.percentage ?? 0) / 100) });
      this.ready = true;
    })().catch(e => { this.loading = null; throw e; });
    return this.loading;
  },
  async openMic() {
    if (this.stream?.active) return this.stream;
    // Safari: the 'playback' audio session (set so the iPhone silent switch doesn't mute
    // the voice) blocks microphone capture. Switch to play-and-record while listening.
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch {}
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    return this.stream;
  },
  closeMic() {
    this._stop?.(); this.stream?.getTracks().forEach(t => t.stop()); this.stream = null;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  },
  cancel() { this._cancelled = true; this._stop?.(); },
  stopEarly() { this._stop?.(); },
  // Record until the speaker goes quiet (after having spoken), or maxMs.
  // Returns { samples, sampleRate, speech } at the context's native rate; Whistle resamples.
  async record({ maxMs = 5000, silenceMs = 900, noSpeechMs = 6000, onLevel } = {}) {
    const stream = await this.openMic(); this._cancelled = false;
    const ctx = audioCtx(); const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1); const sink = ctx.createGain(); sink.gain.value = 0;
    const chunks = []; let floor = 0.006, speech = false, lastLoud = 0, started = performance.now(), calib = [];
    src.connect(proc); proc.connect(sink); sink.connect(ctx.destination);
    return new Promise(resolve => {
      const finish = () => {
        if (!this._stop) return; this._stop = null;
        proc.disconnect(); src.disconnect(); sink.disconnect(); onLevel?.(0);
        const n = chunks.reduce((a, c) => a + c.length, 0), samples = new Float32Array(n); let o = 0;
        for (const c of chunks) { samples.set(c, o); o += c.length; }
        // Keep at most 29.5 s, Whistle's single-pass limit.
        const cap = Math.floor(ctx.sampleRate * 29.5);
        resolve({ samples: samples.length > cap ? samples.subarray(0, cap) : samples, sampleRate: ctx.sampleRate, speech: speech && !this._cancelled });
      };
      this._stop = finish;
      proc.onaudioprocess = e => {
        const d = new Float32Array(e.inputBuffer.getChannelData(0)); chunks.push(d);
        let sum = 0; for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
        const rms = Math.sqrt(sum / d.length), now = performance.now(), el = now - started;
        onLevel?.(rms);
        if (el < 300) { calib.push(rms); floor = Math.max(0.004, calib.reduce((a, b) => a + b, 0) / calib.length); return; }
        const loud = rms > Math.max(0.018, floor * 3);
        if (loud) { speech = true; lastLoud = now; }
        if ((speech && now - lastLoud > silenceMs) || el > maxMs || (!speech && el > noSpeechMs)) finish();
      };
    });
  },
  // Whistle is deterministic (beam search, no sampling): the same clip always gives the
  // same answer, so re-running it is pointless. Instead we run differently pitched copies.
  // Declaring a lower sample rate than the real one plays the clip lower and slower, which
  // moves a child's higher pitch and formants toward the adult speech Whistle was trained on.
  // In testing, raising adult speech 25–40% broke recognition, and a 0.8 shift recovered it.
  SHIFTS: [1, 0.9, 0.8, 0.72],
  async transcribe(rec, shifts = this.SHIFTS) {
    const out = [];
    for (const f of shifts) {
      const r = await this.whistle.transcribe({ samples: rec.samples, sampleRate: Math.round(rec.sampleRate * f) }, { language: 'en', wordTimestamps: true });
      r.shift = f;
      if (r.words) for (const w of r.words) { if (w.start != null) w.start *= f; if (w.end != null) w.end *= f; }  // back to real time
      out.push(r);
    }
    return out;
  },
};

function resultWords(res) {
  if (!res) return [];
  const ws = (res.words?.length ? res.words : (res.text || '').split(/\s+/).map(w => ({ word: w })));
  return ws.flatMap(w => (String(w.word).match(WORD_RE) || []).map(t => ({ w: normWord(t), start: w.start, end: w.end, p: w.probability ?? 1 })));
}

// Rough sound-alike key: enough to tell "sad"/"said" or "brans"/"branch" are near misses,
// and "house"/"horse" are not the same word.
function soundKey(w) {
  let k = normWord(w).replace(/[^a-z]/g, '');
  k = k.replace(/^kn|^gn|^wr/, m => m[1]).replace(/ph/g, 'f').replace(/ck|q/g, 'k').replace(/tch/g, 'ch').replace(/c(?=[eiy])/g, 's').replace(/c/g, 'k')
       .replace(/x/g, 'ks').replace(/z/g, 's').replace(/wh/g, 'w').replace(/gh/g, '').replace(/dg/g, 'j').replace(/sh|ch/g, 'X').replace(/th/g, 'T');
  return k[0] + k.slice(1).replace(/[aeiouyhw]/g, '').replace(/(.)\1+/g, '$1');
}
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function soundsClose(target, heard) {
  const a = soundKey(target), b = soundKey(heard);
  if (!a || !b) return false;
  return a === b || (a.length >= 4 && a[0] === b[0] && editDistance(a, b) <= 1);
}

// Single word check over all pitch variants. No keyword biasing: biasing toward the target
// would make it "hear" the right word even when the child said something else.
//   right     – the target appears in any variant
//   close     – something that sounds close (child probably said it; ask to try again)
//   different – a clearly different word, heard with confidence
//   unclear   – nothing usable
function judgeWord(target, results) {
  results = (Array.isArray(results) ? results : [results]).filter(Boolean);
  const variants = results.map(r => resultWords(r));
  const heard = variants[0]?.map(w => w.w).join(' ') || '';
  const all = variants.flat();
  const variantText = results.map(r => (r.shift ?? 1) + ':' + (resultWords(r).map(w => w.w).join(' ') || '∅')).join(' | ');
  if (!all.length) return { verdict: 'unclear', heard, variantText };
  const hitIdx = variants.findIndex(ws => ws.some(w => sameWord(w.w, target)));
  if (hitIdx >= 0) { const hit = variants[hitIdx].find(w => sameWord(w.w, target)); return { verdict: 'right', heard: hit.w, p: hit.p, shift: results[hitIdx].shift, variantText }; }
  const near = all.find(w => soundsClose(target, w.w));
  if (near) return { verdict: 'close', heard: near.w, p: near.p, variantText };
  const top = Math.max(...all.map(w => w.p), 0);
  if (top < 0.45) return { verdict: 'unclear', heard, p: top, variantText };
  return { verdict: 'different', heard, p: top, variantText };
}

// Word alignment of what was read (hyp) against the page text (ref).
// Insertions (repeats, sounding-out fragments, "um") cost little; words after the last
// one the reader reached are "unreached", not misses (the reader may have stopped early).
function alignReading(ref, hyp) {
  const n = ref.length, m = hyp.length, INS = 0.6, DEL = 1, SUB = 1.2;
  const D = Array.from({ length: n + 1 }, () => new Float32Array(m + 1)), P = Array.from({ length: n + 1 }, () => new Uint8Array(m + 1));
  for (let i = 1; i <= n; i++) { D[i][0] = i * DEL; P[i][0] = 2; }
  for (let j = 1; j <= m; j++) { D[0][j] = j * INS; P[0][j] = 3; }
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    const same = sameWord(ref[i - 1], hyp[j - 1].w);
    let best = D[i - 1][j - 1] + (same ? 0 : SUB), p = same ? 0 : 1;
    if (D[i - 1][j] + DEL < best) { best = D[i - 1][j] + DEL; p = 2; }
    if (D[i][j - 1] + INS < best) { best = D[i][j - 1] + INS; p = 3; }
    D[i][j] = best; P[i][j] = p;
  }
  // free end: choose the last ref position reached
  let bi = n, bv = D[n][m];
  for (let i = 0; i < n; i++) if (D[i][m] < bv) { bv = D[i][m]; bi = i; }
  const out = ref.map(w => ({ ref: w, status: 'unreached', j: -1, insBefore: 0 }));
  let i = bi, j = m, pendingIns = 0;
  while (i > 0 || j > 0) {
    const p = i > 0 && j > 0 ? P[i][j] : i > 0 ? 2 : 3;
    if (p === 0 || p === 1) { out[i - 1].status = p === 0 ? 'ok' : 'sub'; out[i - 1].j = j - 1; i--; j--; }
    else if (p === 2) { out[i - 1].status = 'skip'; i--; }
    else { j--; if (i < n) out[i].insBefore++; }   // extra word heard just before ref[i]
  }
  return out;
}

// Turn alignment + timestamps into per-word results. With several pitch variants,
// a word counts as read if any variant heard it; pauses come from the unshifted pass.
function scoreReading(ref, results) {
  results = (Array.isArray(results) ? results : [results]).filter(Boolean);
  const runs = results.map(res => { const hyp = resultWords(res); return { hyp, al: alignReading(ref, hyp) }; });
  const base = runs[0];
  const al = base.al.map((a, k) => {
    if (a.status === 'ok') return a;
    const better = runs.slice(1).map(r => r.al[k]).find(x => x.status === 'ok');
    return better ? { ...a, status: 'ok', viaShift: true } : a;
  });
  const hyp = base.hyp;
  const gaps = [];
  for (const a of al) if (!a.viaShift && a.j > 0 && hyp[a.j]?.start != null && hyp[a.j - 1]?.end != null) gaps.push(hyp[a.j].start - hyp[a.j - 1].end);
  const med = gaps.length ? [...gaps].sort((a, b) => a - b)[Math.floor(gaps.length / 2)] : 0.2;
  const hesLimit = Math.max(1.0, med * 3);
  for (const a of al) {
    if (!a.viaShift && a.j > 0 && hyp[a.j]?.start != null && hyp[a.j - 1]?.end != null) a.gap = hyp[a.j].start - hyp[a.j - 1].end;
    a.hes = (a.status === 'ok' || a.status === 'sub') && ((a.gap || 0) > hesLimit || a.insBefore >= 2);
  }
  // "unreached" uses the furthest point any variant got to
  const reachedIdx = Math.max(...runs.map(r => r.al.reduce((m, x, k) => x.status !== 'unreached' ? k : m, -1)));
  al.forEach((a, k) => { if (k <= reachedIdx && a.status === 'unreached') a.status = 'skip'; });
  const reached = al.filter(a => a.status !== 'unreached');
  const ok = reached.filter(a => a.status === 'ok').length;
  return { al, hyp, reached: reached.length, ok, ratio: reached.length ? ok / reached.length : 0, hesLimit };
}

// "I'll read it!" — record the child reading the page, then score it quietly.
// The child only ever gets encouragement; details go to the grown-ups' view.
async function readAloud() {
  if (!Recog.ready && !(await loadRecogWithModal())) return;
  TTS.stop(); clearHighlights();
  // Score the story text only — not the title, byline or page number.
  const spans = $$('#pageInner .w:not([data-num])').filter(e => !e.closest('.title'));
  const ref = spans.map(e => normWord(e.textContent));
  if (!ref.length) return;
  const bar = document.createElement('div'); bar.className = 'listen-bar';
  bar.innerHTML = `<span>🎤 Read the page out loud…</span><div class="meter"><i></i></div><button class="btn small primary">I’m done</button>`;
  document.body.appendChild(bar);
  bar.querySelector('button').onclick = () => Recog.stopEarly();
  const page = B.page, story = B.story;
  let rec;
  try { rec = await Recog.record({ maxMs: 29000, silenceMs: 3500, noSpeechMs: 8000, onLevel: v => { const i = bar.querySelector('.meter i'); if (i) i.style.width = Math.min(100, v * 400) + '%'; } }); }
  catch { bar.remove(); toast('Microphone not available'); return; }
  bar.querySelector('span').textContent = '⭐ Checking…'; bar.querySelector('button').remove();
  let res = null;
  try { if (rec.speech) res = [].concat(await Recog.transcribe(rec)); } catch (e) { console.warn(e); }
  bar.remove(); Recog.closeMic();
  if (!res || !res.some(r => resultWords(r).length)) { toast('I didn’t hear any reading. Try again!'); return; }
  const sc = scoreReading(ref, res);
  const stars = sc.ratio >= 0.9 ? 3 : sc.ratio >= 0.7 ? 2 : 1;
  const missed = [], hes = [];
  sc.al.forEach((a, k) => {
    if (a.status === 'unreached') return;
    const w = spans[k].textContent;
    if (a.status === 'skip' || a.status === 'sub') { missed.push(normWord(w)); recordAnswer(w, 'read-miss', { storyId: story.id, page, heard: a.j >= 0 ? sc.hyp[a.j]?.w || '' : '' }); }
    else if (a.hes) { hes.push(normWord(w)); recordAnswer(w, 'read-hes', { storyId: story.id, page, gap: a.gap }); }
  });
  logEvent({ type: 'readaloud', storyId: story.id, page, reached: sc.reached, ok: sc.ok, missed, hes, heard: sc.hyp.map(h => h.w).join(' ') });
  chime(stars === 3 ? 'win' : 'good'); confetti(innerWidth / 2, innerHeight - 120, 8 + stars * 6);
  const msg = stars === 3 ? `Wonderful reading, ${READER.name}!` : stars === 2 ? 'Great reading!' : 'Good reading! Keep going!';
  toast(`${'⭐'.repeat(stars)}  ${msg}`, 3000); TTS.say(msg);
}

// ===========================================================================
// Importing stories: plain text, HTML, EPUB
// ===========================================================================
const BLOCK_TAGS = new Set(['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI', 'BLOCKQUOTE', 'PRE', 'DD', 'DT', 'FIGCAPTION', 'TD']);
const clean = s => s.replace(/\s+/g, ' ').trim();

// Walk a document body and produce flat blocks. resolveImg(src) -> data URL | null (may be async).
async function htmlToBlocks(root, resolveImg) {
  const blocks = [];
  const walk = async el => {
    for (const node of el.childNodes) {
      if (node.nodeType !== 1) continue;
      const tag = node.tagName.toUpperCase();
      if (['SCRIPT', 'STYLE', 'NAV', 'HEADER', 'FOOTER', 'NOSCRIPT', 'SVG', 'TEMPLATE', 'HEAD'].includes(tag)) continue;
      if (tag === 'IMG' || tag === 'IMAGE') {
        const src = node.getAttribute('src') || node.getAttribute('xlink:href') || node.getAttribute('href');
        const url = src && resolveImg ? await resolveImg(src) : null;
        if (url) blocks.push({ t: 'img', src: url, alt: node.getAttribute('alt') || '' });
        continue;
      }
      if (BLOCK_TAGS.has(tag)) {
        if (node.querySelector('img,image')) for (const im of node.querySelectorAll('img,image')) {
          const src = im.getAttribute('src') || im.getAttribute('xlink:href') || im.getAttribute('href');
          const url = src && resolveImg ? await resolveImg(src) : null;
          if (url) blocks.push({ t: 'img', src: url, alt: im.getAttribute('alt') || '' });
        }
        const text = clean(node.textContent || '');
        if (text) blocks.push({ t: /^H[1-6]$/.test(tag) ? 'h' : 'p', text, lvl: /^H[1-6]$/.test(tag) ? +tag[1] : 0 });
        continue;
      }
      // a DIV that only contains text acts like a paragraph
      if (tag === 'DIV' && ![...node.children].some(c => BLOCK_TAGS.has(c.tagName.toUpperCase()) || c.tagName.toUpperCase() === 'DIV' || c.tagName.toUpperCase() === 'IMG')) {
        const text = clean(node.textContent || ''); if (text) blocks.push({ t: 'p', text }); continue;
      }
      await walk(node);
    }
  };
  await walk(root);
  return blocks;
}

// Cut Project Gutenberg front and back matter.
function stripGutenberg(blocks) {
  const s = blocks.findIndex(b => /\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG/i.test(b.text || ''));
  const e = blocks.findIndex(b => /\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG/i.test(b.text || ''));
  let out = blocks;
  if (e > 0) out = out.slice(0, e);
  if (s >= 0) out = out.slice(s + 1);
  return out.filter(b => !/project gutenberg/i.test(b.text || '') || countWords(b.text) > 60);
}

function finishImport({ title, author, blocks, cover }) {
  blocks = stripGutenberg(blocks);
  // A run of headings at the start (title page) collapses into the title.
  const h = blocks.filter(b => b.t === 'h');
  if (!title) title = h[0]?.text || 'My story';
  // Drop headings that just repeat the title, and promote only top-level-ish headings to chapter breaks.
  const minLvl = Math.min(...h.map(b => b.lvl || 2), 9);
  blocks = blocks.filter(b => !(b.t === 'h' && clean(b.text).toLowerCase() === clean(title).toLowerCase()));
  blocks = blocks.map(b => b.t === 'h' && (b.lvl || 2) > minLvl + 1 ? { t: 'p', text: b.text } : b);
  const pages = paginate(blocks.filter(b => b.t !== 'break' || true));
  if (!pages.length) throw new Error('No readable text was found in that file.');
  return { id: 'u-' + uid(), title: clean(title).slice(0, 120), author: author ? clean(author).slice(0, 120) : '', level: guessLevel(pages), cover: '📗', coverImg: cover || null, pages, added: Date.now() };
}

async function importText(raw, name) {
  const st = storyFromScript({ text: raw.replace(/\r\n?/g, '\n'), title: '' });
  if (!st.title || st.title === 'My story') st.title = (name || 'My story').replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
  // Strip Gutenberg boilerplate from plain-text books too.
  if (/PROJECT GUTENBERG/i.test(raw)) {
    const body = raw.split(/\*\*\*\s*START OF (?:THE|THIS) PROJECT GUTENBERG[^\n]*\n/i).pop().split(/\*\*\*\s*END OF (?:THE|THIS) PROJECT GUTENBERG/i)[0];
    const t = raw.match(/^Title:\s*(.+)$/m)?.[1], a = raw.match(/^Author:\s*(.+)$/m)?.[1];
    const paras = body.replace(/\r\n?/g, '\n').split(/\n\s*\n/).map(clean).filter(Boolean);
    const blocks = paras.map(p => /^(CHAPTER|Chapter)\s+[\dIVXLC]+\b/.test(p) && countWords(p) < 14 ? { t: 'h', text: p } : { t: 'p', text: p });
    return finishImport({ title: t || st.title, author: a, blocks });
  }
  return st;
}

async function importHTML(raw, name) {
  const doc = new DOMParser().parseFromString(raw, 'text/html');
  const imgs = src => /^(data:image|https?:)/i.test(src) ? src : null;
  const blocks = await htmlToBlocks(doc.body, imgs);
  return finishImport({ title: doc.querySelector('title')?.textContent || (name || '').replace(/\.[^.]+$/, ''), author: doc.querySelector('meta[name=author]')?.content, blocks });
}

let JSZipLoad = null;
function loadJSZip() {
  return JSZipLoad ||= new Promise((res, rej) => {
    if (window.JSZip) return res(window.JSZip);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => res(window.JSZip); s.onerror = () => { JSZipLoad = null; rej(new Error('Could not load the EPUB reader (JSZip).')); };
    document.head.appendChild(s);
  });
}
const resolvePath = (base, rel) => {
  rel = decodeURIComponent(rel.split('#')[0]);
  const parts = (base.includes('/') ? base.slice(0, base.lastIndexOf('/') + 1) : '').concat(rel).split('/');
  const out = []; for (const p of parts) { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); }
  return out.join('/');
};
function parseXML(text, type = 'application/xml') {
  let d = new DOMParser().parseFromString(text, type);
  if (d.querySelector('parsererror')) d = new DOMParser().parseFromString(text, 'text/html');
  return d;
}
async function importEPUB(file) {
  const JSZip = await loadJSZip();
  const zip = await JSZip.loadAsync(file);
  const read = p => zip.file(p)?.async('string');
  const container = parseXML(await read('META-INF/container.xml') || '');
  const opfPath = container.querySelector('rootfile')?.getAttribute('full-path');
  if (!opfPath) throw new Error('This EPUB is missing its table of contents (OPF).');
  const opf = parseXML(await read(opfPath));
  const pick = sel => [...opf.getElementsByTagName('*')].find(e => e.localName === sel)?.textContent;
  const title = pick('title'), author = pick('creator');
  const manifest = {};
  for (const it of [...opf.getElementsByTagName('*')].filter(e => e.localName === 'item')) manifest[it.getAttribute('id')] = { href: resolvePath(opfPath, it.getAttribute('href')), type: it.getAttribute('media-type'), props: it.getAttribute('properties') || '' };
  const spine = [...opf.getElementsByTagName('*')].filter(e => e.localName === 'itemref' && e.getAttribute('linear') !== 'no').map(e => manifest[e.getAttribute('idref')]).filter(Boolean);
  const coverId = [...opf.getElementsByTagName('*')].find(e => e.localName === 'meta' && e.getAttribute('name') === 'cover')?.getAttribute('content');
  const coverItem = Object.values(manifest).find(m => m.props.includes('cover-image')) || manifest[coverId];
  const imgCache = new Map();
  const toDataURL = async path => {
    if (imgCache.has(path)) return imgCache.get(path);
    const f = zip.file(path); if (!f) return null;
    const b64 = await f.async('base64');
    if (b64.length > 2.5e6) return null;      // skip huge images (~1.8 MB)
    const ext = path.split('.').pop().toLowerCase();
    const mime = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' }[ext] || 'image/*';
    const url = `data:${mime};base64,${b64}`; imgCache.set(path, url); return url;
  };
  const blocks = [];
  for (const item of spine) {
    if (!/x?html/.test(item.type || 'html')) continue;
    const doc = parseXML(await read(item.href) || '', 'application/xhtml+xml');
    const body = doc.querySelector('body') || doc.documentElement;
    const b = await htmlToBlocks(body, src => /^data:/.test(src) ? src : toDataURL(resolvePath(item.href, src)));
    if (!b.length) continue;
    if (!b.some(x => x.text && countWords(x.text) > 0) && !b.some(x => x.t === 'img')) continue;
    blocks.push({ t: 'break' }, ...b);
  }
  // A leading image-only section that is just the cover duplicates the cover tile; drop it.
  const cover = coverItem ? await toDataURL(coverItem.href) : null;
  const firstText = blocks.findIndex(b => b.text);
  const cleaned = blocks.filter((b, i) => !(b.t === 'img' && i < firstText && cover && b.src === cover));
  return finishImport({ title, author, blocks: cleaned, cover });
}

async function importFile(file) {
  const name = file.name || 'story';
  if (/\.epub$/i.test(name) || file.type === 'application/epub+zip') return importEPUB(file);
  const text = await file.text();
  if (/\.x?html?$/i.test(name) || /^\s*<(!doctype|html)/i.test(text)) return importHTML(text, name);
  return importText(text, name);
}
async function saveImported(story) {
  await DB.put('stories', story); STORY_CACHE = null;
  return story;
}

async function renderOverview(body, reader) {

  const stories = await allStories(), title = id => stories.find(s => s.id === id)?.title || '(removed story)';
  const pages = new Set(ev.filter(e => e.type === 'page').map(e => e.storyId + ':' + e.page)).size;
  const finished = new Set(ev.filter(e => e.type === 'finish').map(e => e.storyId));
  const taps = ev.filter(e => e.type === 'tap').length;
  const ans = ev.filter(e => e.type === 'right' || e.type === 'wrong');
  const acc = ans.length ? Math.round(ans.filter(e => e.type === 'right').length / ans.length * 100) + '%' : '—';
  // daily minutes, last 14 days
  const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d.getTime(); });
  const mins = days.map(d => readingMinutes(ev.filter(e => e.ts >= d && e.ts < d + DAY)));

  const raMissed = {}, raHes = {};
  for (const e of ra) { (e.missed || []).forEach(w => raMissed[w] = (raMissed[w] || 0) + 1); (e.hes || []).forEach(w => raHes[w] = (raHes[w] || 0) + 1); }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 12);
  const recentBooks = []; for (const e of ev.filter(e => e.type === 'open').reverse()) if (!recentBooks.find(x => x.storyId === e.storyId)) recentBooks.push(e); recentBooks.splice(6);
  body.innerHTML = `

      <div class="card"><div class="n">${acc}</div><div class="l">game answers right</div></div>
    </div>
    <div class="panel"><h3>Reading time, last 14 days</h3>

async function renderWordsTab(body, reader) {
  if (!reader) { body.innerHTML = `<div class="panel">Add a reader first.</div>`; return; }
  const words = await DB.byReader('words', reader.id);

  words.sort((a, b) => { const x = keyFn(a), y = keyFn(b); return x < y ? -1 : x > y ? 1 : 0; });
  body.innerHTML = `<div class="panel"><h3>${words.length} words</h3>

async function exportBackup() {
  const data = { app: 'tapread', version: 1, exported: new Date().toISOString(), settings: S };
  for (const s of ['readers', 'stories', 'events', 'words']) data[s] = await DB.all(s);
  data.kv = {}; for (const r of data.readers) data.kv['progress:' + r.id] = await KV.get('progress:' + r.id);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `tapread-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importBackup(data) {
  if (data.app !== 'tapread') throw new Error('Not a Tap & Read backup.');
  for (const s of ['readers', 'stories', 'words']) for (const x of data[s] || []) await DB.put(s, x);
  for (const e of data.events || []) { const { id, ...rest } = e; await DB.put('events', rest); }
  for (const [k, v] of Object.entries(data.kv || {})) if (v) await KV.set(k, v);
  if (data.settings) { S = { ...DEFAULT_SETTINGS, ...data.settings }; await saveSettings(); }
  STORY_CACHE = null;
}

// ---------- Speech lab: measure recognition accuracy on this child ----------
// Grown-up chooses whether the next attempt will be said correctly or deliberately
// mispronounced; the reader says the word; we record what the recognizer decided.
let LAB = { trials: null, word: null };
// Store lab recordings at 16 kHz (what Whistle uses) to keep them small.
function to16k(rec) {
  const ratio = rec.sampleRate / 16000; if (ratio <= 1) return { samples: rec.samples.slice(), sampleRate: rec.sampleRate };
  const n = Math.floor(rec.samples.length / ratio), out = new Float32Array(n);
  for (let i = 0; i < n; i++) { const a = Math.floor(i * ratio), b = Math.min(rec.samples.length, Math.floor((i + 1) * ratio)); let sum = 0; for (let j = a; j < b; j++) sum += rec.samples[j]; out[i] = sum / Math.max(1, b - a); }
  return { samples: out, sampleRate: 16000, speech: true };
}
async function renderLab(body, reader) {
  if (!LAB.trials) LAB.trials = (await KV.get('labTrials')) || [];
  const t = LAB.trials.filter(x => !reader || x.readerId === reader.id);
  const good = t.filter(x => x.intent === 'correct'), bad = t.filter(x => x.intent === 'wrong');
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const frr = good.filter(x => x.verdict === 'different').length, unclear = good.filter(x => x.verdict === 'unclear').length, almost = good.filter(x => x.verdict === 'close').length;
  const far = bad.filter(x => x.verdict === 'right').length;
  if (!LAB.word) LAB.word = await labNextWord();
  body.innerHTML = `
  <div class="panel"><h3>Speech lab</h3>
    <p class="note">Checks how well speech recognition hears <b>this</b> reader before you trust the Say It game or read-aloud stats. Pick how the next word will be said, have the reader say it (or mispronounce it on purpose — “wabbit” for rabbit), and the lab records what the recognizer decided. About 30 correct and 15 mispronounced tries gives a usable picture.</p>
    ${Recog.ready ? '' : `<div class="row"><button class="btn teal" id="labLoad">Load speech recognition (17 MB)</button></div>`}
    <div class="${Recog.ready ? '' : 'hidden'}" style="text-align:center">
      <div class="prompt-word" style="display:inline-block;margin:10px 0">${esc(LAB.word)}</div>
      <div class="row" style="justify-content:center"><button class="btn small" id="labNext">↻ Different word</button><button class="btn small" id="labHear">🔊</button></div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn teal" data-intent="correct">🎤 Say it correctly</button>
        <button class="btn primary" data-intent="wrong">🎤 Say it wrong on purpose</button></div>
      <div class="row" style="justify-content:center"><div class="meter"><i id="labLvl"></i></div></div>
      <div class="feedback" id="labOut"></div></div></div>
  <div class="cards">
    <div class="card"><div class="n">${t.length}</div><div class="l">tries${reader ? ' for ' + esc(reader.name) : ''}</div></div>
    <div class="card"><div class="n">${pct(frr, good.length)}</div><div class="l">correct readings marked wrong (${frr}/${good.length})</div></div>
    <div class="card"><div class="n">${pct(almost, good.length)}</div><div class="l">correct readings “almost, try again” (${almost}/${good.length})</div></div>
    <div class="card"><div class="n">${pct(unclear, good.length)}</div><div class="l">correct readings “didn’t catch that”</div></div>
    <div class="card"><div class="n">${pct(far, bad.length)}</div><div class="l">wrong readings accepted (${far}/${bad.length})</div></div>
  </div>
  <div class="panel"><h3>How to read this</h3><p class="note">The first number matters most: if correct readings are marked wrong more than about 1 in 10 times, the Say It game will frustrate a young reader — keep it off and use read-aloud only as a quiet hint for you. A high “wrong readings accepted” rate just means the game is lenient, which is the safer failure.</p></div>
  <div class="panel"><h3>Compare methods</h3><p class="note">Re-runs every saved recording through a single pass and through the four pitch-shifted passes (100%, 90%, 80%, 72%), so you can see whether the extra passes help with this reader. Recordings are saved in this browser (only tries made after this update).</p>
    <div class="row"><button class="btn small teal" id="labCmp" ${Recog.ready ? '' : 'disabled'}>Compare on ${t.filter(x => x.saved).length} saved recordings</button><span class="muted" id="labCmpMsg"></span></div><div id="labCmpOut"></div></div>
  <div class="panel"><h3>Tries</h3><div class="row"><button class="btn small" id="labCsv">⬇️ Export CSV</button><button class="btn small ghost" id="labClr">Clear</button></div>
    <div class="table-wrap"><table><thead><tr><th>When</th><th>Word</th><th>Intended</th><th>Heard (pitch: text)</th><th>Decision</th><th>Confidence</th><th></th></tr></thead><tbody>
    ${t.slice().reverse().slice(0, 100).map((x, k) => `<tr><td class="muted">${new Date(x.ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</td><td class="wd">${esc(x.word)}</td><td>${x.intent === 'correct' ? 'correct' : '<b>wrong</b>'}</td><td>${esc(x.heard || '∅')}${x.variants ? `<div class="muted" style="font-size:12px">${esc(x.variants)}</div>` : ''}</td>
      <td>${x.verdict === 'right' ? '✓ right' : x.verdict === 'close' ? '~ almost' : x.verdict === 'unclear' ? '? unclear' : '✗ different'}</td><td>${x.p != null ? x.p.toFixed(2) : ''}</td><td>${x.saved ? `<button class="btn small ghost" data-play="${x.ts}">▶︎</button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#labLoad', body) && ($('#labLoad', body).onclick = async () => { if (await loadRecogWithModal()) renderLab(body, reader); });
  $('#labNext', body) && ($('#labNext', body).onclick = async () => { LAB.word = await labNextWord(); renderLab(body, reader); });
  $('#labHear', body) && ($('#labHear', body).onclick = () => TTS.say(LAB.word, { word: true }));
  $$('[data-intent]', body).forEach(b => b.onclick = async () => {
    $$('[data-intent]', body).forEach(x => x.disabled = true); TTS.stop();
    $('#labOut', body).textContent = 'Listening…';
    try {
      const rec = await Recog.record({ maxMs: 5000, silenceMs: 900, onLevel: v => { const l = $('#labLvl', body); if (l) l.style.width = Math.min(100, v * 400) + '%'; } });
      $('#labOut', body).textContent = 'Thinking…';
      const res = rec.speech ? await Recog.transcribe(rec) : null;
      const v = judgeWord(LAB.word, res);
      const trial = { ts: Date.now(), readerId: reader?.id, word: LAB.word, intent: b.dataset.intent, verdict: v.verdict, heard: v.heard, p: v.p, variants: v.variantText };
      if (rec.speech) { await DB.put('audio', to16k(rec), 'lab|' + trial.ts); trial.saved = true; }
      LAB.trials.push(trial); await KV.set('labTrials', LAB.trials);
      LAB.word = await labNextWord();
    } catch (e) { $('#labOut', body).textContent = 'Microphone error: ' + (e.message || e); return; }
    finally { Recog.closeMic(); }
    renderLab(body, reader);
  });
  $$('[data-play]', body).forEach(b => b.onclick = async () => { const r = await DB.get('audio', 'lab|' + b.dataset.play); if (r) Player.play({ audio: r.samples, sr: r.sampleRate }).catch(() => {}); });
  $('#labCmp', body).onclick = async () => {
    const saved = t.filter(x => x.saved); if (!saved.length) return;
    const methods = { 'Single pass': [1], 'Four pitch passes': Recog.SHIFTS };
    const tally = {}; for (const m in methods) tally[m] = { correct: { right: 0, close: 0, unclear: 0, different: 0 }, wrong: { right: 0, close: 0, unclear: 0, different: 0 } };
    let k = 0;
    for (const x of saved) {
      const rec = await DB.get('audio', 'lab|' + x.ts); k++; if (!rec) continue;
      $('#labCmpMsg', body).textContent = `${k} / ${saved.length}…`;
      const res = await Recog.transcribe(rec);
      for (const [m, shifts] of Object.entries(methods)) tally[m][x.intent][judgeWord(x.word, res.filter(r => shifts.includes(r.shift))).verdict]++;
    }
    $('#labCmpMsg', body).textContent = '';
    const row = (m, c, w) => { const n = c.right + c.close + c.unclear + c.different, nw = w.right + w.close + w.unclear + w.different;
      return `<tr><td><b>${m}</b></td><td>${pct(c.right, n)}</td><td>${pct(c.close, n)}</td><td>${pct(c.unclear, n)}</td><td>${pct(c.different, n)}</td><td>${pct(w.right, nw)}</td></tr>`; };
    $('#labCmpOut', body).innerHTML = `<div class="table-wrap"><table><thead><tr><th></th><th>Correct → right</th><th>→ almost</th><th>→ didn’t catch</th><th>→ marked wrong</th><th>Wrong → accepted</th></tr></thead><tbody>${Object.keys(methods).map(m => row(m, tally[m].correct, tally[m].wrong)).join('')}</tbody></table></div>
      <p class="note">In the Say It game, a second “almost” on the same word is accepted.</p>`;
  };
  $('#labCsv', body).onclick = () => {
    const rows = [['time', 'reader', 'word', 'intended', 'heard', 'decision', 'confidence', 'by pitch'], ...t.map(x => [new Date(x.ts).toISOString(), x.readerId || '', x.word, x.intent, x.heard || '', x.verdict, x.p ?? '', x.variants || ''])];
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' })); a.download = 'speech-lab.csv'; a.click();
  };
  $('#labClr', body).onclick = async () => { if (!confirm('Clear all lab results?')) return; for (const x of t) if (x.saved) await DB.del('audio', 'lab|' + x.ts); LAB.trials = LAB.trials.filter(x => reader && x.readerId !== reader.id); await KV.set('labTrials', LAB.trials); renderLab(body, reader); };
}
async function labNextWord() {
  const pw = await practiceWords(20);
  const pool = pw.length >= 5 ? pw.map(w => w.word) : (await vocabPool()).filter(w => w.length >= 3 && w.length <= 8);
  return pool[Math.floor(Math.random() * pool.length)] || 'rabbit';
}

// ===========================================================================
// Startup
// ===========================================================================
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  audioCtx();
  const act = a.dataset.act;
  if (act === 'readers') renderReaders();
  else if (act === 'library') renderLibrary();
  else if (act === 'games') renderGames();
  else if (act === 'parent') parentGate(() => openParent());
  else if (act === 'add-story') parentGate(() => openParent('stories'));
});

(async function init() {
  try { await DB.open(); }
  catch (e) { document.body.innerHTML = `<p style="padding:24px;font-family:sans-serif">This browser is blocking storage (private mode?), so Tap &amp; Read can’t save progress. Please open it in a normal window.</p>`; return; }
  await loadSettings();
  // Clips from the fp16 build were garbled; drop them (cache keys now start with "k2|").
  DB.tx('audio', 'readwrite', st => st.delete(IDBKeyRange.bound('k|', 'k|\uffff'))).catch(() => {});
  SystemVoice.init();
  navigator.storage?.persist?.().catch(() => {});
  wireBook();
  if (S.engine === 'kokoro' && S.kokoroWanted) Kokoro.load().catch(e => console.warn('Kokoro unavailable', e));
  if (S.recog) Recog.load().then(() => { if (document.body.dataset.screen === 'book') $('#readAloudBtn').classList.remove('hidden'); }).catch(e => console.warn('Whistle unavailable', e));
  const readers = await DB.all('readers');
  const lastId = await KV.get('lastReader');
  const last = readers.find(r => r.id === lastId);
  if (readers.length === 1 && last) { READER = last; renderLibrary(); }
  else renderReaders();
})();

// Handy for debugging from the console.
window.tapread = { DB, get S() { return S; }, TTS, Kokoro, Recog, alignReading, scoreReading, judgeWord, paginate, parseScript, importFile, practiceWords };
</script>
