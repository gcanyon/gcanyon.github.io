<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap &amp; Read</title>
<meta name="theme-color" content="#fbf5ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8613c'/%3E%3Cpath d='M14 18c7-3 13-2 18 2v28c-5-4-11-5-18-2z' fill='%23fff'/%3E%3Cpath d='M50 18c-7-3-13-2-18 2v28c5-4 11-5 18-2z' fill='%23ffe3a3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf5ea; --page:#fffdf8; --ink:#2b2833; --ink-2:#6b6577; --line:#e9dfcd;
  --tomato:#e8613c; --tomato-2:#fbe1d7; --teal:#2a9d8f; --teal-2:#d6f0ec;
  --sun:#f4b942; --sun-2:#fdf0cf; --plum:#7b5ea7; --plum-2:#ece5f6; --sky:#3d8bd9; --sky-2:#dcebfa;
  --shadow:0 1px 0 rgba(60,40,10,.06), 0 8px 24px -12px rgba(60,40,10,.25);
  --r:18px; --read:"Andika", "Comic Sans MS", system-ui, sans-serif; --ui:"Fredoka", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#1d1b22; --page:#26232c; --ink:#f3eee6; --ink-2:#b4adbd; --line:#3a3642;
    --tomato-2:#4a2a22; --teal-2:#1d3b38; --sun-2:#43391f; --plum-2:#352c44; --sky-2:#1f3247;
    --shadow:0 8px 24px -12px rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.on{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.topbar h1,.topbar h2{font-weight:600;margin:0;font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 16px 40px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--page);box-shadow:var(--shadow);font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--tomato);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{padding:6px 12px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:var(--page);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;flex:none}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500}
.muted{color:var(--ink-2)}
.hidden{display:none!important}

/* readers */
.readers{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:24px 16px}
.reader-card{width:150px;border:0;background:var(--page);border-radius:24px;padding:20px 10px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px}
.reader-card .face{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:46px}
.reader-card .nm{font-size:20px;font-weight:600}
.reader-card.add{background:transparent;border:3px dashed var(--line);box-shadow:none}
.hello{text-align:center;padding:40px 16px 0}
.hello h1{font-size:clamp(30px,6vw,46px);margin:0 0 6px;font-weight:600}

/* library */
.shelf-title{font-size:18px;font-weight:600;margin:22px 4px 10px;color:var(--ink-2)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.book{border:0;border-radius:16px;background:var(--page);box-shadow:var(--shadow);text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:210px}
.book .cover{height:120px;display:grid;place-items:center;font-size:56px;position:relative}
.book .cover img{width:100%;height:100%;object-fit:cover}
.book .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.book .t{font-weight:600;font-size:16px;line-height:1.2}
.book .prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.book .prog i{display:block;height:100%;background:var(--teal)}
.book.add{border:3px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;font-size:17px;gap:6px;color:var(--ink-2)}
.lvl1{background:var(--sun-2)} .lvl2{background:var(--teal-2)} .lvl3{background:var(--plum-2)}
.big-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.big-action{flex:1;min-width:220px;border:0;border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);text-align:left}
.big-action .e{font-size:38px}
.big-action b{display:block;font-size:19px;font-weight:600}

/* book reader */
#scr-book{height:100%;min-height:0}
.book-stage{flex:1;display:flex;align-items:stretch;gap:8px;padding:0 8px 8px;min-height:0}
.nav{border:0;background:transparent;width:56px;font-size:34px;color:var(--ink-2);flex:none;border-radius:16px}
.nav:hover{background:rgba(0,0,0,.04)}
.nav[disabled]{opacity:.15}
.page{flex:1;background:var(--page);border-radius:22px;box-shadow:var(--shadow);overflow:auto;position:relative;display:flex;flex-direction:column;padding:clamp(18px,4vw,48px);min-height:0}
.page-inner{margin:auto 0;width:100%;max-width:720px;align-self:center}
.page.turn-l{animation:turnL .28s ease} .page.turn-r{animation:turnR .28s ease}
@keyframes turnL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes turnR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.reading{font-family:var(--read);line-height:1.55;font-size:calc(var(--fs,30px) * var(--scale,1))}
.reading p{margin:0 0 .7em}
.reading h2{font-size:1.15em;margin:0 0 .8em;text-align:center;font-weight:700;color:var(--plum)}
.reading .title{font-size:1.5em;text-align:center;margin:0 0 .2em;line-height:1.2;font-weight:700}
.reading .byline{text-align:center;font-size:.6em;color:var(--ink-2);margin-bottom:1.2em}
.reading .pic{text-align:center;font-size:2.6em;line-height:1.25;margin:.1em 0 .4em;letter-spacing:.05em}
.reading img{display:block;max-width:100%;max-height:46vh;margin:0 auto .8em;border-radius:10px}
.w{cursor:pointer;border-radius:.2em;padding:0 .04em;transition:background .15s,color .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.w:hover{background:var(--sun-2)}
.w.hit{animation:pop .45s ease;background:var(--sun);color:#2b2833}
.w.say{background:var(--sky-2);box-shadow:0 0 0 .08em var(--sky)}
.w.sent{background:var(--teal-2)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.pageno{text-align:center;margin-top:1em;font-size:.65em;color:var(--ink-2)}
.book-tools{display:flex;gap:10px;align-items:center;justify-content:center;padding:4px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));flex-wrap:wrap}
.progress-line{height:6px;background:var(--line);border-radius:3px;flex:1;max-width:340px;overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--tomato);transition:width .3s}
.listen-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--page);box-shadow:var(--shadow);border-radius:999px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:14px;z-index:30;font-size:18px}
.meter{width:90px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--teal);transition:width .08s}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.game-tile{border:0;border-radius:22px;padding:22px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:170px}
.game-tile .e{font-size:46px}
.game-tile b{font-size:21px;font-weight:600}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;padding-bottom:40px}
.stars{font-size:26px;letter-spacing:4px;min-height:34px}
.prompt-word{font-family:var(--read);font-size:clamp(48px,12vw,110px);font-weight:700;background:var(--page);border-radius:28px;padding:16px 44px;box-shadow:var(--shadow);text-align:center}
.choices{display:grid;grid-template-columns:repeat(2,minmax(130px,260px));gap:16px}
.choice{font-family:var(--read);font-size:clamp(28px,6vw,48px);border:0;border-radius:22px;padding:20px 12px;background:var(--page);box-shadow:var(--shadow);font-weight:700}
.choice.right{background:var(--teal);color:#fff}
.choice.wrong{animation:shake .4s;opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.speaker{width:96px;height:96px;border-radius:50%;border:0;background:var(--sky);color:#fff;font-size:44px;box-shadow:var(--shadow)}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--tomato);color:#fff;font-size:52px;box-shadow:var(--shadow);position:relative}
.mic.rec::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--tomato);opacity:.5;animation:ring 1.1s infinite}
@keyframes ring{from{transform:scale(.92);opacity:.7}to{transform:scale(1.15);opacity:0}}
.mem-grid{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,4),minmax(70px,150px))}
.mem{aspect-ratio:3/4;border:0;border-radius:16px;padding:0;position:relative;background:transparent}
.mem .f,.mem .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;box-shadow:var(--shadow)}
.mem .b{background:repeating-linear-gradient(45deg,var(--plum),var(--plum) 10px,#8c70b8 10px,#8c70b8 20px);color:#fff;font-size:30px}
.mem .f{background:var(--page);font-family:var(--read);font-weight:700;font-size:clamp(18px,4vw,30px);padding:4px;text-align:center;word-break:break-word;visibility:hidden}
.mem.up .f,.mem.done .f{visibility:visible}
.mem.up .b,.mem.done .b{visibility:hidden}
.mem.up,.mem.done{animation:flip .3s ease}
.mem.done .f{background:var(--teal-2)}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.feedback{font-size:24px;min-height:34px;text-align:center;font-weight:500}
.confetti{position:fixed;pointer-events:none;font-size:30px;z-index:60;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

/* parent */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--ink-2)}
.tab.on{background:var(--ink);color:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--page);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card .n{font-size:30px;font-weight:600}
.card .l{color:var(--ink-2);font-size:14px}
.panel{background:var(--page);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-top:16px}
.panel h3{margin:0 0 12px;font-weight:600;font-size:18px}
.panel h4{margin:16px 0 8px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
td.wd{font-family:var(--read);font-weight:700;font-size:17px}
.table-wrap{overflow-x:auto}
.boxes{display:inline-flex;gap:3px}
.boxes i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.boxes i.on{background:var(--teal)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{min-width:150px;color:var(--ink-2)}
.field{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;min-height:42px}
textarea.field{width:100%;min-height:160px;font-family:var(--read)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-2)}
.wordcloud{display:flex;flex-wrap:wrap;gap:8px}
.wordcloud span{font-family:var(--read);font-weight:700;background:var(--sun-2);border-radius:10px;padding:4px 10px}
.note{font-size:14px;color:var(--ink-2);line-height:1.5}
.bar-prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:120px}
.bar-prog i{display:block;height:100%;background:var(--teal);width:0}

/* modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(20,15,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--page);border-radius:24px;padding:24px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:22px;font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;font-size:24px;display:grid;place-items:center}
.swatches button.on{border-color:var(--ink)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:70;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:640px){
  .nav{display:none}
  .book-stage{padding:0 6px 6px}
  .choices{grid-template-columns:repeat(2,1fr);width:100%}
  .row label{min-width:100%}
}
</style>
</head>
<body>

<!-- Who's reading -->
<section class="screen" id="scr-readers">
  <div class="hello"><h1>Who’s reading today?</h1><p class="muted">Tap your name</p></div>
  <div class="readers" id="readerList"></div>
  <div style="text-align:center;margin-top:auto;padding:20px"><button class="btn ghost small" data-act="parent">👪 Grown-ups</button></div>
</section>

<!-- Library -->
<section class="screen" id="scr-library">
  <div class="topbar">
    <button class="icon-btn" data-act="readers" title="Switch reader" id="libFace">🙂</button>
    <h1 id="libHello">Hi!</h1>
    <button class="btn small" data-act="parent">👪 Grown-ups</button>
  </div>
  <div class="wrap">
    <div class="big-actions">
      <button class="big-action lvl2" data-act="games"><span class="e">🎲</span><span><b>Word games</b><span id="practiceCount" class="muted">Practice your words</span></span></button>
      <button class="big-action lvl1 hidden" id="continueBtn"><span class="e">📖</span><span><b>Keep reading</b><span id="continueTitle" class="muted"></span></span></button>
    </div>
    <div id="shelves"></div>
  </div>
</section>

<!-- Book -->
<section class="screen" id="scr-book">
  <div class="topbar">
    <button class="icon-btn" data-act="library" title="Back to books">🏠</button>
    <h2 id="bookTitle"></h2>
    <button class="icon-btn" id="readPageBtn" title="Read this page to me">🔊</button>
    <button class="icon-btn hidden" id="readAloudBtn" title="I'll read it!">🎤</button>
  </div>
  <div class="book-stage">
    <button class="nav" id="prevBtn" aria-label="Previous page">‹</button>
    <article class="page" id="page"><div class="page-inner reading" id="pageInner"></div></article>
    <button class="nav" id="nextBtn" aria-label="Next page">›</button>
  </div>
  <div class="book-tools">
    <button class="btn small" id="prevBtn2">‹ Back</button>
    <div class="progress-line"><i id="bookProg"></i></div>
    <button class="btn small primary" id="nextBtn2">Next ›</button>
  </div>
</section>

<!-- Games menu -->
<section class="screen" id="scr-games">
  <div class="topbar">
    <button class="icon-btn" data-act="library" title="Back">🏠</button>
    <h1>Word games</h1>
  </div>
  <div class="wrap">
    <p class="muted" id="gamesNote"></p>
    <div class="games" id="gameTiles"></div>
  </div>
</section>

<!-- Game play -->
<section class="screen" id="scr-game">
  <div class="topbar">
    <button class="icon-btn" id="gameQuit" title="Stop">✕</button>
    <h2 id="gameTitle"></h2>
    <div class="stars" id="gameStars"></div>
  </div>
  <div class="game-area" id="gameArea"></div>
</section>

<!-- Parent area -->
<section class="screen" id="scr-parent">
  <div class="topbar">
    <button class="icon-btn" id="parentBack" title="Back">←</button>
    <h1>Grown-ups</h1>
    <select class="field" id="parentReader" aria-label="Reader"></select>
  </div>
  <div class="wrap">
    <div class="tabs" id="parentTabs">
      <button class="tab on" data-tab="overview">Progress</button>
      <button class="tab" data-tab="words">Words</button>
      <button class="tab" data-tab="stories">Stories</button>
      <button class="tab" data-tab="settings">Settings</button>
      <button class="tab" data-tab="lab">Speech lab</button>
    </div>
    <div id="parentBody"></div>
  </div>
</section>

<div id="modalRoot"></div>
<div id="toast"></div>
